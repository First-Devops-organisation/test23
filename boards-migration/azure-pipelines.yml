# ============================================================
#  Azure DevOps Pipeline - Boards Migration
#  Migrates ADO Work Items → GitHub Issues + ProjectV2
#
#  Pipeline Variables (set in ADO Variable Group 'boards-migration'):
#    ADO_PAT  - Azure DevOps Personal Access Token (secret)
#    GH_PAT   - GitHub Personal Access Token (secret)
# ============================================================

trigger: none  # Manual trigger only

pr: none

pool:
  vmImage: 'windows-latest'

variables:
  - group: boards-migration  # Contains ADO_PAT and GH_PAT as secrets
  - name: workingDir
    value: '$(Build.SourcesDirectory)\boards-migration'

parameters:
  - name: phase
    displayName: 'Migration Phase'
    type: string
    default: 'all'
    values:
      - all
      - discover
      - prep
      - migrate
      - validate

  - name: dryRun
    displayName: 'Dry Run (no changes made)'
    type: boolean
    default: true

  - name: resume
    displayName: 'Resume from previous run (incremental - skip already migrated)'
    type: boolean
    default: true

  - name: configFile
    displayName: 'Config File (for multi-project support)'
    type: string
    default: 'boards-migration-config.json'

stages:

# ============================================================
#  Stage 1: DISCOVER
# ============================================================
- stage: Discover
  displayName: 'Phase 1 — Discover Work Items'
  condition: and(succeeded(), in('${{ parameters.phase }}', 'all', 'discover'))
  jobs:
  - job: DiscoverWorkItems
    displayName: 'Inventory & Analyze ADO Boards'
    steps:

    - checkout: self
      persistCredentials: true

    - task: PowerShell@2
      displayName: '[Setup] Install Azure DevOps CLI Extension'
      inputs:
        targetType: inline
        script: |
          az extension add --name azure-devops --yes
          az --version
        pwsh: true

    - task: PowerShell@2
      displayName: '[Phase 1] Count & List All ADO Work Items'
      inputs:
        filePath: '$(workingDir)\01-discover\discover-workitems.ps1'
        arguments: '-ConfigPath "$(workingDir)\config\${{ parameters.configFile }}"'
        pwsh: true
      env:
        ADO_PAT: $(ADO_PAT)
        GH_PAT: $(GH_PAT)

    - task: PowerShell@2
      displayName: '[Phase 1] Analyze ADO Board & Sprint Structure'
      inputs:
        filePath: '$(workingDir)\01-discover\analyze-board-structure.ps1'
        arguments: '-ConfigPath "$(workingDir)\config\${{ parameters.configFile }}"'
        pwsh: true
      env:
        ADO_PAT: $(ADO_PAT)

    - task: PowerShell@2
      displayName: '[Phase 1] Generate GitHub Project Setup Guide'
      inputs:
        filePath: '$(workingDir)\01-discover\generate-setup-guide.ps1'
        arguments: '-ConfigPath "$(workingDir)\config\${{ parameters.configFile }}"'
        pwsh: true

    - task: PowerShell@2
      displayName: '[Phase 1] Read ADO Workflow States & Transitions'
      inputs:
        filePath: '$(workingDir)\01-discover\discover-ado-workflows.ps1'
        arguments: '-ConfigPath "$(workingDir)\config\${{ parameters.configFile }}"'
        pwsh: true
      env:
        ADO_PAT: $(ADO_PAT)

    - task: PublishPipelineArtifact@1
      displayName: '[Phase 1] Save Discovery Reports as Pipeline Artifact'
      inputs:
        targetPath: '$(workingDir)\reports'
        artifact: 'discovery-reports'
        publishLocation: 'pipeline'

# ============================================================
#  Stage 2: PREPARE
# ============================================================
- stage: Prepare
  displayName: 'Phase 2 — Prepare & Validate'
  dependsOn: Discover
  condition: and(succeeded(), in('${{ parameters.phase }}', 'all', 'prep'))
  jobs:
  - job: ValidateAndSetup
    displayName: 'Validate Mappings & Setup Labels'
    steps:

    - checkout: self
      persistCredentials: true

    # Download discovery reports from Stage 1
    - task: DownloadPipelineArtifact@2
      displayName: '[Phase 2] Download Discovery Reports from Phase 1'
      inputs:
        buildType: 'current'
        artifactName: 'discovery-reports'
        targetPath: '$(workingDir)\reports'
      condition: and(succeeded(), in('${{ parameters.phase }}', 'all'))
      continueOnError: true

    - task: PowerShell@2
      displayName: '[Setup] Install Azure DevOps CLI Extension'
      inputs:
        targetType: inline
        script: az extension add --name azure-devops --yes
        pwsh: true

    - task: PowerShell@2
      displayName: '[Phase 2] Validate User, Status & Type Mappings'
      inputs:
        filePath: '$(workingDir)\02-prep\validate-mappings.ps1'
        arguments: '-ConfigPath "$(workingDir)\config\${{ parameters.configFile }}"'
        pwsh: true
      env:
        ADO_PAT: $(ADO_PAT)
        GH_PAT: $(GH_PAT)

    - task: PowerShell@2
      displayName: '[Phase 2] Create GitHub Labels (type, priority, severity)'
      inputs:
        filePath: '$(workingDir)\02-prep\setup-github-labels.ps1'
        arguments: '-ConfigPath "$(workingDir)\config\${{ parameters.configFile }}"'
        pwsh: true
      env:
        GH_PAT: $(GH_PAT)

    - task: PowerShell@2
      displayName: '[Phase 2] Create GitHub Milestones from ADO Sprints'
      inputs:
        filePath: '$(workingDir)\02-prep\setup-github-milestones.ps1'
        arguments: '-ConfigPath "$(workingDir)\config\${{ parameters.configFile }}"'
        pwsh: true
      env:
        ADO_PAT: $(ADO_PAT)
        GH_PAT: $(GH_PAT)

    - task: PowerShell@2
      displayName: '[Phase 2] Deploy GitHub Actions Workflow Rules to Repo'
      inputs:
        filePath: '$(workingDir)\02-prep\deploy-github-workflow.ps1'
        arguments: '-ConfigPath "$(workingDir)\config\${{ parameters.configFile }}"'
        pwsh: true
      env:
        GH_PAT: $(GH_PAT)

    - task: PublishPipelineArtifact@1
      displayName: '[Phase 2] Save Preparation Logs as Pipeline Artifact'
      inputs:
        targetPath: '$(workingDir)\logs'
        artifact: 'prep-logs'
        publishLocation: 'pipeline'
      condition: always()

# ============================================================
#  Stage 3: MIGRATE (with manual approval gate)
# ============================================================
- stage: Migrate
  displayName: 'Phase 3 — Migrate Work Items'
  dependsOn: Prepare
  condition: and(succeeded(), in('${{ parameters.phase }}', 'all', 'migrate'))
  jobs:

  # Manual approval before migration (skipped for dry runs)
  - job: ApprovalGate
    displayName: 'Approval Gate'
    condition: eq('${{ parameters.dryRun }}', false)
    pool: server
    steps:
    - task: ManualValidation@1
      displayName: '[Gate] Human Approval Required Before Migration Starts'
      inputs:
        notifyUsers: ''
        instructions: |
          Review the discovery reports and prep logs.
          Confirm that all mappings are correct.
          Click APPROVE to start the migration.
        onTimeout: 'reject'
      timeoutInMinutes: 1440  # 24 hour timeout

  - job: ExecuteMigration
    displayName: 'Execute Migration'
    dependsOn: ApprovalGate
    condition: and(not(canceled()), in(dependencies.ApprovalGate.result, 'Succeeded', 'Skipped'))
    timeoutInMinutes: 360  # 6 hours max
    steps:

    - checkout: self
      persistCredentials: true

    - task: PowerShell@2
      displayName: '[Setup] Install Azure DevOps CLI Extension'
      inputs:
        targetType: inline
        script: az extension add --name azure-devops --yes
        pwsh: true

    # Download discovery reports for reference
    - task: DownloadPipelineArtifact@2
      displayName: '[Phase 3] Download Discovery Reports from Phase 1'
      inputs:
        buildType: 'current'
        artifactName: 'discovery-reports'
        targetPath: '$(workingDir)\reports'
      condition: and(succeeded(), in('${{ parameters.phase }}', 'all'))
      continueOnError: true

    # Download migration log from PREVIOUS run for incremental migration.
    # Downloads to a temp dir and copies ONLY migration-log.json to avoid
    # overwriting current discovery files (like workitem-inventory.json).
    - task: DownloadPipelineArtifact@2
      displayName: '[Phase 3] Download Previous Migration Log for Resume/Incremental Mode'
      inputs:
        buildType: 'specific'
        project: '$(System.TeamProjectId)'
        definition: '$(System.DefinitionId)'
        buildVersionToDownload: 'latestFromBranch'
        branchName: '$(Build.SourceBranch)'
        artifactName: 'migration-reports'
        targetPath: '$(workingDir)\prev-migration'
        allowPartiallySucceededBuilds: true
        allowFailedBuilds: true
      continueOnError: true

    - task: PowerShell@2
      displayName: '[Phase 3] Load Previous Migration Log to Enable Resume Mode'
      inputs:
        targetType: inline
        script: |
          $prevDir = Join-Path "$(workingDir)" "prev-migration"
          $reportsDir = Join-Path "$(workingDir)" "reports"
          $prevLog = Join-Path $prevDir "migration-log.json"
          if (Test-Path $prevLog) {
              if (-not (Test-Path $reportsDir)) { New-Item -ItemType Directory -Path $reportsDir -Force | Out-Null }
              Copy-Item $prevLog -Destination $reportsDir -Force
              $count = (@((Get-Content $prevLog -Raw | ConvertFrom-Json).PSObject.Properties)).Count
              Write-Host "Loaded migration log from previous run: $count items"
          } else {
              Write-Host "No previous migration log found. Starting fresh."
          }
        pwsh: true
      continueOnError: true  # First run won't have previous artifacts

    - task: PowerShell@2
      displayName: '[Phase 3] Take Pre-Migration Snapshot of All ADO Work Items'
      inputs:
        filePath: '$(workingDir)\00-extract\snapshot-ado-data.ps1'
        arguments: '-ConfigPath "$(workingDir)\config\${{ parameters.configFile }}"'
        pwsh: true
      env:
        ADO_PAT: $(ADO_PAT)
      condition: eq('${{ parameters.dryRun }}', false)

    - task: PowerShell@2
      displayName: '[Phase 3] Migrate ADO Work Items → GitHub Issues (Core Engine)'
      inputs:
        targetType: inline
        script: |
          # Build clean Windows paths using Join-Path
          $base       = Join-Path "$(Build.SourcesDirectory)" "boards-migration"
          $scriptPath = Join-Path $base "03-migrate" "migrate-workitems.ps1"
          $configPath = Join-Path $base "config" "${{ parameters.configFile }}"
          Write-Host "Script : $scriptPath"
          Write-Host "Config : $configPath"
          # Use hashtable splatting - correctly binds named parameters
          $params = @{ ConfigPath = $configPath }
          if ('${{ parameters.dryRun }}' -eq 'true') { $params['DryRun'] = $true }
          if ('${{ parameters.resume }}' -eq 'true') { $params['Resume'] = $true }
          & $scriptPath @params
        pwsh: true
      env:
        ADO_PAT: $(ADO_PAT)
        GH_PAT: $(GH_PAT)

    - task: PowerShell@2
      displayName: '[Phase 3] Inject Items into GitHub Project V2 Board (Board Builder)'
      inputs:
        targetType: inline
        script: |
          $base = "$(workingDir)"
          $scriptPath = Join-Path $base "run-python-board-injector.ps1"
          $configPath = Join-Path $base "config" "${{ parameters.configFile }}"
          
          if (Test-Path $scriptPath) {
            Write-Host "Running Python Board Injector..."
            & $scriptPath -ConfigPath $configPath
          } else {
            Write-Host "Python Board Injector script not found. Skipping."
          }
        pwsh: true
      env:
        ADO_PAT: $(ADO_PAT)
        GH_PAT: $(GH_PAT)

    - task: PowerShell@2
      displayName: '[Phase 5] Link ADO Pull Requests to Migrated GitHub Issues'
      inputs:
        targetType: inline
        script: |
          $base = "$(workingDir)"
          $scriptPath = Join-Path $base "05-reconcile" "link-prs-to-issues.ps1"
          $configPath = Join-Path $base "config" "${{ parameters.configFile }}"
          $logPath = Join-Path $base "reports" "migration-log.json"
          
          if (Test-Path $logPath) {
            Write-Host "Running PR Reconciliation Script..."
            & $scriptPath -ConfigPath $configPath -MigrationLogPath $logPath
          } else {
            Write-Host "No migration-log.json found. Skipping PR reconciliation."
          }
        pwsh: true
      env:
        GH_PAT: $(GH_PAT)
        

    - task: PowerShell@2
      displayName: '[Phase 6] Enrich Issues: Related Links, Saved Queries & Roadmap'
      inputs:
        targetType: inline
        script: |
          $base       = "$(workingDir)"
          $scriptPath = Join-Path $base "06-enrich" "post-migrate-enrich.ps1"
          $configPath = Join-Path $base "config" "${{ parameters.configFile }}"
          $logPath    = Join-Path $base "reports" "migration-log.json"

          if (Test-Path $scriptPath) {
            if (Test-Path $logPath) {
              Write-Host "Running Phase 6: Post-Migration Enrichment..."
              & $scriptPath -ConfigPath $configPath -MigrationLogPath $logPath
            } else {
              Write-Host "No migration-log.json found. Skipping enrichment."
            }
          } else {
            Write-Host "Enrichment script not found at $scriptPath. Skipping."
          }
        pwsh: true
      env:
        ADO_PAT: $(ADO_PAT)
        GH_PAT: $(GH_PAT)

    - task: PublishPipelineArtifact@1
      displayName: '[Artifact] Save Migration Log & Enrichment Reports (migration-log.json)'
      inputs:
        targetPath: '$(workingDir)\reports'
        artifact: 'migration-reports'
        publishLocation: 'pipeline'
      condition: always()

    - task: PublishPipelineArtifact@1
      displayName: '[Artifact] Save Verbose Debug Logs for Troubleshooting'
      inputs:
        targetPath: '$(workingDir)\logs'
        artifact: 'migration-logs'
        publishLocation: 'pipeline'
      condition: always()

# ============================================================
#  Stage 4: VALIDATE
# ============================================================
- stage: Validate
  displayName: 'Phase 4 — Validate & Report'
  dependsOn: Migrate
  condition: and(succeeded(), in('${{ parameters.phase }}', 'all', 'validate'))
  jobs:
  - job: ValidateAndReport
    displayName: 'Validate Migration & Generate Report'
    steps:

    - checkout: self
      persistCredentials: true

    - task: PowerShell@2
      displayName: '[Setup] Install Azure DevOps CLI Extension'
      inputs:
        targetType: inline
        script: az extension add --name azure-devops --yes
        pwsh: true

    # Download migration reports
    - task: DownloadPipelineArtifact@2
      displayName: '[Phase 4] Download Migration Log from Phase 3 for Validation'
      inputs:
        buildType: 'current'
        artifactName: 'migration-reports'
        targetPath: '$(workingDir)\reports'
      continueOnError: true

    - task: PowerShell@2
      displayName: '[Phase 4] Compare ADO Item Count vs GitHub Issue Count (Verify Zero Data Loss)'
      inputs:
        filePath: '$(workingDir)\04-validate\validate-migration.ps1'
        arguments: '-ConfigPath "$(workingDir)\config\${{ parameters.configFile }}"'
        pwsh: true
      env:
        ADO_PAT: $(ADO_PAT)
        GH_PAT: $(GH_PAT)
      continueOnError: true

    - task: PowerShell@2
      displayName: '[Phase 4] Generate Final Migration Summary Report (Markdown)'
      inputs:
        filePath: '$(workingDir)\04-validate\generate-report.ps1'
        arguments: '-ConfigPath "$(workingDir)\config\${{ parameters.configFile }}"'
        pwsh: true
      condition: always()

    - task: PublishPipelineArtifact@1
      displayName: '[Artifact] Save Final Reports: ROADMAP.md, GITHUB_FILTERS.md, Summary'
      inputs:
        targetPath: '$(workingDir)\reports'
        artifact: 'final-reports'
        publishLocation: 'pipeline'
      condition: always()

    # Publish markdown report as pipeline summary
    - task: PowerShell@2
      displayName: '[Phase 4] Pin Migration Summary to Pipeline Overview Tab'
      inputs:
        targetType: inline
        script: |
          $reportPath = "$(workingDir)\reports\migration-summary.md"
          if (Test-Path $reportPath) {
            $content = Get-Content $reportPath -Raw
            Write-Host "##vso[task.uploadsummary]$reportPath"
          }
        pwsh: true
      condition: always()