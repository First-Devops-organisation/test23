trigger: none

pool:
  name: linux  # Linux self-hosted agent pool — update to match your pool name

# =============================================================================
# PARAMETERS — choose at queue time
# =============================================================================
parameters:

  - name: MigrationMode
    displayName: "Migration Mode"
    type: string
    default: Single
    values:
      - Single
      - Batch

  - name: ADORepo
    displayName: "ADO Repo name (Single mode only)"
    type: string
    default: " "

  - name: GHRepo
    displayName: "GitHub Repo name (Single mode only, defaults to ADORepo)"
    type: string
    default: " "

  - name: BatchName
    displayName: "Batch name from config (Batch mode — leave blank for all)"
    type: string
    default: " "

  - name: SkipAudit
    displayName: "Skip branch-wise audit (faster, no file inventory)"
    type: boolean
    default: false

  - name: DryRun
    displayName: "Dry Run (print GEI commands, do not execute)"
    type: boolean
    default: false

  - name: RunValidation
    displayName: "Run validation after migration"
    type: boolean
    default: true

variables:
  - group: repo-migration-discover  # ADO_ORG, ADO_PROJECT, ADO_PAT
  - group: repo-migration-migrate   # GH_ORG, GH_PAT

stages:
  # ===========================================================================
  # STAGE 1 – DISCOVER
  # ===========================================================================
  - stage: Discover
    displayName: "1. Discover & Analyse"
    jobs:
      - job: DiscoverAndAudit
        displayName: "1.1 Discover Repos & Audit Sizes"
        timeoutInMinutes: 60
        steps:

          - task: Bash@3
            displayName: "Install git-sizer"
            inputs:
              targetType: inline
              script: |
                ZIP_URL="https://github.com/github/git-sizer/releases/download/v1.5.0/git-sizer-1.5.0-linux-amd64.zip"
                DEST_DIR="$AGENT_TOOLSDIRECTORY/git-sizer"
                mkdir -p "$DEST_DIR"
                curl -L -o git-sizer.zip "$ZIP_URL"
                unzip -o git-sizer.zip -d "$DEST_DIR"
                chmod +x "$DEST_DIR/git-sizer"
                echo "##vso[task.prependpath]$DEST_DIR"

          - task: Bash@3
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                cfg="$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"
                jq --arg ado_org "$ADO_ORG" \
                   --arg ado_project "$ADO_PROJECT" \
                   --arg ado_pat "$ADO_PAT" \
                   --arg gh_org "$GH_ORG" \
                   --arg gh_pat "$GH_PAT" \
                   '.source.organization = $ado_org | .source.project = $ado_project | .source.pat = $ado_pat | .target.organization = $gh_org | .target.pat = $gh_pat' \
                   "$cfg" > "${cfg}.tmp" && mv "${cfg}.tmp" "$cfg"
            env:
              ADO_ORG: $(ADO_ORG)
              ADO_PROJECT: $(ADO_PROJECT)
              ADO_PAT: $(ADO_PAT)
              GH_ORG: $(GH_ORG)
              GH_PAT: $(GH_PAT)

          - task: Bash@3
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/reports"
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/logs"
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/audit"
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/dashboard"
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/tmp/clones"

          - task: Bash@3
            displayName: "1.1 Discover Repos"
            inputs:
              filePath: '$(Build.SourcesDirectory)/repo-migration/01-discover/discover-repos.sh'
              arguments: '"$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"'
              workingDirectory: '$(Build.SourcesDirectory)/repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: Bash@3
            displayName: "1.2 Audit Repo Sizes"
            inputs:
              filePath: '$(Build.SourcesDirectory)/repo-migration/01-discover/audit-repo-sizes.sh'
              arguments: '"$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"'
              workingDirectory: '$(Build.SourcesDirectory)/repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Discovery Reports"
            inputs:
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/reports'
              artifact: "discovery-reports"
              publishLocation: pipeline
            condition: always()

          - task: PublishHtmlReport@1
            displayName: "Show Discovery Report on Pipeline Tab"
            condition: always()
            continueOnError: true
            inputs:
              reportDir: '$(Build.SourcesDirectory)/repo-migration/output/reports/repo-inventory.html'
              tabName: "Discovery Report"

      - job: ScanSecrets
        displayName: "1.3 Scan Secrets (gitleaks)"
        dependsOn: DiscoverAndAudit
        strategy:
          ${{ if eq(parameters.MigrationMode, 'Batch') }}:
            maxParallel: 3
            matrix:
              Batch0:
                BATCH_INDEX: 0
                BATCH_TOTAL: 3
              Batch1:
                BATCH_INDEX: 1
                BATCH_TOTAL: 3
              Batch2:
                BATCH_INDEX: 2
                BATCH_TOTAL: 3
          ${{ if eq(parameters.MigrationMode, 'Single') }}:
            matrix:
              Single:
                BATCH_INDEX: 0
                BATCH_TOTAL: 1
        steps:

          - task: Bash@3
            displayName: "Install gitleaks"
            inputs:
              targetType: inline
              script: |
                TAR_URL="https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz"
                DEST_DIR="$AGENT_TOOLSDIRECTORY/gitleaks"
                mkdir -p "$DEST_DIR"
                curl -L -o gitleaks.tar.gz "$TAR_URL"
                tar -xzf gitleaks.tar.gz -C "$DEST_DIR"
                chmod +x "$DEST_DIR/gitleaks"
                echo "##vso[task.prependpath]$DEST_DIR"

          - task: Bash@3
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                cfg="$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"
                jq --arg ado_org "$ADO_ORG" \
                   --arg ado_project "$ADO_PROJECT" \
                   --arg ado_pat "$ADO_PAT" \
                   --arg gh_org "$GH_ORG" \
                   --arg gh_pat "$GH_PAT" \
                   '.source.organization = $ado_org | .source.project = $ado_project | .source.pat = $ado_pat | .target.organization = $gh_org | .target.pat = $gh_pat' \
                   "$cfg" > "${cfg}.tmp" && mv "${cfg}.tmp" "$cfg"
            env:
              ADO_ORG: $(ADO_ORG)
              ADO_PROJECT: $(ADO_PROJECT)
              ADO_PAT: $(ADO_PAT)
              GH_ORG: $(GH_ORG)
              GH_PAT: $(GH_PAT)

          - task: DownloadPipelineArtifact@2
            displayName: "Download Discovery Reports"
            inputs:
              artifact: "discovery-reports"
              path: '$(Build.SourcesDirectory)/repo-migration/output/reports'

          - task: Bash@3
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/reports"
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/logs"

          - task: Bash@3
            displayName: "1.3 Scan Secrets"
            condition: and(succeeded(), or(eq('${{ parameters.MigrationMode }}', 'Batch'), eq(variables['BATCH_INDEX'], '0')))
            inputs:
              filePath: '$(Build.SourcesDirectory)/repo-migration/01-discover/scan-secrets.sh'
              arguments: >-
                -ConfigPath "$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"
                -BatchIndex $(BATCH_INDEX) -BatchTotal $(BATCH_TOTAL)
                -MigrationMode '${{ parameters.MigrationMode }}'
                -SingleRepoName '${{ parameters.ADORepo }}'
              workingDirectory: '$(Build.SourcesDirectory)/repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Scan Reports"
            condition: and(always(), or(eq('${{ parameters.MigrationMode }}', 'Batch'), eq(variables['BATCH_INDEX'], '0')))
            inputs:
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/reports'
              artifact: "scan-reports-batch$(BATCH_INDEX)"
              publishLocation: pipeline
      
          - task: PublishHtmlReport@1
            displayName: "Show Secret Scan Report on Pipeline Tab"
            condition: and(always(), or(eq('${{ parameters.MigrationMode }}', 'Batch'), eq(variables['BATCH_INDEX'], '0')))
            continueOnError: true
            inputs:
              ${{ if eq(parameters.MigrationMode, 'Single') }}:
                reportDir: '$(Build.SourcesDirectory)/repo-migration/output/reports/secret-scan-report.html'
              ${{ else }}:
                reportDir: '$(Build.SourcesDirectory)/repo-migration/output/reports/secret-scan-report-batch$(BATCH_INDEX).html'
              tabName: "Secret Scan Report"

# ===========================================================================
# STAGE 2 – REVIEW GATE
# ===========================================================================
  - stage: ReviewGate
    displayName: "2. Review Gate"
    dependsOn: Discover
    condition: succeeded()
    jobs:
      - job: ReviewGateJob
        displayName: "Gate: Review Discovery Findings"
        pool: server
        timeoutInMinutes: 4320
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 4320
            inputs:
              notifyUsers: ""
              instructions: |
                Review the discovery artifacts before proceeding to migration.

                Download and check:
                  discovery-reports/repo-inventory.json
                    → confirm which repos to include / exclude
                    → update config/repo-migration-config.json batches and exclusions

                  discovery-reports/repo-sizes.json
                    → any repo flagged OVER_LIMIT (> 40 GiB) must be remediated first

                  scan-reports-batch*/secret-scan-findings.json
                    → MANDATORY for regulated environment
                    → Critical/High findings must be remediated before migration
                    → if zero findings: safe to proceed
                    → if findings exist: scrub history first (scrub-secrets.sh)

                Populate config/user-mappings.csv with ADO→GitHub username mappings.

                Approve to proceed to migration, or Reject to abort.
              onTimeout: reject

# ===========================================================================
# STAGE 3A – SINGLE REPO MIGRATION
# ===========================================================================
  - stage: MigrateSingle
    displayName: "3a. Migrate (Single Repo)"
    dependsOn: ReviewGate
    condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Single'))
    jobs:
      - job: MigrateSingleRepo
        displayName: "Migrate ${{ parameters.ADORepo }}"
        timeoutInMinutes: 180
        steps:

          - task: Bash@3
            displayName: "Install GitHub CLI + ado2gh extension"
            inputs:
              targetType: inline
              script: |
                GH_DIR="$AGENT_TOOLSDIRECTORY/gh"
                if ! command -v gh &> /dev/null; then
                    echo "Installing GitHub CLI (Linux tar.gz)..."
                    mkdir -p "$GH_DIR"
                    curl -L -o gh.tar.gz "https://github.com/cli/cli/releases/download/v2.52.0/gh_2.52.0_linux_amd64.tar.gz"
                    tar -xzf gh.tar.gz -C "$GH_DIR"
                    GH_BIN=$(find "$GH_DIR" -type f -name gh -path '*/bin/*' | head -n 1)
                    if [ -z "$GH_BIN" ]; then
                        GH_BIN=$(find "$GH_DIR" -type f -name gh | head -n 1)
                    fi
                    GH_BIN_DIR=$(dirname "$GH_BIN")
                    chmod +x "$GH_BIN"
                    echo "##vso[task.prependpath]$GH_BIN_DIR"
                    export PATH="${GH_BIN_DIR}:$PATH"
                fi
                gh --version

                # Authenticate gh CLI before installing extensions
                export GH_TOKEN="$GH_PAT"
                echo "$GH_PAT" | gh auth login --with-token
                gh auth status

                if ! gh extension list | grep -q 'ado2gh'; then
                    gh extension install github/gh-ado2gh
                else
                    gh extension upgrade ado2gh
                fi
                gh extension list
            env:
              GH_PAT: $(GH_PAT)

          - task: Bash@3
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/reports"
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/logs"
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/audit"
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/dashboard"
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/tmp"

          - task: Bash@3
            displayName: "Migrate Single Repo"
            inputs:
              targetType: inline
              script: |
                adoRepo=$(echo "${{ parameters.ADORepo }}" | xargs)
                ghRepo=$(echo "${{ parameters.GHRepo }}" | xargs)
                cfgPath="$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"
                if [ -z "$ghRepo" ] && [ -z "$adoRepo" ]; then
                    if [ -f "$cfgPath" ]; then
                        cfg_single=$(jq -r '.migration.singleRepo // empty' "$cfgPath" | tr -d '\r')
                        if [ -n "$cfg_single" ]; then
                            ghRepo="$cfg_single"
                            adoRepo="$cfg_single"
                            echo "No explicit repo parameters passed. Using singleRepo from config: $ghRepo"
                        fi
                    fi
                fi
                if [ -z "$ghRepo" ]; then
                    ghRepo="$adoRepo"
                fi

                # Read target visibility from config
                visibility="private"
                if [ -f "$cfgPath" ]; then
                    cfg_vis=$(jq -r '.migration.targetRepoVisibility // empty' "$cfgPath" | tr -d '\r')
                    if [ -n "$cfg_vis" ]; then
                        visibility="$cfg_vis"
                    fi
                fi

                migParams=(
                    --ado-org "$(ADO_ORG)"
                    --ado-project "$(ADO_PROJECT)"
                    --ado-repo "$adoRepo"
                    --github-org "$(GH_ORG)"
                    --github-repo "$ghRepo"
                    --output-dir "$(Build.SourcesDirectory)/repo-migration/output"
                    --target-repo-visibility "$visibility"
                )
                if [ "${{ parameters.SkipAudit }}" = "True" ] || [ "${{ parameters.SkipAudit }}" = "true" ]; then
                    migParams+=(--skip-audit)
                fi
                if [ "${{ parameters.DryRun }}" = "True" ] || [ "${{ parameters.DryRun }}" = "true" ]; then
                    migParams+=(--dry-run)
                fi

                chmod +x "$(Build.SourcesDirectory)/repo-migration/03-migrate/migrate-single.sh"
                "$(Build.SourcesDirectory)/repo-migration/03-migrate/migrate-single.sh" "${migParams[@]}"
                echo "##vso[task.setvariable variable=RESOLVED_REPO]$ghRepo"
              workingDirectory: '$(Build.SourcesDirectory)/repo-migration'
            env:
              ADO_PAT:   $(ADO_PAT)
              GH_PAT:    $(GH_PAT)
              GH_TOKEN:  $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Migration Logs"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/logs'
              artifact: "MigrationLogs-Single"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Audit Data"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/audit'
              artifact: "MigrationAudit-Single"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish HTML Dashboard"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/dashboard'
              artifact: "MigrationDashboard-Single"
              publishLocation: pipeline

# ===========================================================================
# STAGE 3B – BATCH REPO MIGRATION
# ===========================================================================
  - stage: MigrateBatch
    displayName: "3b. Migrate (Batch)"
    dependsOn: ReviewGate
    condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Batch'))
    jobs:
      - job: MigrateBatchRepos
        displayName: "Migrate Batch"
        timeoutInMinutes: 480
        steps:

          - task: Bash@3
            displayName: "Install GitHub CLI + ado2gh extension"
            inputs:
              targetType: inline
              script: |
                GH_DIR="$AGENT_TOOLSDIRECTORY/gh"
                if ! command -v gh &> /dev/null; then
                    echo "Installing GitHub CLI (Linux tar.gz)..."
                    mkdir -p "$GH_DIR"
                    curl -L -o gh.tar.gz "https://github.com/cli/cli/releases/download/v2.52.0/gh_2.52.0_linux_amd64.tar.gz"
                    tar -xzf gh.tar.gz -C "$GH_DIR"
                    GH_BIN=$(find "$GH_DIR" -type f -name gh -path '*/bin/*' | head -n 1)
                    if [ -z "$GH_BIN" ]; then
                        GH_BIN=$(find "$GH_DIR" -type f -name gh | head -n 1)
                    fi
                    GH_BIN_DIR=$(dirname "$GH_BIN")
                    chmod +x "$GH_BIN"
                    echo "##vso[task.prependpath]$GH_BIN_DIR"
                    export PATH="${GH_BIN_DIR}:$PATH"
                fi
                gh --version

                # Authenticate gh CLI before installing extensions
                export GH_TOKEN="$GH_PAT"
                echo "$GH_PAT" | gh auth login --with-token
                gh auth status

                if ! gh extension list | grep -q 'ado2gh'; then
                    gh extension install github/gh-ado2gh
                else
                    gh extension upgrade ado2gh
                fi
                gh extension list
            env:
              GH_PAT: $(GH_PAT)

          - task: Bash@3
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                cfg="$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"
                jq --arg ado_org "$ADO_ORG" \
                   --arg ado_project "$ADO_PROJECT" \
                   --arg ado_pat "$ADO_PAT" \
                   --arg gh_org "$GH_ORG" \
                   --arg gh_pat "$GH_PAT" \
                   '.source.organization = $ado_org | .source.project = $ado_project | .source.pat = $ado_pat | .target.organization = $gh_org | .target.pat = $gh_pat' \
                   "$cfg" > "${cfg}.tmp" && mv "${cfg}.tmp" "$cfg"
            env:
              ADO_ORG: $(ADO_ORG)
              ADO_PROJECT: $(ADO_PROJECT)
              ADO_PAT: $(ADO_PAT)
              GH_ORG: $(GH_ORG)
              GH_PAT: $(GH_PAT)

          - task: Bash@3
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/reports"
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/logs"
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/audit"
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/dashboard"
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/tmp"

          - task: Bash@3
            displayName: "Migrate Batch Repos"
            inputs:
              targetType: inline
              script: |
                migParams=(
                    --ado-org "$(ADO_ORG)"
                    --ado-project "$(ADO_PROJECT)"
                    --github-org "$(GH_ORG)"
                    --config-path "$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"
                    --batch-name "${{ parameters.BatchName }}"
                    --output-dir "$(Build.SourcesDirectory)/repo-migration/output"
                    --max-parallel 3
                )
                if [ "${{ parameters.SkipAudit }}" = "True" ] || [ "${{ parameters.SkipAudit }}" = "true" ]; then
                    migParams+=(--skip-audit)
                fi
                if [ "${{ parameters.DryRun }}" = "True" ] || [ "${{ parameters.DryRun }}" = "true" ]; then
                    migParams+=(--dry-run)
                fi

                chmod +x "$(Build.SourcesDirectory)/repo-migration/03-migrate/migrate-batch.sh"
                "$(Build.SourcesDirectory)/repo-migration/03-migrate/migrate-batch.sh" "${migParams[@]}"
              workingDirectory: '$(Build.SourcesDirectory)/repo-migration'
            env:
              ADO_PAT:  $(ADO_PAT)
              GH_PAT:   $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Migration Logs"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/logs'
              artifact: "BatchMigrationLogs"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Audit Data"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/audit'
              artifact: "BatchMigrationAudit"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Dashboards"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/dashboard'
              artifact: "BatchMigrationDashboards"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Summary"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/reports'
              artifact: "BatchMigrationReports"
              publishLocation: pipeline

# ===========================================================================
# STAGE 4 – VALIDATE
# ===========================================================================
  - stage: Validate
    displayName: "4. Validate Migration"
    dependsOn:
      - MigrateSingle
      - MigrateBatch
    condition: |
      and(
        eq('${{ parameters.RunValidation }}', true),
        or(
          eq(dependencies.MigrateSingle.result, 'Succeeded'),
          eq(dependencies.MigrateSingle.result, 'SucceededWithIssues'),
          eq(dependencies.MigrateBatch.result, 'Succeeded'),
          eq(dependencies.MigrateBatch.result, 'SucceededWithIssues')
        )
      )
    jobs:
      - job: ValidateRepos
        displayName: "4.1 Validate Migrated Repos"
        timeoutInMinutes: 60
        steps:

          - task: Bash@3
            displayName: "Install GitHub CLI"
            inputs:
              targetType: inline
              script: |
                GH_DIR="$AGENT_TOOLSDIRECTORY/gh"
                if ! command -v gh &> /dev/null; then
                    echo "Installing GitHub CLI (Linux tar.gz)..."
                    mkdir -p "$GH_DIR"
                    curl -L -o gh.tar.gz "https://github.com/cli/cli/releases/download/v2.52.0/gh_2.52.0_linux_amd64.tar.gz"
                    tar -xzf gh.tar.gz -C "$GH_DIR"
                    GH_BIN=$(find "$GH_DIR" -type f -name gh -path '*/bin/*' | head -n 1)
                    if [ -z "$GH_BIN" ]; then
                        GH_BIN=$(find "$GH_DIR" -type f -name gh | head -n 1)
                    fi
                    GH_BIN_DIR=$(dirname "$GH_BIN")
                    chmod +x "$GH_BIN"
                    echo "##vso[task.prependpath]$GH_BIN_DIR"
                    export PATH="${GH_BIN_DIR}:$PATH"
                fi
                gh --version

                export GH_TOKEN="$GH_PAT"
                echo "$GH_PAT" | gh auth login --with-token
                gh auth status
            env:
              GH_TOKEN: $(GH_PAT)
              GH_PAT: $(GH_PAT)

          - task: Bash@3
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                cfg="$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"
                jq --arg ado_org "$ADO_ORG" \
                   --arg ado_project "$ADO_PROJECT" \
                   --arg ado_pat "$ADO_PAT" \
                   --arg gh_org "$GH_ORG" \
                   --arg gh_pat "$GH_PAT" \
                   '.source.organization = $ado_org | .source.project = $ado_project | .source.pat = $ado_pat | .target.organization = $gh_org | .target.pat = $gh_pat' \
                   "$cfg" > "${cfg}.tmp" && mv "${cfg}.tmp" "$cfg"
            env:
              ADO_ORG: $(ADO_ORG)
              ADO_PROJECT: $(ADO_PROJECT)
              ADO_PAT: $(ADO_PAT)
              GH_ORG: $(GH_ORG)
              GH_PAT: $(GH_PAT)

          - task: Bash@3
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/reports"

          # Download migration artifacts to get audit data + batch summary
          - task: DownloadPipelineArtifact@2
            displayName: "Download Migration Reports (Single)"
            condition: eq('${{ parameters.MigrationMode }}', 'Single')
            continueOnError: true
            inputs:
              buildType: 'current'
              artifactName: "MigrationAudit-Single"
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/audit'

          - task: DownloadPipelineArtifact@2
            displayName: "Download Migration Logs (Single)"
            condition: eq('${{ parameters.MigrationMode }}', 'Single')
            continueOnError: true
            inputs:
              buildType: 'current'
              artifactName: "MigrationLogs-Single"
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/logs'

          - task: DownloadPipelineArtifact@2
            displayName: "Download Batch Audit Data"
            condition: eq('${{ parameters.MigrationMode }}', 'Batch')
            continueOnError: true
            inputs:
              artifact: "BatchMigrationAudit"
              path: '$(Build.SourcesDirectory)/repo-migration/output/audit'

          - task: DownloadPipelineArtifact@2
            displayName: "Download Batch Reports (for batch-migration-summary.json)"
            condition: eq('${{ parameters.MigrationMode }}', 'Batch')
            continueOnError: true
            inputs:
              artifact: "BatchMigrationReports"
              path: '$(Build.SourcesDirectory)/repo-migration/output/reports'

          - task: DownloadPipelineArtifact@2
            displayName: "Download Batch Logs"
            condition: eq('${{ parameters.MigrationMode }}', 'Batch')
            continueOnError: true
            inputs:
              buildType: 'current'
              artifactName: "BatchMigrationLogs"
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/logs'
              
          # Download migration dashboards for HTML tab
          - task: DownloadPipelineArtifact@2
            displayName: "Download Migration Dashboard (Single)"
            condition: eq('${{ parameters.MigrationMode }}', 'Single')
            continueOnError: true
            inputs:
              buildType: 'current'
              artifactName: "MigrationDashboard-Single"
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/dashboard'

          - task: DownloadPipelineArtifact@2
            displayName: "Download Migration Dashboards (Batch)"
            condition: eq('${{ parameters.MigrationMode }}', 'Batch')
            continueOnError: true
            inputs:
              artifact: "BatchMigrationDashboards"
              path: '$(Build.SourcesDirectory)/repo-migration/output/dashboard'

          # Single mode — validate one repo
          - task: Bash@3
            displayName: "4.1 Validate Single Repo"
            condition: eq('${{ parameters.MigrationMode }}', 'Single')
            continueOnError: true
            inputs:
              targetType: inline
              script: |
                adoRepo=$(echo "${{ parameters.ADORepo }}" | xargs)
                ghRepo=$(echo "${{ parameters.GHRepo }}" | xargs)
                cfgPath="$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"
                if [ -z "$ghRepo" ] && [ -z "$adoRepo" ]; then
                    if [ -f "$cfgPath" ]; then
                        cfg_single=$(jq -r '.migration.singleRepo // empty' "$cfgPath" | tr -d '\r')
                        if [ -n "$cfg_single" ]; then
                            ghRepo="$cfg_single"
                            adoRepo="$cfg_single"
                            echo "No explicit repo parameters passed. Using singleRepo from config: $ghRepo"
                        fi
                    fi
                fi
                if [ -z "$ghRepo" ]; then
                    ghRepo="$adoRepo"
                fi

                # Read target visibility from config
                visibility="private"
                if [ -f "$cfgPath" ]; then
                    cfg_vis=$(jq -r '.migration.targetRepoVisibility // empty' "$cfgPath" | tr -d '\r')
                    if [ -n "$cfg_vis" ]; then
                        visibility="$cfg_vis"
                    fi
                fi

                chmod +x "$(Build.SourcesDirectory)/repo-migration/04-validate/validate-migration.sh"
                "$(Build.SourcesDirectory)/repo-migration/04-validate/validate-migration.sh" \
                    --ado-org "$(ADO_ORG)" \
                    --ado-project "$(ADO_PROJECT)" \
                    --github-org "$(GH_ORG)" \
                    --github-repo "$ghRepo" \
                    --ado-repo "$adoRepo" \
                    --output-dir "$(Build.SourcesDirectory)/repo-migration/output" \
                    --expected-visibility "$visibility"
              workingDirectory: '$(Build.SourcesDirectory)/repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          # Batch mode — validate all repos from batch summary
          - task: Bash@3
            displayName: "4.1 Validate Batch Repos"
            condition: eq('${{ parameters.MigrationMode }}', 'Batch')
            continueOnError: true
            inputs:
              targetType: inline
              script: |
                # Read target visibility from config
                cfgPath="$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"
                visibility="private"
                if [ -f "$cfgPath" ]; then
                    cfg_vis=$(jq -r '.migration.targetRepoVisibility // empty' "$cfgPath" | tr -d '\r')
                    if [ -n "$cfg_vis" ]; then
                        visibility="$cfg_vis"
                    fi
                fi

                chmod +x "$(Build.SourcesDirectory)/repo-migration/04-validate/validate-migration.sh"
                "$(Build.SourcesDirectory)/repo-migration/04-validate/validate-migration.sh" \
                    --ado-org "$(ADO_ORG)" \
                    --ado-project "$(ADO_PROJECT)" \
                    --github-org "$(GH_ORG)" \
                    --output-dir "$(Build.SourcesDirectory)/repo-migration/output" \
                    --expected-visibility "$visibility"
              workingDirectory: '$(Build.SourcesDirectory)/repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Validation Reports"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/reports'
              artifact: "ValidationReports"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Show Validation Report on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)/repo-migration/output/reports/validation-report.html'
              tabName: "Validation Report"

          - task: Bash@3
            displayName: "Prepare Migration Report for HTML Tab"
            condition: always()
            inputs:
              targetType: inline
              script: |
                src="$(Build.SourcesDirectory)/repo-migration/output/dashboard"

                adoRepo=$(echo "${{ parameters.ADORepo }}" | xargs)
                ghRepo=$(echo "${{ parameters.GHRepo }}" | xargs)
                cfgPath="$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"
                if [ -z "$ghRepo" ] && [ -z "$adoRepo" ]; then
                    if [ -f "$cfgPath" ]; then
                        cfg_single=$(jq -r '.migration.singleRepo // empty' "$cfgPath" | tr -d '\r')
                        if [ -n "$cfg_single" ]; then
                            ghRepo="$cfg_single"
                            adoRepo="$cfg_single"
                        fi
                    fi
                fi
                if [ -z "$ghRepo" ]; then
                    ghRepo="$adoRepo"
                fi

                singleFile="$src/$ghRepo/migration-report-$ghRepo.html"

                if [ -f "$singleFile" ]; then
                    echo "Single mode — using: $singleFile"
                    echo "##vso[task.setvariable variable=MIGRATION_REPORT_PATH]$singleFile"
                else
                    htmlFiles=()
                    while IFS= read -r -d '' file; do
                        htmlFiles+=("$file")
                    done < <(find "$src" -type f -name "*.html" ! -name "combined-migration-report.html" -print0 2>/dev/null)

                    fileCount=${#htmlFiles[@]}
                    echo "Found $fileCount HTML file(s) in dashboard"
                    if [ "$fileCount" -eq 1 ]; then
                        echo "Using: ${htmlFiles[0]}"
                        echo "##vso[task.setvariable variable=MIGRATION_REPORT_PATH]${htmlFiles[0]}"
                    elif [ "$fileCount" -gt 1 ]; then
                        dst="$src/combined-migration-report.html"
                        echo "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Migration Reports</title></head><body>" > "$dst"
                        for f in "${htmlFiles[@]}"; do
                            echo "  Merged: $(basename "$f")"
                            content=$(python3 -c "
                            import sys, re
                            try:
                                content = open(sys.argv[1], 'r', encoding='utf-8', errors='ignore').read()
                                content = re.sub(r'(?i)<!DOCTYPE[^>]*>', '', content)
                                content = re.sub(r'(?i)</?html[^>]*>', '', content)
                                content = re.sub(r'(?i)<head>.*?</head>', '', content, flags=re.DOTALL)
                                content = re.sub(r'(?i)</?body[^>]*>', '', content)
                                print(content)
                            except Exception as e:
                                print(f'<p>Error merging file: {e}</p>')
                            " "$f")
                            echo "<div style='border-bottom:4px solid #0d1117;margin-bottom:40px;padding-bottom:40px;'>$content</div>" >> "$dst"
                        done
                        echo "</body></html>" >> "$dst"
                        echo "##vso[task.setvariable variable=MIGRATION_REPORT_PATH]$dst"
                    else
                        echo "##vso[task.logissue type=warning]No migration HTML files found"
                        echo "##vso[task.setvariable variable=MIGRATION_REPORT_PATH]"
                    fi
                fi

          - task: PublishHtmlReport@1
            displayName: "Show Migration Report on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(MIGRATION_REPORT_PATH)'
              tabName: "Migration Report"

          - task: Bash@3
            displayName: "Publish Validation Summary to ADO Tab"
            condition: always()
            inputs:
              targetType: inline
              script: |
                valSummary="$(Build.SourcesDirectory)/repo-migration/output/reports/validation-summary.md"
                if [ -f "$valSummary" ]; then
                    echo "##vso[task.uploadsummary]$valSummary"
                else
                    echo "##vso[task.logissue type=warning]Validation summary not found: $valSummary"
                fi
