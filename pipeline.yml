trigger:
  branches:
    include:
      - pipeline-migration

variables:
      - group: ankit-adotogit

jobs:
- job: AuditPipelines
  displayName: 'Run Azure DevOps pipeline audit'
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - checkout: self

  - task: PowerShell@2
    displayName: 'Install required tooling'
    inputs:
      targetType: 'filePath'
      filePath: 'migration-accelerator/01-prep/install-tools.ps1'
      arguments: '-GitHubPat "$(GH_PAT)"'
      pwsh: true
    env:
      GH_PAT: $(GH_PAT)
      GH_TOKEN: $(GH_PAT)

  - task: PowerShell@2
    displayName: 'Run audit-pipelines.ps1'
    inputs:
      targetType: 'filePath'
      filePath: 'migration-accelerator/00-discovery/audit-pipelines.ps1'
      arguments: '-AdoOrg "$(ADO_Org)" -AdoProject "$(ADO_Project)" -AdoPat "$(ADO_PAT)" -GitHubPat "$(GH_PAT)" -OutputDir "migration-accelerator/output/pipeline-audit"'
      pwsh: true
    env:
      ADO_PAT: $(ADO_PAT)
      GH_PAT: $(GH_PAT)
      GH_TOKEN: $(GH_PAT)

  # -------------------------------------------------------
  # DEBUG STEP: Print audit_summary.md so we can see the
  # exact format and fix regex in generate-dashboard.ps1
  # -------------------------------------------------------
  - task: PowerShell@2
    displayName: '🔍 DEBUG - Print audit_summary.md content'
    inputs:
      targetType: 'inline'
      pwsh: true
      script: |
        $summaryFile = "migration-accelerator/output/pipeline-audit/audit_summary.md"

        Write-Host "======================================================" -ForegroundColor Cyan
        Write-Host "DEBUG: Checking audit output directory contents" -ForegroundColor Cyan
        Write-Host "======================================================" -ForegroundColor Cyan

        # List all files generated by the audit
        $auditDir = "migration-accelerator/output/pipeline-audit"
        if (Test-Path $auditDir) {
            Write-Host "`n📁 Files in $auditDir :" -ForegroundColor Yellow
            Get-ChildItem -Path $auditDir -Recurse | ForEach-Object {
                Write-Host "   $($_.FullName)  [$($_.Length) bytes]"
            }
        } else {
            Write-Host "ERROR: Audit output directory not found: $auditDir" -ForegroundColor Red
        }

        Write-Host "`n======================================================" -ForegroundColor Cyan
        Write-Host "DEBUG: Raw content of audit_summary.md" -ForegroundColor Cyan
        Write-Host "======================================================" -ForegroundColor Cyan

        if (Test-Path $summaryFile) {
            $content = Get-Content $summaryFile -Raw
            Write-Host "File size: $($content.Length) characters"
            Write-Host ""
            Write-Host "--- BEGIN audit_summary.md ---"
            Write-Host $content
            Write-Host "--- END audit_summary.md ---"

            # Also show line-by-line with line numbers for easier reading
            Write-Host "`n--- LINE BY LINE VIEW ---"
            $lines = Get-Content $summaryFile
            for ($i = 0; $i -lt $lines.Count; $i++) {
                Write-Host ("{0,4}: {1}" -f ($i + 1), $lines[$i])
            }
        } else {
            Write-Host "ERROR: audit_summary.md not found at: $summaryFile" -ForegroundColor Red
            Write-Host "This means the audit step did not produce output. Check the audit step logs above." -ForegroundColor Red
        }

  - task: PublishPipelineArtifact@1
    displayName: '📦 Download Audit Reports'
    inputs:
      targetPath: 'migration-accelerator/output/pipeline-audit'
      artifact: 'pipeline-audit-reports'
      publishLocation: 'pipeline'
    condition: always()

  - task: PowerShell@2
    displayName: 'Generate HTML Dashboard'
    inputs:
      targetType: 'filePath'
      filePath: 'migration-accelerator/00-discovery/generate-dashboard.ps1'
      arguments: ''
      pwsh: true

  - task: PublishHTMLReport@1
    displayName: 'Publish HTML Dashboard to Summary'
    inputs:
      htmlPath: 'migration-accelerator/output/dashboard'
      htmlName: 'Pipeline Migration Dashboard'