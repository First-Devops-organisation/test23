trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - name: adoOrg
    value: ''
  - name: adoProject
    value: ''
  - name: adoPat
    value: ''
  - name: githubPat
    value: ''
  - name: outputDir
    value: 'migration-accelerator/output/pipeline-audit'

jobs:
- job: AuditPipelines
  displayName: 'Run Azure DevOps pipeline audit'
  pool:
    vmImage: 'windows-latest'
  steps:
  - checkout: self

  - task: PowerShell@2
    displayName: 'Install required tooling'
    inputs:
      targetType: 'filePath'
      filePath: 'migration-accelerator/01-prep/install-tools.ps1'
      arguments: ''
      pwsh: true

  - task: PowerShell@2
    displayName: 'Run audit-pipelines.ps1'
    inputs:
      targetType: 'filePath'
      filePath: 'migration-accelerator/00-discovery/audit-pipelines.ps1'
      arguments: |
        -AdoOrg "$(adoOrg)"
        -AdoProject "$(adoProject)"
        -AdoPat "$(adoPat)"
        -GitHubPat "$(githubPat)"
        -OutputDir "$(outputDir)"
      pwsh: true
    env:
      ADO_PAT: $(adoPat)
      GH_PAT: $(githubPat)
