trigger: none

pool:
  name: linux  # Set to your Linux self-hosted pool name (or use vmImage: 'ubuntu-latest')

variables:
  - group: repo-migration-discover

stages:
  - stage: Inventory
    displayName: '0. Inventory All ADO Assets (Linux)'
    jobs:
      - job: InventoryAssets
        displayName: 'Inventory Projects, Repos, Pipelines, Teams, etc.'
        timeoutInMinutes: 60
        steps:

          - script: |
              mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/inventory"
            displayName: 'Ensure output directory'

          - task: Bash@3
            displayName: '0.1 Inventory All Assets'
            inputs:
              filePath: '$(Build.SourcesDirectory)/repo-migration/linux/inventory-assets.sh'
              arguments: '--org-url "$(ADO_ORG)" --pat "$(ADO_PAT)" --output-dir "$(Build.SourcesDirectory)/repo-migration/output/inventory"'
              workingDirectory: '$(Build.SourcesDirectory)/repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Inventory Reports'
            inputs:
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/inventory'
              artifact: 'inventory-reports'
              publishLocation: 'pipeline'
            condition: always()

          - task: PublishHtmlReport@1
            displayName: 'Publish Inventory Dashboard'
            inputs:
              reportDir: '$(Build.SourcesDirectory)/repo-migration/output/inventory/inventory-dashboard.html'
              tabName: 'ADO Inventory'
            condition: always()
