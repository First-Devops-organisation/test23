trigger: none

pool:
  name: windows-latest  # Set to your Windows self-hosted pool name (or use vmImage: 'windows-latest')

variables:
  - group: repo-migration-discover

stages:
  - stage: Inventory
    displayName: '0. Inventory All ADO Assets (Windows)'
    jobs:
      - job: InventoryAssets
        displayName: 'Inventory Projects, Repos, Pipelines, Teams, etc.'
        timeoutInMinutes: 60
        steps:

          - powershell: |
              $dir = "$(Build.SourcesDirectory)/repo-migration/output/inventory"
              if (-not (Test-Path $dir)) {
                  New-Item -ItemType Directory -Path $dir -Force | Out-Null
              }
            displayName: 'Ensure output directory'

          - task: PowerShell@2
            displayName: '0.1 Inventory All Assets'
            inputs:
              filePath: '$(Build.SourcesDirectory)/repo-migration/windows/inventory-assets.ps1'
              arguments: '-OrgUrl "$(ADO_ORG)" -Pat "$(ADO_PAT)" -OutputDir "$(Build.SourcesDirectory)/repo-migration/output/inventory"'
              pwsh: false  # Runs under Windows PowerShell
              workingDirectory: '$(Build.SourcesDirectory)/repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Inventory Reports'
            inputs:
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/inventory'
              artifact: 'inventory-reports'
              publishLocation: 'pipeline'
            condition: always()

          - task: PublishHtmlReport@1
            displayName: 'Publish Inventory Dashboard'
            inputs:
              reportDir: '$(Build.SourcesDirectory)/repo-migration/output/inventory/inventory-dashboard.html'
              tabName: 'ADO Inventory'
            condition: always()
