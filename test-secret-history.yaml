trigger: none # Manual run only

parameters:
  - name: commitHash
    displayName: "Commit Hash to Inspect"
    type: string
    default: "13fed892ee68"

pool:
  vmImage: 'windows-latest'

jobs:
- job: InspectCommit
  displayName: "Inspect Hidden Secret"
  steps:
  - checkout: self
    fetchDepth: 0 # CRITICAL: Get full history so we can see old commits

  - powershell: |
      Write-Host "=== Inspecting Commit: ${{ parameters.commitHash }} ===" -ForegroundColor Cyan
      
      # Check if commit exists
      $exists = git rev-parse ${{ parameters.commitHash }} 2>$null
      if ($LASTEXITCODE -ne 0) {
          Write-Error "Commit ${{ parameters.commitHash }} not found! Make sure you are running this on the correct repository."
          exit 1
      }

      Write-Host "Commit found. Showing content changes..." -ForegroundColor Green
      
      # Show the secret that gitleaks found
      git show ${{ parameters.commitHash }}
      
    displayName: 'Git Show Secret Commit'
