trigger: none

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: runDiscovery
    displayName: 'Stage 1: Run Discovery (Export ADO Teams)'
    type: boolean
    default: true
  - name: runValidate
    displayName: 'Stage 3: Validate Org'
    type: boolean
    default: false
  - name: runCreateTeams
    displayName: 'Stage 3: Create GitHub Teams'
    type: boolean
    default: true
  - name: runSyncUsers
    displayName: 'Stage 3: Sync Users to Teams'
    type: boolean
    default: true
  - name: runSyncRepos
    displayName: 'Stage 3: Sync Repo Permissions'
    type: boolean
    default: true
  - name: runOffboard
    displayName: 'Stage 3: Offboard Users (Remove missing)'
    type: boolean
    default: false
  - name: runOnboard
    displayName: 'Stage 3: Onboard Users (Invite new)'
    type: boolean
    default: false
  - name: removeFromOrg
    displayName: 'Remove offboarded users from GitHub Org completely (if offboard stage is selected)?'
    type: boolean
    default: false

variables:
  - group: 'setup-github-org'  # Pulls ADO_Org, ADO_PAT, GH_Org, GH_PAT from Library

# =================================================================
# MULTI-STAGE PIPELINE WITH MANUAL APPROVAL
# Stage 1: Discovery  → Exports ADO teams to JSON artifact (always runs unless validate)
# Stage 2: Approval   → Manual validation gate (review the export)
# Stage 3: Execute    → Runs the stages selected in parameters
# =================================================================

stages:

# -----------------------------------------------------------------
# STAGE 1: DISCOVERY — Export ADO Teams
# -----------------------------------------------------------------
- stage: Discovery
  displayName: '1. Discovery — Export ADO Teams'
  condition: eq('${{ parameters.runDiscovery }}', true)
  jobs:
  - job: ExportTeams
    displayName: 'Export ADO Teams to JSON'
    steps:

    - script: |
        sudo apt-get update -qq && sudo apt-get install -y -qq jq > /dev/null 2>&1 || true
      displayName: 'Install jq'

    - script: |
        chmod +x "$(Build.SourcesDirectory)/migration-accelerator/01-prep/github-org-setup.sh"
        "$(Build.SourcesDirectory)/migration-accelerator/01-prep/github-org-setup.sh" \
          --stages "discover" \
          --ado-org "$(ADO_Org)" \
          --ado-pat "$(ADO_PAT)" \
          --gh-org "$(GH_Org)" \
          --gh-pat "$(GH_PAT)" \
          --user-mapping "$(Build.SourcesDirectory)/migration-accelerator/config/user-mappings.csv" \
          --output-dir "$(Build.ArtifactStagingDirectory)"
      displayName: 'Export ADO Teams (Discovery)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Exported Teams JSON'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/team-mappings-template.json'
        ArtifactName: 'team-mappings-template'
        publishLocation: 'Container'

# -----------------------------------------------------------------
# STAGE 2: MANUAL APPROVAL — Review Before Execution
# -----------------------------------------------------------------
- stage: Approval
  displayName: '2. Manual Approval — Review Export'
  dependsOn: Discovery
  condition: in(dependencies.Discovery.result, 'Succeeded', 'Skipped')
  jobs:
  - job: WaitForApproval
    displayName: 'Wait for Manual Approval'
    pool: server  # Agentless job — runs on Azure DevOps server
    steps:

    - task: ManualValidation@1
      displayName: 'Review exported teams before sync'
      timeoutInMinutes: 4320  # 3 days timeout
      inputs:
        notifyUsers: ''
        instructions: |
          ╔══════════════════════════════════════════════════════════════╗
          ║   REVIEW REQUIRED BEFORE GITHUB EXECUTION                    ║
          ╠══════════════════════════════════════════════════════════════╣
          ║                                                            ║
          ║  1. Download the 'team-mappings-template' artifact         ║
          ║     from the Discovery stage above.                        ║
          ║                                                            ║
          ║  2. Review the exported teams, members, and repo           ║
          ║     permissions. You can add/remove users or promote       ║
          ║     users to maintainers.                                  ║
          ║                                                            ║
          ║  3. Update config/team-mappings.json in the repo           ║
          ║     with ONLY the teams, users, and repos you want.        ║
          ║     The script will apply EXACTLY what is in this file.    ║
          ║                                                            ║
          ║  4. Click 'Resume' to proceed with execution.              ║
          ║     Click 'Reject' to cancel — no changes will be made.    ║
          ║                                                            ║
          ╚══════════════════════════════════════════════════════════════╝
        onTimeout: 'reject'

# -----------------------------------------------------------------
# STAGE 3: EXECUTE — Run Selected Stages
# -----------------------------------------------------------------
- stage: Execute
  displayName: '3. Execute — GitHub Org Setup'
  dependsOn: Approval
  condition: always()
  jobs:
  - job: ExecuteSetup
    displayName: 'Execute Selected Stages'
    steps:

    - script: |
        sudo apt-get update -qq && sudo apt-get install -y -qq jq > /dev/null 2>&1 || true
      displayName: 'Install jq'

    - script: |
        chmod +x "$(Build.SourcesDirectory)/migration-accelerator/01-prep/github-org-setup.sh"
        "$(Build.SourcesDirectory)/migration-accelerator/01-prep/github-org-setup.sh" \
          --stages "validate" \
          --ado-org "$(ADO_Org)" \
          --ado-pat "$(ADO_PAT)" \
          --gh-org "$(GH_Org)" \
          --gh-pat "$(GH_PAT)"
      displayName: 'Execute: Validate Org'
      condition: eq('${{ parameters.runValidate }}', true)

    - script: |
        chmod +x "$(Build.SourcesDirectory)/migration-accelerator/01-prep/github-org-setup.sh"
        "$(Build.SourcesDirectory)/migration-accelerator/01-prep/github-org-setup.sh" \
          --stages "create-teams" \
          --ado-org "$(ADO_Org)" \
          --ado-pat "$(ADO_PAT)" \
          --gh-org "$(GH_Org)" \
          --gh-pat "$(GH_PAT)" \
          --team-mapping "$(Build.SourcesDirectory)/migration-accelerator/config/team-mappings.json" \
          --user-mapping "$(Build.SourcesDirectory)/migration-accelerator/config/user-mappings.csv"
      displayName: 'Execute: Create Teams'
      condition: eq('${{ parameters.runCreateTeams }}', true)

    - script: |
        chmod +x "$(Build.SourcesDirectory)/migration-accelerator/01-prep/github-org-setup.sh"
        "$(Build.SourcesDirectory)/migration-accelerator/01-prep/github-org-setup.sh" \
          --stages "sync-users" \
          --ado-org "$(ADO_Org)" \
          --ado-pat "$(ADO_PAT)" \
          --gh-org "$(GH_Org)" \
          --gh-pat "$(GH_PAT)" \
          --team-mapping "$(Build.SourcesDirectory)/migration-accelerator/config/team-mappings.json" \
          --user-mapping "$(Build.SourcesDirectory)/migration-accelerator/config/user-mappings.csv"
      displayName: 'Execute: Sync Users'
      condition: eq('${{ parameters.runSyncUsers }}', true)

    - script: |
        chmod +x "$(Build.SourcesDirectory)/migration-accelerator/01-prep/github-org-setup.sh"
        "$(Build.SourcesDirectory)/migration-accelerator/01-prep/github-org-setup.sh" \
          --stages "sync-repos" \
          --ado-org "$(ADO_Org)" \
          --ado-pat "$(ADO_PAT)" \
          --gh-org "$(GH_Org)" \
          --gh-pat "$(GH_PAT)" \
          --team-mapping "$(Build.SourcesDirectory)/migration-accelerator/config/team-mappings.json" \
          --user-mapping "$(Build.SourcesDirectory)/migration-accelerator/config/user-mappings.csv"
      displayName: 'Execute: Sync Repos'
      condition: eq('${{ parameters.runSyncRepos }}', true)

    - script: |
        EXTRA_FLAGS=""
        if [ "${{ parameters.removeFromOrg }}" == "True" ]; then
          EXTRA_FLAGS="--remove-from-org"
        fi
        chmod +x "$(Build.SourcesDirectory)/migration-accelerator/01-prep/github-org-setup.sh"
        "$(Build.SourcesDirectory)/migration-accelerator/01-prep/github-org-setup.sh" \
          --stages "offboard" \
          --ado-org "$(ADO_Org)" \
          --ado-pat "$(ADO_PAT)" \
          --gh-org "$(GH_Org)" \
          --gh-pat "$(GH_PAT)" \
          --team-mapping "$(Build.SourcesDirectory)/migration-accelerator/config/team-mappings.json" \
          --user-mapping "$(Build.SourcesDirectory)/migration-accelerator/config/user-mappings.csv" \
          $EXTRA_FLAGS
      displayName: 'Execute: Offboard Users'
      condition: eq('${{ parameters.runOffboard }}', true)

    - script: |
        chmod +x "$(Build.SourcesDirectory)/migration-accelerator/01-prep/github-org-setup.sh"
        "$(Build.SourcesDirectory)/migration-accelerator/01-prep/github-org-setup.sh" \
          --stages "onboard" \
          --ado-org "$(ADO_Org)" \
          --ado-pat "$(ADO_PAT)" \
          --gh-org "$(GH_Org)" \
          --gh-pat "$(GH_PAT)" \
          --team-mapping "$(Build.SourcesDirectory)/migration-accelerator/config/team-mappings.json" \
          --user-mapping "$(Build.SourcesDirectory)/migration-accelerator/config/user-mappings.csv"
      displayName: 'Execute: Onboard Users'
      condition: eq('${{ parameters.runOnboard }}', true)