trigger: none

pool:
  vmImage: windows-latest

# =============================================================================
# PARAMETERS
# =============================================================================
parameters:

  - name: ReclaimMode
    displayName: "Reclaim Mode"
    type: string
    default: DryRun
    values:
      - DryRun
      - Execute

variables:
  - group: repo-migration-discove    # ADO_ORG, ADO_PROJECT, ADO_PAT
  - group: repo-migration-migrate    # GH_ORG, GH_PAT

stages:
  # ===========================================================================
  # STAGE 1 – LIST MANNEQUINS
  # ===========================================================================
  - stage: ListMannequins
    displayName: "1. List Mannequins & Preview Mappings"
    jobs:
      - job: ListAndPreview
        displayName: "List Mannequins in GitHub Org"
        timeoutInMinutes: 30
        steps:

          - task: PowerShell@2
            displayName: "Install GitHub CLI + GEI extension"
            inputs:
              targetType: inline
              script: |
                $ghDir = "$env:AGENT_TOOLSDIRECTORY\gh"
                if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
                    Write-Host "Installing GitHub CLI..."
                    Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v2.52.0/gh_2.52.0_windows_amd64.zip" -OutFile gh.zip
                    Expand-Archive -Path gh.zip -DestinationPath $ghDir -Force
                    $ghBin = (Get-ChildItem -Path $ghDir -Recurse -Filter gh.exe | Select-Object -First 1).DirectoryName
                    Write-Host "##vso[task.prependpath]$ghBin"
                    $env:PATH = "$ghBin;$env:PATH"
                }
                gh --version
                $env:GH_TOKEN = "$(GH_PAT)"
                gh auth status

                gh extension install github/gh-ado2gh 2>&1 | Where-Object { $_ -notmatch 'already installed' }
                gh extension list
              pwsh: true
            env:
              GH_TOKEN: $(GH_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                "reports" | ForEach-Object {
                    New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\$_" -Force | Out-Null
                }
              pwsh: true

          - task: PowerShell@2
            displayName: "List Mannequins & Preview Mappings"
            inputs:
              targetType: inline
              script: |
                $ghOrg     = '$(GH_ORG)'
                $reportDir = '$(Build.SourcesDirectory)\repo-migration\output\reports'

                # ── 1. Generate mannequin CSV from GitHub org ──
                Write-Host "=== Fetching Mannequins from $ghOrg ===" -ForegroundColor Cyan
                $mannequinCsv = "$reportDir\mannequins.csv"
                gh ado2gh generate-mannequin-csv --github-org $ghOrg --output $mannequinCsv 2>&1 | ForEach-Object { Write-Host "  $_" }

                if (-not (Test-Path $mannequinCsv)) {
                    Write-Warning "No mannequin CSV generated — org may have no mannequins."
                    "login,id,target_user" | Out-File $mannequinCsv -Encoding utf8
                }

                $mannequins = @(Import-Csv $mannequinCsv)
                Write-Host "`n  Total mannequins found: $($mannequins.Count)"
                if ($mannequins.Count -gt 0) {
                    Write-Host "  CSV Headers discovered: $(($mannequins[0].PSObject.Properties.Name) -join ', ')"
                }

                # ── 2. Load user mappings ──
                $mappingPath = '$(Build.SourcesDirectory)\repo-migration\config\user-mappings.csv'
                if (-not (Test-Path $mappingPath)) {
                    Write-Warning "user-mappings.csv not found at $mappingPath"
                    $mappings = @()
                } else {
                    $mappings = @(Import-Csv $mappingPath)
                    Write-Host "  User mappings loaded: $($mappings.Count)"
                }

                # ── 3. Preview mapping matches ──
                $preview = @()
                foreach ($m in $mannequins) {
                    $login = if ($m.'mannequin-user') { $m.'mannequin-user' } else { $m.login }
                    $mId   = if ($m.'mannequin-id') { $m.'mannequin-id' } else { $m.id }
                    
                    if ([string]::IsNullOrWhiteSpace($login)) { continue }
                    $login = $login.Trim()
                    $mId   = if ($mId) { $mId.Trim() } else { "" }

                    # Flexible matching logic (with null checks)
                    $match = $mappings | Where-Object {
                        ([string]::IsNullOrEmpty($_.ADOEmail) ? $false : ($_.ADOEmail.Trim() -eq $login)) -or
                        ([string]::IsNullOrEmpty($_.ADOUsername) ? $false : ($_.ADOUsername.Trim() -eq $login)) -or
                        ([string]::IsNullOrEmpty($_.ADODisplayName) ? $false : ($_.ADODisplayName.Trim() -eq $login)) -or
                        ([string]::IsNullOrEmpty($_.ADOEmail) ? $false : ($_.ADOEmail.Split('@')[0].Trim() -eq $login))
                    } | Select-Object -First 1

                    if (-not $match) {
                        Write-Host "    [DEBUG] No match found for mannequin: '$login'" -ForegroundColor Gray
                    }

                    $preview += [PSCustomObject]@{
                        Mannequin    = $login
                        MannequinId  = $mId
                        MappedTo     = if ($match) { $match.GitHubUsername } else { "*** NO MAPPING ***" }
                        MatchedBy    = if ($match) {
                            if ($match.ADOEmail.Trim() -eq $login) { "ADOEmail" }
                            elseif ($match.ADOUsername.Trim() -eq $login) { "ADOUsername" }
                            elseif ($match.ADODisplayName.Trim() -eq $login) { "ADODisplayName" }
                            else { "EmailPrefix" }
                        } else { "-" }
                    }
                }

                # ── 4. Display preview ──
                Write-Host "`n=== Mapping Preview ===" -ForegroundColor Cyan
                Write-Host ("-" * 90)
                Write-Host ("{0,-30} {1,-25} {2,-15}" -f "Mannequin", "Mapped To", "Matched By")
                Write-Host ("-" * 90)
                foreach ($p in $preview) {
                    $color = if ($p.MappedTo -eq "*** NO MAPPING ***") { "Red" } else { "Green" }
                    Write-Host ("{0,-30} {1,-25} {2,-15}" -f $p.Mannequin, $p.MappedTo, $p.MatchedBy) -ForegroundColor $color
                }
                Write-Host ("-" * 90)

                $mapped   = @($preview | Where-Object { $_.MappedTo -ne "*** NO MAPPING ***" })
                $unmapped = @($preview | Where-Object { $_.MappedTo -eq "*** NO MAPPING ***" })
                Write-Host "`n  Mapped:   $($mapped.Count)"
                Write-Host "  Unmapped: $($unmapped.Count)"

                if ($unmapped.Count -gt 0) {
                    Write-Host "`n  Unmapped mannequins — add these to user-mappings.csv:" -ForegroundColor Yellow
                    foreach ($u in $unmapped) {
                        Write-Host "    $($u.Mannequin)" -ForegroundColor Yellow
                    }
                }

                # ── 5. Save preview report ──
                $preview | Export-Csv "$reportDir\mannequin-mapping-preview.csv" -NoTypeInformation -Encoding utf8

                # ── 6. Generate reclaim CSV (for gh ado2gh) ──
                $reclaimRows = @()
                foreach ($p in $preview) {
                    if ($p.MappedTo -ne "*** NO MAPPING ***") {
                        $reclaimRows += [PSCustomObject]@{
                            'mannequin-user' = $p.Mannequin
                            'mannequin-id'   = $p.MannequinId
                            'target-user'    = $p.MappedTo
                        }
                    }
                }
                # ── 6. Generate reclaim CSV (for gh ado2gh) ──
                if ($reclaimRows.Count -gt 0) {
                    $csvLines = @("mannequin-user,mannequin-id,target-user")
                    foreach ($r in $reclaimRows) {
                        # Explicitly extract values to avoid nulls
                        $mUser   = $r.'mannequin-user'
                        $mId     = $r.'mannequin-id'
                        $tUser   = $r.'target-user'
                        Write-Host "  Adding to CSV: $mUser ($mId) -> $tUser"
                        $csvLines += "$mUser,$mId,$tUser"
                    }
                    $csvLines | Out-File "$reportDir\reclaim-input.csv" -Encoding utf8
                    Write-Host "`n  Reclaim CSV saved: reclaim-input.csv ($($reclaimRows.Count) entries)"
                }

                # ── 7. Summary markdown ──
                $md  = "# Mannequin Reclaim Preview`n`n"
                $md += "| Mannequin | Mapped To | Matched By |`n|---|---|---|`n"
                foreach ($p in $preview) {
                    $status = if ($p.MappedTo -eq "*** NO MAPPING ***") { "❌ $($p.MappedTo)" } else { "✅ $($p.MappedTo)" }
                    $md += "| $($p.Mannequin) | $status | $($p.MatchedBy) |`n"
                }
                $md += "`n**Mapped:** $($mapped.Count) | **Unmapped:** $($unmapped.Count)`n"
                $md | Out-File "$reportDir\mannequin-preview.md" -Encoding utf8

                Write-Host "##vso[task.uploadsummary]$reportDir\mannequin-preview.md"
              pwsh: true
            env:
              GH_TOKEN: $(GH_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Mannequin Reports"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "MannequinReports"
              publishLocation: pipeline

  # ===========================================================================
  # STAGE 2 – REVIEW GATE
  # ===========================================================================
  - stage: ReviewGate
    displayName: "2. Review Mappings"
    dependsOn: ListMannequins
    condition: and(succeeded(), eq('${{ parameters.ReclaimMode }}', 'Execute'))
    jobs:
      - job: ReviewMappings
        displayName: "Gate: Review Mannequin Mappings"
        pool: server
        timeoutInMinutes: 4320
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 4320
            inputs:
              notifyUsers: ""
              instructions: |
                Review the mannequin mapping preview in the pipeline summary tab.

                Mode   : ${{ parameters.ReclaimMode }}
                Target : $(GH_ORG)

                Check:
                  1. All mannequins have correct GitHub username mappings
                  2. No unmapped mannequins (add to user-mappings.csv if needed)
                  3. Target GitHub users are already org members

                Approve to send reclaim invitations, or Reject to abort.
              onTimeout: reject

  # ===========================================================================
  # STAGE 3 – RECLAIM MANNEQUINS
  # ===========================================================================
  - stage: ReclaimMannequins
    displayName: "3. Reclaim Mannequins"
    dependsOn: ReviewGate
    condition: succeeded()
    jobs:
      - job: Reclaim
        displayName: "Send Reclaim Invitations"
        timeoutInMinutes: 60
        steps:

          - task: PowerShell@2
            displayName: "Install GitHub CLI + GEI extension"
            inputs:
              targetType: inline
              script: |
                $ghDir = "$env:AGENT_TOOLSDIRECTORY\gh"
                if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
                    Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v2.52.0/gh_2.52.0_windows_amd64.zip" -OutFile gh.zip
                    Expand-Archive -Path gh.zip -DestinationPath $ghDir -Force
                    $ghBin = (Get-ChildItem -Path $ghDir -Recurse -Filter gh.exe | Select-Object -First 1).DirectoryName
                    Write-Host "##vso[task.prependpath]$ghBin"
                    $env:PATH = "$ghBin;$env:PATH"
                }
                $env:GH_TOKEN = "$(GH_PAT)"
                gh extension install github/gh-ado2gh 2>&1 | Where-Object { $_ -notmatch 'already installed' }
              pwsh: true
            env:
              GH_TOKEN: $(GH_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\reports" -Force | Out-Null
              pwsh: true

          - task: DownloadPipelineArtifact@2
            displayName: "Download Mannequin Reports"
            inputs:
              artifact: "MannequinReports"
              path: '$(Build.SourcesDirectory)\repo-migration\output\reports'

          - task: PowerShell@2
            displayName: "Reclaim Mannequins"
            inputs:
              targetType: inline
              script: |
                $ghOrg      = '$(GH_ORG)'
                $reportDir  = '$(Build.SourcesDirectory)\repo-migration\output\reports'
                
                Write-Host "=== Searching for Artifacts ==="
                Get-ChildItem -Path "$(Build.SourcesDirectory)\repo-migration\output" -Recurse | Select-Object FullName
                
                $reclaimCsv = Get-ChildItem -Path "$(Build.SourcesDirectory)\repo-migration\output" -Recurse -Filter "reclaim-input.csv" | Select-Object -ExpandProperty FullName -First 1

                if (-not $reclaimCsv -or -not (Test-Path $reclaimCsv)) {
                    Write-Warning "No reclaim-input.csv found in $(Build.SourcesDirectory)\repo-migration\output — no mannequins to reclaim."
                    exit 0
                }

                Write-Host "=== CSV Debug Info ==="
                Get-Content $reclaimCsv -TotalCount 1 | Write-Host
                Write-Host "======================"

                Write-Host "=== Bulk Reclaiming Mannequins for $ghOrg ===" -ForegroundColor Cyan
                
                # Use the --csv flag for bulk reclaim instead of looping
                gh ado2gh reclaim-mannequin `
                    --github-org $ghOrg `
                    --csv $reclaimCsv `
                    --force 2>&1 | ForEach-Object { Write-Host "  $_" }

                if ($LASTEXITCODE -eq 0) {
                    Write-Host "`n✅ Bulk reclaim command completed successfully." -ForegroundColor Green
                } else {
                    Write-Error "Bulk reclaim command failed with exit code $LASTEXITCODE"
                }
              pwsh: true
            env:
              GH_TOKEN: $(GH_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Reclaim Results"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "ReclaimResults"
              publishLocation: pipeline
