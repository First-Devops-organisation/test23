trigger: none

pool: linux
  # vmImage: ubuntu-latest

# ================a=============================================================
# PARAMETERS
# =============================================================================
parameters:

  - name: ReclaimMode
    displayName: "Reclaim Mode"
    type: string
    default: DryRun
    values:
      - DryRun
      - Execute

variables:
  - group: repo-migration-discove    # ADO_ORG, ADO_PROJECT, ADO_PAT
  - group: repo-migration-migrate    # GH_ORG, GH_PAT

stages:
  # ===========================================================================
  # STAGE 1 – LIST MANNEQUINS
  # ===========================================================================
  - stage: ListMannequins
    displayName: "1. List Mannequins & Preview Mappings"
    jobs:
      - job: ListAndPreview
        displayName: "List Mannequins in GitHub Org"
        timeoutInMinutes: 30
        steps:

          - task: Bash@3
            displayName: "Install GitHub CLI + GEI extension"
            inputs:
              targetType: inline
              script: |
                if ! command -v gh &> /dev/null; then
                    echo "Installing GitHub CLI..."
                    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
                    sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
                    echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
                    sudo apt-get update
                    sudo apt-get install gh -y
                fi
                gh --version
                export GH_TOKEN="$(GH_PAT)"
                gh auth status
                gh extension install github/gh-ado2gh || true
                gh extension list
            env:
              GH_TOKEN: $(GH_PAT)
              GH_PAT:  $(GH_PAT)

          - task: Bash@3
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/reports"

          - task: Bash@3
            displayName: "List Mannequins & Preview Mappings"
            inputs:
              targetType: inline
              script: |
                export ghOrg="$(GH_ORG)"
                export reportDir="$(Build.SourcesDirectory)/repo-migration/output/reports"
                
                echo -e "\e[36m=== Fetching Mannequins from $ghOrg ===\e[0m"
                mannequinCsv="$reportDir/mannequins.csv"
                
                gh ado2gh generate-mannequin-csv --github-org "$ghOrg" --output "$mannequinCsv" || true
                
                echo -e "\n=== Raw Mannequin CSV Check ==="
                if [ -f "$mannequinCsv" ]; then
                    head -n 3 "$mannequinCsv"
                else
                    echo -e "\e[33mWarning: File not generated: $mannequinCsv\e[0m"
                fi
                echo "==============================="
                
                cat << 'EOF' > process_mannequins.py
                import csv, os, sys

                gh_org = os.environ.get('ghOrg', '')
                report_dir = os.environ.get('reportDir', '.')
                mannequin_csv = os.path.join(report_dir, 'mannequins.csv')
                mapping_path = os.path.join(os.environ.get('BUILD_SOURCESDIRECTORY', '.'), 'repo-migration', 'config', 'user-mappings.csv')

                mannequins = []
                if os.path.exists(mannequin_csv):
                    with open(mannequin_csv, 'r', encoding='utf-8') as f:
                        reader = csv.reader(f)
                        next(reader, None) # skip header
                        for row in reader:
                            if len(row) >= 3:
                                mannequins.append({'m_user': row[0].strip(), 'm_id': row[1].strip(), 'm_target': row[2].strip()})
                else:
                    print("Mannequin CSV not found!")
                    sys.exit(0)

                print(f"\n  Total mannequins found: {len(mannequins)}")

                mappings = []
                if os.path.exists(mapping_path):
                    with open(mapping_path, 'r', encoding='utf-8') as f:
                        lines = f.readlines()
                        start_idx = 0
                        for i, line in enumerate(lines):
                            if line.strip():
                                start_idx = i
                                break
                        if start_idx < len(lines):
                            reader = csv.DictReader(lines[start_idx:])
                            for row in reader:
                                mappings.append(row)
                    print(f"  User mappings loaded: {len(mappings)}")
                else:
                    print(f"  Warning: user-mappings.csv not found at {mapping_path}")

                preview = []
                for m in mannequins:
                    login = m['m_user']
                    m_id = m['m_id']
                    if not login: continue

                    match = None
                    matched_by = '-'
                    for row in mappings:
                        ado_email = row.get('ADOEmail', '').strip()
                        ado_user = row.get('ADOUsername', '').strip()
                        ado_name = row.get('ADODisplayName', '').strip()
                        
                        if ado_email and ado_email == login:
                            match = row
                            matched_by = 'ADOEmail'
                            break
                        if ado_user and ado_user == login:
                            match = row
                            matched_by = 'ADOUsername'
                            break
                        if ado_name and ado_name == login:
                            match = row
                            matched_by = 'ADODisplayName'
                            break
                        if ado_email and ado_email.split('@')[0] == login:
                            match = row
                            matched_by = 'EmailPrefix'
                            break
                            
                    mapped_to = match['GitHubUsername'] if match else '*** NO MAPPING ***'
                    preview.append({
                        'Mannequin': login,
                        'MannequinId': m_id,
                        'MappedTo': mapped_to,
                        'MatchedBy': matched_by
                    })

                print("\n\033[36m=== Mapping Preview ===\033[0m")
                print("-" * 90)
                print(f"{'Mannequin':<30} {'Mapped To':<25} {'Matched By':<15}")
                print("-" * 90)
                for p in preview:
                    color = '\033[31m' if p['MappedTo'] == '*** NO MAPPING ***' else '\033[32m'
                    print(f"{color}{p['Mannequin']:<30} {p['MappedTo']:<25} {p['MatchedBy']:<15}\033[0m")
                print("-" * 90)

                mapped = [p for p in preview if p['MappedTo'] != '*** NO MAPPING ***']
                unmapped = [p for p in preview if p['MappedTo'] == '*** NO MAPPING ***']

                print(f"\n  Mapped:   {len(mapped)}")
                print(f"  Unmapped: {len(unmapped)}")

                if unmapped:
                    print("\n\033[33m  Unmapped mannequins — add these to user-mappings.csv:\033[0m")
                    for u in unmapped:
                        print(f"\033[33m    {u['Mannequin']}\033[0m")

                if mapped:
                    reclaim_csv = os.path.join(report_dir, 'reclaim-input.csv')
                    with open(reclaim_csv, 'w', encoding='utf-8', newline='') as f:
                        writer = csv.writer(f)
                        writer.writerow(['mannequin-user', 'mannequin-id', 'target-user'])
                        for p in mapped:
                            writer.writerow([p['Mannequin'], p['MannequinId'], p['MappedTo']])
                    print(f"\n  Reclaim CSV saved: reclaim-input.csv ({len(mapped)} entries)")

                md_path = os.path.join(report_dir, 'mannequin-preview.md')
                with open(md_path, 'w', encoding='utf-8') as f:
                    f.write("# Mannequin Reclaim Preview\n\n")
                    f.write("| Mannequin | Mapped To | Matched By |\n|---|---|---|\n")
                    for p in preview:
                        status = f"✅ {p['MappedTo']}" if p['MappedTo'] != '*** NO MAPPING ***' else f"❌ {p['MappedTo']}"
                        f.write(f"| {p['Mannequin']} | {status} | {p['MatchedBy']} |\n")
                    f.write(f"\n**Mapped:** {len(mapped)} | **Unmapped:** {len(unmapped)}\n")

                print(f"##vso[task.uploadsummary]{md_path}")
                EOF
                
                python3 process_mannequins.py
            env:
              GH_TOKEN: $(GH_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Mannequin Reports"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "MannequinReports"
              publishLocation: pipeline

  # ===========================================================================
  # STAGE 2 – REVIEW GATE
  # ===========================================================================
  - stage: ReviewGate
    displayName: "2. Review Mappings"
    dependsOn: ListMannequins
    condition: and(succeeded(), eq('${{ parameters.ReclaimMode }}', 'Execute'))
    jobs:
      - job: ReviewMappings
        displayName: "Gate: Review Mannequin Mappings"
        pool: server
        timeoutInMinutes: 4320
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 4320
            inputs:
              notifyUsers: ""
              instructions: |
                Review the mannequin mapping preview in the pipeline summary tab.

                Mode   : ${{ parameters.ReclaimMode }}
                Target : $(GH_ORG)

                Check:
                  1. All mannequins have correct GitHub username mappings
                  2. No unmapped mannequins (add to user-mappings.csv if needed)
                  3. Target GitHub users are already org members

                Approve to send reclaim invitations, or Reject to abort.
              onTimeout: reject

  # ===========================================================================
  # STAGE 3 – RECLAIM MANNEQUINS
  # ===========================================================================
  - stage: ReclaimMannequins
    displayName: "3. Reclaim Mannequins"
    dependsOn: ReviewGate
    condition: succeeded()
    jobs:
      - job: Reclaim
        displayName: "Send Reclaim Invitations"
        timeoutInMinutes: 60
        steps:

          - task: Bash@3
            displayName: "Install GitHub CLI + GEI extension"
            inputs:
              targetType: inline
              script: |
                if ! command -v gh &> /dev/null; then
                    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
                    sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
                    echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
                    sudo apt-get update
                    sudo apt-get install gh -y
                fi
                export GH_TOKEN="$(GH_PAT)"
                gh extension install github/gh-ado2gh || true
            env:
              GH_TOKEN: $(GH_PAT)
              GH_PAT:  $(GH_PAT)

          - task: Bash@3
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/reports"

          - task: DownloadPipelineArtifact@2
            displayName: "Download Mannequin Reports"
            inputs:
              artifact: "MannequinReports"
              path: '$(Build.SourcesDirectory)\repo-migration\output\reports'

          - task: Bash@3
            displayName: "Reclaim Mannequins"
            inputs:
              targetType: inline
              script: |
                ghOrg="$(GH_ORG)"
                reportDir="$(Build.SourcesDirectory)/repo-migration/output/reports"
                
                echo "=== Searching for Artifacts ==="
                find "$(Build.SourcesDirectory)/repo-migration/output" -type f
                
                reclaimCsv=$(find "$(Build.SourcesDirectory)/repo-migration/output" -name "reclaim-input.csv" | head -n 1)
                
                if [ -z "$reclaimCsv" ] || [ ! -f "$reclaimCsv" ]; then
                    echo -e "\e[33mWarning: No reclaim-input.csv found in $(Build.SourcesDirectory)/repo-migration/output — no mannequins to reclaim.\e[0m"
                    exit 0
                fi
                
                echo "=== CSV Debug Info ==="
                head -n 1 "$reclaimCsv"
                echo "======================"
                
                echo -e "\e[36m=== Bulk Reclaiming Mannequins for $ghOrg ===\e[0m"
                
                if gh ado2gh reclaim-mannequin --github-org "$ghOrg" --csv "$reclaimCsv" --force; then
                    echo -e "\n\e[32m✅ Bulk reclaim command completed successfully.\e[0m"
                else
                    exitCode=$?
                    echo -e "\e[31mBulk reclaim command failed with exit code $exitCode\e[0m"
                    exit $exitCode
                fi
            env:
              GH_TOKEN: $(GH_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Reclaim Results"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "ReclaimResults"
              publishLocation: pipeline
