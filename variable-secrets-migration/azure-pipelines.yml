trigger:
- none

pool:
  vmImage: ubuntu-latest

parameters:
- name: Migration
  displayName: "Migration Strategy"
  type: string
  default: 'Specific'
  values:
    - "Specific"
    - "All"

- name: libraryGroup
  displayName: "Library Group Name" 
  type: string
  default: 'Default Value'

- name: GitRepoName
  displayName: "GitHub Repo Name" 
  type: string
  default: 'Default Value'

variables:
- group: DevOpsConfig
# - group: group2

steps:

- task: PowerShell@2
  displayName: "Run migration for all groups"
  condition: eq('${{ parameters.Migration }}', 'All')
  inputs:
    targetType: 'inline'
    script: |
      # Authenticate GitHub CLI using pipeline PAT
      echo "$(Git_pat)" | gh auth login --with-token

      # Build auth header for Azure DevOps
      $base64AuthInfo = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$(Pat)"))
      $url = "https://dev.azure.com/$(Organization)/$(Project)/_apis/distributedtask/variablegroups?api-version=7.1-preview.2"
      $response = Invoke-RestMethod -Uri $url -Method Get -Headers @{Authorization=("Basic {0}" -f $base64AuthInfo)}

      # Filter out unwanted groups
      $filteredGroups = $response.value | Where-Object { $_.name -ne "DevOpsConfig" }

      $owner = "$(Owner)"
      $repo  = "$(GH_Repository)"

      foreach ($group in $filteredGroups) {
          Write-Host "Processing Variable Group: $($group.name)"
          if ($group.variables) {
              foreach ($varName in $group.variables.PSObject.Properties.Name) {
                  $varObj = $group.variables.$varName

                  if ($varObj.isSecret -eq $true) {
                      Write-Host "Skipping secret $varName"

                      # # GitHub CLI to set placeholder secret
                      # $placeholder = "PLACEHOLDER_$varName"
                      # gh secret set $varName --body "$placeholder" --repo "$owner/$repo"

                      # Write-Host "Stored placeholder secret $varName in GitHub repository $repo"
                  }
                  elseif ($null -ne $varObj.value -and $varObj.value -ne "") {
                      Write-Host "Storing $varName as GitHub variable"

                      # GitHub CLI to set variable
                      gh variable set $varName --body "$($varObj.value)" --repo "$owner/$repo"

                      Write-Host "Stored variable $varName in GitHub repository $repo"
                  }
                  else {
                      Write-Host "Skipped $varName (no value)"
                  }
              }
          }
      }


- task: PowerShell@2
  displayName: "Run migration for specific group"
  condition: eq('${{ parameters.Migration }}', 'Specific')
  inputs:
    targetType: 'inline'
    script: |
      # Authenticate GitHub CLI using pipeline PAT
      echo "$(Git_pat)" | gh auth login --with-token

      # Build auth header
      $base64AuthInfo = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$(Pat)"))
      $url = "https://dev.azure.com/$(Organization)/$(Project)/_apis/distributedtask/variablegroups?api-version=7.1-preview.2"
      $response = Invoke-RestMethod -Uri $url -Method Get -Headers @{Authorization=("Basic {0}" -f $base64AuthInfo)}

      # Use parameter to select group
      $targetGroupName = "${{ parameters.libraryGroup }}"
      $group = $response.value | Where-Object { $_.name -eq $targetGroupName }

      if (-not $group) {
          Write-Host "Group $targetGroupName not found"
          exit 1
      }

      $owner = "$(Owner)"
      $repo  = "${{ parameters.GitRepoName }}"

      Write-Host "Processing Variable Group: $($group.name)"
      if ($group.variables) {
          foreach ($varName in $group.variables.PSObject.Properties.Name) {
              $varObj = $group.variables.$varName

              if ($varObj.isSecret -eq $true) {
                  Write-Host "Skipping secret $varName"

                  # # GitHub CLI to set placeholder secret
                  # $placeholder = "PLACEHOLDER_$varName"
                  # gh secret set $varName --body "$placeholder" --repo "$owner/$repo"

                  # Write-Host "Stored placeholder secret $varName in GitHub repository $repo"
              }
              elseif ($null -ne $varObj.value -and $varObj.value -ne "") {
                  Write-Host "Storing $varName as GitHub variable"
                  gh variable set $varName --body "$($varObj.value)" --repo "$owner/$repo"
                  Write-Host "Stored variable $varName in GitHub repository $repo"
              }
              else {
                  Write-Host "Skipped $varName (no value)"
              }
          }
      }
