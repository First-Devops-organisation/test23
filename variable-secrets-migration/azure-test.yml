trigger:
- none

parameters:
- name: libraryGroup
  displayName: "Library Group Name" 
  type: string
  default: 'Default Value'

- name: secretNames
  type: object
  default:
    - sec

variables:
- group: DevOpsConfig   # contains secrets with keys matching secretNames
- group: ${{ parameters.libraryGroup }}

pool:
  vmImage: ubuntu-latest

steps:
- ${{ each secretName in parameters.secretNames }}:
  - task: PowerShell@2
    displayName: "Write secret ${{ secretName }} to file"
    inputs:
      targetType: 'inline'
      script: |
        $owner = "$(Owner)"
        $repo  = "migration"
        $SecretValue = "$(${{ secretName }})"

        # Authenticate GitHub CLI with pipeline PAT
        echo "$(Git_pat)" | gh auth login --with-token

        # gh variable set "${{ secretName }}" --body "$SecretValue" --repo "$owner/$repo"
        gh secret set "${{ secretName }}" --repo "$owner/$repo" --body "$SecretValue"
