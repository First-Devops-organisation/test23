trigger: none

variables:
  - group: artifact-migration

jobs:
  - job: MigratePythonFeed
    displayName: "Migrate Python Feed to GitHub"
    pool:
      vmImage: 'ubuntu-latest' # Linux is often faster for Python/Twine
    steps:
      - checkout: self

      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.x'
          addToPath: true

      - script: |
          python -m pip install --upgrade pip
          pip install twine
        displayName: 'Install Twine'

      - task: PowerShell@2
        displayName: "Execute Python Migration Script"
        inputs:
          targetType: 'filePath'
          filePath: 'migrate-python-feed.ps1'
          arguments: >
            -AdoOrg "$(ADO_ORG)"
            -AdoProject "$(ADO_PROJECT)"
            -AdoFeed "$(ADO_FEED)"
            -AdoPat "$(ADO_PAT)"
            -GitHubOrg "$(GH_ORG)"
            -GitHubPat "$(GH_PAT)"
            -TestPackage "py-project-toml"
      
