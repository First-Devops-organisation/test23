trigger: none

parameters:
  - name: commitHash
    displayName: "Commit Hash to Inspect"
    type: string
    default: "13fed892ee68"

pool:
  vmImage: 'windows-latest'

jobs:
- job: InspectCommit
  steps:
  - checkout: self
    fetchDepth: 0 

  - powershell: |
      Write-Host "=== Inspecting Commit: ${{ parameters.commitHash }} ===" -ForegroundColor Cyan
      
      # FIX: Fetch everything from the server so we can find the old commit
      Write-Host "Fetching all history..."
      git fetch --all --quiet 

      # Check if commit exists
      $exists = git rev-parse "${{ parameters.commitHash }}" 2>$null
      if ($LASTEXITCODE -ne 0) {
          Write-Error "Commit ${{ parameters.commitHash }} not found!"
          Write-Host "Are you running this on the 'migration_testing' repo?" -ForegroundColor Yellow
          exit 1
      }

      Write-Host "Commit found! Showing changes..." -ForegroundColor Green
      git show ${{ parameters.commitHash }}
    displayName: 'Force Fetch and Show'
