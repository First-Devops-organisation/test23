title = "ADO to GHAS Migration Custom Rules"

[extend]
useDefault = true

[[rules]]
id = "custom-db-connection-string"
description = "Detects generic database connection strings containing passwords"
regex = '''(?i)(?:password|pwd)\s*=\s*([^;"'\s]+)'''
secretGroup = 1
tags = ["custom", "database", "credentials"]

[[rules]]
id = "custom-connection-string-uri"
description = "Detects database connection URIs"
regex = '''(?i)(?:mysql|postgres|postgresql|mongodb|mssql|jdbc):[a-z0-9_]+://[^:]+:([^@]+)@'''
secretGroup = 1
tags = ["custom", "database", "credentials"]

[[rules]]
id = "generic-api-or-secret-key"
description = "Detects generic API keys, Access Tokens, and Secret Keys"
regex = '''(?i)(?:api_key|apikey|access_token|secret_key|auth_token|client_secret)\s*[:=]\s*["']?([a-zA-Z0-9\-_]{16,64})["']?'''
secretGroup = 1
tags = ["custom", "generic", "credentials"]

[[rules]]
id = "basic-auth-url"
description = "Detects basic authentication credentials exposed directly in HTTP/HTTPS URLs"
regex = '''(?i)https?://(?:[a-zA-Z0-9_\-\.%]+):([^@\s'"<>]+)@'''
secretGroup = 1
tags = ["custom", "url", "credentials"]

[[rules]]
id = "authorization-header"
description = "Detects hardcoded Bearer or Basic Authorization headers"
regex = '''(?i)Authorization:\s*(?:Bearer|Basic)\s+([A-Za-z0-9\-._~+/]+=*)'''
secretGroup = 1
tags = ["custom", "header", "credentials"]
