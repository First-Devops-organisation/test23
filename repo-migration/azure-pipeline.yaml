trigger: none

pool:
  vmImage: windows-latest

# =============================================================================
# PARAMETERS Ã¢â‚¬â€ choose at queue time
# =============================================================================
parameters:

  - name: MigrationMode
    displayName: "Migration Mode"
    type: string
    default: Single
    values:
      - Single
      - Batch

  - name: ADO_Repo
    displayName: "ADO Repo name (Single mode only)"
    type: string
    default: " "

  - name: GitHub_Repo
    displayName: "GitHub Repo name (Single mode only, defaults to ADO_Repo)"
    type: string
    default: " "

  - name: BatchName
    displayName: "Batch name from config (Batch mode Ã¢â‚¬â€ leave blank for all)"
    type: string
    default: " "

  - name: SkipAudit
    displayName: "Skip branch-wise audit (faster, no file inventory)"
    type: boolean
    default: false

  - name: DryRun
    displayName: "Dry Run (print GEI commands, do not execute)"
    type: boolean
    default: false

  - name: RunValidation
    displayName: "Run validation after migration"
    type: boolean
    default: true

variables:
  - group: ankit-adotogit    # ADO_Org, GitHub_Org, GH_PAT, REPORT_DIR, etc.

stages:
  # ===========================================================================
  # STAGE 1 Ã¢â‚¬â€œ DISCOVER  (reuse existing scripts Ã¢â‚¬â€ already working)
  # ===========================================================================
  - stage: Discover
    displayName: "1. Discover & Analyse"
    jobs:
      - job: DiscoverAndAudit
        displayName: "1.1 Discover Repos & Audit Sizes"
        timeoutInMinutes: 60
        steps:
          - task: PowerShell@2
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                $cfg = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $c   = Get-Content $cfg -Raw
                $c   = $c -replace '\$\(ADO_Org\)',     '$(ADO_Org)'
                $c   = $c -replace '\$\(ADO_Project\)', '$(ADO_Project)'
                $c   = $c -replace '\$\(ADO_PAT\)',     '$(ADO_PAT)'
                $c   = $c -replace '\$\(GitHub_Org\)',   '$(GitHub_Org)'
                $c   = $c -replace '\$\(GH_PAT\)',      '$(GH_PAT)'
                $c   = $c -replace '\$\(CLONE_TEMP_DIR\)', '$(CLONE_TEMP_DIR)'
                $c   = $c -replace '\$\(LOG_DIR\)',        '$(LOG_DIR)'
                $c   = $c -replace '\$\(REPORT_DIR\)',     '$(REPORT_DIR)'
                Set-Content -Path $cfg -Value $c
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                $base = "$(Build.SourcesDirectory)\repo-migration"
                $env:REPORT_DIR, $env:LOG_DIR, $env:CLONE_TEMP_DIR, "output\audit", "output\dashboard", "output\tmp\scrubbed" | ForEach-Object {
                    if ([string]::IsNullOrWhiteSpace($_)) { return }
                    $p = Join-Path $base $_
                    if (-not (Test-Path $p)) {
                        New-Item -ItemType Directory -Path $p -Force | Out-Null
                    }
                }
              pwsh: true
            env:
              REPORT_DIR: $(REPORT_DIR)
              LOG_DIR: $(LOG_DIR)
              CLONE_TEMP_DIR: $(CLONE_TEMP_DIR)

          - task: PowerShell@2
            displayName: "1.1 Discover Repos"
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\01-discover\discover-repos.ps1'
              arguments: '-ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_Org: $(ADO_Org)
              ADO_Project: $(ADO_Project)
              ADO_PAT: $(ADO_PAT)

          - task: PowerShell@2
            displayName: "1.2 Audit Repo Sizes"
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\01-discover\audit-repo-sizes.ps1'
              arguments: '-ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            condition: eq('${{ parameters.SkipAudit }}', false)
            env:
              ADO_Org: $(ADO_Org)
              ADO_Project: $(ADO_Project)
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Discovery Reports"
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\$(REPORT_DIR)'
              artifact: "discovery-reports"
              publishLocation: pipeline
            condition: always()

      - job: ScanSecrets
        displayName: "1.3 Scan Secrets (gitleaks + keyword)"
        dependsOn: DiscoverAndAudit
        timeoutInMinutes: 120
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: "Download Discovery Reports"
            inputs:
              artifact: "discovery-reports"
              path: '$(Build.SourcesDirectory)\repo-migration\$(REPORT_DIR)'

          - task: PowerShell@2
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                $cfg = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $c   = Get-Content $cfg -Raw
                $c   = $c -replace '\$\(ADO_Org\)',     '$(ADO_Org)'
                $c   = $c -replace '\$\(ADO_Project\)', '$(ADO_Project)'
                $c   = $c -replace '\$\(ADO_PAT\)',     '$(ADO_PAT)'
                $c   = $c -replace '\$\(GitHub_Org\)',   '$(GitHub_Org)'
                $c   = $c -replace '\$\(GH_PAT\)',      '$(GH_PAT)'
                $c   = $c -replace '\$\(CLONE_TEMP_DIR\)', '$(CLONE_TEMP_DIR)'
                $c   = $c -replace '\$\(LOG_DIR\)',        '$(LOG_DIR)'
                $c   = $c -replace '\$\(REPORT_DIR\)',     '$(REPORT_DIR)'
                Set-Content -Path $cfg -Value $c
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PowerShell@2
            displayName: "Install gitleaks"
            inputs:
              targetType: inline
              script: |
                Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_windows_x64.zip" -OutFile gitleaks.zip
                Expand-Archive -Path gitleaks.zip -DestinationPath "$env:AGENT_TOOLSDIRECTORY\gitleaks" -Force
                Write-Host "##vso[task.prependpath]$env:AGENT_TOOLSDIRECTORY\gitleaks"
              pwsh: true

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                $base = "$(Build.SourcesDirectory)\repo-migration"
                $env:REPORT_DIR, $env:LOG_DIR, $env:CLONE_TEMP_DIR, "output\audit", "output\dashboard", "output\tmp\scrubbed" | ForEach-Object {
                    if ([string]::IsNullOrWhiteSpace($_)) { return }
                    $p = Join-Path $base $_
                    if (-not (Test-Path $p)) {
                        New-Item -ItemType Directory -Path $p -Force | Out-Null
                    }
                }
              pwsh: true
            env:
              REPORT_DIR: $(REPORT_DIR)
              LOG_DIR: $(LOG_DIR)
              CLONE_TEMP_DIR: $(CLONE_TEMP_DIR)

          - task: PowerShell@2
            displayName: "1.3 Scan Secrets"
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\01-discover\scan-secrets.ps1'
              arguments: '-ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_Org: $(ADO_Org)
              ADO_Project: $(ADO_Project)
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Scan Reports"
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\$(REPORT_DIR)'
              artifact: "scan-reports"
              publishLocation: pipeline
            condition: always()

          - task: PublishHtmlReport@1
            displayName: "Show Secret Scan Report"
            condition: always()
            continueOnError: true
            inputs:
              reportDir: '$(Build.SourcesDirectory)\repo-migration\$(REPORT_DIR)\secret-scan-report.html'
              tabName: "Secret Scan Report"

  - stage: ReviewGate
    displayName: "2. Review Gate"
    dependsOn: Discover
    condition: succeeded()
    jobs:
      - job: ReviewGateJob
        displayName: "Gate: Review Discovery Findings"
        pool: server
        timeoutInMinutes: 4320
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 4320
            inputs:
              notifyUsers: ""
              instructions: |
                Review the discovery artifacts before proceeding to migration.

                Download and check:
                  discovery-reports/repo-inventory.json
                    Ã¢â€ â€™ confirm which repos to include / exclude
                    Ã¢â€ â€™ update config/repo-migration-config.json batches and exclusions

                  discovery-reports/repo-sizes.json
                    Ã¢â€ â€™ any repo flagged OVER_LIMIT (> 40 GiB) must be remediated first

                  scan-reports-batch*/secret-scan-findings.json
                    Ã¢â€ â€™ MANDATORY for regulated environment
                    Ã¢â€ â€™ Critical/High findings must be remediated before migration
                    Ã¢â€ â€™ if zero findings: safe to proceed
                    Ã¢â€ â€™ if findings exist: scrub history first (scrub-secrets.ps1)

                Populate config/user-mappings.csv with ADOÃ¢â€ â€™GitHub username mappings.

                Approve to proceed to migration, or Reject to abort.
              onTimeout: reject

  # ===========================================================================
  # ===========================================================================
  # STAGE 2B - SCRUB SECRETS
  # ===========================================================================
  - stage: ScrubSecrets
    displayName: "2b. Scrub Secrets"
    dependsOn: ReviewGate
    condition: succeeded()
    jobs:
      - job: ScrubSecretsJob
        displayName: "Scrub secrets from repo history"
        timeoutInMinutes: 120
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: "Download Scan Reports"
            inputs:
              artifact: "scan-reports"
              path: '$(Build.SourcesDirectory)\repo-migration\$(REPORT_DIR)'

          - task: PowerShell@2
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                $cfg = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $c   = Get-Content $cfg -Raw
                $c   = $c -replace '\$\(ADO_Org\)',     '$(ADO_Org)'
                $c   = $c -replace '\$\(ADO_Project\)', '$(ADO_Project)'
                $c   = $c -replace '\$\(ADO_PAT\)',     '$(ADO_PAT)'
                $c   = $c -replace '\$\(GitHub_Org\)',   '$(GitHub_Org)'
                $c   = $c -replace '\$\(GH_PAT\)',      '$(GH_PAT)'
                $c   = $c -replace '\$\(CLONE_TEMP_DIR\)', '$(CLONE_TEMP_DIR)'
                $c   = $c -replace '\$\(LOG_DIR\)',        '$(LOG_DIR)'
                $c   = $c -replace '\$\(REPORT_DIR\)',     '$(REPORT_DIR)'
                Set-Content -Path $cfg -Value $c
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PowerShell@2
            displayName: "Install git-filter-repo"
            inputs:
              targetType: inline
              script: |
                pip install git-filter-repo
              pwsh: true

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                $base = "$(Build.SourcesDirectory)\repo-migration"
                $env:REPORT_DIR, $env:LOG_DIR, $env:CLONE_TEMP_DIR, "output\audit", "output\dashboard", "output\tmp\scrubbed" | ForEach-Object {
                    if ([string]::IsNullOrWhiteSpace($_)) { return }
                    $p = Join-Path $base $_
                    if (-not (Test-Path $p)) {
                        New-Item -ItemType Directory -Path $p -Force | Out-Null
                    }
                }
              pwsh: true
            env:
              REPORT_DIR: $(REPORT_DIR)
              LOG_DIR: $(LOG_DIR)
              CLONE_TEMP_DIR: $(CLONE_TEMP_DIR)

          - task: PowerShell@2
            displayName: "2b. Scrub Secrets"
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\02-prep\scrub-secrets.ps1'
              arguments: '-ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_Org: $(ADO_Org)
              ADO_Project: $(ADO_Project)
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Scrub Reports"
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\$(REPORT_DIR)'
              artifact: "scrub-reports"
              publishLocation: pipeline
            condition: always()

  # STAGE 3A Ã¢â‚¬â€œ SINGLE REPO MIGRATION
  # ===========================================================================
  - stage: MigrateSingle
    displayName: "3a. Migrate (Single Repo)"
    dependsOn: ScrubSecrets
    condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Single'))
    jobs:
      - job: MigrateSingleRepo
        displayName: "Migrate ${{ parameters.ADO_Repo }}"
        timeoutInMinutes: 180
        steps:

          - task: PowerShell@2
            displayName: "Install GitHub CLI + ado2gh extension"
            inputs:
              targetType: inline
              script: |
                # Portable zip install Ã¢â‚¬â€ no elevation required on self-hosted agents
                $ghDir = "$env:AGENT_TOOLSDIRECTORY\gh"
                if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
                    Write-Host "Installing GitHub CLI (portable zip)..."
                    Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v2.52.0/gh_2.52.0_windows_amd64.zip" -OutFile gh.zip
                    Expand-Archive -Path gh.zip -DestinationPath $ghDir -Force
                    $ghBin = (Get-ChildItem -Path $ghDir -Recurse -Filter gh.exe | Select-Object -First 1).DirectoryName
                    Write-Host "##vso[task.prependpath]$ghBin"
                    $env:PATH = "$ghBin;$env:PATH"
                }
                gh --version

                # Authenticate gh CLI before installing extensions
                $env:GH_TOKEN = "$(GH_PAT)"
                echo $env:GH_TOKEN | gh auth login --with-token
               
                gh auth status

                gh extension install github/gh-ado2gh 2>&1 | Where-Object { $_ -notmatch 'already installed' }
                gh extension upgrade ado2gh
                gh extension list
              pwsh: true
            env:
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                $base = "$(Build.SourcesDirectory)\repo-migration"
                $env:REPORT_DIR, $env:LOG_DIR, $env:CLONE_TEMP_DIR, "output\audit", "output\dashboard", "output\tmp\scrubbed" | ForEach-Object {
                    if ([string]::IsNullOrWhiteSpace($_)) { return }
                    $p = Join-Path $base $_
                    if (-not (Test-Path $p)) {
                        New-Item -ItemType Directory -Path $p -Force | Out-Null
                    }
                }
              pwsh: true
            env:
              REPORT_DIR: $(REPORT_DIR)
              LOG_DIR: $(LOG_DIR)
              CLONE_TEMP_DIR: $(CLONE_TEMP_DIR)

          - task: PowerShell@2
            displayName: "Migrate Single Repo"
            inputs:
              targetType: inline
              script: |
                $ADO_Repo = '${{ parameters.ADO_Repo }}'.Trim()
                $GitHub_Repo  = '${{ parameters.GitHub_Repo }}'.Trim()
                if ([string]::IsNullOrWhiteSpace($GitHub_Repo)) { $GitHub_Repo = $ADO_Repo }

                # Read target visibility from config
                $cfgPath = '$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json'
                $visibility = 'private'
                if (Test-Path $cfgPath) {
                    $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
                    if ($cfg.migration.targetRepoVisibility) {
                        $visibility = $cfg.migration.targetRepoVisibility
                    }
                }

                $params = @{
                    ADOOrg     = '$(ADO_Org)'.Trim()
                    ADOProject = '$(ADO_Project)'.Trim()
                    ADO_Repo    = $ADO_Repo
                    GHOrg      = '$(GitHub_Org)'.Trim()
                    GitHub_Repo     = $GitHub_Repo
                    OutputDir  = '$(Build.SourcesDirectory)\repo-migration\output'
                    TargetRepoVisibility = $visibility
                }
                if ('${{ parameters.SkipAudit }}' -eq 'True') { $params['SkipAudit'] = $true }
                if ('${{ parameters.DryRun }}'    -eq 'True') { $params['DryRun']    = $true }
                & '$(Build.SourcesDirectory)\repo-migration\03-migrate\migrate-single.ps1' @params
                Write-Host "##vso[task.setvariable variable=RESOLVED_REPO]$GitHub_Repo"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT:   $(ADO_PAT)
              GH_PAT:    $(GH_PAT)
              GH_TOKEN:  $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Migration Logs"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\$(LOG_DIR)'
              artifact: "MigrationLogs-${{ parameters.ADO_Repo }}"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Audit Data"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\audit'
              artifact: "MigrationAudit-${{ parameters.ADO_Repo }}"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish HTML Dashboard"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\dashboard'
              artifact: "MigrationDashboard-${{ parameters.ADO_Repo }}"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Show HTML on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)\repo-migration\output\dashboard\$(RESOLVED_REPO)'
              tabName: "Migration Report"

          - task: DownloadPipelineArtifact@2
            displayName: "Download Scrub Reports"
            inputs:
              artifact: "scrub-reports"
              path: '$(Build.SourcesDirectory)\repo-migration\$(REPORT_DIR)'

          - task: PowerShell@2
            displayName: "Create GitHub Secrets"
            inputs:
              targetType: inline
              script: |
                $ADO_Repo = '${{ parameters.ADO_Repo }}'.Trim()
                $GitHub_Repo  = '${{ parameters.GitHub_Repo }}'.Trim()
                if ([string]::IsNullOrWhiteSpace($GitHub_Repo)) { $GitHub_Repo = $ADO_Repo }

                & '$(Build.SourcesDirectory)\repo-migration\03-migrate\create-github-secrets.ps1' `
                    -GitHubOrg '$(GitHub_Org)' `
                    -GitHubRepo $GitHub_Repo `
                    -ConfigPath '$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              GH_PAT:   $(GH_PAT)
              GH_TOKEN: $(GH_PAT)


  # ===========================================================================
  # STAGE 3B Ã¢â‚¬â€œ BATCH REPO MIGRATION
  # ===========================================================================
  - stage: MigrateBatch
    displayName: "3b. Migrate (Batch)"
    dependsOn: ScrubSecrets
    condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Batch'))
    jobs:
      - job: MigrateBatchRepos
        displayName: "Migrate Batch"
        timeoutInMinutes: 480
        steps:

          - task: PowerShell@2
            displayName: "Install GitHub CLI + ado2gh extension"
            inputs:
              targetType: inline
              script: |
                # Portable zip install Ã¢â‚¬â€ no elevation required on self-hosted agents
                $ghDir = "$env:AGENT_TOOLSDIRECTORY\gh"
                if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
                    Write-Host "Installing GitHub CLI (portable zip)..."
                    Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v2.52.0/gh_2.52.0_windows_amd64.zip" -OutFile gh.zip
                    Expand-Archive -Path gh.zip -DestinationPath $ghDir -Force
                    $ghBin = (Get-ChildItem -Path $ghDir -Recurse -Filter gh.exe | Select-Object -First 1).DirectoryName
                    Write-Host "##vso[task.prependpath]$ghBin"
                    $env:PATH = "$ghBin;$env:PATH"
                }
                gh --version

                # Authenticate gh CLI before installing extensions
                $env:GH_TOKEN = "$(GH_PAT)"
                "$(GH_PAT)" | gh auth login --with-token
                gh auth status

                gh extension install github/gh-ado2gh 2>&1 | Where-Object { $_ -notmatch 'already installed' }
                gh extension list
              pwsh: true
            env:
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                $cfg = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $c   = Get-Content $cfg -Raw
                $c   = $c -replace '\$\(ADO_Org\)',     '$(ADO_Org)'
                $c   = $c -replace '\$\(ADO_Project\)', '$(ADO_Project)'
                $c   = $c -replace '\$\(ADO_PAT\)',     '$(ADO_PAT)'
                $c   = $c -replace '\$\(GitHub_Org\)',   '$(GitHub_Org)'
                $c   = $c -replace '\$\(GH_PAT\)',      '$(GH_PAT)'
                $c   = $c -replace '\$\(CLONE_TEMP_DIR\)', '$(CLONE_TEMP_DIR)'
                $c   = $c -replace '\$\(LOG_DIR\)',        '$(LOG_DIR)'
                $c   = $c -replace '\$\(REPORT_DIR\)',     '$(REPORT_DIR)'
                Set-Content -Path $cfg -Value $c
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                $base = "$(Build.SourcesDirectory)\repo-migration"
                $env:REPORT_DIR, $env:LOG_DIR, $env:CLONE_TEMP_DIR, "output\audit", "output\dashboard", "output\tmp\scrubbed" | ForEach-Object {
                    if ([string]::IsNullOrWhiteSpace($_)) { return }
                    $p = Join-Path $base $_
                    if (-not (Test-Path $p)) {
                        New-Item -ItemType Directory -Path $p -Force | Out-Null
                    }
                }
              pwsh: true
            env:
              REPORT_DIR: $(REPORT_DIR)
              LOG_DIR: $(LOG_DIR)
              CLONE_TEMP_DIR: $(CLONE_TEMP_DIR)

          - task: PowerShell@2
            displayName: "Migrate Batch Repos"
            inputs:
              targetType: inline
              script: |
                $params = @{
                    ADOOrg      = '$(ADO_Org)'
                    ADOProject  = '$(ADO_Project)'
                    GHOrg       = '$(GitHub_Org)'
                    ConfigPath  = '$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json'
                    BatchName   = '${{ parameters.BatchName }}'
                    OutputDir   = '$(Build.SourcesDirectory)\repo-migration\output'
                    MaxParallel = 3
                }
                if ('${{ parameters.SkipAudit }}' -eq 'True') { $params['SkipAudit'] = $true }
                if ('${{ parameters.DryRun }}'    -eq 'True') { $params['DryRun']    = $true }
                & '$(Build.SourcesDirectory)\repo-migration\03-migrate\migrate-batch.ps1' @params
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT:  $(ADO_PAT)
              GH_PAT:   $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Migration Logs"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\$(LOG_DIR)'
              artifact: "BatchMigrationLogs"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Audit Data"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\audit'
              artifact: "BatchMigrationAudit"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Dashboards"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\dashboard'
              artifact: "BatchMigrationDashboards"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Summary"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\$(REPORT_DIR)'
              artifact: "BatchMigrationReports"
              publishLocation: pipeline

          - task: DownloadPipelineArtifact@2
            displayName: "Download Scrub Reports"
            inputs:
              artifact: "scrub-reports"
              path: '$(Build.SourcesDirectory)\repo-migration\$(REPORT_DIR)'

          - task: PowerShell@2
            displayName: "Create GitHub Secrets (Batch)"
            inputs:
              targetType: inline
              script: |
                $secretValues = '$(Build.SourcesDirectory)\repo-migration\output\reports\secret-values.json'
                if (-not (Test-Path $secretValues)) {
                    Write-Host "No secret-values.json found - skipping secret creation"
                    exit 0
                }
                $secrets = Get-Content $secretValues -Raw | ConvertFrom-Json
                $repos = $secrets | Select-Object -ExpandProperty Repo -Unique

                foreach ($repoName in $repos) {
                    Write-Host "Creating secrets for $repoName..."
                    & '$(Build.SourcesDirectory)\repo-migration\03-migrate\create-github-secrets.ps1' `
                        -GitHubOrg '$(GitHub_Org)' `
                        -GitHubRepo $repoName `
                        -SecretValuesPath $secretValues
                }
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              GH_PAT:   $(GH_PAT)
              GH_TOKEN: $(GH_PAT)


  # ===========================================================================
  # STAGE 4 Ã¢â‚¬â€œ VALIDATE
  # ===========================================================================
  - stage: Validate
    displayName: "4. Validate Migration"
    dependsOn:
      - MigrateSingle
      - MigrateBatch
    condition: |
      and(
        eq('${{ parameters.RunValidation }}', true),
        or(
          eq(dependencies.MigrateSingle.result, 'Succeeded'),
          eq(dependencies.MigrateSingle.result, 'SucceededWithIssues'),
          eq(dependencies.MigrateBatch.result, 'Succeeded'),
          eq(dependencies.MigrateBatch.result, 'SucceededWithIssues')
        )
      )
    jobs:
      - job: ValidateRepos
        displayName: "4.1 Validate Migrated Repos"
        timeoutInMinutes: 60
        steps:

          - task: PowerShell@2
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                $cfg = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $c   = Get-Content $cfg -Raw
                $c   = $c -replace '\$\(ADO_Org\)',     '$(ADO_Org)'
                $c   = $c -replace '\$\(ADO_Project\)', '$(ADO_Project)'
                $c   = $c -replace '\$\(ADO_PAT\)',     '$(ADO_PAT)'
                $c   = $c -replace '\$\(GitHub_Org\)',   '$(GitHub_Org)'
                $c   = $c -replace '\$\(GH_PAT\)',      '$(GH_PAT)'
                $c   = $c -replace '\$\(CLONE_TEMP_DIR\)', '$(CLONE_TEMP_DIR)'
                $c   = $c -replace '\$\(LOG_DIR\)',        '$(LOG_DIR)'
                $c   = $c -replace '\$\(REPORT_DIR\)',     '$(REPORT_DIR)'
                Set-Content -Path $cfg -Value $c
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                $base = "$(Build.SourcesDirectory)\repo-migration"
                $env:REPORT_DIR, $env:LOG_DIR, $env:CLONE_TEMP_DIR, "output\audit", "output\dashboard", "output\tmp\scrubbed" | ForEach-Object {
                    if ([string]::IsNullOrWhiteSpace($_)) { return }
                    $p = Join-Path $base $_
                    if (-not (Test-Path $p)) {
                        New-Item -ItemType Directory -Path $p -Force | Out-Null
                    }
                }
              pwsh: true
            env:
              REPORT_DIR: $(REPORT_DIR)
              LOG_DIR: $(LOG_DIR)
              CLONE_TEMP_DIR: $(CLONE_TEMP_DIR)

          # Download migration artifacts to get audit data + batch summary
          - task: DownloadPipelineArtifact@2
            displayName: "Download Migration Reports (Single)"
            condition: eq('${{ parameters.MigrationMode }}', 'Single')
            continueOnError: true
            inputs:
              artifact: "MigrationAudit-${{ parameters.ADO_Repo }}"
              path: '$(Build.SourcesDirectory)\repo-migration\output\audit'

          - task: DownloadPipelineArtifact@2
            displayName: "Download Batch Audit Data"
            condition: eq('${{ parameters.MigrationMode }}', 'Batch')
            continueOnError: true
            inputs:
              artifact: "BatchMigrationAudit"
              path: '$(Build.SourcesDirectory)\repo-migration\output\audit'

          - task: DownloadPipelineArtifact@2
            displayName: "Download Batch Reports (for batch-migration-summary.json)"
            condition: eq('${{ parameters.MigrationMode }}', 'Batch')
            continueOnError: true
            inputs:
              artifact: "BatchMigrationReports"
              path: '$(Build.SourcesDirectory)\repo-migration\$(REPORT_DIR)'

          # Download migration dashboards for HTML tab
          - task: DownloadPipelineArtifact@2
            displayName: "Download Migration Dashboard (Single)"
            condition: eq('${{ parameters.MigrationMode }}', 'Single')
            continueOnError: true
            inputs:
              artifact: "MigrationDashboard-${{ parameters.ADO_Repo }}"
              path: '$(Build.SourcesDirectory)\repo-migration\output\dashboard'

          - task: DownloadPipelineArtifact@2
            displayName: "Download Migration Dashboards (Batch)"
            condition: eq('${{ parameters.MigrationMode }}', 'Batch')
            continueOnError: true
            inputs:
              artifact: "BatchMigrationDashboards"
              path: '$(Build.SourcesDirectory)\repo-migration\output\dashboard'

          # Single mode Ã¢â‚¬â€ validate one repo
          - task: PowerShell@2
            displayName: "4.1 Validate Single Repo"
            condition: eq('${{ parameters.MigrationMode }}', 'Single')
            continueOnError: true
            inputs:
              targetType: inline
              script: |
                $ADO_Repo = '${{ parameters.ADO_Repo }}'.Trim()
                $GitHub_Repo  = '${{ parameters.GitHub_Repo }}'.Trim()
                if ([string]::IsNullOrWhiteSpace($GitHub_Repo)) { $GitHub_Repo = $ADO_Repo }

                # Read target visibility from config
                $cfgPath = '$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json'
                $visibility = 'private'
                if (Test-Path $cfgPath) {
                    $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
                    if ($cfg.migration.targetRepoVisibility) {
                        $visibility = $cfg.migration.targetRepoVisibility
                    }
                }

                & '$(Build.SourcesDirectory)\repo-migration\04-validate\validate-migration.ps1' `
                    -ADOOrg     '$(ADO_Org)' `
                    -ADOProject '$(ADO_Project)' `
                    -GHOrg      '$(GitHub_Org)' `
                    -GitHub_Repo     $GitHub_Repo `
                    -ADO_Repo    $ADO_Repo `
                    -OutputDir  '$(Build.SourcesDirectory)\repo-migration\output' `
                    -ExpectedVisibility $visibility
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          # Batch mode Ã¢â‚¬â€ validate all repos from batch summary
          - task: PowerShell@2
            displayName: "4.1 Validate Batch Repos"
            condition: eq('${{ parameters.MigrationMode }}', 'Batch')
            continueOnError: true
            inputs:
              targetType: inline
              script: |
                # Read target visibility from config
                $cfgPath = '$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json'
                $visibility = 'private'
                if (Test-Path $cfgPath) {
                    $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
                    if ($cfg.migration.targetRepoVisibility) {
                        $visibility = $cfg.migration.targetRepoVisibility
                    }
                }

                & '$(Build.SourcesDirectory)\repo-migration\04-validate\validate-migration.ps1' `
                    -ADOOrg     '$(ADO_Org)' `
                    -ADOProject '$(ADO_Project)' `
                    -GHOrg      '$(GitHub_Org)' `
                    -OutputDir  '$(Build.SourcesDirectory)\repo-migration\output' `
                    -ExpectedVisibility $visibility
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Validation Reports"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\$(REPORT_DIR)'
              artifact: "ValidationReports"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Show Validation Report on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)\repo-migration\$(REPORT_DIR)\validation-report.html'
              tabName: "Validation Report"

          - task: PowerShell@2
            displayName: "Prepare Migration Report for HTML Tab"
            condition: always()
            inputs:
              targetType: inline
              script: |
                $src = "$(Build.SourcesDirectory)\repo-migration\output\dashboard"

                # For Single mode: use pipeline parameters
                $ADO_Repo = '${{ parameters.ADO_Repo }}'.Trim()
                $GitHub_Repo  = '${{ parameters.GitHub_Repo }}'.Trim()
                if ([string]::IsNullOrWhiteSpace($GitHub_Repo)) { $GitHub_Repo = $ADO_Repo }
                $singleFile = "$src\$GitHub_Repo\migration-report-$GitHub_Repo.html"

                if (Test-Path $singleFile) {
                    Write-Host "Single mode Ã¢â‚¬â€ using: $singleFile"
                    Write-Host "##vso[task.setvariable variable=MIGRATION_REPORT_PATH]$singleFile"
                }
                else {
                    # Batch mode or Single file not found Ã¢â‚¬â€ find all HTML files
                    $htmlFiles = @(Get-ChildItem -Path $src -Recurse -Filter "*.html" -ErrorAction SilentlyContinue)
                    Write-Host "Found $($htmlFiles.Count) HTML file(s) in dashboard"
                    if ($htmlFiles.Count -eq 1) {
                        Write-Host "Using: $($htmlFiles[0].FullName)"
                        Write-Host "##vso[task.setvariable variable=MIGRATION_REPORT_PATH]$($htmlFiles[0].FullName)"
                    }
                    elseif ($htmlFiles.Count -gt 1) {
                        $dst = "$src\combined-migration-report.html"
                        $combined = "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Migration Reports</title></head><body>"
                        foreach ($f in $htmlFiles) {
                            $content = Get-Content $f.FullName -Raw -Encoding utf8
                            $content = $content -replace '<!DOCTYPE[^>]*>', '' -replace '</?html[^>]*>', '' -replace '<head>.*?</head>', '' -replace '</?body[^>]*>', ''
                            $combined += "<div style='border-bottom:4px solid #0d1117;margin-bottom:40px;padding-bottom:40px;'>$content</div>"
                            Write-Host "  Merged: $($f.Name)"
                        }
                        $combined += "</body></html>"
                        $combined | Out-File $dst -Encoding utf8
                        Write-Host "##vso[task.setvariable variable=MIGRATION_REPORT_PATH]$dst"
                    }
                    else {
                        Write-Warning "No migration HTML files found"
                        Write-Host "##vso[task.setvariable variable=MIGRATION_REPORT_PATH]"
                    }
                }
              pwsh: true

          - task: PublishHtmlReport@1
            displayName: "Show Migration Report on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(MIGRATION_REPORT_PATH)'
              tabName: "Migration Report"

          - task: PowerShell@2
            displayName: "Publish Validation Summary to ADO Tab"
            condition: always()
            inputs:
              targetType: inline
              script: |
                $valSummary = "$(Build.SourcesDirectory)\repo-migration\output\reports\validation-summary.md"
                if (Test-Path $valSummary) {
                    Write-Host "##vso[task.uploadsummary]$valSummary"
                } else { Write-Warning "Validation summary not found: $valSummary" }
              pwsh: true





