trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: repo-migration-discover

stages:
  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 1: DISCOVER
  # ═══════════════════════════════════════════════════════════════════════════
  - stage: Discover
    displayName: '1. Discover & Analyze'
    jobs:
      # ── Job 1: Discover repos + Audit sizes ──────────────────────────────
      - job: DiscoverAndAudit
        displayName: 'Discover Repos & Audit Sizes'
        timeoutInMinutes: 30
        steps:

          - script: |
              echo "Installing git-sizer..."
              curl -sL https://github.com/github/git-sizer/releases/download/v1.5.0/git-sizer-1.5.0-linux-amd64.zip -o git-sizer.zip
              unzip git-sizer.zip -d /usr/local/bin/
              chmod +x /usr/local/bin/git-sizer
              git-sizer --version
            displayName: 'Install git-sizer'

          - script: git lfs install
            displayName: 'Install Git LFS'

          - task: PowerShell@2
            displayName: 'Replace config tokens'
            inputs:
              targetType: inline
              script: |
                $configFile = "$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"
                $content = Get-Content $configFile -Raw
                $content = $content -replace '\$\(ADO_ORG\)', '$(ADO_ORG)'
                $content = $content -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $content = $content -replace '\$\(ADO_PAT\)', '$(ADO_PAT)'
                Set-Content -Path $configFile -Value $content
                Write-Host "Config tokens replaced successfully."
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)

          - script: |
              mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/reports"
              mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/logs"
              mkdir -p "$(Build.SourcesDirectory)/repo-migration/tmp/clones"
            displayName: 'Ensure output directories'

          - task: PowerShell@2
            displayName: '1.1 Discover Repos'
            inputs:
              filePath: '$(Build.SourcesDirectory)/repo-migration/01-discover/discover-repos.ps1'
              arguments: '-ConfigPath "$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - script: |
              echo "Freeing disk space..."
              sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache 2>/dev/null || true
              sudo apt-get clean 2>/dev/null || true
              df -h /
            displayName: 'Free disk space'

          - task: PowerShell@2
            displayName: '1.2 Audit Repo Sizes'
            inputs:
              filePath: '$(Build.SourcesDirectory)/repo-migration/01-discover/audit-repo-sizes.ps1'
              arguments: '-ConfigPath "$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Discovery Reports'
            inputs:
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/reports'
              artifact: 'discovery-reports'
              publishLocation: 'pipeline'
            condition: always()

      # ── Job 2: Scan secrets — small repos (< 1 GB) ─────────────────────
      - job: ScanSecretsSmall
        displayName: '1.3a Scan Secrets (small repos < 1 GB)'
        dependsOn: DiscoverAndAudit
        timeoutInMinutes: 60
        steps:

          - script: |
              curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o gitleaks.tar.gz
              tar -xzf gitleaks.tar.gz -C /usr/local/bin/ gitleaks
              chmod +x /usr/local/bin/gitleaks
            displayName: 'Install gitleaks'

          - script: git lfs install
            displayName: 'Install Git LFS'

          - task: PowerShell@2
            displayName: 'Replace config tokens'
            inputs:
              targetType: inline
              script: |
                $configFile = "$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"
                $content = Get-Content $configFile -Raw
                $content = $content -replace '\$\(ADO_ORG\)', '$(ADO_ORG)'
                $content = $content -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $content = $content -replace '\$\(ADO_PAT\)', '$(ADO_PAT)'
                Set-Content -Path $configFile -Value $content
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Discovery Reports'
            inputs:
              artifact: 'discovery-reports'
              path: '$(Build.SourcesDirectory)/repo-migration/output/reports'

          - script: |
              echo "Freeing disk space..."
              sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache 2>/dev/null || true
              sudo apt-get clean 2>/dev/null || true
              df -h /
            displayName: 'Free disk space'

          - script: |
              mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/reports"
              mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/logs"
            displayName: 'Ensure output directories'

          - task: PowerShell@2
            displayName: '1.3a Scan Small Repos'
            inputs:
              filePath: '$(Build.SourcesDirectory)/repo-migration/01-discover/scan-secrets.ps1'
              arguments: '-ConfigPath "$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json" -SizeFilter Small -SizeThresholdMB 1024'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Small Scan Reports'
            inputs:
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/reports'
              artifact: 'scan-reports-small'
              publishLocation: 'pipeline'
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Small Scan Logs'
            inputs:
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/logs'
              artifact: 'scan-logs-small'
              publishLocation: 'pipeline'
            condition: always()

      # ── Job 3: Scan secrets — large repos (>= 1 GB) ────────────────────
      - job: ScanSecretsLarge
        displayName: '1.3b Scan Secrets (large repos >= 1 GB)'
        dependsOn: DiscoverAndAudit
        timeoutInMinutes: 360
        steps:

          - script: |
              curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o gitleaks.tar.gz
              tar -xzf gitleaks.tar.gz -C /usr/local/bin/ gitleaks
              chmod +x /usr/local/bin/gitleaks
            displayName: 'Install gitleaks'

          - script: git lfs install
            displayName: 'Install Git LFS'

          - task: PowerShell@2
            displayName: 'Replace config tokens'
            inputs:
              targetType: inline
              script: |
                $configFile = "$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"
                $content = Get-Content $configFile -Raw
                $content = $content -replace '\$\(ADO_ORG\)', '$(ADO_ORG)'
                $content = $content -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $content = $content -replace '\$\(ADO_PAT\)', '$(ADO_PAT)'
                Set-Content -Path $configFile -Value $content
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Discovery Reports'
            inputs:
              artifact: 'discovery-reports'
              path: '$(Build.SourcesDirectory)/repo-migration/output/reports'

          - script: |
              echo "Freeing disk space..."
              sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache 2>/dev/null || true
              sudo apt-get clean 2>/dev/null || true
              df -h /
            displayName: 'Free disk space'

          - script: |
              mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/reports"
              mkdir -p "$(Build.SourcesDirectory)/repo-migration/output/logs"
            displayName: 'Ensure output directories'

          - task: PowerShell@2
            displayName: '1.3b Scan Large Repos'
            inputs:
              filePath: '$(Build.SourcesDirectory)/repo-migration/01-discover/scan-secrets.ps1'
              arguments: '-ConfigPath "$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json" -SizeFilter Large -SizeThresholdMB 1024'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Large Scan Reports'
            inputs:
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/reports'
              artifact: 'scan-reports-large'
              publishLocation: 'pipeline'
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Large Scan Logs'
            inputs:
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/logs'
              artifact: 'scan-logs-large'
              publishLocation: 'pipeline'
            condition: always()

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 2: PREP
  # ═══════════════════════════════════════════════════════════════════════════
  - stage: Prep
    displayName: '2. Prepare & Scrub Secrets'
    dependsOn: Discover
    jobs:
      - job: PrepAndScrub
        displayName: 'Install Tools & Scrub Secrets'
        timeoutInMinutes: 60
        steps:

          - script: |
              echo "Installing tools..."
              # git-sizer
              curl -sL https://github.com/github/git-sizer/releases/download/v1.5.0/git-sizer-1.5.0-linux-amd64.zip -o git-sizer.zip
              unzip git-sizer.zip -d /usr/local/bin/
              chmod +x /usr/local/bin/git-sizer
              # gitleaks
              curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o gitleaks.tar.gz
              tar -xzf gitleaks.tar.gz -C /usr/local/bin/ gitleaks
              chmod +x /usr/local/bin/gitleaks
              # git-filter-repo
              pip install git-filter-repo
              # git lfs
              git lfs install
            displayName: 'Install all tools'

          - task: PowerShell@2
            displayName: 'Replace config tokens'
            inputs:
              targetType: inline
              script: |
                $configFile = "$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"
                $content = Get-Content $configFile -Raw
                $content = $content -replace '\$\(ADO_ORG\)', '$(ADO_ORG)'
                $content = $content -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $content = $content -replace '\$\(ADO_PAT\)', '$(ADO_PAT)'
                Set-Content -Path $configFile -Value $content
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Discovery Reports'
            inputs:
              artifact: 'discovery-reports'
              path: '$(Build.SourcesDirectory)/repo-migration/output/reports'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Small Scan Reports'
            inputs:
              artifact: 'scan-reports-small'
              path: '$(Build.SourcesDirectory)/repo-migration/output/scan-small'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Large Scan Reports'
            inputs:
              artifact: 'scan-reports-large'
              path: '$(Build.SourcesDirectory)/repo-migration/output/scan-large'

          - task: PowerShell@2
            displayName: 'Merge scan results'
            inputs:
              targetType: inline
              script: |
                $reportDir = "$(Build.SourcesDirectory)/repo-migration/output/reports"
                $smallDir  = "$(Build.SourcesDirectory)/repo-migration/output/scan-small"
                $largeDir  = "$(Build.SourcesDirectory)/repo-migration/output/scan-large"

                # Merge summaries
                $all = @()
                $smallSummary = Join-Path $smallDir "secret-scan-summary-small.json"
                $largeSummary = Join-Path $largeDir "secret-scan-summary-large.json"
                if (Test-Path $smallSummary) { $all += Get-Content $smallSummary -Raw | ConvertFrom-Json }
                if (Test-Path $largeSummary) { $all += Get-Content $largeSummary -Raw | ConvertFrom-Json }
                $all | ConvertTo-Json -Depth 3 | Out-File (Join-Path $reportDir "secret-scan-summary.json") -Encoding utf8

                # Merge findings
                $allFindings = @()
                $smallFindings = Join-Path $smallDir "secret-scan-findings-small.json"
                $largeFindings = Join-Path $largeDir "secret-scan-findings-large.json"
                if (Test-Path $smallFindings) { $allFindings += Get-Content $smallFindings -Raw | ConvertFrom-Json }
                if (Test-Path $largeFindings) { $allFindings += Get-Content $largeFindings -Raw | ConvertFrom-Json }
                $allFindings | ConvertTo-Json -Depth 5 | Out-File (Join-Path $reportDir "secret-scan-findings.json") -Encoding utf8

                Write-Host "Merged scan results: $($all.Count) repos, $($allFindings.Count) total findings"
              pwsh: true

          - task: PowerShell@2
            displayName: '2.1 Scrub Secrets (if needed)'
            inputs:
              targetType: inline
              script: |
                $reportDir = "$(Build.SourcesDirectory)/repo-migration/output/reports"
                $secretReport = Join-Path $reportDir "secret-scan-summary.json"
                if (Test-Path $secretReport) {
                    $data = Get-Content $secretReport -Raw | ConvertFrom-Json
                    $dirty = $data | Where-Object { $_.Status -eq 'SECRETS_FOUND' }
                    if ($dirty.Count -gt 0) {
                        Write-Host "Repos with secrets found - running scrub..."
                        & "$(Build.SourcesDirectory)/repo-migration/02-prep/scrub-secrets.ps1" -ConfigPath "$(Build.SourcesDirectory)/repo-migration/config/repo-migration-config.json"
                    } else {
                        Write-Host "No secrets found - skipping scrub."
                    }
                } else {
                    Write-Host "No secret scan report found - skipping scrub."
                }
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Prep Reports'
            inputs:
              targetPath: '$(Build.SourcesDirectory)/repo-migration/output/reports'
              artifact: 'prep-reports'
              publishLocation: 'pipeline'
            condition: always()
