trigger: none

pool: migration-pool

# =============================================================================
# PARAMETERS — choose at queue time
# =============================================================================
parameters:

  - name: MigrationMode
    displayName: "Migration Mode"
    type: string
    default: Single
    values:
      - Single
      - Batch

  - name: ADORepo
    displayName: "ADO Repo name (Single mode only)"
    type: string
    default: ""

  - name: GHRepo
    displayName: "GitHub Repo name (Single mode only, defaults to ADORepo)"
    type: string
    default: ""

  - name: BatchName
    displayName: "Batch name from config (Batch mode — leave blank for all)"
    type: string
    default: ""

  - name: SkipAudit
    displayName: "Skip branch-wise audit (faster, no file inventory)"
    type: boolean
    default: false

  - name: DryRun
    displayName: "Dry Run (print GEI commands, do not execute)"
    type: boolean
    default: false

  - name: RunValidation
    displayName: "Run validation after migration"
    type: boolean
    default: true

variables:
  - group: repo-migration-discove   # ADO_ORG, ADO_PROJECT, ADO_PAT
  - group: repo-migration-migrate    # GH_ORG, GH_PAT

stages:
  # ===========================================================================
  # STAGE 1 – DISCOVER  (reuse existing scripts — already working)
  # ===========================================================================
  - stage: Discover
    displayName: "1. Discover & Analyse"
    jobs:
      - job: DiscoverAndAudit
        displayName: "1.1 Discover Repos & Audit Sizes"
        timeoutInMinutes: 60
        steps:

          - task: PowerShell@2
            displayName: "Install git-sizer"
            inputs:
              targetType: inline
              script: |
                Invoke-WebRequest -Uri "https://github.com/github/git-sizer/releases/download/v1.5.0/git-sizer-1.5.0-windows-amd64.zip" -OutFile git-sizer.zip
                Expand-Archive -Path git-sizer.zip -DestinationPath "$env:AGENT_TOOLSDIRECTORY\git-sizer" -Force
                Write-Host "##vso[task.prependpath]$env:AGENT_TOOLSDIRECTORY\git-sizer"
              pwsh: true

          - task: PowerShell@2
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                $cfg = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $c   = Get-Content $cfg -Raw
                $c   = $c -replace '\$\(ADO_ORG\)',     '$(ADO_ORG)'
                $c   = $c -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $c   = $c -replace '\$\(ADO_PAT\)',     '$(ADO_PAT)'
                $c   = $c -replace '\$\(GH_ORG\)',      '$(GH_ORG)'
                $c   = $c -replace '\$\(GH_PAT\)',      '$(GH_PAT)'
                Set-Content -Path $cfg -Value $c
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                "reports","logs","audit","dashboard","tmp\clones" | ForEach-Object {
                    New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\$_" -Force | Out-Null
                }
              pwsh: true

          - task: PowerShell@2
            displayName: "1.1 Discover Repos"
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\01-discover\discover-repos.ps1'
              arguments: '-ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PowerShell@2
            displayName: "1.2 Audit Repo Sizes"
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\01-discover\audit-repo-sizes.ps1'
              arguments: '-ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Discovery Reports"
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "discovery-reports"
              publishLocation: pipeline
            condition: always()

      - job: ScanSecrets
        displayName: "1.3 Scan Secrets (gitleaks)"
        dependsOn: DiscoverAndAudit
        strategy:
          maxParallel: 3
          matrix:
            Batch0:
              BATCH_INDEX: 0
              BATCH_TOTAL: 3
            Batch1:
              BATCH_INDEX: 1
              BATCH_TOTAL: 3
            Batch2:
              BATCH_INDEX: 2
              BATCH_TOTAL: 3
        steps:

          - task: PowerShell@2
            displayName: "Install gitleaks"
            inputs:
              targetType: inline
              script: |
                Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_windows_x64.zip" -OutFile gitleaks.zip
                Expand-Archive -Path gitleaks.zip -DestinationPath "$env:AGENT_TOOLSDIRECTORY\gitleaks" -Force
                Write-Host "##vso[task.prependpath]$env:AGENT_TOOLSDIRECTORY\gitleaks"
              pwsh: true

          - task: PowerShell@2
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                $cfg = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $c   = Get-Content $cfg -Raw
                $c   = $c -replace '\$\(ADO_ORG\)',     '$(ADO_ORG)'
                $c   = $c -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $c   = $c -replace '\$\(ADO_PAT\)',     '$(ADO_PAT)'
                $c   = $c -replace '\$\(GH_ORG\)',      '$(GH_ORG)'
                $c   = $c -replace '\$\(GH_PAT\)',      '$(GH_PAT)'
                Set-Content -Path $cfg -Value $c
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: DownloadPipelineArtifact@2
            displayName: "Download Discovery Reports"
            inputs:
              artifact: "discovery-reports"
              path: '$(Build.SourcesDirectory)\repo-migration\output\reports'

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                "reports","logs" | ForEach-Object {
                    New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\$_" -Force | Out-Null
                }
              pwsh: true

          - task: PowerShell@2
            displayName: "1.3 Scan Secrets"
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\01-discover\scan-secrets.ps1'
              arguments: >-
                -ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                -BatchIndex $(BATCH_INDEX) -BatchTotal $(BATCH_TOTAL)
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Scan Reports"
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "scan-reports-batch$(BATCH_INDEX)"
              publishLocation: pipeline
            condition: always()

  # ===========================================================================
  # STAGE 2 – REVIEW GATE  (human reviews discovery + scan before migrating)
  # ===========================================================================
  - stage: ReviewGate
    displayName: "2. Review Gate"
    dependsOn: Discover
    condition: succeeded()
    jobs:
      - job: ReviewGateJob
        displayName: "Gate: Review Discovery Findings"
        pool: server
        timeoutInMinutes: 4320
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 4320
            inputs:
              notifyUsers: ""
              instructions: |
                Review the discovery artifacts before proceeding to migration.

                Download and check:
                  discovery-reports/repo-inventory.json
                    → confirm which repos to include / exclude
                    → update config/repo-migration-config.json batches and exclusions

                  discovery-reports/repo-sizes.json
                    → any repo flagged OVER_LIMIT (> 40 GiB) must be remediated first

                  scan-reports-batch*/secret-scan-findings.json
                    → MANDATORY for regulated environment
                    → Critical/High findings must be remediated before migration
                    → if zero findings: safe to proceed
                    → if findings exist: scrub history first (scrub-secrets.ps1)

                Populate config/user-mappings.csv with ADO→GitHub username mappings.

                Approve to proceed to migration, or Reject to abort.
              onTimeout: reject

  # ===========================================================================
  # STAGE 3A – SINGLE REPO MIGRATION
  # ===========================================================================
  - stage: MigrateSingle
    displayName: "3a. Migrate (Single Repo)"
    dependsOn: ReviewGate
    condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Single'))
    jobs:
      - job: MigrateSingleRepo
        displayName: "Migrate ${{ parameters.ADORepo }}"
        timeoutInMinutes: 180
        steps:

          - task: PowerShell@2
            displayName: "Install GitHub CLI + ado2gh extension"
            inputs:
              targetType: inline
              script: |
                if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
                    Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v2.52.0/gh_2.52.0_windows_amd64.msi" -OutFile gh.msi
                    Start-Process msiexec.exe -ArgumentList '/i','gh.msi','/quiet','/norestart' -Wait
                    Write-Host "##vso[task.prependpath]$env:ProgramFiles\GitHub CLI"
                }
                gh --version
                gh extension install github/gh-ado2gh 2>&1 | Where-Object { $_ -notmatch 'already installed' }
              pwsh: true
            env:
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                "reports","logs","audit","dashboard","tmp" | ForEach-Object {
                    New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\$_" -Force | Out-Null
                }
              pwsh: true

          - task: PowerShell@2
            displayName: "Migrate Single Repo"
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\03-migrate\migrate-single.ps1'
              arguments: >-
                -ADOOrg     "$(ADO_ORG)"
                -ADOProject "$(ADO_PROJECT)"
                -ADORepo    "${{ parameters.ADORepo }}"
                -GHOrg      "$(GH_ORG)"
                -GHRepo     "${{ coalesce(parameters.GHRepo, parameters.ADORepo) }}"
                -OutputDir  "$(Build.SourcesDirectory)\repo-migration\output"
                ${{ if eq(parameters.SkipAudit, true) }}-SkipAudit${{ end }}
                ${{ if eq(parameters.DryRun, true) }}-DryRun${{ end }}
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT:   $(ADO_PAT)
              GH_PAT:    $(GH_PAT)
              GH_TOKEN:  $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Migration Logs"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\logs'
              artifact: "MigrationLogs-${{ parameters.ADORepo }}"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Audit Data"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\audit'
              artifact: "MigrationAudit-${{ parameters.ADORepo }}"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish HTML Dashboard"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\dashboard'
              artifact: "MigrationDashboard-${{ parameters.ADORepo }}"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Show HTML on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)\repo-migration\output\dashboard\${{ coalesce(parameters.GHRepo, parameters.ADORepo) }}\migration-report-${{ coalesce(parameters.GHRepo, parameters.ADORepo) }}.html'
              tabName: "Migration Report"

  # ===========================================================================
  # STAGE 3B – BATCH REPO MIGRATION
  # ===========================================================================
  - stage: MigrateBatch
    displayName: "3b. Migrate (Batch)"
    dependsOn: ReviewGate
    condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Batch'))
    jobs:
      - job: MigrateBatchRepos
        displayName: "Migrate Batch"
        timeoutInMinutes: 480
        steps:

          - task: PowerShell@2
            displayName: "Install GitHub CLI + ado2gh extension"
            inputs:
              targetType: inline
              script: |
                if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
                    Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v2.52.0/gh_2.52.0_windows_amd64.msi" -OutFile gh.msi
                    Start-Process msiexec.exe -ArgumentList '/i','gh.msi','/quiet','/norestart' -Wait
                    Write-Host "##vso[task.prependpath]$env:ProgramFiles\GitHub CLI"
                }
                gh --version
                gh extension install github/gh-ado2gh 2>&1 | Where-Object { $_ -notmatch 'already installed' }
              pwsh: true
            env:
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                $cfg = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $c   = Get-Content $cfg -Raw
                $c   = $c -replace '\$\(ADO_ORG\)',     '$(ADO_ORG)'
                $c   = $c -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $c   = $c -replace '\$\(ADO_PAT\)',     '$(ADO_PAT)'
                $c   = $c -replace '\$\(GH_ORG\)',      '$(GH_ORG)'
                $c   = $c -replace '\$\(GH_PAT\)',      '$(GH_PAT)'
                Set-Content -Path $cfg -Value $c
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                "reports","logs","audit","dashboard","tmp" | ForEach-Object {
                    New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\$_" -Force | Out-Null
                }
              pwsh: true

          - task: PowerShell@2
            displayName: "Migrate Batch Repos"
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\03-migrate\migrate-batch.ps1'
              arguments: >-
                -ADOOrg      "$(ADO_ORG)"
                -ADOProject  "$(ADO_PROJECT)"
                -GHOrg       "$(GH_ORG)"
                -ConfigPath  "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                -BatchName   "${{ parameters.BatchName }}"
                -OutputDir   "$(Build.SourcesDirectory)\repo-migration\output"
                -MaxParallel 3
                ${{ if eq(parameters.SkipAudit, true) }}-SkipAudit${{ end }}
                ${{ if eq(parameters.DryRun, true) }}-DryRun${{ end }}
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT:  $(ADO_PAT)
              GH_PAT:   $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Migration Logs"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\logs'
              artifact: "BatchMigrationLogs"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Audit Data"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\audit'
              artifact: "BatchMigrationAudit"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Dashboards"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\dashboard'
              artifact: "BatchMigrationDashboards"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Summary"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "BatchMigrationReports"
              publishLocation: pipeline

  # ===========================================================================
  # STAGE 4 – VALIDATE
  # ===========================================================================
  - stage: Validate
    displayName: "4. Validate Migration"
    dependsOn:
      - MigrateSingle
      - MigrateBatch
    condition: |
      and(
        eq('${{ parameters.RunValidation }}', true),
        or(
          eq(dependencies.MigrateSingle.result, 'Succeeded'),
          eq(dependencies.MigrateSingle.result, 'SucceededWithIssues'),
          eq(dependencies.MigrateBatch.result, 'Succeeded'),
          eq(dependencies.MigrateBatch.result, 'SucceededWithIssues')
        )
      )
    jobs:
      - job: ValidateRepos
        displayName: "4.1 Validate Migrated Repos"
        timeoutInMinutes: 60
        steps:

          - task: PowerShell@2
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                $cfg = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $c   = Get-Content $cfg -Raw
                $c   = $c -replace '\$\(ADO_ORG\)',     '$(ADO_ORG)'
                $c   = $c -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $c   = $c -replace '\$\(ADO_PAT\)',     '$(ADO_PAT)'
                $c   = $c -replace '\$\(GH_ORG\)',      '$(GH_ORG)'
                $c   = $c -replace '\$\(GH_PAT\)',      '$(GH_PAT)'
                Set-Content -Path $cfg -Value $c
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\reports" -Force | Out-Null
              pwsh: true

          # Download migration artifacts to get audit data + batch summary
          - task: DownloadPipelineArtifact@2
            displayName: "Download Migration Reports (Single)"
            condition: eq('${{ parameters.MigrationMode }}', 'Single')
            continueOnError: true
            inputs:
              artifact: "MigrationAudit-${{ parameters.ADORepo }}"
              path: '$(Build.SourcesDirectory)\repo-migration\output\audit\${{ coalesce(parameters.GHRepo, parameters.ADORepo) }}'

          - task: DownloadPipelineArtifact@2
            displayName: "Download Batch Audit Data"
            condition: eq('${{ parameters.MigrationMode }}', 'Batch')
            continueOnError: true
            inputs:
              artifact: "BatchMigrationAudit"
              path: '$(Build.SourcesDirectory)\repo-migration\output\audit'

          - task: DownloadPipelineArtifact@2
            displayName: "Download Batch Reports (for batch-migration-summary.json)"
            condition: eq('${{ parameters.MigrationMode }}', 'Batch')
            continueOnError: true
            inputs:
              artifact: "BatchMigrationReports"
              path: '$(Build.SourcesDirectory)\repo-migration\output\reports'

          # Single mode — validate one repo
          - task: PowerShell@2
            displayName: "4.1 Validate Single Repo"
            condition: eq('${{ parameters.MigrationMode }}', 'Single')
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\04-validate\validate-migration.ps1'
              arguments: >-
                -ADOOrg     "$(ADO_ORG)"
                -ADOProject "$(ADO_PROJECT)"
                -GHOrg      "$(GH_ORG)"
                -GHRepo     "${{ coalesce(parameters.GHRepo, parameters.ADORepo) }}"
                -ADORepo    "${{ parameters.ADORepo }}"
                -OutputDir  "$(Build.SourcesDirectory)\repo-migration\output"
                -ExpectedVisibility "internal"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          # Batch mode — validate all repos from batch summary
          - task: PowerShell@2
            displayName: "4.1 Validate Batch Repos"
            condition: eq('${{ parameters.MigrationMode }}', 'Batch')
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\04-validate\validate-migration.ps1'
              arguments: >-
                -ADOOrg     "$(ADO_ORG)"
                -ADOProject "$(ADO_PROJECT)"
                -GHOrg      "$(GH_ORG)"
                -OutputDir  "$(Build.SourcesDirectory)\repo-migration\output"
                -ExpectedVisibility "internal"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Validation Reports"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "ValidationReports"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Show Validation Report on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)\repo-migration\output\reports\validation-report.html'
              tabName: "Validation Report"

          - task: PowerShell@2
            displayName: "Publish Validation Summary to ADO Tab"
            condition: always()
            inputs:
              targetType: inline
              script: |
                Write-Host '##vso[task.uploadsummary]$(Build.SourcesDirectory)\repo-migration\output\reports\validation-summary.md'
              pwsh: true
