trigger: none

pool: migration-pool
  # vmImage: 'windows-latest'

variables:
  - group: repo-migration-discover

stages:
  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 1: DISCOVER
  # ═══════════════════════════════════════════════════════════════════════════
  - stage: Discover
    displayName: '1. Discover & Analyze'
    jobs:
      # ── Job 1: Discover repos + Audit sizes ──────────────────────────────
      - job: DiscoverAndAudit
        displayName: 'Discover Repos & Audit Sizes'
        timeoutInMinutes: 30
        steps:

          - task: PowerShell@2
            displayName: 'Install git-sizer'
            inputs:
              targetType: inline
              script: |
                Write-Host "Installing git-sizer..."
                Invoke-WebRequest -Uri "https://github.com/github/git-sizer/releases/download/v1.5.0/git-sizer-1.5.0-windows-amd64.zip" -OutFile git-sizer.zip
                Expand-Archive -Path git-sizer.zip -DestinationPath "$env:AGENT_TOOLSDIRECTORY\git-sizer" -Force
                $env:PATH = "$env:AGENT_TOOLSDIRECTORY\git-sizer;$env:PATH"
                Write-Host "##vso[task.prependpath]$env:AGENT_TOOLSDIRECTORY\git-sizer"
                git-sizer --version
              pwsh: true

          - task: PowerShell@2
            displayName: 'Install Git LFS'
            inputs:
              targetType: inline
              script: git lfs install
              pwsh: true

          - task: PowerShell@2
            displayName: 'Replace config tokens'
            inputs:
              targetType: inline
              script: |
                $configFile = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $content = Get-Content $configFile -Raw
                $content = $content -replace '\$\(ADO_ORG\)', '$(ADO_ORG)'
                $content = $content -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $content = $content -replace '\$\(ADO_PAT\)', '$(ADO_PAT)'
                Set-Content -Path $configFile -Value $content
                Write-Host "Config tokens replaced successfully."
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PowerShell@2
            displayName: 'Ensure output directories'
            inputs:
              targetType: inline
              script: |
                New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\reports" -Force | Out-Null
                New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\logs" -Force | Out-Null
                New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\tmp\clones" -Force | Out-Null
              pwsh: true

          - task: PowerShell@2
            displayName: '1.1 Discover Repos'
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\01-discover\discover-repos.ps1'
              arguments: '-ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PowerShell@2
            displayName: 'Free disk space'
            inputs:
              targetType: inline
              script: |
                Write-Host "Checking disk space..."
                Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{N='Used(GB)';E={[math]::Round($_.Used/1GB,2)}}, @{N='Free(GB)';E={[math]::Round($_.Free/1GB,2)}}
              pwsh: true

          - task: PowerShell@2
            displayName: '1.2 Audit Repo Sizes'
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\01-discover\audit-repo-sizes.ps1'
              arguments: '-ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Discovery Reports'
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: 'discovery-reports'
              publishLocation: 'pipeline'
            condition: always()

          - task: PublishHtmlReport@1
            displayName: 'Publish Discovery Dashboard'
            inputs:
              reportDir: '$(Build.SourcesDirectory)\repo-migration\output\reports\repo-inventory.html'
              tabName: 'Repo Discovery'
            condition: always()

      # ── Job 2: Scan secrets — small repos (< 1 GB) ─────────────────────
      - job: ScanSecretsSmall
        displayName: '1.3a Scan Secrets (small repos < 1 GB)'
        dependsOn: DiscoverAndAudit
        timeoutInMinutes: 60
        steps:

          - task: PowerShell@2
            displayName: 'Install gitleaks'
            inputs:
              targetType: inline
              script: |
                Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_windows_x64.zip" -OutFile gitleaks.zip
                Expand-Archive -Path gitleaks.zip -DestinationPath "$env:AGENT_TOOLSDIRECTORY\gitleaks" -Force
                Write-Host "##vso[task.prependpath]$env:AGENT_TOOLSDIRECTORY\gitleaks"
              pwsh: true

          - task: PowerShell@2
            displayName: 'Install Git LFS'
            inputs:
              targetType: inline
              script: git lfs install
              pwsh: true

          - task: PowerShell@2
            displayName: 'Replace config tokens'
            inputs:
              targetType: inline
              script: |
                $configFile = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $content = Get-Content $configFile -Raw
                $content = $content -replace '\$\(ADO_ORG\)', '$(ADO_ORG)'
                $content = $content -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $content = $content -replace '\$\(ADO_PAT\)', '$(ADO_PAT)'
                Set-Content -Path $configFile -Value $content
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Discovery Reports'
            inputs:
              artifact: 'discovery-reports'
              path: '$(Build.SourcesDirectory)\repo-migration\output\reports'

          - task: PowerShell@2
            displayName: 'Free disk space'
            inputs:
              targetType: inline
              script: |
                Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{N='Used(GB)';E={[math]::Round($_.Used/1GB,2)}}, @{N='Free(GB)';E={[math]::Round($_.Free/1GB,2)}}
              pwsh: true

          - task: PowerShell@2
            displayName: 'Ensure output directories'
            inputs:
              targetType: inline
              script: |
                New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\reports" -Force | Out-Null
                New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\logs" -Force | Out-Null
              pwsh: true

          - task: PowerShell@2
            displayName: '1.3a Scan Small Repos'
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\01-discover\scan-secrets.ps1'
              arguments: '-ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json" -SizeFilter Small -SizeThresholdMB 1024 -ThrottleLimit 8'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Small Scan Reports'
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: 'scan-reports-small'
              publishLocation: 'pipeline'
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Small Scan Logs'
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\logs'
              artifact: 'scan-logs-small'
              publishLocation: 'pipeline'
            condition: always()

          - task: PublishHtmlReport@1
            displayName: 'Publish Small Scan Dashboard'
            inputs:
              reportDir: '$(Build.SourcesDirectory)\repo-migration\output\reports\secret-scan-report-small.html'
              tabName: 'Secret Scan (Small)'
            condition: always()

      # ── Job 3: Scan secrets — large repos (>= 1 GB) ────────────────────
      - job: ScanSecretsLarge
        displayName: '1.3b Scan Secrets (large repos >= 1 GB)'
        dependsOn: DiscoverAndAudit
        timeoutInMinutes: 360
        steps:

          - task: PowerShell@2
            displayName: 'Install gitleaks'
            inputs:
              targetType: inline
              script: |
                Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_windows_x64.zip" -OutFile gitleaks.zip
                Expand-Archive -Path gitleaks.zip -DestinationPath "$env:AGENT_TOOLSDIRECTORY\gitleaks" -Force
                Write-Host "##vso[task.prependpath]$env:AGENT_TOOLSDIRECTORY\gitleaks"
              pwsh: true

          - task: PowerShell@2
            displayName: 'Install Git LFS'
            inputs:
              targetType: inline
              script: git lfs install
              pwsh: true

          - task: PowerShell@2
            displayName: 'Replace config tokens'
            inputs:
              targetType: inline
              script: |
                $configFile = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $content = Get-Content $configFile -Raw
                $content = $content -replace '\$\(ADO_ORG\)', '$(ADO_ORG)'
                $content = $content -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $content = $content -replace '\$\(ADO_PAT\)', '$(ADO_PAT)'
                Set-Content -Path $configFile -Value $content
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Discovery Reports'
            inputs:
              artifact: 'discovery-reports'
              path: '$(Build.SourcesDirectory)\repo-migration\output\reports'

          - task: PowerShell@2
            displayName: 'Free disk space'
            inputs:
              targetType: inline
              script: |
                Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{N='Used(GB)';E={[math]::Round($_.Used/1GB,2)}}, @{N='Free(GB)';E={[math]::Round($_.Free/1GB,2)}}
              pwsh: true

          - task: PowerShell@2
            displayName: 'Ensure output directories'
            inputs:
              targetType: inline
              script: |
                New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\reports" -Force | Out-Null
                New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\logs" -Force | Out-Null
              pwsh: true

          - task: PowerShell@2
            displayName: '1.3b Scan Large Repos'
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\01-discover\scan-secrets.ps1'
              arguments: '-ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json" -SizeFilter Large -SizeThresholdMB 1024 -ThrottleLimit 8'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Large Scan Reports'
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: 'scan-reports-large'
              publishLocation: 'pipeline'
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Large Scan Logs'
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\logs'
              artifact: 'scan-logs-large'
              publishLocation: 'pipeline'
            condition: always()

          - task: PublishHtmlReport@1
            displayName: 'Publish Large Scan Dashboard'
            inputs:
              reportDir: '$(Build.SourcesDirectory)\repo-migration\output\reports\secret-scan-report-large.html'
              tabName: 'Secret Scan (Large)'
            condition: always()

