

trigger: none

# This pulls all the variables from your screenshot into the pipeline
variables:
  - group: migration-secrets 

jobs:
  - job: MigrateArtifacts
    displayName: "Migrate Artifacts"
    pool:
      vmImage: 'windows-latest'
    steps:
      - checkout: self

      - task: PowerShell@2
        displayName: "Execute Artifact Migration Script"
        env:
          # These must be added to your Variable Group as secrets
          ADO_PAT: $(ADO_PAT) 
          GH_TOKEN: $(GH_PAT)
        inputs:
          targetType: 'filePath'
          filePath: 'repo-migration/03-migrate/migrate-artifacts.ps1'
          arguments: >
            -LastBuilds "$(LastBuilds)"
            -OrgName "$(ADO_ORG)"
            -ProjectName "$(ADO_PROJECT)"
            -PipelineName "$(PipelineName)"
            -GitHubOrg "$(GH_ORG)"
            -GitHubRepo "$(GitHubRepo)"
            -Version "$(Version)"
            -Pat "$(ADO_PAT)"
