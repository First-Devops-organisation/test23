trigger: none
pool: linux
#   vmImage: ubuntu-latest
variables:
- group: repo-migration-discove
- group: repo-migration-migrate
jobs:
  - job: Migrate_Secrets_SnowflakeCredentials
    variables:
    - group: repo-migration-discove
    - group: repo-migration-migrate
    - group: 'SnowflakeCredentials'
    steps:
    - task: PowerShell@2
      displayName: 'Migrate Secrets for SnowflakeCredentials'
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |
          $ghPatMacro = "$" + "(GH_PAT)"
          $gitPatMacro = "$" + "(Git_pat)"
          $token = $env:MY_GH_PAT
          if ($token -eq $ghPatMacro -or [string]::IsNullOrWhiteSpace($token)) {
              $token = $env:MY_GIT_PAT
          }
          if ($token -eq $gitPatMacro -or [string]::IsNullOrWhiteSpace($token)) {
              Write-Host "##[error] Azure DevOps failed to inject GH_PAT or Git_pat!"
              exit 1
          }
          $env:GH_TOKEN = $token.Trim()

          gh secret set "SNOWFLAKE_ACCOUNT" --body "$env:MY_SEC_SNOWFLAKE_ACCOUNT" --repo "First-Devops-organisation/test2" --env "Dev"
          gh secret set "SNOWFLAKE_PASSWORD" --body "$env:MY_SEC_SNOWFLAKE_PASSWORD" --repo "First-Devops-organisation/test2" --env "Dev"
      env:
        MY_GH_PAT: $(GH_PAT)
        MY_GIT_PAT: $(Git_pat)
        MY_SEC_SNOWFLAKE_ACCOUNT: $(SNOWFLAKE_ACCOUNT)
        MY_SEC_SNOWFLAKE_PASSWORD: $(SNOWFLAKE_PASSWORD)

