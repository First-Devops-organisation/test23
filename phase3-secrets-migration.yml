trigger: none
pool:
  vmImage: ubuntu-latest
variables:
- group: repo-migration-discove
- group: repo-migration-migrate
jobs:
  - job: Migrate_Secrets_DemoApp_Application_API_UAT_E
    variables:
    - group: repo-migration-discove
    - group: repo-migration-migrate
    - group: 'DemoApp-Application-API-UAT_E'
    steps:
    - task: PowerShell@2
      displayName: 'Migrate Secrets for DemoApp-Application-API-UAT_E'
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |
          $ghPatMacro = "$" + "(GH_PAT)"
          $gitPatMacro = "$" + "(Git_pat)"
          $token = $env:MY_GH_PAT
          if ($token -eq $ghPatMacro -or [string]::IsNullOrWhiteSpace($token)) {
              $token = $env:MY_GIT_PAT
          }
          if ($token -eq $gitPatMacro -or [string]::IsNullOrWhiteSpace($token)) {
              Write-Host "##[error] Azure DevOps failed to inject GH_PAT or Git_pat!"
              exit 1
          }
          $env:GH_TOKEN = $token.Trim()

          gh secret set "Name" --body "$env:MY_SEC_NAME" --repo "First-Devops-organisation/sample2" --env "uat_e"
          gh secret set "resourceGroupName" --body "$env:MY_SEC_RESOURCEGROUPNAME" --repo "First-Devops-organisation/sample2" --env "uat_e"
      env:
        MY_GH_PAT: $(GH_PAT)
        MY_GIT_PAT: $(Git_pat)
        MY_SEC_NAME: $Name
        MY_SEC_RESOURCEGROUPNAME: $resourceGroupName

  - job: Migrate_Secrets_owsap
    variables:
    - group: repo-migration-discove
    - group: repo-migration-migrate
    - group: 'owsap'
    steps:
    - task: PowerShell@2
      displayName: 'Migrate Secrets for owsap'
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |
          $ghPatMacro = "$" + "(GH_PAT)"
          $gitPatMacro = "$" + "(Git_pat)"
          $token = $env:MY_GH_PAT
          if ($token -eq $ghPatMacro -or [string]::IsNullOrWhiteSpace($token)) {
              $token = $env:MY_GIT_PAT
          }
          if ($token -eq $gitPatMacro -or [string]::IsNullOrWhiteSpace($token)) {
              Write-Host "##[error] Azure DevOps failed to inject GH_PAT or Git_pat!"
              exit 1
          }
          $env:GH_TOKEN = $token.Trim()

          gh secret set "nvdApiKey" --body "$env:MY_SEC_NVDAPIKEY" --repo "First-Devops-organisation/test2"
      env:
        MY_GH_PAT: $(GH_PAT)
        MY_GIT_PAT: $(Git_pat)
        MY_SEC_NVDAPIKEY: $nvdApiKey

