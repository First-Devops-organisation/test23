trigger: none

pool:
  vmImage: 'windows-latest'

variables:
  - group: 'migration-branch-policies'

stages:
- stage: Discovery
  displayName: 'Phase 1: Discover Policies'
  jobs:
  - job: ExportPolicies
    steps:
    - task: PowerShell@2
      displayName: 'Export ADO Policies to JSON'
      inputs:
        filePath: '$(System.DefaultWorkingDirectory)/export-branch-policies.ps1'
        arguments: >
          -AdoOrgUrl "$(ADO_Org)"
          -AdoProject "$(ADO_Project)"
          -AdoPat "$(ADO_PAT)"
          -OutputFile "$(Build.ArtifactStagingDirectory)/branch-policy-mappings.json"
        pwsh: true
    
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Policy Inventory'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/branch-policy-mappings.json'
        ArtifactName: 'policy-discovery'

- stage: Migration
  displayName: 'Phase 2: Apply to GitHub'
  condition: succeeded()
  jobs:
  - job: ApplyPolicies
    steps:
    # --- NEW STEP: Download the JSON file from Phase 1 ---
    - task: DownloadBuildArtifacts@0
      displayName: 'Download Policy Mapping'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'policy-discovery'
        downloadPath: '$(System.DefaultWorkingDirectory)'

    - task: PowerShell@2
      displayName: 'Apply Policies to GitHub'
      inputs:
        filePath: '$(System.DefaultWorkingDirectory)/sync-branch-policies.ps1'
        arguments: >
          -GitHubOrg "$(GH_Org)"
          -GitHubPat "$(GH_PAT)"
          # Note: The artifact is downloaded into a subfolder named after the artifact
          -MappingFile "$(System.DefaultWorkingDirectory)/policy-discovery/branch-policy-mappings.json"
        pwsh: true


