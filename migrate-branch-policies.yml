trigger: none

pool:
  vmImage: 'windows-latest'

variables:
  - group: 'migration-branch-policies'

stages:
- stage: Discovery
  displayName: 'Phase 1: Discover Policies'
  jobs:
  - job: ExportPolicies
    steps:
    - task: PowerShell@2
      displayName: 'Export ADO Policies to JSON'
      inputs:
        filePath: '$(System.DefaultWorkingDirectory)/export-branch-policies.ps1'
        arguments: >
          -AdoOrgUrl "$(ADO_Org)"
          -AdoProject "$(ADO_Project)"
          -AdoPat "$(ADO_PAT)"
          -OutputFile "$(Build.ArtifactStagingDirectory)/branch-policy-mappings.json"
        pwsh: true
    
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Policy Inventory'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/branch-policy-mappings.json'
        ArtifactName: 'policy-discovery'

- stage: Migration
  displayName: 'Phase 2: Apply to GitHub'
  condition: succeeded()
  jobs:
  - job: ApplyPolicies
    # Note: In a real scenario, you would review the Discovery artifact 
    # and commit it to your repo as 'config/branch-policy-mappings.json'
    steps:
    - task: PowerShell@2
      displayName: 'Apply Policies to GitHub'
      inputs:
        filePath: '$(System.DefaultWorkingDirectory)/sync-branch-policies.ps1'
        arguments: >
          # -AdoOrgUrl "$(ADO_Org)"
          # -AdoProject "$(ADO_Project)"
          # -AdoRepoName "$(ADO_Repo)"
          # -AdoPat "$(ADO_PAT)"
          -GitHubOrg "$(GH_Org)"
          -GitHubRepo "$(GH_Repo)"
          -GitHubPat "$(GH_PAT)"
          -MappingFile "$(System.DefaultWorkingDirectory)/branch-policy-mappings.json"
        pwsh: true
