trigger: none # Manual run only

pool:
  vmImage: 'windows-latest'

variables:
  - group: 'migration-branch-policies'

steps:
- task: PowerShell@2
  displayName: 'Migrate Branch Policies'
  inputs:
    filePath: '$(System.DefaultWorkingDirectory)/branch-policy-migration.ps1'
    arguments: >
      -AdoOrgUrl "$(ADO_Org)"
      -AdoProject "$(ADO_Project)"
      -AdoRepoName "$(ADO_Repo)"
      -AdoPat "$(ADO_PAT)"
      -GitHubOrg "$(GH_Org)"
      -GitHubRepo "$(GH_Repo)"
      -GitHubPat "$(GH_PAT)"
    pwsh: true
