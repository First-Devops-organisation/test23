trigger: none
pool:
  vmImage: ubuntu-latest
variables:
- group: DevOpsConfig
jobs:
- job: Migrate_Secrets_BoardMigrationConfig
  variables:
  - group: DevOpsConfig
  - group: 'BoardMigrationConfig'
  steps:
  - task: PowerShell@2
    displayName: 'Migrate Secrets for BoardMigrationConfig'
    inputs:
      targetType: 'inline'
      script: |
        echo "$(Git_pat)" | gh auth login --with-token
        gh secret set "ADO_PAT" --body "$(ADO_PAT)" --repo "Second-Devops-organisation1/Board_migration"
        gh secret set "GH_PAT" --body "$(GH_PAT)" --repo "Second-Devops-organisation1/Board_migration"

