trigger: none

pool:
  name: 'linux'

parameters:
- name: RunDiscovery
  displayName: 'Run Phase 1: Discovery (Generates Report)'
  type: boolean
  default: true

- name: RunMigration
  displayName: "Run Phase 2: Migration (Variables to GitHub)"
  type: boolean
  default: false

- name: RunSecrets
  displayName: "Run Phase 3: Migrate Secrets & Key Vault Groups to GitHub"
  type: boolean
  default: false


variables:
- group: repo-migration-discove
- group: repo-migration-migrate

stages:

# ==============================================================================
# PHASE 1: DISCOVERY
# ==============================================================================
- stage: Discovery
  condition: eq('${{ parameters.RunDiscovery }}', true)
  displayName: 'Phase 1: Discover Usage'
  jobs:
  - job: DiscoverVariableGroups
    steps:
    - task: PowerShell@2
      displayName: 'Run Discovery Script'
      inputs:
        filePath: '$(System.DefaultWorkingDirectory)/enterprise-variable-migration/01-discover/discover-variable-usage.ps1'
        arguments: '-Organization "$(ADO_Org)" -Project "$(ADO_Project)" -Pat "$(ADO_PAT)"'
        pwsh: true
        workingDirectory: '$(System.DefaultWorkingDirectory)/enterprise-variable-migration/01-discover'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Discovery CSV Report'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/enterprise-variable-migration/01-discover/VariableGroup-Usage-Report.csv'
        artifact: 'VariableGroup-Mapping-CSV'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Discovery JSON Template'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/enterprise-variable-migration/01-discover/variable-mappings-template.json'
        artifact: 'VariableGroup-Mapping-JSON'
        publishLocation: 'pipeline'

# ==============================================================================
# PHASE 2: MIGRATION
# ==============================================================================
- stage: Migration
  dependsOn: Discovery
  condition: and(always(), eq('${{ parameters.RunMigration }}', true))
  displayName: 'Phase 2: Migrate Variables'
  jobs:
  - job: MigrateVariables
    steps:
    - task: PowerShell@2
      displayName: 'Run Migration Script'
      inputs:
        filePath: '$(System.DefaultWorkingDirectory)/enterprise-variable-migration/03-migrate/migrate-variables.ps1'
        arguments: '-Organization "$(ADO_Org)" -Project "$(ADO_Project)" -AdoPat "$(ADO_PAT)" -GhPat "$(GH_PAT)" -ConfigPath "$(System.DefaultWorkingDirectory)/enterprise-variable-migration/config/variable-mappings.json"'
        pwsh: true

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Migration Dashboard'
      condition: always()
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/enterprise-variable-migration/03-migrate/Migration-Dashboard.md'
        artifact: 'Migration-Dashboard'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Migration Summary CSV'
      condition: always()
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/enterprise-variable-migration/03-migrate/Migration-Summary.csv'
        artifact: 'Migration-Summary-CSV'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Generated Phase 3 YAML'
      condition: always()
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/enterprise-variable-migration/03-migrate/phase3-secrets-migration.yml'
        artifact: 'Phase3-Secrets-Pipeline-YAML'
        publishLocation: 'pipeline'

# ==============================================================================
# PHASE 3: SECRETS & KEY VAULT MIGRATION (Unified)
#
# Regular Secrets:  ADO decrypts the value → $(VAR) resolves → gh secret set
# KV-Linked Groups: ADO fetches from Key Vault at runtime → $(VAR) resolves → gh secret set
#
# Both use the EXACT same mechanism — declare the variable group in YAML,
# the ADO agent injects the value, then GitHub CLI pushes it to GitHub Secrets.
#
# ADO REQUIREMENT: Each variable group needs its OWN job so ADO can authorize
# them at YAML parse time. Groups cannot be bound dynamically at runtime.
#
# KV groups use continueOnError: true — if a vault is unreachable (e.g. deleted),
# that job fails gracefully without blocking the rest of the stage.
# ==============================================================================
- stage: Secrets
  dependsOn: Migration
  condition: and(always(), eq('${{ parameters.RunSecrets }}', true))
  displayName: 'Phase 3: Migrate Secrets & Key Vault Groups'
  jobs:
  - job: Migrate_Secrets_log
    variables:
    - group: repo-migration-discove
    - group: repo-migration-migrate
    - group: 'log'
    steps:
    - task: PowerShell@2
      displayName: 'Secrets: log'
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |
          # [CHECK MAPPINGS] Check if this group is marked for migration
          $mapping = Get-Content "$(System.DefaultWorkingDirectory)/enterprise-variable-migration/config/variable-mappings.json" | ConvertFrom-Json | Select-Object -ExpandProperty variableGroups | Where-Object { $_.adoGroupName -eq 'log' }
          if (-not $mapping -or $mapping.action -ne 'migrate') {
              Write-Host "##[warning] SKIPPED: 'log' is not marked for migration in variable-mappings.json."
              exit 0
          }
          # Check if GH_PAT is present, fallback to Git_pat
          $token = $env:MY_GH_PAT
          if ($token -eq '$(GH_PAT)' -or [string]::IsNullOrWhiteSpace($token)) {
              $token = $env:MY_GIT_PAT
          }
          if ($token -eq '$(Git_pat)' -or [string]::IsNullOrWhiteSpace($token)) {
              Write-Host "##[error] Neither GH_PAT nor Git_pat were found in your variable groups!"
              exit 1
          }
          $env:GH_TOKEN = $token.Trim()
          
          $targetOrg = "$(GH_Org)"
          $targetRepo = $mapping.targetRepo
          $targetEnv = $mapping.targetEnvironment
          $targetScope = $mapping.targetScope
          
          if ($targetScope -eq 'environment') {
              gh secret set "ADO_PAT" --body "$env:MY_ADO_PAT" --repo "$targetOrg/$targetRepo" --env "$targetEnv"
          } elseif ($targetScope -eq 'repository') {
              gh secret set "ADO_PAT" --body "$env:MY_ADO_PAT" --repo "$targetOrg/$targetRepo"
          } elseif ($targetScope -eq 'organization') {
              gh secret set "ADO_PAT" --body "$env:MY_ADO_PAT" --org "$targetOrg" --visibility private
          }
      env:
        MY_GH_PAT: $(GH_PAT)
        MY_GIT_PAT: $(Git_pat)
        MY_ADO_PAT: $(ADO_PAT)
