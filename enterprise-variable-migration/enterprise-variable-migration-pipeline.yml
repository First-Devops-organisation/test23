trigger: none

pool:
  vmImage: ubuntu-latest

parameters:
- name: RunDiscovery
  displayName: "Run Phase 1: Discovery (Generates Report)"
  type: boolean
  default: true

- name: RunMigration
  displayName: "Run Phase 2: Migration (Variables to GitHub)"
  type: boolean
  default: false

- name: RunSecrets
  displayName: "Run Phase 3: Migrate Secrets to GitHub"
  type: boolean
  default: false

variables:
- group: DevOpsConfig # Contains Pat, Git_pat, Organization, Project

stages:

# ==============================================================================
# PHASE 1: DISCOVERY
# ==============================================================================
- stage: Discovery
  condition: eq('${{ parameters.RunDiscovery }}', true)
  displayName: 'Phase 1: Discover Usage'
  jobs:
  - job: DiscoverVariableGroups
    steps:
    - task: PowerShell@2
      displayName: 'Run Discovery Script'
      inputs:
        filePath: '$(System.DefaultWorkingDirectory)/enterprise-variable-migration/01-discover/discover-variable-usage.ps1'
        arguments: '-Organization "$(Organization)" -Project "$(Project)" -Pat "$(Pat)"'
        pwsh: true
        workingDirectory: '$(System.DefaultWorkingDirectory)/enterprise-variable-migration/01-discover'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Discovery CSV Report'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/enterprise-variable-migration/01-discover/VariableGroup-Usage-Report.csv'
        artifact: 'VariableGroup-Mapping-CSV'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Discovery JSON Template'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/enterprise-variable-migration/01-discover/variable-mappings-template.json'
        artifact: 'VariableGroup-Mapping-JSON'
        publishLocation: 'pipeline'

# ==============================================================================
# PHASE 2: MIGRATION
# ==============================================================================
- stage: Migration
  condition: eq('${{ parameters.RunMigration }}', true)
  displayName: 'Phase 2: Migrate Variables'
  jobs:
  - job: MigrateVariables
    steps:
    - task: PowerShell@2
      displayName: 'Run Migration Script'
      inputs:
        filePath: '$(System.DefaultWorkingDirectory)/enterprise-variable-migration/03-migrate/migrate-variables.ps1'
        arguments: '-Organization "$(Organization)" -Project "$(Project)" -AdoPat "$(Pat)" -GhPat "$(Git_pat)" -ConfigPath "$(System.DefaultWorkingDirectory)/enterprise-variable-migration/config/variable-mappings.json"'
        pwsh: true

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Migration Dashboard'
      condition: always()
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/enterprise-variable-migration/03-migrate/Migration-Dashboard.md'
        artifact: 'Migration-Dashboard'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Migration Summary CSV'
      condition: always()
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/enterprise-variable-migration/03-migrate/Migration-Summary.csv'
        artifact: 'Migration-Summary-CSV'
        publishLocation: 'pipeline'

# ==============================================================================
# PHASE 3: SECRETS MIGRATION
# Each job maps ONE variable group - variable groups must be declared here so
# ADO can authorize them at YAML parse time (ADO security requirement)
# ==============================================================================
- stage: Secrets
  condition: eq('${{ parameters.RunSecrets }}', true)
  displayName: 'Phase 3: Migrate Secrets'
  jobs:

  - job: Migrate_Secrets_ankit_adotogit
    variables:
    - group: DevOpsConfig
    - group: 'ankit-adotogit'
    steps:
    - task: PowerShell@2
      displayName: 'Secrets: ankit-adotogit'
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |
          echo "$(Git_pat)" | gh auth login --with-token
          gh secret set "ADO_PAT" --body "$(ADO_PAT)" --repo "Second-Devops-organisation1/ADO_To_GHAS_Migration"
          gh secret set "GH_PAT"  --body "$(GH_PAT)"  --repo "Second-Devops-organisation1/ADO_To_GHAS_Migration"

  - job: Migrate_Secrets_artifact_migration
