trigger: none

parameters:
  - name: migrationType
    displayName: 'Migration Type'
    type: string
    default: 'both'
    values:
      - pipeline
      - repo
      - both

  - name: MigrationMode
    displayName: "Migration Mode"
    type: string
    default: Single
    values:
      - Single
      - Batch

  - name: ADORepo
    displayName: "ADO Repo name (Single mode only)"
    type: string
    default: " "

  - name: GHRepo
    displayName: "GitHub Repo name (Single mode only, defaults to ADORepo)"
    type: string
    default: " "

  - name: BatchName
    displayName: "Batch name from config (Batch mode — leave blank for all)"
    type: string
    default: " "

  - name: SkipAudit
    displayName: "Skip branch-wise audit (faster, no file inventory)"
    type: boolean
    default: false

  - name: SkipSecretScan
    displayName: "Skip secret scanning (gitleaks)"
    type: boolean
    default: false

  - name: DryRun
    displayName: "Dry Run (print GEI commands, do not execute)"
    type: boolean
    default: false

  - name: RunValidation
    displayName: "Run validation after migration"
    type: boolean
    default: true

variables:
  - group: pipeline-migration       # ADO_ORG, ADO_PROJECT, ADO_PAT, GH_PAT
  - group: repo-migration-discove   # ADO_ORG, ADO_PROJECT, ADO_PAT
  - group: repo-migration-migrate   # GH_ORG, GH_PAT

stages:
  # ===========================================================================
  # PIPELINE MIGRATION: STAGE 1 – DISCOVER
  # ===========================================================================
  - stage: PipelineDiscover
    displayName: "1. Discover & Audit Pipelines"
    condition: in('${{ parameters.migrationType }}', 'pipeline', 'both')
    jobs:
      - job: AuditPipelines
        displayName: "1.1 Audit ADO Pipelines"
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 60
        steps:
          - checkout: self
            fetchDepth: 0
          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'pipeline-migration/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Run audit-pipelines.ps1"
            inputs:
              filePath: '$(Build.SourcesDirectory)/pipeline-migration/00-discovery/audit-pipelines.ps1'
              arguments: >-
                -AdoOrg "$(ADO_ORG)"
                -AdoProject "$(ADO_PROJECT)"
                -AdoPat "$(ADO_PAT)"
                -GitHubPat "$(GH_PAT)"
                -OutputDir "output/pipeline-audit"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/pipeline-migration'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "List all ADO Pipeline IDs"
            inputs:
              filePath: '$(Build.SourcesDirectory)/pipeline-migration/02-migrate/migrate-pipelines.ps1'
              arguments: >-
                -ConfigFile "$(Build.SourcesDirectory)/pipeline-migration/config/migration-config.json"
                -AdoProject "$(ADO_PROJECT)"
                -Mode "list"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/pipeline-migration'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Audit Artifact"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/pipeline-migration/output/pipeline-audit'
              artifact: "pipeline-audit"
              publishLocation: pipeline

          - task: PowerShell@2
            displayName: "Parse config for pipeline conditions"
            name: checkConfig
            inputs:
              targetType: 'inline'
              script: |
                $configPath = "$(Build.SourcesDirectory)/pipeline-migration/config/migration-config.json"
                $ids = ""
                $mode = ""
                $type = ""
                if (Test-Path $configPath) {
                    $config = Get-Content $configPath -Raw | ConvertFrom-Json
                    if ($null -ne $config.PIPELINE_IDS) { $ids = ($config.PIPELINE_IDS -join ',') }
                    if ($config.MIGRATE_MODE) { $mode = $config.MIGRATE_MODE }
                    elseif ($config.MODE) { $mode = $config.MODE }
                    if ($config.PIPELINE_TYPE) { $type = $config.PIPELINE_TYPE }
                }
                if (-not $mode) { $mode = "dry-run" }
                if (-not $type) { $type = "build" }
                Write-Host "##vso[task.setvariable variable=HAS_IDS;isOutput=true]$(if ($ids) { 'true' } else { 'false' })"
                Write-Host "##vso[task.setvariable variable=RESOLVED_IDS;isOutput=true]$ids"
                Write-Host "##vso[task.setvariable variable=RESOLVED_MODE;isOutput=true]$mode"
                Write-Host "##vso[task.setvariable variable=RESOLVED_TYPE;isOutput=true]$type"
              pwsh: true

          - task: PublishHtmlReport@1
            displayName: "Show Pipeline Audit Report"
            condition: always()
            continueOnError: true
            inputs:
              reportDir: '$(Build.SourcesDirectory)/pipeline-migration/output/pipeline-audit'
              tabName: "Pipeline Audit"

  # ===========================================================================
  # PIPELINE MIGRATION: STAGE 2 – MIGRATE
  # ===========================================================================
  - stage: MigratePipeline
    displayName: "2. Migrate Pipelines"
    dependsOn: PipelineDiscover
    condition: and(not(failed()), eq(dependencies.PipelineDiscover.outputs['AuditPipelines.checkConfig.HAS_IDS'], 'true'), in('${{ parameters.migrationType }}', 'pipeline', 'both'))
    variables:
      PIPELINE_IDS: $[ stageDependencies.PipelineDiscover.AuditPipelines.outputs['checkConfig.RESOLVED_IDS'] ]
      MIGRATE_MODE: $[ stageDependencies.PipelineDiscover.AuditPipelines.outputs['checkConfig.RESOLVED_MODE'] ]
      PIPELINE_TYPE: $[ stageDependencies.PipelineDiscover.AuditPipelines.outputs['checkConfig.RESOLVED_TYPE'] ]
    jobs:
      - job: DryRun
        displayName: "2.1 Dry-Run Preview"
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'pipeline-migration/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)
          - task: PowerShell@2
            displayName: "Dry-Run pipelines"
            inputs:
              filePath: '$(Build.SourcesDirectory)/pipeline-migration/02-migrate/migrate-pipelines.ps1'
              arguments: >-
                -ConfigFile "$(Build.SourcesDirectory)/pipeline-migration/config/migration-config.json"
                -AdoProject "$(ADO_PROJECT)"
                -PipelineId $(PIPELINE_IDS)
                -PipelineType "$(PIPELINE_TYPE)"
                -Mode "dry-run"
              pwsh: true
            env:
              ADO_ORG: $(ADO_ORG)
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)
          - task: PublishPipelineArtifact@1
            displayName: "Publish Dry-Run Output"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/pipeline-migration/output/pipelines'
              artifact: "pipeline-dry-run"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Show Pipeline Dry-Run Report"
            condition: always()
            continueOnError: true
            inputs:
              reportDir: '$(Build.SourcesDirectory)/pipeline-migration/output/pipelines'
              tabName: "Pipeline Dry-Run"

      - job: Migrate
        displayName: "2.2 Migrate to GitHub"
        dependsOn: DryRun
        pool:
          vmImage: ubuntu-latest
        condition: and(succeeded(), eq(stageDependencies.PipelineDiscover.AuditPipelines.outputs['checkConfig.RESOLVED_MODE'], 'migrate'))
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'pipeline-migration/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)
          - task: PowerShell@2
            displayName: "Migrate pipelines"
            inputs:
              filePath: '$(Build.SourcesDirectory)/pipeline-migration/02-migrate/migrate-pipelines.ps1'
              arguments: >-
                -ConfigFile "$(Build.SourcesDirectory)/pipeline-migration/config/migration-config.json"
                -AdoProject "$(ADO_PROJECT)"
                -PipelineId $(PIPELINE_IDS)
                -PipelineType "$(PIPELINE_TYPE)"
                -Mode "migrate"
              pwsh: true
            env:
              ADO_ORG: $(ADO_ORG)
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)
          - task: PublishPipelineArtifact@1
            displayName: "Publish Migration Output"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/pipeline-migration/output/pipelines'
              artifact: "pipeline-migrate"
              publishLocation: pipeline

  # ===========================================================================
  # REPO MIGRATION: STAGES SYNCED WITH azure-pipeline.yaml
  # ===========================================================================
  - stage: Discover
    displayName: "1. Discover & Analyse"
    condition: in('${{ parameters.migrationType }}', 'repo', 'both')
    pool:
      vmImage: windows-latest
    jobs:
      - job: DiscoverAndAudit
        displayName: "1.1 Discover Repos & Audit Sizes"
        timeoutInMinutes: 60
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: "Install git-sizer"
            inputs:
              targetType: inline
              script: |
                Invoke-WebRequest -Uri "https://github.com/github/git-sizer/releases/download/v1.5.0/git-sizer-1.5.0-windows-amd64.zip" -OutFile git-sizer.zip
                Expand-Archive -Path git-sizer.zip -DestinationPath "$env:AGENT_TOOLSDIRECTORY\git-sizer" -Force
                Write-Host "##vso[task.prependpath]$env:AGENT_TOOLSDIRECTORY\git-sizer"
              pwsh: true

          - task: PowerShell@2
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                $cfg = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $c   = Get-Content $cfg -Raw
                $c   = $c -replace '\$\(ADO_ORG\)',     '$(ADO_ORG)'
                $c   = $c -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $c   = $c -replace '\$\(ADO_PAT\)',     '$(ADO_PAT)'
                $c   = $c -replace '\$\(GH_ORG\)',      '$(GH_ORG)'
                $c   = $c -replace '\$\(GH_PAT\)',      '$(GH_PAT)'
                Set-Content -Path $cfg -Value $c
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                "reports","logs","audit","dashboard","tmp\clones" | ForEach-Object {
                    New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\$_" -Force | Out-Null
                }
              pwsh: true

          - task: PowerShell@2
            displayName: "1.1 Discover Repos"
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\01-discover\discover-repos.ps1'
              arguments: '-ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PowerShell@2
            displayName: "1.2 Audit Repo Sizes"
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\01-discover\audit-repo-sizes.ps1'
              arguments: '-ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            condition: eq('${{ parameters.SkipAudit }}', false)
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Discovery Reports"
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "discovery-reports"
              publishLocation: pipeline
            condition: always()

          - task: PublishHtmlReport@1
            displayName: "Show Discovery Report"
            condition: always()
            continueOnError: true
            inputs:
              reportDir: '$(Build.SourcesDirectory)\repo-migration\output\reports\repo-inventory.html'
              tabName: "Discovery Report"

      - job: ScanSecretsSingle
        displayName: "1.3 Scan Secrets (Single Repo)"
        dependsOn: DiscoverAndAudit
        condition: and(succeeded(), eq('${{ parameters.SkipSecretScan }}', false), eq('${{ parameters.MigrationMode }}', 'Single'))
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: "Download Discovery Inventory"
            inputs:
              artifact: "discovery-reports"
              path: '$(Build.SourcesDirectory)\repo-migration\output\reports'

          - task: PowerShell@2
            displayName: "Install gitleaks"
            inputs:
              targetType: inline
              script: |
                Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_windows_x64.zip" -OutFile gitleaks.zip
                Expand-Archive -Path gitleaks.zip -DestinationPath "$env:AGENT_TOOLSDIRECTORY\gitleaks" -Force
                Write-Host "##vso[task.prependpath]$env:AGENT_TOOLSDIRECTORY\gitleaks"
              pwsh: true

          - task: PowerShell@2
            displayName: "1.3 Scan Secrets"
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\01-discover\scan-secrets.ps1'
              arguments: >-
                -ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                -RepoName "${{ parameters.ADORepo }}"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Scan Reports"
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "scan-reports-single"
              publishLocation: pipeline
            condition: always()

          - task: PublishHtmlReport@1
            displayName: "Show Secret Scan Report"
            condition: always()
            continueOnError: true
            inputs:
              reportDir: '$(Build.SourcesDirectory)\repo-migration\output\reports\secret-scan-report.html'
              tabName: "Secret Scan Report"

      - job: ScanSecretsBatch
        displayName: "1.3 Scan Secrets (Batch Matrix)"
        dependsOn: DiscoverAndAudit
        condition: and(succeeded(), eq('${{ parameters.SkipSecretScan }}', false), eq('${{ parameters.MigrationMode }}', 'Batch'))
        strategy:
          maxParallel: 3
          matrix:
            Batch0:
              BATCH_INDEX: 0
              BATCH_TOTAL: 3
            Batch1:
              BATCH_INDEX: 1
              BATCH_TOTAL: 3
            Batch2:
              BATCH_INDEX: 2
              BATCH_TOTAL: 3
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: "Download Discovery Inventory"
            inputs:
              artifact: "discovery-reports"
              path: '$(Build.SourcesDirectory)\repo-migration\output\reports'

          - task: PowerShell@2
            displayName: "Install gitleaks"
            inputs:
              targetType: inline
              script: |
                Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_windows_x64.zip" -OutFile gitleaks.zip
                Expand-Archive -Path gitleaks.zip -DestinationPath "$env:AGENT_TOOLSDIRECTORY\gitleaks" -Force
                Write-Host "##vso[task.prependpath]$env:AGENT_TOOLSDIRECTORY\gitleaks"
              pwsh: true

          - task: PowerShell@2
            displayName: "1.3 Scan Secrets"
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\01-discover\scan-secrets.ps1'
              arguments: >-
                -ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                -BatchIndex $(BATCH_INDEX) -BatchTotal $(BATCH_TOTAL)
                -BatchName "${{ parameters.BatchName }}"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Scan Reports"
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "scan-reports-batch$(BATCH_INDEX)"
              publishLocation: pipeline
            condition: always()

          - task: PublishHtmlReport@1
            displayName: "Show Secret Scan Report"
            condition: always()
            continueOnError: true
            inputs:
              reportDir: '$(Build.SourcesDirectory)\repo-migration\output\reports\secret-scan-report-batch$(BATCH_INDEX).html'
              tabName: "Secret Scan Report"

  - stage: ReviewGate
    displayName: "2. Review Gate"
    dependsOn: Discover
    condition: and(not(failed()), not(canceled()), or(eq('${{ parameters.migrationType }}', 'repo'), eq('${{ parameters.migrationType }}', 'both')))
    jobs:
      - job: ReviewGateJob
        displayName: "Gate: Review Discovery Findings"
        pool: server
        timeoutInMinutes: 4320
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 4320
            inputs:
              notifyUsers: ""
              instructions: |
                Review the discovery artifacts before proceeding to migration.
                Check: repo-inventory.json, repo-sizes.json, and secret-scan findings.
                Approve to proceed to migration, or Reject to abort.
              onTimeout: reject

  - stage: MigrateSingle
    displayName: "3a. Migrate (Single Repo)"
    dependsOn: ReviewGate
    condition: and(not(failed()), not(canceled()), eq('${{ parameters.MigrationMode }}', 'Single'), or(eq('${{ parameters.migrationType }}', 'repo'), eq('${{ parameters.migrationType }}', 'both')))
    pool:
      vmImage: windows-latest
    jobs:
      - job: MigrateSingleRepo
        displayName: "Migrate ${{ parameters.ADORepo }}"
        timeoutInMinutes: 180
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: "Install GitHub CLI + ado2gh"
            inputs:
              targetType: inline
              script: |
                $ghDir = "$env:AGENT_TOOLSDIRECTORY\gh"
                if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
                    Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v2.52.0/gh_2.52.0_windows_amd64.zip" -OutFile gh.zip
                    Expand-Archive -Path gh.zip -DestinationPath $ghDir -Force
                    $ghBin = (Get-ChildItem -Path $ghDir -Recurse -Filter gh.exe | Select-Object -First 1).DirectoryName
                    Write-Host "##vso[task.prependpath]$ghBin"
                }
                $env:GH_TOKEN = "$(GH_PAT)"
                echo "$(GH_PAT)" | gh auth login --with-token
                gh extension install github/gh-ado2gh 2>&1 | Where-Object { $_ -notmatch 'already installed' }
              pwsh: true
            env:
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Migrate Single Repo"
            inputs:
              targetType: inline
              script: |
                $adoRepo = '${{ parameters.ADORepo }}'.Trim()
                $ghRepo  = '${{ parameters.GHRepo }}'.Trim()
                if ([string]::IsNullOrWhiteSpace($ghRepo)) { $ghRepo = $adoRepo }

                $params = @{
                    ADOOrg     = '$(ADO_ORG)'.Trim()
                    ADOProject = '$(ADO_PROJECT)'.Trim()
                    ADORepo    = $adoRepo
                    GHOrg      = '$(GH_ORG)'.Trim()
                    GHRepo     = $ghRepo
                    OutputDir  = '$(Build.SourcesDirectory)\repo-migration\output'
                }
                if ('${{ parameters.SkipAudit }}' -eq 'True') { $params['SkipAudit'] = $true }
                if ('${{ parameters.DryRun }}'    -eq 'True') { $params['DryRun']    = $true }

                & '$(Build.SourcesDirectory)\repo-migration\03-migrate\migrate-single.ps1' @params
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Migration Logs"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\logs'
              artifact: "MigrationLogs-${{ parameters.ADORepo }}"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Migration Audit Data"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\audit'
              artifact: "MigrationAudit-${{ parameters.ADORepo }}"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Migration Dashboard"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\dashboard'
              artifact: "MigrationDashboard-${{ parameters.ADORepo }}"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Show Migration Report"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)\repo-migration\output\dashboard'
              tabName: "Migration Report"

  - stage: MigrateBatch
    displayName: "3b. Migrate (Batch)"
    dependsOn: ReviewGate
    condition: and(not(failed()), not(canceled()), eq('${{ parameters.MigrationMode }}', 'Batch'), or(eq('${{ parameters.migrationType }}', 'repo'), eq('${{ parameters.migrationType }}', 'both')))
    pool:
      vmImage: windows-latest
    jobs:
      - job: MigrateBatchRepos
        displayName: "Migrate Batch"
        timeoutInMinutes: 480
        strategy:
          maxParallel: 3
          matrix:
            Batch0:
              BATCH_INDEX: 0
              BATCH_TOTAL: 3
            Batch1:
              BATCH_INDEX: 1
              BATCH_TOTAL: 3
            Batch2:
              BATCH_INDEX: 2
              BATCH_TOTAL: 3
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: "Install GitHub CLI + ado2gh"
            inputs:
              targetType: inline
              script: |
                $ghDir = "$env:AGENT_TOOLSDIRECTORY\gh"
                if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
                    Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v2.52.0/gh_2.52.0_windows_amd64.zip" -OutFile gh.zip
                    Expand-Archive -Path gh.zip -DestinationPath $ghDir -Force
                    $ghBin = (Get-ChildItem -Path $ghDir -Recurse -Filter gh.exe | Select-Object -First 1).DirectoryName
                    Write-Host "##vso[task.prependpath]$ghBin"
                }
                $env:GH_TOKEN = "$(GH_PAT)"
                echo "$(GH_PAT)" | gh auth login --with-token
                gh extension install github/gh-ado2gh 2>&1 | Where-Object { $_ -notmatch 'already installed' }
              pwsh: true
            env:
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                $cfg = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $c   = Get-Content $cfg -Raw
                $c   = $c -replace '\$\(ADO_ORG\)',     '$(ADO_ORG)'
                $c   = $c -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $c   = $c -replace '\$\(ADO_PAT\)',     '$(ADO_PAT)'
                $c   = $c -replace '\$\(GH_ORG\)',      '$(GH_ORG)'
                $c   = $c -replace '\$\(GH_PAT\)',      '$(GH_PAT)'
                Set-Content -Path $cfg -Value $c
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PowerShell@2
            displayName: "Migrate Batch Repos"
            inputs:
              targetType: inline
              script: |
                $params = @{
                    ADOOrg      = '$(ADO_ORG)'
                    ADOProject  = '$(ADO_PROJECT)'
                    GHOrg       = '$(GH_ORG)'
                    ConfigPath  = '$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json'
                    BatchName   = '${{ parameters.BatchName }}'
                    OutputDir   = '$(Build.SourcesDirectory)\repo-migration\output'
                    BatchIndex  = $(BATCH_INDEX)
                    BatchTotal  = $(BATCH_TOTAL)
                }
                if ('${{ parameters.SkipAudit }}' -eq 'True') { $params['SkipAudit'] = $true }
                if ('${{ parameters.DryRun }}'    -eq 'True') { $params['DryRun']    = $true }

                & '$(Build.SourcesDirectory)\repo-migration\03-migrate\migrate-batch.ps1' @params
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Migration Logs"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\logs'
              artifact: "BatchMigrationLogs-$(BATCH_INDEX)"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Migration Reports"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "BatchMigrationReports-$(BATCH_INDEX)"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Migration Audit Data"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\audit'
              artifact: "BatchMigrationAudit-$(BATCH_INDEX)"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Migration Dashboards"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\dashboard'
              artifact: "BatchMigrationDashboards-$(BATCH_INDEX)"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Show Migration Report"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)\repo-migration\output\dashboard'
              tabName: "Migration Report"

  - stage: Validate
    displayName: "4. Validate Migration"
    dependsOn:
      - MigrateSingle
      - MigrateBatch
    condition: |
      and(
        in('${{ parameters.migrationType }}', 'repo', 'both'),
        eq('${{ parameters.RunValidation }}', true),
        or(
          eq(dependencies.MigrateSingle.result, 'Succeeded'),
          eq(dependencies.MigrateSingle.result, 'SucceededWithIssues'),
          eq(dependencies.MigrateBatch.result, 'Succeeded'),
          eq(dependencies.MigrateBatch.result, 'SucceededWithIssues')
        )
      )
    pool:
      vmImage: windows-latest
    jobs:
      - job: ValidateRepos
        displayName: "4.1 Validate Migrated Repos"
        steps:
          - checkout: self
          - task: DownloadPipelineArtifact@2
            displayName: "Download Batch Reports"
            condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Batch'))
            inputs:
              artifact: "BatchMigrationReports-0"
              path: '$(Build.SourcesDirectory)\repo-migration\output\reports-0'
            continueOnError: true

          - task: DownloadPipelineArtifact@2
            displayName: "Download Batch Reports"
            condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Batch'))
            inputs:
              artifact: "BatchMigrationReports-1"
              path: '$(Build.SourcesDirectory)\repo-migration\output\reports-1'
            continueOnError: true

          - task: DownloadPipelineArtifact@2
            displayName: "Download Batch Reports"
            condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Batch'))
            inputs:
              artifact: "BatchMigrationReports-2"
              path: '$(Build.SourcesDirectory)\repo-migration\output\reports-2'
            continueOnError: true

          - task: DownloadPipelineArtifact@2
            displayName: "Download Batch Audit Data"
            condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Batch'))
            inputs:
              artifact: "BatchMigrationAudit-0"
              path: '$(Build.SourcesDirectory)\repo-migration\output\audit'
            continueOnError: true

          - task: DownloadPipelineArtifact@2
            displayName: "Download Batch Audit Data"
            condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Batch'))
            inputs:
              artifact: "BatchMigrationAudit-1"
              path: '$(Build.SourcesDirectory)\repo-migration\output\audit'
            continueOnError: true

          - task: DownloadPipelineArtifact@2
            displayName: "Download Batch Audit Data"
            condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Batch'))
            inputs:
              artifact: "BatchMigrationAudit-2"
              path: '$(Build.SourcesDirectory)\repo-migration\output\audit'
            continueOnError: true

          - task: DownloadPipelineArtifact@2
            displayName: "Download Single Audit Data"
            condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Single'))
            inputs:
              artifact: "MigrationAudit-${{ parameters.ADORepo }}"
              path: '$(Build.SourcesDirectory)\repo-migration\output\audit'
            continueOnError: true

          - task: DownloadPipelineArtifact@2
            displayName: "Download Single Dashboard"
            condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Single'))
            inputs:
              artifact: "MigrationDashboard-${{ parameters.ADORepo }}"
              path: '$(Build.SourcesDirectory)\repo-migration\output\dashboard'
            continueOnError: true

          - task: DownloadPipelineArtifact@2
            displayName: "Download Batch Dashboards"
            condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Batch'))
            inputs:
              artifact: "BatchMigrationDashboards-0"
              path: '$(Build.SourcesDirectory)\repo-migration\output\dashboard'
            continueOnError: true

          - task: DownloadPipelineArtifact@2
            displayName: "Download Batch Dashboards"
            condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Batch'))
            inputs:
              artifact: "BatchMigrationDashboards-1"
              path: '$(Build.SourcesDirectory)\repo-migration\output\dashboard'
            continueOnError: true

          - task: DownloadPipelineArtifact@2
            displayName: "Download Batch Dashboards"
            condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Batch'))
            inputs:
              artifact: "BatchMigrationDashboards-2"
              path: '$(Build.SourcesDirectory)\repo-migration\output\dashboard'
            continueOnError: true

          - task: PowerShell@2
            displayName: "Consolidate Batch Summaries"
            condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Batch'))
            inputs:
              targetType: inline
              script: |
                $merged = @()
                0..2 | ForEach-Object {
                    $p = "$(Build.SourcesDirectory)\repo-migration\output\reports-$_\batch-migration-summary.json"
                    if (Test-Path $p) {
                        $merged += Get-Content $p -Raw | ConvertFrom-Json
                    }
                }
                $target = "$(Build.SourcesDirectory)\repo-migration\output\reports\batch-migration-summary.json"
                New-Item -ItemType Directory -Path (Split-Path $target) -Force | Out-Null
                $merged | ConvertTo-Json -Depth 5 | Out-File $target -Encoding utf8
                Write-Host "Consolidated $($merged.Count) repo results into $target"
              pwsh: true

          - task: PowerShell@2
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                $cfg = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $c   = Get-Content $cfg -Raw
                $c   = $c -replace '\$\(ADO_ORG\)',     '$(ADO_ORG)'
                $c   = $c -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $c   = $c -replace '\$\(ADO_PAT\)',     '$(ADO_PAT)'
                $c   = $c -replace '\$\(GH_ORG\)',      '$(GH_ORG)'
                $c   = $c -replace '\$\(GH_PAT\)',      '$(GH_PAT)'
                Set-Content -Path $cfg -Value $c
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PowerShell@2
            displayName: "Run Validation"
            inputs:
              targetType: inline
              script: |
                # Read target visibility from config
                $cfgPath = '$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json'
                $visibility = 'private'
                if (Test-Path $cfgPath) {
                    $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
                    if ($cfg.migration.targetRepoVisibility) {
                        $visibility = $cfg.migration.targetRepoVisibility
                    }
                }

                $params = @{
                    ADOOrg             = '$(ADO_ORG)'
                    ADOProject         = '$(ADO_PROJECT)'
                    GHOrg              = '$(GH_ORG)'
                    OutputDir          = '$(Build.SourcesDirectory)\repo-migration\output'
                    ExpectedVisibility = $visibility
                }
                if ('${{ parameters.MigrationMode }}' -eq 'Single') {
                    $params['GHRepo']  = '${{ parameters.GHRepo }}'.Trim()
                    $params['ADORepo'] = '${{ parameters.ADORepo }}'.Trim()
                    if ([string]::IsNullOrWhiteSpace($params['GHRepo'])) { $params['GHRepo'] = $params['ADORepo'] }
                }

                & '$(Build.SourcesDirectory)\repo-migration\04-validate\validate-migration.ps1' @params
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Validation Reports"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "ValidationReports"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Show Validation Report"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)\repo-migration\output\reports\validation-report.html'
              tabName: "Validation Report"

          - task: PowerShell@2
            displayName: "Prepare Migration Report for HTML Tab"
            condition: always()
            inputs:
              targetType: inline
              script: |
                $src = "$(Build.SourcesDirectory)\repo-migration\output\dashboard"
                
                # For Single mode: use parameters
                $adoRepo = '${{ parameters.ADORepo }}'.Trim()
                $ghRepo  = '${{ parameters.GHRepo }}'.Trim()
                if ([string]::IsNullOrWhiteSpace($ghRepo)) { $ghRepo = $adoRepo }
                $singleFile = "$src\$ghRepo\migration-report-$ghRepo.html"

                if (Test-Path $singleFile) {
                    Write-Host "Single mode — using: $singleFile"
                    Write-Host "##vso[task.setvariable variable=MIGRATION_REPORT_PATH]$singleFile"
                }
                else {
                    # Batch mode or multi-VM — find all HTML files
                    $htmlFiles = @(Get-ChildItem -Path $src -Recurse -Filter "*.html" -ErrorAction SilentlyContinue)
                    Write-Host "Found $($htmlFiles.Count) HTML file(s) in dashboard"
                    if ($htmlFiles.Count -eq 1) {
                        Write-Host "Using: $($htmlFiles[0].FullName)"
                        Write-Host "##vso[task.setvariable variable=MIGRATION_REPORT_PATH]$($htmlFiles[0].FullName)"
                    }
                    elseif ($htmlFiles.Count -gt 1) {
                        $dst = "$src\combined-migration-report.html"
                        $combined = "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Migration Reports</title></head><body>"
                        foreach ($f in $htmlFiles) {
                            $content = Get-Content $f.FullName -Raw -Encoding utf8
                            $content = $content -replace '<!DOCTYPE[^>]*>', '' -replace '</?html[^>]*>', '' -replace '<head>.*?</head>', '' -replace '</?body[^>]*>', ''
                            $combined += "<div style='border-bottom:4px solid #0d1117;margin-bottom:40px;padding-bottom:40px;'>$content</div>"
                            Write-Host "  Merged: $($f.Name)"
                        }
                        $combined += "</body></html>"
                        $combined | Out-File $dst -Encoding utf8
                        Write-Host "##vso[task.setvariable variable=MIGRATION_REPORT_PATH]$dst"
                    }
                    else {
                        Write-Warning "No migration HTML files found"
                        Write-Host "##vso[task.setvariable variable=MIGRATION_REPORT_PATH]"
                    }
                }
              pwsh: true

          - task: PublishHtmlReport@1
            displayName: "Show Combined Migration Report"
            condition: always()
            inputs:
              reportDir: '$(MIGRATION_REPORT_PATH)'
              tabName: "Migration Report"

          - task: PowerShell@2
            displayName: "Publish Validation Summary to ADO Tab"
            condition: always()
            inputs:
              targetType: inline
              script: |
                $valSummary = "$(Build.SourcesDirectory)\repo-migration\output\reports\validation-summary.md"
                if (Test-Path $valSummary) {
                    Write-Host "##vso[task.uploadsummary]$valSummary"
                }
              pwsh: true
