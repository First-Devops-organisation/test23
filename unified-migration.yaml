trigger: none

parameters:
  - name: MigrationSelection
    displayName: "Select Migration Type"
    type: string
    default: Both
    values:
      - Pipeline
      - Repo
      - Both

  - name: RepoMigrationMode
    displayName: "Repo Migration Mode"
    type: string
    default: Single
    values:
      - Single
      - Batch

  - name: ADORepo
    displayName: "ADO Repo name (Single mode only)"
    type: string
    default: " "

  - name: GHRepo
    displayName: "GitHub Repo name (Single mode only)"
    type: string
    default: " "

  - name: BatchName
    displayName: "Batch name from config (Batch mode)"
    type: string
    default: " "

  - name: DryRun
    displayName: "Dry Run (Repo migration)"
    type: boolean
    default: true

  - name: SkipAudit
    displayName: "Skip branch-wise audit (Faster)"
    type: boolean
    default: false

  - name: RunValidation
    displayName: "Run validation after migration"
    type: boolean
    default: true

variables:
  - group: pipeline-migration       # ADO_ORG, ADO_PROJECT, ADO_PAT, GH_PAT
  - group: repo-migration-discove   # ADO_ORG, ADO_PROJECT, ADO_PAT
  - group: repo-migration-migrate   # GH_ORG, GH_PAT

stages:
  # ===========================================================================
  # STAGE 1 – DISCOVER
  # ===========================================================================
  - stage: Discover
    displayName: "1. Discover & Audit"
    jobs:
      # --- Pipeline Discovery (Ubuntu) ---
      - job: AuditPipelines
        displayName: "1.1 Audit ADO Pipelines"
        pool:
          vmImage: ubuntu-latest
        condition: |
          or(
            eq('${{ parameters.MigrationSelection }}', 'Pipeline'),
            eq('${{ parameters.MigrationSelection }}', 'Both')
          )
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'pipeline-migration/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Run audit-pipelines.ps1"
            inputs:
              filePath: '$(Build.SourcesDirectory)/pipeline-migration/00-discovery/audit-pipelines.ps1'
              arguments: >-
                -AdoOrg "$(ADO_ORG)"
                -AdoProject "$(ADO_PROJECT)"
                -AdoPat "$(ADO_PAT)"
                -GitHubPat "$(GH_PAT)"
                -OutputDir "output/pipeline-audit"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/pipeline-migration'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Parse config for pipeline conditions"
            name: checkConfig
            inputs:
              targetType: 'inline'
              script: |
                $configPath = "$(Build.SourcesDirectory)/pipeline-migration/config/migration-config.json"
                $ids = ""
                $mode = ""
                if (Test-Path $configPath) {
                    $config = Get-Content $configPath -Raw | ConvertFrom-Json
                    if ($null -ne $config.PIPELINE_IDS) { $ids = ($config.PIPELINE_IDS -join ',') }
                    $mode = if ($config.MIGRATE_MODE) { $config.MIGRATE_MODE } else { "dry-run" }
                }
                Write-Host "##vso[task.setvariable variable=HAS_IDS;isOutput=true]$(if ($ids) { 'true' } else { 'false' })"
                Write-Host "##vso[task.setvariable variable=RESOLVED_IDS;isOutput=true]$ids"
                Write-Host "##vso[task.setvariable variable=RESOLVED_MODE;isOutput=true]$mode"
              pwsh: true

          - task: PublishPipelineArtifact@1
            displayName: "Publish Pipeline Audit Artifact"
            inputs:
              targetPath: '$(Build.SourcesDirectory)/pipeline-migration/output/pipeline-audit'
              artifact: "pipeline-audit"
              publishLocation: pipeline

      # --- Repo Discovery (Windows) ---
      - job: DiscoverAndAuditRepos
        displayName: "1.2 Discover & Audit Repos"
        pool:
          vmImage: windows-latest
        condition: |
          or(
            eq('${{ parameters.MigrationSelection }}', 'Repo'),
            eq('${{ parameters.MigrationSelection }}', 'Both')
          )
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                $cfg = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $c   = Get-Content $cfg -Raw
                $c   = $c -replace '\$\(ADO_ORG\)',     '$(ADO_ORG)'
                $c   = $c -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $c   = $c -replace '\$\(ADO_PAT\)',     '$(ADO_PAT)'
                $c   = $c -replace '\$\(GH_ORG\)',      '$(GH_ORG)'
                $c   = $c -replace '\$\(GH_PAT\)',      '$(GH_PAT)'
                Set-Content -Path $cfg -Value $c
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Run Discovery & Audit"
            inputs:
              targetType: inline
              script: |
                # Ensure output dirs
                "reports","logs","audit","dashboard","tmp" | ForEach-Object {
                    New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\$_" -Force | Out-Null
                }
                # Run scripts
                & '$(Build.SourcesDirectory)\repo-migration\01-discover\discover-repos.ps1' -ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                
                if (-not $([bool]${{ parameters.SkipAudit }})) {
                    Write-Host "Running size audit..."
                    & '$(Build.SourcesDirectory)\repo-migration\01-discover\audit-repo-sizes.ps1' -ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                } else {
                    Write-Host "Skipping size audit as requested."
                }
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Repo Discovery Reports"
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "repo-discovery-reports"
              publishLocation: pipeline

  # ===========================================================================
  # STAGE 2 – REVIEW GATE
  # ===========================================================================
  - stage: ReviewGate
    displayName: "2. Review Gate"
    dependsOn: Discover
    jobs:
      - job: ReviewGateJob
        displayName: "Gate: Review Findings"
        pool: server
        steps:
          - task: ManualValidation@0
            inputs:
              instructions: |
                Please review the discovery results before approving the migration:

                FOR PIPELINE MIGRATION:
                - Check 'pipeline-audit' artifact for Action Importer reports.
                - Verify 'pipeline-migration/config/migration-config.json' has the correct PIPELINE_IDS.

                FOR REPO MIGRATION:
                - Check 'repo-discovery-reports' for inventory and sizes.
                - Repos > 40GB or files > 100MB may require manual handling.
                - Verify 'repo-migration/config/repo-migration-config.json' batches.

                Approve to proceed with the migration or Reject to stop.

  # ===========================================================================
  # STAGE 3 – MIGRATE
  # ===========================================================================
  - stage: Migrate
    displayName: "3. Migration"
    dependsOn: ReviewGate
    jobs:
      # --- Pipeline Migration (Ubuntu) ---
      - job: MigratePipelines
        displayName: "3.1 Migrate Pipelines"
        pool:
          vmImage: ubuntu-latest
        condition: |
          and(
            succeeded(),
            or(eq('${{ parameters.MigrationSelection }}', 'Pipeline'), eq('${{ parameters.MigrationSelection }}', 'Both')),
            eq(dependencies.Discover.outputs['AuditPipelines.checkConfig.HAS_IDS'], 'true')
          )
        variables:
          PIPELINE_IDS: $[ stageDependencies.Discover.AuditPipelines.outputs['checkConfig.RESOLVED_IDS'] ]
          MIGRATE_MODE: $[ stageDependencies.Discover.AuditPipelines.outputs['checkConfig.RESOLVED_MODE'] ]
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'pipeline-migration/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Run Migration"
            inputs:
              filePath: '$(Build.SourcesDirectory)/pipeline-migration/02-migrate/migrate-pipelines.ps1'
              arguments: >-
                -ConfigFile "$(Build.SourcesDirectory)/pipeline-migration/config/migration-config.json"
                -AdoProject "$(ADO_PROJECT)"
                -PipelineId $(PIPELINE_IDS)
                -Mode "$(MIGRATE_MODE)"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/pipeline-migration'
            env:
              ADO_ORG: $(ADO_ORG)
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Pipeline Migration Output"
            inputs:
              targetPath: '$(Build.SourcesDirectory)/pipeline-migration/output/pipelines'
              artifact: "pipeline-migration-output"
              publishLocation: pipeline

      # --- Repo Migration (Windows) ---
      - job: MigrateRepos
        displayName: "3.2 Migrate Repositories"
        pool:
          vmImage: windows-latest
        condition: |
          and(
            succeeded(),
            or(eq('${{ parameters.MigrationSelection }}', 'Repo'), eq('${{ parameters.MigrationSelection }}', 'Both'))
          )
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: "Install GitHub CLI + ado2gh"
            inputs:
              targetType: inline
              script: |
                $ghDir = "$env:AGENT_TOOLSDIRECTORY\gh"
                if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
                    Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v2.52.0/gh_2.52.0_windows_amd64.zip" -OutFile gh.zip
                    Expand-Archive -Path gh.zip -DestinationPath $ghDir -Force
                    $ghBin = (Get-ChildItem -Path $ghDir -Recurse -Filter gh.exe | Select-Object -First 1).DirectoryName
                    Write-Host "##vso[task.prependpath]$ghBin"
                }
                $env:GH_TOKEN = "$(GH_PAT)"
                gh extension install github/gh-ado2gh 2>&1 | Where-Object { $_ -notmatch 'already installed' }
              pwsh: true
            env:
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Run Repo Migration"
            inputs:
              targetType: inline
              script: |
                # Ensure output dirs
                "reports","logs","audit","dashboard","tmp" | ForEach-Object {
                    New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\$_" -Force | Out-Null
                }
                
                if ('${{ parameters.RepoMigrationMode }}' -eq 'Single') {
                    $adoRepo = '${{ parameters.ADORepo }}'.Trim()
                    $ghRepo  = '${{ parameters.GHRepo }}'.Trim()
                    if ([string]::IsNullOrWhiteSpace($ghRepo)) { $ghRepo = $adoRepo }
                    
                    & '$(Build.SourcesDirectory)\repo-migration\03-migrate\migrate-single.ps1' `
                        -ADOOrg '$(ADO_ORG)' -ADOProject '$(ADO_PROJECT)' -ADORepo $adoRepo `
                        -GHOrg '$(GH_ORG)' -GHRepo $ghRepo `
                        -OutputDir '$(Build.SourcesDirectory)\repo-migration\output' `
                        -DryRun $([bool]${{ parameters.DryRun }}) `
                        -SkipAudit $([bool]${{ parameters.SkipAudit }})
                } else {
                    & '$(Build.SourcesDirectory)\repo-migration\03-migrate\migrate-batch.ps1' `
                        -ADOOrg '$(ADO_ORG)' -ADOProject '$(ADO_PROJECT)' -GHOrg '$(GH_ORG)' `
                        -ConfigPath '$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json' `
                        -BatchName '${{ parameters.BatchName }}' `
                        -OutputDir '$(Build.SourcesDirectory)\repo-migration\output' `
                        -DryRun $([bool]${{ parameters.DryRun }}) `
                        -SkipAudit $([bool]${{ parameters.SkipAudit }})
                }
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Repo Migration Output"
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output'
              artifact: "repo-migration-output"
              publishLocation: pipeline

  # ===========================================================================
  # STAGE 4 – VALIDATE
  # ===========================================================================
  - stage: Validate
    displayName: "4. Validation"
    dependsOn: Migrate
    condition: |
      and(
        succeeded(),
        eq('${{ parameters.RunValidation }}', true),
        or(eq('${{ parameters.MigrationSelection }}', 'Repo'), eq('${{ parameters.MigrationSelection }}', 'Both'))
      )
    jobs:
      - job: ValidateRepos
        displayName: "4.1 Validate Migrated Repos"
        pool:
          vmImage: windows-latest
        condition: |
          or(eq('${{ parameters.MigrationSelection }}', 'Repo'), eq('${{ parameters.MigrationSelection }}', 'Both'))
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: "Run Validation"
            inputs:
              targetType: inline
              script: |
                & '$(Build.SourcesDirectory)\repo-migration\04-validate\validate-migration.ps1' `
                    -ADOOrg '$(ADO_ORG)' -ADOProject '$(ADO_PROJECT)' -GHOrg '$(GH_ORG)' `
                    -OutputDir '$(Build.SourcesDirectory)\repo-migration\output'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)
