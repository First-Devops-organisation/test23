# Unified Migration Pipeline YAML
# Select migrationType at runtime to run either pipeline or repo migration



trigger: none

parameters:
  - name: migrationType
    displayName: 'Migration Type'
    type: string
    default: 'pipeline'
    values:
      - pipeline
      - repo



stages:
  - stage: PipelineMigration
    displayName: 'Pipeline Migration'
    condition: eq('${{ parameters.migrationType }}', 'pipeline')
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: RunPipelineMigration
        displayName: 'Run Pipeline Migration'
        variables:
          - group: pipeline-migration  # Update with your actual variable group name
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: 'Run Pipeline Migration Script'
            inputs:
              filePath: 'repo-migration/run-migration.ps1'
              pwsh: true

  - stage: RepoMigration
    displayName: 'Repo Migration'
    condition: eq('${{ parameters.migrationType }}', 'repo')
    pool:
      vmImage: 'windows-latest'
    jobs:
      - job: RunRepoMigration
        displayName: 'Run Repo Migration'
        variables:
          - group: repo-migration-discove  # ADO_ORG, ADO_PROJECT, ADO_PAT
          - group: repo-migration-migrate
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: 'Run Repo Migration Script'
            inputs:
              filePath: 'repo-migration/run-migration.ps1'
              pwsh: true
