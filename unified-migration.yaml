trigger: none

parameters:
  - name: migrationType
    displayName: 'Migration Type'
    type: string
    default: 'pipeline'
    values:
      - pipeline
      - repo
      - both
      - reclaim

  - name: MigrationMode
    displayName: "Migration Mode"
    type: string
    default: Single
    values:
      - Single
      - Batch

  - name: ADORepo
    displayName: "ADO Repo name (Single mode only)"
    type: string
    default: " "

  - name: GHRepo
    displayName: "GitHub Repo name (Single mode only, defaults to ADORepo)"
    type: string
    default: " "

  - name: BatchName
    displayName: "Batch name from config (Batch mode — leave blank for all)"
    type: string
    default: " "

  - name: SkipAudit
    displayName: "Skip branch-wise audit (faster, no file inventory)"
    type: boolean
    default: false

  - name: SkipSecretScan
    displayName: "Skip secret scanning (gitleaks)"
    type: boolean
    default: false

  - name: DryRun
    displayName: "Dry Run (print GEI commands, do not execute)"
    type: boolean
    default: false

  - name: RunValidation
    displayName: "Run validation after migration"
    type: boolean
    default: true

  - name: ReclaimMode
    displayName: "Reclaim Mannequins Mode"
    type: string
    default: Skip
    values:
      - DryRun
      - Execute
      - Skip

variables:
  - group: pipeline-migration # ADO_ORG, ADO_PROJECT, ADO_PAT
  - group: repo-migration-discove  # ADO_ORG, ADO_PROJECT, ADO_PAT
  - group: repo-migration-migrate    # GH_ORG, GH_PAT

stages:
  # ===========================================================================
  # PIPELINE MIGRATION: STAGE 1 – DISCOVER
  # ===========================================================================
  - stage: PipelineDiscover
    displayName: "1. Discover & Audit Pipelines"
    condition: in('${{ parameters.migrationType }}', 'pipeline', 'both')
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: AuditPipelines
        displayName: "1.1 Audit ADO Pipelines (actions-importer)"
        timeoutInMinutes: 60

        steps:
          - checkout: self
            fetchDepth: 0
          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'Pipeline-migration/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Run audit-pipelines.ps1"
            inputs:
              filePath: '$(Build.SourcesDirectory)/Pipeline-migration/00-discovery/audit-pipelines.ps1'
              arguments: >-
                -AdoOrg "$(ADO_ORG)"
                -AdoProject "$(ADO_PROJECT)"
                -AdoPat "$(ADO_PAT)"
                -GitHubPat "$(GH_PAT)"
                -OutputDir "output/pipeline-audit"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/Pipeline-migration'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "List all ADO Pipeline IDs"
            inputs:
              filePath: '$(Build.SourcesDirectory)/Pipeline-migration/02-migrate/migrate-pipelines.ps1'
              arguments: >-
                -ConfigFile "$(Build.SourcesDirectory)/Pipeline-migration/config/migration-config.json"
                -AdoProject "$(ADO_PROJECT)"
                -Mode "list"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/Pipeline-migration'
            env:
             
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Audit Artifact"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/Pipeline-migration/output/pipeline-audit'
              artifact: "pipeline-audit"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Audit Dashboard on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)/Pipeline-migration/output/pipeline-audit/dashboard'
              tabName: "Pipeline Audit Dashboard"

          - task: PowerShell@2
            displayName: "Parse config for pipeline conditions"
            name: checkConfig
            inputs:
              targetType: 'inline'
              script: |
                $configPath = "$(Build.SourcesDirectory)/Pipeline-migration/config/migration-config.json"
                $ids = ""
                $mode = ""
                $type = ""
                if (Test-Path $configPath) {
                    $config = Get-Content $configPath -Raw | ConvertFrom-Json
                    if ($null -ne $config.PIPELINE_IDS) { $ids = ($config.PIPELINE_IDS -join ',') }
                    if ($config.MIGRATE_MODE) { $mode = $config.MIGRATE_MODE }
                    elseif ($config.MODE) { $mode = $config.MODE }
                    if ($config.PIPELINE_TYPE) { $type = $config.PIPELINE_TYPE }
                }
                
                # If config doesn't have it, fallback to env (var group)
                $literalIds = '$' + '(PIPELINE_IDS)'
                $literalMode = '$' + '(MIGRATE_MODE)'
                $literalType = '$' + '(PIPELINE_TYPE)'
                
                $macroIds = '$(PIPELINE_IDS)'
                $macroMode = '$(MIGRATE_MODE)'
                $macroType = '$(PIPELINE_TYPE)'
                
                if (-not $ids -and $macroIds -ne $literalIds) { $ids = $macroIds }
                if (-not $mode -and $macroMode -ne $literalMode) { $mode = $macroMode }
                if (-not $type -and $macroType -ne $literalType) { $type = $macroType }
                if (-not $mode) { $mode = "dry-run" } # Default is dry-run if left totally blank
                if (-not $type) { $type = "build" }
                
                Write-Host "Resolved PIPELINE_IDS: $ids"
                Write-Host "Resolved MIGRATE_MODE: $mode"
                Write-Host "Resolved PIPELINE_TYPE: $type"
                
                Write-Host "##vso[task.setvariable variable=HAS_IDS;isOutput=true]$(if ($ids) { 'true' } else { 'false' })"
                Write-Host "##vso[task.setvariable variable=RESOLVED_IDS;isOutput=true]$ids"
                Write-Host "##vso[task.setvariable variable=RESOLVED_MODE;isOutput=true]$mode"
                Write-Host "##vso[task.setvariable variable=RESOLVED_TYPE;isOutput=true]$type"

  # ===========================================================================
  # PIPELINE MIGRATION: STAGE 2 – MIGRATE
  # ===========================================================================
  - stage: MigratePipeline
    displayName: "2. Migrate Pipelines"
    dependsOn: PipelineDiscover
    condition: and(succeeded(), eq(dependencies.PipelineDiscover.outputs['AuditPipelines.checkConfig.HAS_IDS'], 'true'), in('${{ parameters.migrationType }}', 'pipeline', 'both'))
    pool:
      vmImage: ubuntu-latest
    variables:
      PIPELINE_IDS: $[ stageDependencies.PipelineDiscover.AuditPipelines.outputs['checkConfig.RESOLVED_IDS'] ]
      MIGRATE_MODE: $[ stageDependencies.PipelineDiscover.AuditPipelines.outputs['checkConfig.RESOLVED_MODE'] ]
      PIPELINE_TYPE: $[ stageDependencies.PipelineDiscover.AuditPipelines.outputs['checkConfig.RESOLVED_TYPE'] ]
    jobs:
      - job: DryRun
        displayName: "2.1 Dry-Run Preview"
        steps:
          - checkout: self
            fetchDepth: 0

          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'Pipeline-migration/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Dry-Run pipelines: $(PIPELINE_IDS)"
            inputs:
              filePath: '$(Build.SourcesDirectory)/Pipeline-migration/02-migrate/migrate-pipelines.ps1'
              arguments: >-
                -ConfigFile "$(Build.SourcesDirectory)/Pipeline-migration/config/migration-config.json"
                -AdoProject "$(ADO_PROJECT)"
                -PipelineId $(PIPELINE_IDS)
                -PipelineType "$(PIPELINE_TYPE)"
                -Mode "dry-run"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/Pipeline-migration'
            env:
              ADO_ORG: $(ADO_ORG)
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)
              GH_REPO: $(GH_REPO)
              PIPELINE_REPO_MAP: $(PIPELINE_REPO_MAP)
 
           
          - task: PublishPipelineArtifact@1
            displayName: "Publish Dry-Run Output"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/Pipeline-migration/output/pipelines'
              artifact: "pipeline-dry-run"
              publishLocation: pipeline

      - job: Migrate
        displayName: "2.2 Migrate to GitHub"
        dependsOn: DryRun
        condition: and(succeeded(), eq(stageDependencies.PipelineDiscover.AuditPipelines.outputs['checkConfig.RESOLVED_MODE'], 'migrate'))
        steps:
          - checkout: self
            fetchDepth: 0

          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'Pipeline-migration/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Migrate pipelines: $(PIPELINE_IDS)"
            inputs:
              filePath: '$(Build.SourcesDirectory)/Pipeline-migration/02-migrate/migrate-pipelines.ps1'
              arguments: >-
                -ConfigFile "$(Build.SourcesDirectory)/Pipeline-migration/config/migration-config.json"
                -AdoProject "$(ADO_PROJECT)"
                -PipelineId $(PIPELINE_IDS)
                -PipelineType "$(PIPELINE_TYPE)"
                -Mode "migrate"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/Pipeline-migration'
            env:
              ADO_ORG: $(ADO_ORG)
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)
              GH_REPO: $(GH_REPO)
              PIPELINE_REPO_MAP: $(PIPELINE_REPO_MAP)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Migration Output"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/Pipeline-migration/output/pipelines'
              artifact: "pipeline-migrate"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Migration Dashboard on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)/Pipeline-migration/output/pipelines/dashboard'
              tabName: "Migration Dashboard"


  # ===========================================================================
  # REPO MIGRATION: STAGE 1 – DISCOVER
  # ===========================================================================
  - stage: RepoDiscover
    displayName: "1. Discover & Analyse"
    condition: in('${{ parameters.migrationType }}', 'repo', 'both', 'reclaim')
    pool:
      vmImage: windows-latest
    jobs:
      - job: DiscoverAndAudit
        displayName: "1.1 Discover Repos & Audit Sizes"
        timeoutInMinutes: 60
        steps:

          - task: PowerShell@2
            displayName: "Install git-sizer"
            inputs:
              targetType: inline
              script: |
                Invoke-WebRequest -Uri "https://github.com/github/git-sizer/releases/download/v1.5.0/git-sizer-1.5.0-windows-amd64.zip" -OutFile git-sizer.zip
                Expand-Archive -Path git-sizer.zip -DestinationPath "$env:AGENT_TOOLSDIRECTORY\git-sizer" -Force
                Write-Host "##vso[task.prependpath]$env:AGENT_TOOLSDIRECTORY\git-sizer"
              pwsh: true

          - task: PowerShell@2
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                $cfg = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $c   = Get-Content $cfg -Raw
                $c   = $c -replace '\$\(ADO_ORG\)',     '$(ADO_ORG)'
                $c   = $c -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $c   = $c -replace '\$\(ADO_PAT\)',     '$(ADO_PAT)'
                $c   = $c -replace '\$\(GH_ORG\)',      '$(GH_ORG)'
                $c   = $c -replace '\$\(GH_PAT\)',      '$(GH_PAT)'
                Set-Content -Path $cfg -Value $c
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                "reports","logs","audit","dashboard","tmp\clones" | ForEach-Object {
                    New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\$_" -Force | Out-Null
                }
              pwsh: true

          - task: PowerShell@2
            displayName: "1.1 Discover Repos"
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\01-discover\discover-repos.ps1'
              arguments: '-ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            condition: ne('${{ parameters.migrationType }}', 'reclaim')
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PowerShell@2
            displayName: "1.2 Audit Repo Sizes"
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\01-discover\audit-repo-sizes.ps1'
              arguments: '-ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"'
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            condition: ne('${{ parameters.migrationType }}', 'reclaim')
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Discovery Reports"
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "discovery-reports"
              publishLocation: pipeline
            condition: always()

          - task: PublishHtmlReport@1
            displayName: "Show Discovery Report on Pipeline Tab"
            condition: always()
            continueOnError: true
            inputs:
              reportDir: '$(Build.SourcesDirectory)\repo-migration\output\reports\repo-inventory.html'
              tabName: "Discovery Report"

      - job: ScanSecrets
        displayName: "1.3 Scan Secrets (gitleaks)"
        dependsOn: DiscoverAndAudit
        condition: and(succeeded(), eq('${{ parameters.SkipSecretScan }}', false), ne('${{ parameters.migrationType }}', 'reclaim'))
        strategy:
          maxParallel: 3
          matrix:
            Batch0:
              BATCH_INDEX: 0
              BATCH_TOTAL: 3
            Batch1:
              BATCH_INDEX: 1
              BATCH_TOTAL: 3
            Batch2:
              BATCH_INDEX: 2
              BATCH_TOTAL: 3
        steps:

          - task: PowerShell@2
            displayName: "Install gitleaks"
            inputs:
              targetType: inline
              script: |
                Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_windows_x64.zip" -OutFile gitleaks.zip
                Expand-Archive -Path gitleaks.zip -DestinationPath "$env:AGENT_TOOLSDIRECTORY\gitleaks" -Force
                Write-Host "##vso[task.prependpath]$env:AGENT_TOOLSDIRECTORY\gitleaks"
              pwsh: true

          - task: PowerShell@2
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                $cfg = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $c   = Get-Content $cfg -Raw
                $c   = $c -replace '\$\(ADO_ORG\)',     '$(ADO_ORG)'
                $c   = $c -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $c   = $c -replace '\$\(ADO_PAT\)',     '$(ADO_PAT)'
                $c   = $c -replace '\$\(GH_ORG\)',      '$(GH_ORG)'
                $c   = $c -replace '\$\(GH_PAT\)',      '$(GH_PAT)'
                Set-Content -Path $cfg -Value $c
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: DownloadPipelineArtifact@2
            displayName: "Download Discovery Reports"
            inputs:
              artifact: "discovery-reports"
              path: '$(Build.SourcesDirectory)\repo-migration\output\reports'

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                "reports","logs" | ForEach-Object {
                    New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\$_" -Force | Out-Null
                }
              pwsh: true

          - task: PowerShell@2
            displayName: "1.3 Scan Secrets"
            inputs:
              filePath: '$(Build.SourcesDirectory)\repo-migration\01-discover\scan-secrets.ps1'
              arguments: >-
                -ConfigPath "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                -BatchIndex $(BATCH_INDEX) -BatchTotal $(BATCH_TOTAL)
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Scan Reports"
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "scan-reports-batch$(BATCH_INDEX)"
              publishLocation: pipeline
            condition: always()
      
          - task: PublishHtmlReport@1
            displayName: "Show Secret Scan Report on Pipeline Tab"
            condition: always()
            continueOnError: true
            inputs:
              reportDir: '$(Build.SourcesDirectory)\repo-migration\output\reports\secret-scan-report-batch$(BATCH_INDEX).html'
              tabName: "Secret Scan Report"

  # ===========================================================================
  # REPO MIGRATION: STAGE 2 – REVIEW GATE
  # ===========================================================================
  - stage: ReviewGate
    displayName: "2. Review Gate"
    dependsOn: RepoDiscover
    condition: and(succeeded(), in('${{ parameters.migrationType }}', 'repo', 'both'))
    jobs:
      - job: ReviewGateJob
        displayName: "Gate: Review Discovery Findings"
        pool: server
        timeoutInMinutes: 4320
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 4320
            inputs:
              notifyUsers: ""
              instructions: |
                Review the discovery artifacts before proceeding to migration.

                Download and check:
                  discovery-reports/repo-inventory.json
                    → confirm which repos to include / exclude
                    → update config/repo-migration-config.json batches and exclusions

                  discovery-reports/repo-sizes.json
                    → any repo flagged OVER_LIMIT (> 40 GiB) must be remediated first

                  scan-reports-batch*/secret-scan-findings.json
                    → MANDATORY for regulated environment
                    → Critical/High findings must be remediated before migration
                    → if zero findings: safe to proceed
                    → if findings exist: scrub history first (scrub-secrets.ps1)
                    → (Note: skipped if SkipSecretScan was set to true)

                Populate config/user-mappings.csv with ADO→GitHub username mappings.

                Approve to proceed to migration, or Reject to abort.
              onTimeout: reject

  # ===========================================================================
  # REPO MIGRATION: STAGE 3A – SINGLE REPO MIGRATION
  # ===========================================================================
  - stage: MigrateSingle
    displayName: "3a. Migrate (Single Repo)"
    dependsOn: ReviewGate
    condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Single'), in('${{ parameters.migrationType }}', 'repo', 'both'))
    pool:
      vmImage: windows-latest
    jobs:
      - job: MigrateSingleRepo
        displayName: "Migrate ${{ parameters.ADORepo }}"
        timeoutInMinutes: 180
        steps:

          - task: PowerShell@2
            displayName: "Install GitHub CLI + ado2gh extension"
            inputs:
              targetType: inline
              script: |
                # Portable zip install — no elevation required on self-hosted agents
                $ghDir = "$env:AGENT_TOOLSDIRECTORY\gh"
                if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
                    Write-Host "Installing GitHub CLI (portable zip)..."
                    Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v2.52.0/gh_2.52.0_windows_amd64.zip" -OutFile gh.zip
                    Expand-Archive -Path gh.zip -DestinationPath $ghDir -Force
                    $ghBin = (Get-ChildItem -Path $ghDir -Recurse -Filter gh.exe | Select-Object -First 1).DirectoryName
                    Write-Host "##vso[task.prependpath]$ghBin"
                    $env:PATH = "$ghBin;$env:PATH"
                }
                gh --version

                # Authenticate gh CLI before installing extensions
                $env:GH_TOKEN = "$(GH_PAT)"
                echo $env:GH_TOKEN | gh auth login --with-token
               
                gh auth status

                gh extension install github/gh-ado2gh 2>&1 | Where-Object { $_ -notmatch 'already installed' }
                gh extension upgrade ado2gh
                gh extension list
              pwsh: true
            env:
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                "reports","logs","audit","dashboard","tmp" | ForEach-Object {
                    New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\$_" -Force | Out-Null
                }
              pwsh: true

          - task: PowerShell@2
            displayName: "Migrate Single Repo"
            inputs:
              targetType: inline
              script: |
                $adoRepo = '${{ parameters.ADORepo }}'.Trim()
                $ghRepo  = '${{ parameters.GHRepo }}'.Trim()
                if ([string]::IsNullOrWhiteSpace($ghRepo)) { $ghRepo = $adoRepo }

                # Read target visibility from config
                $cfgPath = '$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json'
                $visibility = 'private'
                if (Test-Path $cfgPath) {
                    $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
                    if ($cfg.migration.targetRepoVisibility) {
                        $visibility = $cfg.migration.targetRepoVisibility
                    }
                }

                $params = @{
                    ADOOrg     = '$(ADO_ORG)'.Trim()
                    ADOProject = '$(ADO_PROJECT)'.Trim()
                    ADORepo    = $adoRepo
                    GHOrg      = '$(GH_ORG)'.Trim()
                    GHRepo     = $ghRepo
                    OutputDir  = '$(Build.SourcesDirectory)\repo-migration\output'
                    TargetRepoVisibility = $visibility
                }
                if ('${{ parameters.SkipAudit }}' -eq 'True') { $params['SkipAudit'] = $true }
                if ('${{ parameters.DryRun }}'    -eq 'True') { $params['DryRun']    = $true }
                & '$(Build.SourcesDirectory)\repo-migration\03-migrate\migrate-single.ps1' @params
                Write-Host "##vso[task.setvariable variable=RESOLVED_REPO]$ghRepo"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT:   $(ADO_PAT)
              GH_PAT:    $(GH_PAT)
              GH_TOKEN:  $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Migration Logs"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\logs'
              artifact: "MigrationLogs-${{ parameters.ADORepo }}"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Audit Data"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\audit'
              artifact: "MigrationAudit-${{ parameters.ADORepo }}"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish HTML Dashboard"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\dashboard'
              artifact: "MigrationDashboard-${{ parameters.ADORepo }}"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Show HTML on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)\repo-migration\output\dashboard\$(RESOLVED_REPO)'
              tabName: "Migration Report"

  # ===========================================================================
  # REPO MIGRATION: STAGE 3B – BATCH REPO MIGRATION
  # ===========================================================================
  - stage: MigrateBatch
    displayName: "3b. Migrate (Batch)"
    dependsOn: ReviewGate
    condition: and(succeeded(), eq('${{ parameters.MigrationMode }}', 'Batch'), in('${{ parameters.migrationType }}', 'repo', 'both'))
    pool:
      vmImage: windows-latest
    jobs:
      - job: MigrateBatchRepos
        displayName: "Migrate Batch"
        timeoutInMinutes: 480
        steps:

          - task: PowerShell@2
            displayName: "Install GitHub CLI + ado2gh extension"
            inputs:
              targetType: inline
              script: |
                # Portable zip install — no elevation required on self-hosted agents
                $ghDir = "$env:AGENT_TOOLSDIRECTORY\gh"
                if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
                    Write-Host "Installing GitHub CLI (portable zip)..."
                    Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v2.52.0/gh_2.52.0_windows_amd64.zip" -OutFile gh.zip
                    Expand-Archive -Path gh.zip -DestinationPath $ghDir -Force
                    $ghBin = (Get-ChildItem -Path $ghDir -Recurse -Filter gh.exe | Select-Object -First 1).DirectoryName
                    Write-Host "##vso[task.prependpath]$ghBin"
                    $env:PATH = "$ghBin;$env:PATH"
                }
                gh --version

                # Authenticate gh CLI before installing extensions
                $env:GH_TOKEN = "$(GH_PAT)"
                "$(GH_PAT)" | gh auth login --with-token
                gh auth status

                gh extension install github/gh-ado2gh 2>&1 | Where-Object { $_ -notmatch 'already installed' }
                gh extension list
              pwsh: true
            env:
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                $cfg = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $c   = Get-Content $cfg -Raw
                $c   = $c -replace '\$\(ADO_ORG\)',     '$(ADO_ORG)'
                $c   = $c -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $c   = $c -replace '\$\(ADO_PAT\)',     '$(ADO_PAT)'
                $c   = $c -replace '\$\(GH_ORG\)',      '$(GH_ORG)'
                $c   = $c -replace '\$\(GH_PAT\)',      '$(GH_PAT)'
                Set-Content -Path $cfg -Value $c
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                "reports","logs","audit","dashboard","tmp" | ForEach-Object {
                    New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\$_" -Force | Out-Null
                }
              pwsh: true

          - task: PowerShell@2
            displayName: "Migrate Batch Repos"
            inputs:
              targetType: inline
              script: |
                $params = @{
                    ADOOrg      = '$(ADO_ORG)'
                    ADOProject  = '$(ADO_PROJECT)'
                    GHOrg       = '$(GH_ORG)'
                    ConfigPath  = '$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json'
                    BatchName   = '${{ parameters.BatchName }}'
                    OutputDir   = '$(Build.SourcesDirectory)\repo-migration\output'
                    MaxParallel = 3
                }
                if ('${{ parameters.SkipAudit }}' -eq 'True') { $params['SkipAudit'] = $true }
                if ('${{ parameters.DryRun }}'    -eq 'True') { $params['DryRun']    = $true }
                & '$(Build.SourcesDirectory)\repo-migration\03-migrate\migrate-batch.ps1' @params
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT:  $(ADO_PAT)
              GH_PAT:   $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Migration Logs"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\logs'
              artifact: "BatchMigrationLogs"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Audit Data"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\audit'
              artifact: "BatchMigrationAudit"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Dashboards"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\dashboard'
              artifact: "BatchMigrationDashboards"
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: "Publish Batch Summary"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "BatchMigrationReports"
              publishLocation: pipeline

  # ===========================================================================
  # REPO MIGRATION: STAGE 4 – VALIDATE
  # ===========================================================================
  - stage: Validate
    displayName: "4. Validate Migration"
    dependsOn:
      - MigrateSingle
      - MigrateBatch
    condition: |
      and(
        in('${{ parameters.migrationType }}', 'repo', 'both'),
        eq('${{ parameters.RunValidation }}', true),
        or(
          eq(dependencies.MigrateSingle.result, 'Succeeded'),
          eq(dependencies.MigrateSingle.result, 'SucceededWithIssues'),
          eq(dependencies.MigrateBatch.result, 'Succeeded'),
          eq(dependencies.MigrateBatch.result, 'SucceededWithIssues')
        )
      )
    pool:
      vmImage: windows-latest
    jobs:
      - job: ValidateRepos
        displayName: "4.1 Validate Migrated Repos"
        timeoutInMinutes: 60
        steps:

          - task: PowerShell@2
            displayName: "Replace config tokens"
            inputs:
              targetType: inline
              script: |
                $cfg = "$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json"
                $c   = Get-Content $cfg -Raw
                $c   = $c -replace '\$\(ADO_ORG\)',     '$(ADO_ORG)'
                $c   = $c -replace '\$\(ADO_PROJECT\)', '$(ADO_PROJECT)'
                $c   = $c -replace '\$\(ADO_PAT\)',     '$(ADO_PAT)'
                $c   = $c -replace '\$\(GH_ORG\)',      '$(GH_ORG)'
                $c   = $c -replace '\$\(GH_PAT\)',      '$(GH_PAT)'
                Set-Content -Path $cfg -Value $c
              pwsh: true
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\reports" -Force | Out-Null
              pwsh: true

          # Download migration artifacts to get audit data + batch summary
          - task: DownloadPipelineArtifact@2
            displayName: "Download Migration Reports (Single)"
            condition: eq('${{ parameters.MigrationMode }}', 'Single')
            continueOnError: true
            inputs:
              artifact: "MigrationAudit-${{ parameters.ADORepo }}"
              path: '$(Build.SourcesDirectory)\repo-migration\output\audit'

          - task: DownloadPipelineArtifact@2
            displayName: "Download Batch Audit Data"
            condition: eq('${{ parameters.MigrationMode }}', 'Batch')
            continueOnError: true
            inputs:
              artifact: "BatchMigrationAudit"
              path: '$(Build.SourcesDirectory)\repo-migration\output\audit'

          - task: DownloadPipelineArtifact@2
            displayName: "Download Batch Reports (for batch-migration-summary.json)"
            condition: eq('${{ parameters.MigrationMode }}', 'Batch')
            continueOnError: true
            inputs:
              artifact: "BatchMigrationReports"
              path: '$(Build.SourcesDirectory)\repo-migration\output\reports'

          # Download migration dashboards for HTML tab
          - task: DownloadPipelineArtifact@2
            displayName: "Download Migration Dashboard (Single)"
            condition: eq('${{ parameters.MigrationMode }}', 'Single')
            continueOnError: true
            inputs:
              artifact: "MigrationDashboard-${{ parameters.ADORepo }}"
              path: '$(Build.SourcesDirectory)\repo-migration\output\dashboard'

          - task: DownloadPipelineArtifact@2
            displayName: "Download Migration Dashboards (Batch)"
            condition: eq('${{ parameters.MigrationMode }}', 'Batch')
            continueOnError: true
            inputs:
              artifact: "BatchMigrationDashboards"
              path: '$(Build.SourcesDirectory)\repo-migration\output\dashboard'

          # Single mode — validate one repo
          - task: PowerShell@2
            displayName: "4.1 Validate Single Repo"
            condition: eq('${{ parameters.MigrationMode }}', 'Single')
            continueOnError: true
            inputs:
              targetType: inline
              script: |
                $adoRepo = '${{ parameters.ADORepo }}'.Trim()
                $ghRepo  = '${{ parameters.GHRepo }}'.Trim()
                if ([string]::IsNullOrWhiteSpace($ghRepo)) { $ghRepo = $adoRepo }

                # Read target visibility from config
                $cfgPath = '$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json'
                $visibility = 'private'
                if (Test-Path $cfgPath) {
                    $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
                    if ($cfg.migration.targetRepoVisibility) {
                        $visibility = $cfg.migration.targetRepoVisibility
                    }
                }

                & '$(Build.SourcesDirectory)\repo-migration\04-validate\validate-migration.ps1' `
                    -ADOOrg     '$(ADO_ORG)' `
                    -ADOProject '$(ADO_PROJECT)' `
                    -GHOrg      '$(GH_ORG)' `
                    -GHRepo     $ghRepo `
                    -ADORepo    $adoRepo `
                    -OutputDir  '$(Build.SourcesDirectory)\repo-migration\output' `
                    -ExpectedVisibility $visibility
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          # Batch mode — validate all repos from batch summary
          - task: PowerShell@2
            displayName: "4.1 Validate Batch Repos"
            condition: eq('${{ parameters.MigrationMode }}', 'Batch')
            continueOnError: true
            inputs:
              targetType: inline
              script: |
                # Read target visibility from config
                $cfgPath = '$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json'
                $visibility = 'private'
                if (Test-Path $cfgPath) {
                    $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
                    if ($cfg.migration.targetRepoVisibility) {
                        $visibility = $cfg.migration.targetRepoVisibility
                    }
                }

                & '$(Build.SourcesDirectory)\repo-migration\04-validate\validate-migration.ps1' `
                    -ADOOrg     '$(ADO_ORG)' `
                    -ADOProject '$(ADO_PROJECT)' `
                    -GHOrg      '$(GH_ORG)' `
                    -OutputDir  '$(Build.SourcesDirectory)\repo-migration\output' `
                    -ExpectedVisibility $visibility
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)\repo-migration'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT:  $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Validation Reports"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "ValidationReports"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Show Validation Report on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)\repo-migration\output\reports\validation-report.html'
              tabName: "Validation Report"

          - task: PowerShell@2
            displayName: "Prepare Migration Report for HTML Tab"
            condition: always()
            inputs:
              targetType: inline
              script: |
                $src = "$(Build.SourcesDirectory)\repo-migration\output\dashboard"

                # For Single mode: use pipeline parameters
                $adoRepo = '${{ parameters.ADORepo }}'.Trim()
                $ghRepo  = '${{ parameters.GHRepo }}'.Trim()
                if ([string]::IsNullOrWhiteSpace($ghRepo)) { $ghRepo = $adoRepo }
                $singleFile = "$src\$ghRepo\migration-report-$ghRepo.html"

                if (Test-Path $singleFile) {
                    Write-Host "Single mode — using: $singleFile"
                    Write-Host "##vso[task.setvariable variable=MIGRATION_REPORT_PATH]$singleFile"
                }
                else {
                    # Batch mode or Single file not found — find all HTML files
                    $htmlFiles = @(Get-ChildItem -Path $src -Recurse -Filter "*.html" -ErrorAction SilentlyContinue)
                    Write-Host "Found $($htmlFiles.Count) HTML file(s) in dashboard"
                    if ($htmlFiles.Count -eq 1) {
                        Write-Host "Using: $($htmlFiles[0].FullName)"
                        Write-Host "##vso[task.setvariable variable=MIGRATION_REPORT_PATH]$($htmlFiles[0].FullName)"
                    }
                    elseif ($htmlFiles.Count -gt 1) {
                        $dst = "$src\combined-migration-report.html"
                        $combined = "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Migration Reports</title></head><body>"
                        foreach ($f in $htmlFiles) {
                            $content = Get-Content $f.FullName -Raw -Encoding utf8
                            $content = $content -replace '<!DOCTYPE[^>]*>', '' -replace '</?html[^>]*>', '' -replace '<head>.*?</head>', '' -replace '</?body[^>]*>', ''
                            $combined += "<div style='border-bottom:4px solid #0d1117;margin-bottom:40px;padding-bottom:40px;'>$content</div>"
                            Write-Host "  Merged: $($f.Name)"
                        }
                        $combined += "</body></html>"
                        $combined | Out-File $dst -Encoding utf8
                        Write-Host "##vso[task.setvariable variable=MIGRATION_REPORT_PATH]$dst"
                    }
                    else {
                        Write-Warning "No migration HTML files found"
                        Write-Host "##vso[task.setvariable variable=MIGRATION_REPORT_PATH]"
                    }
                }
              pwsh: true

          - task: PublishHtmlReport@1
            displayName: "Show Migration Report on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(MIGRATION_REPORT_PATH)'
              tabName: "Migration Report"

          - task: PowerShell@2
            displayName: "Publish Validation Summary to ADO Tab"
            condition: always()
            inputs:
              targetType: inline
              script: |
                $valSummary = "$(Build.SourcesDirectory)\repo-migration\output\reports\validation-summary.md"
                if (Test-Path $valSummary) {
                    Write-Host "##vso[task.uploadsummary]$valSummary"
                } else { Write-Warning "Validation summary not found: $valSummary" }
              pwsh: true

  # ===========================================================================
  # REPO MIGRATION: STAGE 5 – RECLAIM MANNEQUINS
  # ===========================================================================
  - stage: ListMannequins
    displayName: "5. List Mannequins"
    dependsOn: 
      - RepoDiscover
      - Validate
    condition: |
      and(
        in('${{ parameters.migrationType }}', 'repo', 'both', 'reclaim'),
        ne('${{ parameters.ReclaimMode }}', 'Skip'),
        or(
          in(dependencies.Validate.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
          eq('${{ parameters.migrationType }}', 'reclaim')
        )
      )
    pool:
      vmImage: windows-latest
    jobs:
      - job: ListAndPreview
        displayName: "List Mannequins & Preview Mappings"
        timeoutInMinutes: 30
        steps:
          - checkout: self

          - task: PowerShell@2
            displayName: "Install GitHub CLI + GEI extension"
            inputs:
              targetType: inline
              script: |
                $ghDir = "$env:AGENT_TOOLSDIRECTORY\gh"
                if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
                    Write-Host "Installing GitHub CLI..."
                    Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v2.52.0/gh_2.52.0_windows_amd64.zip" -OutFile gh.zip
                    Expand-Archive -Path gh.zip -DestinationPath $ghDir -Force
                    $ghBin = (Get-ChildItem -Path $ghDir -Recurse -Filter gh.exe | Select-Object -First 1).DirectoryName
                    Write-Host "##vso[task.prependpath]$ghBin"
                    $env:PATH = "$ghBin;$env:PATH"
                }
                gh --version
                $env:GH_TOKEN = "$(GH_PAT)"
                gh auth status
                gh extension install github/gh-ado2gh 2>&1 | Where-Object { $_ -notmatch 'already installed' }
                gh extension upgrade ado2gh
              pwsh: true
            env:
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Ensure output directories"
            inputs:
              targetType: inline
              script: |
                New-Item -ItemType Directory -Path "$(Build.SourcesDirectory)\repo-migration\output\reports" -Force | Out-Null
              pwsh: true

          - task: PowerShell@2
            displayName: "List Mannequins & Preview Mappings"
            inputs:
              targetType: inline
              script: |
                $ghOrg     = '$(GH_ORG)'
                $reportDir = '$(Build.SourcesDirectory)\repo-migration\output\reports'

                Write-Host "=== Fetching Mannequins from $ghOrg ===" -ForegroundColor Cyan
                $mannequinCsv = "$reportDir\mannequins.csv"
                
                gh ado2gh generate-mannequin-csv --github-org $ghOrg --output $mannequinCsv 2>&1 | ForEach-Object { Write-Host "  $_" }

                if (-not (Test-Path $mannequinCsv)) {
                    Write-Warning "File not generated: $mannequinCsv"
                    exit 0
                }

                $mannequins = @(Import-Csv $mannequinCsv -Header "m_user","m_id","m_target" | Select-Object -Skip 1)
                Write-Host "Total mannequins found: $($mannequins.Count)"

                $mappingPath = '$(Build.SourcesDirectory)\repo-migration\config\user-mappings.csv'
                if (-not (Test-Path $mappingPath)) {
                    Write-Warning "user-mappings.csv not found at $mappingPath"
                    $mappings = @()
                } else {
                    $rawMappings = Get-Content $mappingPath
                    $firstDataLine = 0
                    for ($i=0; $i -lt $rawMappings.Count; $i++) {
                        if (-not [string]::IsNullOrWhiteSpace($rawMappings[$i])) {
                            $firstDataLine = $i
                            break
                        }
                    }
                    $mappings = $rawMappings | Select-Object -Skip $firstDataLine | ConvertFrom-Csv
                }

                $preview = @()
                foreach ($m in $mannequins) {
                    $login = if ($m.m_user) { $m.m_user.Trim() } else { "" }
                    $mId   = if ($m.m_id) { $m.m_id.Trim() } else { "" }
                    if ([string]::IsNullOrWhiteSpace($login)) { continue }

                    $match = $mappings | Where-Object {
                        ([string]::IsNullOrEmpty($_.ADOEmail) ? $false : ($_.ADOEmail.Trim() -eq $login)) -or
                        ([string]::IsNullOrEmpty($_.ADOUsername) ? $false : ($_.ADOUsername.Trim() -eq $login)) -or
                        ([string]::IsNullOrEmpty($_.ADODisplayName) ? $false : ($_.ADODisplayName.Trim() -eq $login))
                    } | Select-Object -First 1

                    $preview += [PSCustomObject]@{
                        Mannequin    = $login
                        MannequinId  = $mId
                        MappedTo     = if ($match) { $match.GitHubUsername } else { "*** NO MAPPING ***" }
                    }
                }

                $preview | Export-Csv "$reportDir\mannequin-mapping-preview.csv" -NoTypeInformation -Encoding utf8

                $reclaimRows = @()
                foreach ($p in $preview) {
                    if ($p.MappedTo -ne "*** NO MAPPING ***") {
                        $reclaimRows += [PSCustomObject]@{
                            'mannequin-user' = $p.Mannequin
                            'mannequin-id'   = $p.MannequinId
                            'target-user'    = $p.MappedTo
                        }
                    }
                }

                if ($reclaimRows.Count -gt 0) {
                    $csvLines = @("mannequin-user,mannequin-id,target-user")
                    foreach ($r in $reclaimRows) {
                        $csvLines += "$($r.'mannequin-user'),$($r.'mannequin-id'),$($r.'target-user')"
                    }
                    $csvLines | Out-File "$reportDir\reclaim-input.csv" -Encoding utf8
                }

                $md  = "# Mannequin Reclaim Preview`n`n| Mannequin | Mapped To |`n|---|---|`n"
                foreach ($p in $preview) {
                    $status = if ($p.MappedTo -eq "*** NO MAPPING ***") { "❌" } else { "✅ $($p.MappedTo)" }
                    $md += "| $($p.Mannequin) | $status |`n"
                }
                $md | Out-File "$reportDir\mannequin-preview.md" -Encoding utf8
                Write-Host "##vso[task.uploadsummary]$reportDir\mannequin-preview.md"
              pwsh: true
            env:
              GH_TOKEN: $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Mannequin Reports"
            inputs:
              targetPath: '$(Build.SourcesDirectory)\repo-migration\output\reports'
              artifact: "MannequinReports"
              publishLocation: pipeline

  # ===========================================================================
  # REPO MIGRATION: STAGE 6 – REVIEW GATE
  # ===========================================================================
  - stage: ReclaimReviewGate
    displayName: "6. Review Mannequin Mappings"
    dependsOn: ListMannequins
    condition: and(succeeded(), eq('${{ parameters.ReclaimMode }}', 'Execute'))
    jobs:
      - job: ReviewMappings
        displayName: "Gate: Review Mannequin Mappings"
        pool: server
        steps:
          - task: ManualValidation@0
            inputs:
              notifyUsers: ""
              instructions: |
                Review the mannequin mapping preview in the pipeline summary tab.
                Approve to send reclaim invitations to GitHub users.

  # ===========================================================================
  # REPO MIGRATION: STAGE 7 – RECLAIM MANNEQUINS
  # ===========================================================================
  - stage: ReclaimMannequins
    displayName: "7. Reclaim Mannequins"
    dependsOn: ReclaimReviewGate
    condition: succeeded()
    pool:
      vmImage: windows-latest
    jobs:
      - job: Reclaim
        displayName: "Send Reclaim Invitations"
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: "MannequinReports"
              path: '$(Build.SourcesDirectory)\repo-migration\output\reports'

          - task: PowerShell@2
            displayName: "Reclaim Mannequins"
            inputs:
              targetType: inline
              script: |
                $ghOrg = '$(GH_ORG)'
                $reclaimCsv = "$(Build.SourcesDirectory)\repo-migration\output\reports\reclaim-input.csv"
                if (-not (Test-Path $reclaimCsv)) {
                    Write-Warning "No reclaim-input.csv found."
                    exit 0
                }
                $env:GH_TOKEN = "$(GH_PAT)"
                gh ado2gh reclaim-mannequin --github-org $ghOrg --csv $reclaimCsv --force
              pwsh: true
            env:
              GH_TOKEN: $(GH_PAT)
