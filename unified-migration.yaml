name: $(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: migrationScope
    displayName: Migration Scope
    type: string
    default: 'Both'
    values:
      - 'Repo Only'
      - 'Pipeline Only'
      - 'Both'
  - name: executionMode
    displayName: Execution Mode
    type: string
    default: 'dry-run'
    values:
      - 'audit'
      - 'dry-run'
      - 'migrate'
  - name: batchName
    displayName: Batch Name (for Repos)
    type: string
    default: 'batch-1-pilot'
  - name: adoProject
    displayName: ADO Project (for Pipelines)
    type: string
    default: 'ProjectA'
  - name: runSecretScan
    displayName: Run Secret Scan?
    type: boolean
    default: true
  - name: runValidation
    displayName: Run Validation & Reclaim?
    type: boolean
    default: true

variables:
  - group: migration-secrets # Expects ADO_PAT and GH_PAT
  - name: repoConfigPath
    value: '$(Build.SourcesDirectory)\repo-migration\config\repo-migration-config.json'
  - name: pipelineConfigPath
    value: '$(Build.SourcesDirectory)\migration-accelerator\config\migration-config.json'

stages:
  - stage: Discovery
    displayName: '1. Discovery & Audit'
    jobs:
      # REPO DISCOVERY (Windows)
      - job: AuditRepos
        displayName: 'Audit Repos (Windows)'
        pool:
          vmImage: 'windows-latest'
        condition: ne('${{ parameters.migrationScope }}', 'Pipeline Only')
        steps:
          - powershell: .\migration-accelerator\01-prep\install-tools.ps1
            displayName: 'Install Repo Tools'
            env: { ADO_PAT: $(ADO_PAT), GH_PAT: $(GH_PAT) }
          - powershell: |
              .\repo-migration\01-discover\discover-repos.ps1 -ConfigPath $(repoConfigPath)
              .\repo-migration\01-discover\audit-repo-sizes.ps1 -ConfigPath $(repoConfigPath)
              if ("${{ parameters.runSecretScan }}" -eq "True") {
                .\repo-migration\01-discover\scan-secrets.ps1 -ConfigPath $(repoConfigPath)
              }
            displayName: 'Discover & Audit Repos'
            env: { ADO_PAT: $(ADO_PAT), GH_PAT: $(GH_PAT) }
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Repo Audit Reports'
            condition: always()
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)/reports'
              ArtifactName: 'RepoAuditReports'

      # PIPELINE DISCOVERY (Ubuntu)
      - job: AuditPipelines
        displayName: 'Audit Pipelines (Ubuntu)'
        pool:
          vmImage: 'ubuntu-latest'
        condition: ne('${{ parameters.migrationScope }}', 'Repo Only')
        steps:
          - pwsh: |
              gh extension install github/gh-actions-importer --force
              $config = Get-Content $(pipelineConfigPath) | ConvertFrom-Json
              $adoOrg = $config.source.organization -replace "https://dev.azure.com/", ""
              .\migration-accelerator\00-discovery\audit-pipelines.ps1 -AdoOrg $adoOrg -AdoPat $(ADO_PAT) -GitHubPat $(GH_PAT)
            displayName: 'Audit Pipelines'
            env: { ADO_PAT: $(ADO_PAT), GH_PAT: $(GH_PAT) }
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Pipeline Audit Reports'
            condition: always()
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)/output/pipelines'
              ArtifactName: 'PipelineAuditReports'

  - stage: Migration
    displayName: '2. Execute Migration'
    dependsOn: Discovery
    jobs:
      # REPO MIGRATION (Windows)
      - job: MigrateRepos
        displayName: 'Migrate Repos (Windows)'
        pool:
          vmImage: 'windows-latest'
        condition: and(succeeded(), ne('${{ parameters.migrationScope }}', 'Pipeline Only'))
        steps:
          - powershell: |
              $params = @{ ConfigPath = "$(repoConfigPath)"; BatchName = "${{ parameters.batchName }}" }
              if ("${{ parameters.executionMode }}" -eq "dry-run") { $params.DryRun = $true }
              .\repo-migration\03-migrate\migrate-repos.ps1 @params
            displayName: 'Execute Repo Migration'
            env: { ADO_PAT: $(ADO_PAT), GH_PAT: $(GH_PAT) }
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Repo Migration Logs'
            condition: always()
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)/logs'
              ArtifactName: 'RepoMigrationLogs'

      # PIPELINE MIGRATION (Ubuntu)
      - job: MigratePipelines
        displayName: 'Migrate Pipelines (Ubuntu)'
        pool:
          vmImage: 'ubuntu-latest'
        condition: and(succeeded(), ne('${{ parameters.migrationScope }}', 'Repo Only'))
        steps:
          - pwsh: |
              gh extension install github/gh-actions-importer --force
              .\migration-accelerator\02-migrate\migrate-pipelines.ps1 -ConfigFile $(pipelineConfigPath) -AdoProject "${{ parameters.adoProject }}" -Mode "${{ parameters.executionMode }}"
            displayName: 'Execute Pipeline Migration'
            env: { ADO_PAT: $(ADO_PAT), GH_PAT: $(GH_PAT) }
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Pipeline Migration Results'
            condition: always()
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)/output/pipelines'
              ArtifactName: 'PipelineMigrationResults'

  - stage: PostMigration
    displayName: '3. Validation & User Reclaim'
    dependsOn: Migration
    condition: and(succeeded(), ne('${{ parameters.executionMode }}', 'dry-run'), eq('${{ parameters.runValidation }}', 'True'))
    jobs:
      - job: Validate
        displayName: 'Validation (Windows)'
        pool:
          vmImage: 'windows-latest'
        steps:
          - powershell: |
              .\repo-migration\04-validate\validate-repos.ps1 -ConfigPath $(repoConfigPath)
              .\repo-migration\04-validate\reclaim-mannequins.ps1 -ConfigPath $(repoConfigPath)
            displayName: 'Validate & Reclaim'
            env: { ADO_PAT: $(ADO_PAT), GH_PAT: $(GH_PAT) }
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Validation Results'
            condition: always()
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)/reports'
              ArtifactName: 'ValidationResults'
