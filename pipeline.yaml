trigger: none

pool:
  vmImage: 'windows-latest'

variables:
  - group: 'metadata'

steps:
  - task: PowerShell@2
    displayName: 'Install ImportExcel Module'
    inputs:
      targetType: inline
      script: |
        Install-Module -Name ImportExcel -Scope CurrentUser -Force -AllowClobber

  - task: PowerShell@2
    displayName: 'Run ADO Metadata Extraction'
    inputs:
      targetType: inline
      script: |
        $scriptPath = Join-Path "$(Build.SourcesDirectory)" "metadata.ps1"

        if (-not (Test-Path $scriptPath)) {
          Write-Error "metadata.ps1 not found at: $scriptPath"
          exit 1
        }

        $outDir = Join-Path "$(Build.ArtifactStagingDirectory)" "ADO-Export"

        $inputFile = Join-Path $env:TEMP "menu_inputs.txt"
        @("1","1","0","0") | Out-File -FilePath $inputFile -Encoding ascii

        $proc = Start-Process -FilePath "powershell.exe" `
          -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$scriptPath`" -OrgUrl `"$(ADO_ORG_URL)`" -Project `"$(ADO_PROJECT)`" -OutputDir `"$outDir`"" `
          -RedirectStandardInput $inputFile `
          -NoNewWindow -Wait -PassThru

        exit $proc.ExitCode
    env:
      AZURE_DEVOPS_EXT_PAT: $(AZURE_DEVOPS_EXT_PAT)

  - publish: '$(Build.ArtifactStagingDirectory)/ADO-Export'
    artifact: 'ADO-Metadata'
    displayName: 'Publish Excel Reports'
