# 100% Variable Group Driven - No hardcoded URLs
trigger: none

pool:
  vmImage: 'windows-latest'

variables:
  - group: setup-github-org # All values (ADO_ORG_URL, GH_ORG_NAME, ADO_PAT, GH_PAT) are here

jobs:
- job: AutoSyncTeams
  displayName: 'Automated Team & Access Synchronization'
  steps:

  # Step 1: Auto-generate the config JSON
  - task: PowerShell@2
    displayName: 'Step 1: Auto-Generate Team Mappings'
    inputs:
      targetType: 'filePath'
      filePath: 'migration-accelerator/01-prep/export-ado-full-config.ps1'
      arguments: >
        -AdoOrgUrl "$(ADO_Org)"
        -AdoPat "$(ADO_PAT)"
        -UserMappingFile "$(Build.SourcesDirectory)/config/user-mappings.csv"
        -OutputFile "$(Build.ArtifactStagingDirectory)/team-mappings.json"

