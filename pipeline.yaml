# 100% Variable Group Driven - No hardcoded URLs
trigger: none

pool:
  vmImage: 'windows-latest'

variables:
  - group: setup-github-org # ADO_Org, ADO_PAT, GH_ORG_NAME, GH_PAT are stored here

jobs:
- job: AutoSyncTeams
  displayName: 'Automated Team & Access Synchronization'
  steps:

  # Step 1: Discover everything from ADO and generate the JSON
  - task: PowerShell@2
    displayName: 'Step 1: Auto-Generate Team Mappings'
    inputs:
      targetType: 'filePath'
      filePath: 'migration-accelerator/01-prep/export-ado-full-config.ps1'
      arguments: >
        -AdoOrgUrl "$(ADO_Org)"
        -AdoPat "$(ADO_PAT)"
        -UserMappingFile "$(Build.SourcesDirectory)/config/user-mappings.csv"
        -OutputFile "$(Build.ArtifactStagingDirectory)/automated-team-mappings.json"

  # Step 2: Push the discovered teams and permissions to GitHub
  - task: PowerShell@2
    displayName: 'Step 2: Sync to GitHub'
    inputs:
      targetType: 'filePath'
      filePath: 'migration-accelerator/01-prep/team.ps1'
      arguments: >
        -GitHubOrg "$(GH_ORG_NAME)"
        -GitHubPat "$(GH_PAT)"
        -TeamMappingFile "$(Build.ArtifactStagingDirectory)/automated-team-mappings.json"

  # Step 3: Store the generated JSON in ADO Artifacts for you to view/download
  - task: PublishBuildArtifacts@1
    displayName: 'Step 3: Save Discovery JSON to Artifacts'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/automated-team-mappings.json'
      ArtifactName: 'migration-discovery-results'
