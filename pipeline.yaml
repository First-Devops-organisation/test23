trigger: none

pool:
  vmImage: 'windows-latest'

variables:
  - group: 'metadata'

steps:
  - task: PowerShell@2
    displayName: 'Install ImportExcel Module'
    inputs:
      targetType: inline
      script: |
        Install-Module -Name ImportExcel -Scope CurrentUser -Force -AllowClobber

  - task: PowerShell@2
    displayName: 'Run ADO Metadata Extraction'
    inputs:
      targetType: inline
      script: |
        # Find the script wherever it is in the repo
        $scriptPath = Get-ChildItem -Path "$(Build.SourcesDirectory)" -Filter "ADO-Metadata-Tool.ps1" -Recurse | Select-Object -First 1 -ExpandProperty FullName

        if (-not $scriptPath) {
          Write-Error "ADO-Metadata-Tool.ps1 not found in repo. Check the file name and path."
          exit 1
        }

        Write-Host "Found script at: $scriptPath"

        $outDir = Join-Path "$(Build.ArtifactStagingDirectory)" "ADO-Export"

        "1","1","0","0" | & $scriptPath `
          -OrgUrl "$(ADO_ORG_URL)" `
          -Project "$(ADO_PROJECT)" `
          -OutputDir $outDir
    env:
      AZURE_DEVOPS_EXT_PAT: $(AZURE_DEVOPS_EXT_PAT)

  - publish: '$(Build.ArtifactStagingDirectory)/ADO-Export'
    artifact: 'ADO-Metadata'
    displayName: 'Publish Excel Reports'
