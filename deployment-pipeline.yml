# ==============================================================================
# Multi-Repo Environment Setup -- Azure DevOps Pipeline (Linux/Ubuntu)
# ==============================================================================
# This pipeline reads repos.csv and sets up GitHub environments for ALL repos
# in a single run on an Ubuntu agent. Supports dry-run mode via pipeline variable.
#
# Prerequisites:
#   - Variable group 'environment_set_up' must contain:
#       GH_Org       -- GitHub org name
#       GH_PAT       -- GitHub PAT with repo + environment permissions
#   - repos.csv must be committed to the same repository
# ==============================================================================

trigger: none   # Manual trigger only

parameters:
  - name: DryRun
    displayName: "Dry Run (validate only, no API calls)"
    type: boolean
    default: false

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: environment_set_up

steps:
  - checkout: self
    displayName: "Checkout repository"

  # -- Install gh CLI if not present --
  - script: |
      if ! command -v gh &> /dev/null; then
        echo "Installing GitHub CLI..."
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
        sudo apt-get update && sudo apt-get install gh -y
      fi
      echo "gh version: $(gh --version)"
    displayName: "Ensure gh CLI is installed"

  # -- Validate prerequisites --
  - script: |
      CSV_PATH="$(Build.SourcesDirectory)/repos.csv"
      if [ ! -f "$CSV_PATH" ]; then
        echo "##[error]CSV file not found at: $CSV_PATH"
        exit 1
      fi
      LINE_COUNT=$(grep -v '^\s*#' "$CSV_PATH" | grep -v '^\s*$' | tail -n +2 | wc -l)
      echo "CSV validated: $LINE_COUNT repo-environment configuration(s) found."
    displayName: "Validate CSV file"

  # -- Make script executable and run --
  - script: |
      chmod +x "$(Build.SourcesDirectory)/setup-env-multi.sh"
      mkdir -p "$(Build.SourcesDirectory)/logs"

      DRY_RUN_FLAG=""
      if [ "${{ parameters.DryRun }}" = "True" ]; then
        DRY_RUN_FLAG="--dry-run"
      fi

      "$(Build.SourcesDirectory)/setup-env-multi.sh" \
        --org "$(GH_Org)" \
        --csv "$(Build.SourcesDirectory)/repos.csv" \
        --log "$(Build.SourcesDirectory)/logs/setup-env-multi.log" \
        --retries 2 \
        $DRY_RUN_FLAG
    displayName: "Setup environments for all repos"
    env:
      GH_TOKEN: $(GH_PAT)

  # -- Publish log as pipeline artifact --
  - task: PublishBuildArtifacts@1
    displayName: "Publish setup log"
    condition: always()
    inputs:
      PathtoPublish: "$(Build.SourcesDirectory)/logs"
      ArtifactName: "env-setup-logs"
      publishLocation: "Container"
