trigger: none   # Runs manually only

pool:
  vmImage: 'windows-latest'

variables:
  - name: GH_PAT
    value: $(GitHubPAT)   # Comes from ADO Variable Group or Pipeline Variable

steps:
  - checkout: self

  - task: PowerShell@2
    displayName: 'Run QA Environment Setup Script'
    inputs:
      filePath: '$(Build.SourcesDirectory)/setup-env-qa.ps1'
      
    env:
      GH_TOKEN: $(GH_PAT)
