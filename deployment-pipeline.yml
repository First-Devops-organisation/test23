trigger: none

pool:
  vmImage: 'windows-latest'

variables:
  - group: environment_set_up

steps:
  - checkout: self

  - task: PowerShell@2
    displayName: 'Run QA Environment Setup Script'
    inputs:
      filePath: '$(Build.SourcesDirectory)/setup-env-multi.ps1'
      arguments: >
        -GHOrg "$(GH_Org)"

     
    env:
      GH_TOKEN: $(GH_PAT)
