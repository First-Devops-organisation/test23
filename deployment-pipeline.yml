trigger: none

pool:
  vmImage: 'windows-latest'

variables:
  - group: environment_set_up

steps:
  - checkout: self

  - task: PowerShell@2
    displayName: 'Run QA Environment Setup Script'
    inputs:
      filePath: '$(Build.SourcesDirectory)/setup-env-qa.ps1'
      arguments: >
        -GHOrg "$(GHOrg)"
        -GHRepo "$(GHRepo)"
        -EnvName "$(EnvName)"
        -BranchName "$(BranchName)"
        -ReviewerUsernames $(ReviewerUsernames)
        -WaitTimer $(WaitTimer)
        

    env:
      GH_TOKEN: $(GitHubPAT)
