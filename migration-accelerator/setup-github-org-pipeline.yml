trigger: none

pool:
  vmImage: 'windows-latest'

parameters:
  - name: GitHubOrg
    type: string
    default: 'my-github-org'
  - name: GitHubEnterprise
    type: string
    default: ''

variables:
  # Ensure you map the GH_PAT secret variable in your pipeline configuration
  # - name: GH_PAT
  #   value: $(YOUR_SECRET_GH_PAT)

steps:
- task: PowerShell@2
  displayName: 'Validate and Setup GitHub Organization'
  inputs:
    filePath: '$(System.DefaultWorkingDirectory)/migration-accelerator/01-prep/setup-github-org.ps1'
    arguments: >
      -GitHubOrg "${{ parameters.GitHubOrg }}"
      -GitHubPat "$(GH_PAT)"
      -GitHubEnterprise "${{ parameters.GitHubEnterprise }}"
    pwsh: true
