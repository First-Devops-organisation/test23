trigger: none

pool:
  vmImage: 'windows-latest'

variables:
  - group: 'setup-github-org' # Pulls everything from your Library -> setup-github-org
  # ADO_Project: Optionally set this variable in your Library to target a single project.
  # Leave blank ("") to export all projects in the org.
  # Example: "YASH-DevOps-Serverless"

steps:

# ---------------------------------------------------------------
# STEP 1: Export ADO Teams to a JSON template (Discovery)
# Set ADO_Project variable to target a single project,
# or leave blank to export all projects in the org.
# ---------------------------------------------------------------
- task: PowerShell@2
  displayName: '1. Export ADO Teams (Discovery)'
  inputs:
    filePath: '$(System.DefaultWorkingDirectory)/migration-accelerator/01-prep/export-ado-teams.ps1'
    arguments: >
      -AdoOrgUrl "$(ADO_Org)"
      -AdoPat "$(ADO_PAT)"
      -AdoProject "$(ADO_Project)"
      -UserMappingFile "$(System.DefaultWorkingDirectory)/migration-accelerator/config/user-mappings.csv"
      -OutputFile "$(Build.ArtifactStagingDirectory)/team-mappings-template.json"
    pwsh: true

# ---------------------------------------------------------------
# STEP 2: Publish the generated JSON so you can download & review
# ---------------------------------------------------------------
- task: PublishBuildArtifacts@1
  displayName: '2. Publish Exported Teams JSON'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/team-mappings-template.json'
    ArtifactName: 'team-mappings-template'
    publishLocation: 'Container'

# ---------------------------------------------------------------
# STEP 3: Create & Sync GitHub Teams (Actual Migration)
# Uncomment this step AFTER you have reviewed the exported JSON,
# updated config/team-mappings.json, and committed it to the repo.
# ---------------------------------------------------------------
- task: PowerShell@2
  displayName: '3. Create & Sync GitHub Teams'
  inputs:
    filePath: '$(System.DefaultWorkingDirectory)/migration-accelerator/01-prep/team.ps1'
    arguments: >
      -GitHubOrg "$(GH_Org)"
      -GitHubPat "$(GH_PAT)"
      -AdoOrgUrl "$(ADO_Org)"
      -AdoPat "$(ADO_PAT)"
      -TeamMappingFile "$(System.DefaultWorkingDirectory)/migration-accelerator/config/team-mappings.json"
      -UserMappingFile "$(System.DefaultWorkingDirectory)/migration-accelerator/config/user-mappings.csv"
    pwsh: true