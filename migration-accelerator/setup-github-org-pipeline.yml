trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: 'setup-github-org'  # Pulls ADO_Org, ADO_PAT, GH_Org, GH_PAT from Library

# =================================================================
# MULTI-STAGE PIPELINE WITH MANUAL APPROVAL
# Stage 1: Discovery  → Exports ADO teams to JSON artifact
# Stage 2: Approval   → Manual validation gate (review the export)
# Stage 3: Sync       → Creates GitHub teams from curated config
# =================================================================

stages:

# -----------------------------------------------------------------
# STAGE 1: DISCOVERY — Export ADO Teams
# Fetches all projects, teams, and members from ADO.
# Publishes a JSON template for review.
# -----------------------------------------------------------------
- stage: Discovery
  displayName: '1. Discovery — Export ADO Teams'
  jobs:
  - job: ExportTeams
    displayName: 'Export ADO Teams to JSON'
    steps:
    - script: |
        sudo apt-get update -qq && sudo apt-get install -y -qq jq > /dev/null 2>&1 || true
      displayName: 'Install jq'

    - script: |
        chmod +x "$(System.DefaultWorkingDirectory)/migration-accelerator/01-prep/github-org-setup.sh"
        "$(System.DefaultWorkingDirectory)/migration-accelerator/01-prep/github-org-setup.sh" \
          --stages "discover" \
          --ado-org "$(ADO_Org)" \
          --ado-pat "$(ADO_PAT)" \
          --user-mapping "$(System.DefaultWorkingDirectory)/migration-accelerator/config/user-mappings.csv" \
          --output-dir "$(Build.ArtifactStagingDirectory)"
      displayName: 'Export ADO Teams (Discovery)'
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Exported Teams JSON'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/team-mappings-template.json'
        ArtifactName: 'team-mappings-template'
        publishLocation: 'Container'

# -----------------------------------------------------------------
# STAGE 2: MANUAL APPROVAL — Review Before Sync
# Pipeline PAUSES here until an approver validates the export.
# Uses the 'ManualValidation' task so no Azure Environment needed.
#
# ACTION: Download the artifact from Stage 1, review the teams
#         and members, update config/team-mappings.json if needed,
#         then Resume the pipeline.
# -----------------------------------------------------------------
- stage: Approval
  displayName: '2. Manual Approval — Review Export'
  dependsOn: Discovery
  jobs:
  - job: WaitForApproval
    displayName: 'Wait for Manual Approval'
    pool: server  # Agentless job — runs on Azure DevOps server
    steps:

    - task: ManualValidation@1
      displayName: 'Review exported teams before sync'
      timeoutInMinutes: 4320  # 3 days timeout
      inputs:
        notifyUsers: ''  # Add approver emails here, e.g. 'varsha.patil@yash.com'
        instructions: |
          ╔══════════════════════════════════════════════════════════════╗
          ║   REVIEW REQUIRED BEFORE GITHUB TEAM SYNC                  ║
          ╠══════════════════════════════════════════════════════════════╣
          ║                                                            ║
          ║  1. Download the 'team-mappings-template' artifact         ║
          ║     from the Discovery stage above.                        ║
          ║                                                            ║
          ║  2. Review the exported teams and members.                 ║
          ║     - Are all teams correct?                               ║
          ║     - Are the right members listed?                        ║
          ║     - Are there unmapped users that need attention?        ║
          ║                                                            ║
          ║  3. Update config/team-mappings.json in the repo           ║
          ║     with ONLY the teams and users you want to sync.        ║
          ║                                                            ║
          ║  4. Click 'Resume' to proceed with GitHub sync.            ║
          ║     Click 'Reject' to cancel — no changes will be made.    ║
          ║                                                            ║
          ╚══════════════════════════════════════════════════════════════╝
        onTimeout: 'reject'  # Auto-reject if nobody approves within timeout

# -----------------------------------------------------------------
# STAGE 3: SYNC — Create & Sync GitHub Teams (Config-Driven)
# Runs ONLY after manual approval.
# Reads ONLY from config/team-mappings.json — your curated config.
# Only users listed in the config will receive GitHub invitations.
# -----------------------------------------------------------------
- stage: Sync
  displayName: '3. Sync — Create GitHub Teams'
  dependsOn: Approval
  jobs:
  - job: SyncTeams
    displayName: 'Create & Sync GitHub Teams from Config'
    steps:
    - script: |
        sudo apt-get update -qq && sudo apt-get install -y -qq jq > /dev/null 2>&1 || true
      displayName: 'Install jq'

    - script: |
        chmod +x "$(System.DefaultWorkingDirectory)/migration-accelerator/01-prep/github-org-setup.sh"
        "$(System.DefaultWorkingDirectory)/migration-accelerator/01-prep/github-org-setup.sh" \
          --stages "sync" \
          --gh-org "$(GH_Org)" \
          --gh-pat "$(GH_PAT)"
      displayName: 'Create & Sync GitHub Teams'