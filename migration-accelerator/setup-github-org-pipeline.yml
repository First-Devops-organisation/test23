trigger: none

pool:
  vmImage: 'windows-latest'

variables:
  - group: 'setup-github-org' # Pulls everything from your Library -> setup-github-org

steps:

# ---------------------------------------------------------------
# STEP 1: Export all ADO Teams to a JSON template (Discovery)
# Run this step FIRST to validate your ADO teams before syncing.
# ---------------------------------------------------------------
- task: PowerShell@2
  displayName: '1. Export ADO Teams (Discovery)'
  inputs:
    filePath: '$(System.DefaultWorkingDirectory)/migration-accelerator/01-prep/export-ado-teams.ps1'
    arguments: >
      -AdoOrgUrl "$(ADO_Org)"
      -AdoPat "$(ADO_PAT)"
      -OutputFile "$(Build.ArtifactStagingDirectory)/team-mappings-template.json"
    pwsh: true

# ---------------------------------------------------------------
# STEP 2: Publish the generated JSON so you can download & review
# ---------------------------------------------------------------
- task: PublishBuildArtifacts@1
  displayName: '2. Publish Exported Teams JSON'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/team-mappings-template.json'
    ArtifactName: 'team-mappings-template'
    publishLocation: 'Container'

