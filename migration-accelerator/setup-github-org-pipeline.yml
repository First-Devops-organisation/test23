trigger: none

pool:
  vmImage: 'windows-latest'

variables:
  - group: 'setup-github-org' # <--- CHANGE THIS to the actual name of your Variable Group

steps:
- task: PowerShell@2
  displayName: 'Validate and Setup GitHub Organization'
  inputs:
    filePath: '$(System.DefaultWorkingDirectory)/migration-accelerator/01-prep/setup-github-org.ps1'
    arguments: >
      -GitHubOrg "$(GH_Org)"
      -GitHubPat "$(GH_PAT)"
    pwsh: true
