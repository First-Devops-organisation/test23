# Custom gitleaks config for migration secret scanning
# Extends default rules with additional patterns for common secrets

title = "Migration Secret Scanner"

# ============================================================================
# Generic key=value patterns (catches ENV_KEY=xyz, DB_PASSWORD=xxx, etc.)
# ============================================================================

[[rules]]
id = "generic-password"
description = "Generic password in key=value format"
regex = '''(?i)(password|passwd|pwd)\s*[=:]\s*['"]?([^\s'"]{6,})['"]?'''
keywords = ["password", "passwd", "pwd"]

[[rules]]
id = "generic-secret-key"
description = "Generic secret/key in key=value format"
regex = '''(?i)(secret|secret_key|secret[-_]?access[-_]?key)\s*[=:]\s*['"]?([^\s'"]{6,})['"]?'''
keywords = ["secret"]

[[rules]]
id = "generic-api-key"
description = "Generic API key/token in key=value format"
regex = '''(?i)(api[-_]?key|api[-_]?token|api[-_]?secret|access[-_]?key|auth[-_]?token)\s*[=:]\s*['"]?([^\s'"]{6,})['"]?'''
keywords = ["api", "token", "key", "auth"]

[[rules]]
id = "env-key-value"
description = "Environment variable with secret-like name"
regex = '''(?i)(env[-_]?key|app[-_]?key|app[-_]?secret|client[-_]?secret|client[-_]?id)\s*[=:]\s*['"]?([^\s'"]{4,})['"]?'''
keywords = ["env_key", "app_key", "client_secret", "client_id"]

[[rules]]
id = "connection-string"
description = "Database connection string with password"
regex = '''(?i)(connection[-_]?string|connstr)\s*[=:]\s*['"]?([^\s'"]*password[^\s'"]+)['"]?'''
keywords = ["connection", "connstr"]

[[rules]]
id = "private-key"
description = "Private key block"
regex = '''-----BEGIN\s+(RSA\s+)?PRIVATE\s+KEY-----'''
keywords = ["private key", "BEGIN"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''(?i)aws[-_]?access[-_]?key[-_]?id\s*[=:]\s*['"]?(AKIA[0-9A-Z]{12,})['"]?'''
keywords = ["AKIA", "aws"]

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Access Key"
regex = '''(?i)aws[-_]?secret[-_]?access[-_]?key\s*[=:]\s*['"]?([A-Za-z0-9/+=]{20,})['"]?'''
keywords = ["aws_secret"]

[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = '''ghp_[0-9a-zA-Z]{36}'''
keywords = ["ghp_"]

[[rules]]
id = "azure-client-secret"
description = "Azure Client Secret"
regex = '''(?i)(azure[-_]?client[-_]?secret|client[-_]?secret)\s*[=:]\s*['"]?([^\s'"]{8,})['"]?'''
keywords = ["azure", "client_secret"]

[[rules]]
id = "generic-token"
description = "Generic token assignment"
regex = '''(?i)(token|bearer)\s*[=:]\s*['"]?([^\s'"]{10,})['"]?'''
keywords = ["token", "bearer"]

[[rules]]
id = "db-password"
description = "Database password"
regex = '''(?i)(db[-_]?password|db[-_]?pass|database[-_]?password|mysql[-_]?password|postgres[-_]?password)\s*[=:]\s*['"]?([^\s'"]{4,})['"]?'''
keywords = ["db_password", "database"]

# Allow list — ignore test/example files if needed
[allowlist]
paths = [
    '''\.gitleaks\.toml$''',
    '''gitleaks-config\.toml$'''
]
