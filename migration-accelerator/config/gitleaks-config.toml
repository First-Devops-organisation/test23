# Custom gitleaks config for migration secret scanning
# Deep scanning: specific patterns + broad generic key=value catch-all
# Ensures zero secrets survive migration to GitHub

title = "Migration Secret Scanner"

# ============================================================================
# Cloud Provider Specific Patterns
# ============================================================================

[[rules]]
id = "aws-access-key-id"
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{12,}'''
keywords = ["AKIA"]

[[rules]]
id = "aws-secret-access-key"
description = "AWS Secret Access Key (key=value)"
regex = '''(?i)aws[_]?secret[_]?access[_]?key\s*[=:]\s*['"]?([A-Za-z0-9/+=]{20,})['"]?'''
secretGroup = 1
keywords = ["aws_secret", "aws-secret", "awssecret"]

[[rules]]
id = "azure-client-secret"
description = "Azure Client Secret / Service Principal"
regex = '''(?i)(azure[_-]?client[_-]?secret|azure[_-]?secret|client[_-]?secret)\s*[=:]\s*['"]?([^\s'"]{6,})['"]?'''
secretGroup = 2
keywords = ["azure_client_secret", "azure-client-secret", "client_secret", "client-secret", "azure_secret"]

[[rules]]
id = "azure-storage-key"
description = "Azure Storage Account Key"
regex = '''(?i)(azure[_-]?storage[_-]?key|storage[_-]?account[_-]?key)\s*[=:]\s*['"]?([A-Za-z0-9/+=]{44,})['"]?'''
secretGroup = 2
keywords = ["azure_storage", "storage_account_key"]

[[rules]]
id = "gcp-api-key"
description = "Google/GCP API Key"
regex = '''AIzaSy[0-9A-Za-z_-]{33}'''
keywords = ["AIzaSy"]

[[rules]]
id = "gcp-service-account"
description = "GCP Service Account Key"
regex = '''"private_key"\s*:\s*"(-----BEGIN [A-Z]+ KEY-----[^"]+)"'''
secretGroup = 1
keywords = ["private_key"]

# ============================================================================
# Token & Key Patterns (Prefix-based)
# ============================================================================

[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = '''ghp_[0-9a-zA-Z]{36}'''
keywords = ["ghp_"]

[[rules]]
id = "github-pat-fine-grained"
description = "GitHub Fine-Grained PAT"
regex = '''github_pat_[0-9a-zA-Z_]{20,}'''
keywords = ["github_pat_"]

[[rules]]
id = "github-oauth"
description = "GitHub OAuth Token"
regex = '''gho_[0-9a-zA-Z]{36}'''
keywords = ["gho_"]

[[rules]]
id = "jwt-token"
description = "JWT Token"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
keywords = ["eyJ"]

[[rules]]
id = "stripe-key"
description = "Stripe Secret Key"
regex = '''sk_(test|live)_[0-9a-zA-Z]{10,}'''
keywords = ["sk_test", "sk_live"]

[[rules]]
id = "stripe-publishable"
description = "Stripe Publishable Key"
regex = '''pk_(test|live)_[0-9a-zA-Z]{10,}'''
keywords = ["pk_test", "pk_live"]

[[rules]]
id = "slack-token"
description = "Slack Token"
regex = '''xox[bpors]-[0-9a-zA-Z-]{10,}'''
keywords = ["xoxb", "xoxp", "xoxo", "xoxr", "xoxs"]

[[rules]]
id = "npm-token"
description = "NPM Access Token"
regex = '''npm_[0-9a-zA-Z]{36}'''
keywords = ["npm_"]

[[rules]]
id = "sendgrid-key"
description = "SendGrid API Key"
regex = '''SG\.[0-9a-zA-Z_-]{22}\.[0-9a-zA-Z_-]{43}'''
keywords = ["SG."]

[[rules]]
id = "twilio-key"
description = "Twilio API Key"
regex = '''SK[0-9a-fA-F]{32}'''
keywords = ["SK"]

# ============================================================================
# Private Key Blocks
# ============================================================================

[[rules]]
id = "private-key-block"
description = "Private Key (PEM block)"
regex = '''-----BEGIN\s+(RSA\s+|EC\s+|DSA\s+|OPENSSH\s+|ENCRYPTED\s+)?PRIVATE\s+KEY-----'''
keywords = ["BEGIN", "PRIVATE KEY"]

[[rules]]
id = "private-key-assignment"
description = "Private key in assignment"
regex = '''(?i)(private[_-]?key)\s*[=:]\s*['"]?(-----BEGIN[^'"]+|[^\s'"]{8,})['"]?'''
secretGroup = 2
keywords = ["private_key", "private-key", "PRIVATE_KEY"]

# ============================================================================
# Connection Strings & URIs
# ============================================================================

[[rules]]
id = "connection-string"
description = "Database/service connection string with password"
regex = '''(?i)(connection[_-]?string|conn[_-]?str|database[_-]?url|db[_-]?url|mongodb|postgres|mysql|redis|amqp|mssql)[=:]\s*['"]?([^\s'"]{10,})['"]?'''
secretGroup = 2
keywords = ["connection_string", "conn_str", "database_url", "db_url", "mongodb://", "postgres://", "mysql://", "redis://", "amqp://", "mssql://"]

[[rules]]
id = "uri-with-credentials"
description = "URI containing embedded credentials"
regex = '''[a-zA-Z]+://[^:]+:([^@\s]{3,})@[^\s]+'''
secretGroup = 1
keywords = ["://"]

# ============================================================================
# Generic Key=Value Catch-All (DEEP SCAN — captures broad patterns)
# This rule catches secrets that don't match any specific pattern above.
# secretGroup = 2 captures the VALUE, not the key name.
# ============================================================================

[[rules]]
id = "generic-password"
description = "Password in key=value assignment"
regex = '''(?i)(password|passwd|pwd|db_password|db_passwd|admin_password|root_password|user_password|login_password|mysql_password|pg_password|redis_password|mongo_password)[_A-Z0-9]*\s*[=:]\s*['"]?([^\s'"]{6,})['"]?'''
secretGroup = 2
keywords = ["password", "passwd", "pwd", "db_password", "admin_password", "root_password"]

[[rules]]
id = "generic-secret"
description = "Secret value in key=value assignment"
regex = '''(?i)(secret|secret_key|app_secret|jwt_secret|signing_secret|webhook_secret|encryption_key|decrypt_key|master_key)[_A-Z0-9]*\s*[=:]\s*['"]?([^\s'"]{6,})['"]?'''
secretGroup = 2
keywords = ["secret", "secret_key", "app_secret", "jwt_secret", "signing_secret", "webhook_secret", "encryption_key"]

[[rules]]
id = "generic-api-key"
description = "API key/token in key=value assignment"
regex = '''(?i)(api[_-]?key|api[_-]?token|access[_-]?key|access[_-]?token|auth[_-]?token|auth[_-]?key|bearer[_-]?token|service[_-]?key|app[_-]?key|env[_-]?key)[_A-Z0-9]*\s*[=:]\s*['"]?([^\s'"]{6,})['"]?'''
secretGroup = 2
keywords = ["api_key", "api_token", "access_key", "access_token", "auth_token", "auth_key", "bearer_token", "service_key", "app_key", "env_key", "api-key", "api-token"]

[[rules]]
id = "generic-credential"
description = "Credential/key in key=value assignment"
regex = '''(?i)(credential|credentials|token|oauth_token|refresh_token|session_token|session_secret|private_token|personal_token)[_A-Z0-9]*\s*[=:]\s*['"]?([^\s'"]{6,})['"]?'''
secretGroup = 2
keywords = ["credential", "token", "oauth_token", "refresh_token", "session_token", "personal_token"]

# ============================================================================
# Firebase / Google specific (often found in Angular/web apps)
# ============================================================================

[[rules]]
id = "firebase-config"
description = "Firebase configuration secret"
regex = '''(?i)(firebase[_-]?api[_-]?key|firebase[_-]?auth[_-]?domain|firebase[_-]?project|messaging[_-]?sender[_-]?id|app[_-]?id|measurement[_-]?id)\s*[=:]\s*['"]?([^\s'"]{6,})['"]?'''
secretGroup = 2
keywords = ["firebase", "messagingSenderId", "appId", "measurementId"]

# ============================================================================
# Allowlist — paths and patterns to exclude from scanning
# ============================================================================

[allowlist]
paths = [
    '''\.gitleaks\.toml$''',
    '''gitleaks-config\.toml$''',
    '''\.git/''',
    '''node_modules/''',
    '''package-lock\.json$''',
    '''yarn\.lock$''',
    '''\.min\.js$'''
]
