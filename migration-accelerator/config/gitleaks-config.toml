# Custom gitleaks config for migration secret scanning
# Non-overlapping rules — each secret matches only ONE rule

title = "Migration Secret Scanner"

# ============================================================================
# Specific patterns (match the VALUE directly — no secretGroup needed)
# ============================================================================

[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = '''ghp_[0-9a-zA-Z]{36}'''
keywords = ["ghp_"]

[[rules]]
id = "aws-access-key-id"
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{12,}'''
keywords = ["AKIA"]

[[rules]]
id = "private-key-block"
description = "Private key block"
regex = '''-----BEGIN\s+(RSA\s+)?PRIVATE\s+KEY-----'''
keywords = ["BEGIN", "PRIVATE KEY"]

[[rules]]
id = "jwt-token"
description = "JWT Token"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
keywords = ["eyJ"]

[[rules]]
id = "stripe-key"
description = "Stripe Secret Key"
regex = '''sk_(test|live)_[0-9a-zA-Z]{10,}'''
keywords = ["sk_test", "sk_live"]

[[rules]]
id = "google-api-key"
description = "Google API Key"
regex = '''AIzaSy[0-9A-Za-z_-]{33}'''
keywords = ["AIzaSy"]

# ============================================================================
# Generic key=value (secretGroup = 2 → captures the VALUE, not the key name)
# ============================================================================

[[rules]]
id = "secret-assignment"
description = "Secret value in key=value assignment"
regex = '''(?i)(password|passwd|pwd|secret|api_key|api_token|access_key|auth_token|client_secret|private_key|jwt_secret|stripe|env_key|app_key|db_password|google_api_key)[_A-Z]*\s*[=:]\s*['"]?([^\s'"]{6,})['"]?'''
secretGroup = 2
keywords = ["password", "secret", "api_key", "api_token", "access_key", "auth_token", "client_secret", "private_key", "jwt_secret", "stripe", "env_key", "app_key", "db_password", "google_api_key"]

# Allow list
[allowlist]
paths = [
    '''\.gitleaks\.toml$''',
    '''gitleaks-config\.toml$'''
]
