# azure-pipelines-migrate.yml
trigger: none

pool:
  vmImage: 'ubuntu-latest' 

variables:
- group: repo-migration-migrate
- group: repo-migration-discove

steps:
- checkout: self

- bash: |
    echo "Authenticating GitHub CLI..."
    gh extension install github/gh-actions-importer
    gh actions-importer update
  displayName: 'Install GitHub Actions Importer'
  env:
    GH_TOKEN: $(GH_PAT) 

- bash: |
    CLEAN_ADO_ORG="$(ADO_Org)"
    CLEAN_ADO_ORG="${CLEAN_ADO_ORG#https://dev.azure.com/}"
    CONFIG_FILE="migration-config.json"

    if [ ! -f "$CONFIG_FILE" ]; then
      echo "Error: $CONFIG_FILE not found in the repository."
      exit 1
    fi

    echo "Found $CONFIG_FILE! Starting bulk migration..."

    # Read the JSON file and loop through each item
    jq -c '.[]' $CONFIG_FILE | while read item; do
      PIPELINE_ID=$(echo $item | jq -r '.pipelineId')
      TYPE=$(echo $item | jq -r '.type')
      TARGET_REPO=$(echo $item | jq -r '.targetRepo')
      
      echo "=========================================================="
      echo "🚀 Migrating $TYPE ID: $PIPELINE_ID to $TARGET_REPO"
      echo "=========================================================="
      
      gh actions-importer migrate azure-devops $TYPE \
        --pipeline-id $PIPELINE_ID \
        --target-url $TARGET_REPO \
        --azure-devops-organization $CLEAN_ADO_ORG \
        --azure-devops-project $(ADO_Project) \
        --azure-devops-access-token $(ADO_PAT) \
        --github-access-token $(GH_PAT) \
        --output-dir "migrate-results-$PIPELINE_ID"
        
    done
  displayName: 'Bulk Migrate using JSON Config'
  env:
    GH_TOKEN: $(GH_PAT)
    GITHUB_ACCESS_TOKEN: $(GH_PAT)