# azure-pipelines-migrate.yml
trigger: none # Run this manually

pool:
  vmImage: 'ubuntu-latest' # Linux agent is recommended as it comes with Docker & GH CLI

variables:
- group: repo-migration-migrate
- group: repo-migration-discove
  # GITHUB_TOKEN and ADO_PAT should be set as secret pipeline variables in the UI

steps:
- script: |
    # Install GitHub Actions Importer extension
    echo "Installing GitHub Actions Importer..."
    gh extension install github/gh-actions-importer
    
    # Update the importer Docker image
    gh actions-importer update
  displayName: 'Install GitHub Actions Importer'
  env:
    GH_TOKEN: $(GITHUB_TOKEN)

- script: |
    echo "Running Audit (Discovery) on Azure DevOps..."
    # This discovers all pipelines and task groups
    gh actions-importer audit azure-devops \
      --azure-devops-organization $(ADO_ORG) \
      --azure-devops-project $(ADO_PROJECT) \
      --azure-devops-access-token $(ADO_PAT) \
      --output-dir $(Build.ArtifactStagingDirectory)/audit-results
  displayName: '1. Discover (Audit) Task Groups & Pipelines'
  env:
    GH_TOKEN: $(GITHUB_TOKEN)

- script: |
    echo "Running Dry-Run Migration..."
    # This simulates migration and generates the GitHub Actions YAML files
    # without pushing them to GitHub.
    gh actions-importer dry-run azure-devops \
      --azure-devops-organization $(ADO_ORG) \
      --azure-devops-project $(ADO_PROJECT) \
      --azure-devops-access-token $(ADO_PAT) \
      --output-dir $(Build.ArtifactStagingDirectory)/dry-run-results
  displayName: '2. Generate Migration YAML (Dry-Run)'
  env:
    GH_TOKEN: $(GITHUB_TOKEN)

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/audit-results'
    ArtifactName: 'Audit_Discovery_Report'
    publishLocation: 'Container'
  displayName: 'Publish Discovery Report'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/dry-run-results'
    ArtifactName: 'Generated_GitHub_YAML'
    publishLocation: 'Container'
  displayName: 'Publish Generated YAML Code'