trigger: none
pr: none

parameters:
  - name: ado_org
    displayName: 'Azure DevOps Organization URL or Name'
    type: string
  - name: ado_project
    displayName: 'Azure DevOps Project Name'
    type: string
  - name: output_mode
    displayName: 'Output format'
    type: string
    default: 'composite-action'
    values:
      - 'composite-action'
      - 'workflow'
  - name: target_repo
    displayName: 'Target GitHub repo (owner/repo) for migrated workflows'
    type: string
  - name: filter
    displayName: 'Task group name filter (glob pattern)'
    type: string
    default: '*'
  - name: dry_run
    displayName: 'Dry run (discover + convert only, no push)'
    type: boolean
    default: true

variables:
  OUTPUT_DIR: '$(Build.SourcesDirectory)/output'

pool:
  vmImage: 'windows-latest'

jobs:
  - job: MigrateTaskGroups
    displayName: 'Migrate Task Groups'
    steps:
      - checkout: self

      - pwsh: |
          New-Item -ItemType Directory -Path $(OUTPUT_DIR) -Force
        displayName: 'Initialize Directories'

      - pwsh: |
          $TargetRepoSplit = "${{ parameters.target_repo }}" -split "/"
          $GitHubOrg = $TargetRepoSplit[0]
          $GitHubRepo = $TargetRepoSplit[1]
          
          $Params = @{
              AdoOrganization = "${{ parameters.ado_org }}"
              AdoProject      = "${{ parameters.ado_project }}"
              AdoPat          = $env:ADO_PAT
              OutputMode      = "${{ parameters.output_mode }}"
              Filter          = "${{ parameters.filter }}"
              OutputDir       = "$(OUTPUT_DIR)"
          }
          
          if ("${{ parameters.dry_run }}" -ne "True") {
              $Params["GitHubOrg"] = $GitHubOrg
              $Params["GitHubRepo"] = $GitHubRepo
              $Params["GitHubPat"] = $env:GH_MIGRATION_PAT
          } else {
              $Params["DryRun"] = $true
          }
          
          # Run the main orchestrator script
          .\scripts\Migrate-TaskGroups.ps1 @Params
        displayName: 'Run Discovery and Conversion'
        env:
          ADO_PAT: $(ADO_PAT)
          GH_MIGRATION_PAT: $(GH_MIGRATION_PAT)

      - task: PublishPipelineArtifact@1
        displayName: 'Upload Discovered Task Groups'
        inputs:
          targetPath: '$(OUTPUT_DIR)/discovered/'
          artifact: 'discovered-taskgroups'
          publishLocation: 'pipeline'
        condition: always()

      - task: PublishPipelineArtifact@1
        displayName: 'Upload Migrated Workflows'
        inputs:
          targetPath: '$(OUTPUT_DIR)/migrated/'
          artifact: 'migrated-workflows'
          publishLocation: 'pipeline'
        condition: always()

      - pwsh: |
          $ReportPath = "$(OUTPUT_DIR)/migration-report.md"
          if (Test-Path $ReportPath) {
              $Content = Get-Content $ReportPath -Raw
              Write-Host "##vso[task.uploadsummary]$ReportPath"
          } else {
              $SummaryError = "### [WARN] Migration Report Not Generated`nSee logs for details."
              $SummaryPath = "$(OUTPUT_DIR)/error-summary.md"
              $SummaryError | Out-File -FilePath $SummaryPath -Encoding utf8
              Write-Host "##vso[task.uploadsummary]$SummaryPath"
          }
        displayName: 'Publish Job Summary'
        condition: always()
