# azure-pipelines-migrate-taskgroups.yml
# =========================================================================
# Azure DevOps YAML Pipeline
# Uses the GitHub Actions Importer (Valet) to automatically convert and
# migrate ADO Pipelines/Task Groups to GitHub Actions workflow files.
# =========================================================================

trigger: none                     # manual trigger only

pool:
  vmImage: 'ubuntu-latest'

# ─────────────────────────────────────────────────────────────────────────
# Link your Variable Groups from ADO Library
# ─────────────────────────────────────────────────────────────────────────
variables:
  - group: 'repo-migration-discove' # Contains: ADO_Org, ADO_PAT, ADO_Project, ADO_Repo
  - group: 'repo-migration-migrate' # Contains: GH_Org, GH_PAT, GitHub_Repo, GitHub_User

stages:

# =========================================================================
# STAGE 1 — Audit and Convert using GitHub Actions Importer
# =========================================================================
- stage: MigratePipelines
  displayName: 'Migrate Pipelines to GH'
  jobs:
  - job: RunImporter
    displayName: 'Run GitHub Actions Importer'
    container:
      image: ghcr.io/github/github-actions-importer-cli:latest
      options: --user 0:0 # Runs as root to write directories inside the container
    steps:

    - script: |
        # Create output directory
        mkdir -p $(Build.ArtifactStagingDirectory)/importer-audit
        
        # Execute the official audit command
        github-actions-importer azure-devops audit \
          --output-dir $(Build.ArtifactStagingDirectory)/importer-audit
      displayName: 'Audit Azure DevOps Pipelines'
      env:
        # Importer matches these specific environment variables automatically
        PERSONAL_ACCESS_TOKEN: $(ADO_PAT)
        AZURE_DEVOPS_ORGANIZATION: $(ADO_Org)
        AZURE_DEVOPS_PROJECT: $(ADO_Project)

    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/workflows
        
        # Run a generic dry-run conversion of target pipeline configurations
        github-actions-importer azure-devops forecast \
          --output-dir $(Build.ArtifactStagingDirectory)/workflows
      displayName: 'Convert Pipelines to GitHub Actions'
      env:
        PERSONAL_ACCESS_TOKEN: $(ADO_PAT)
        AZURE_DEVOPS_ORGANIZATION: $(ADO_Org)
        AZURE_DEVOPS_PROJECT: $(ADO_Project)

    - task: PublishBuildArtifacts@1
      displayName: 'Publish converted workflows'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/workflows'
        ArtifactName: 'github-workflows'
        publishLocation: 'Container'

# =========================================================================
# STAGE 2 — Push Converted Workflows to GitHub Repository
# =========================================================================
- stage: PushToGitHub
  displayName: 'Push Workflows to GitHub'
  dependsOn: MigratePipelines
  jobs:
  - job: GitPush
    displayName: 'Commit and push to GitHub'
    steps:

    - task: DownloadBuildArtifacts@0
      displayName: 'Download converted workflows'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'github-workflows'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: Bash@3
      displayName: 'Clone GitHub repo, add workflows, push'
      inputs:
        targetType: 'inline'
        script: |
          set -euo pipefail

          echo "=== Pushing workflows to GitHub ==="

          WORKFLOW_DIR="$(System.ArtifactsDirectory)/github-workflows"
          CLONE_DIR="$(Agent.TempDirectory)/github-repo"

          # Clone target GitHub repo using GH_PAT and GH_ORG / GH_REPO
          git clone "https://x-access-token:${GH_PAT}@github.com/${GH_ORG}/${GH_REPO}.git" "$CLONE_DIR"
          cd "$CLONE_DIR"
          
          # Setup target branch
          git checkout "main" || git checkout -b "main"

          # Copy files to workflows folder
          mkdir -p .github/workflows
          cp "$WORKFLOW_DIR"/*.yml .github/workflows/ 2>/dev/null || cp "$WORKFLOW_DIR"/*.yaml .github/workflows/ 2>/dev/null || echo "No workflow files found to copy"

          echo "Workflow files to commit:"
          ls -la .github/workflows/ || echo "No files in workflows directory"

          # Configure git
          git config user.name  "GitHub Actions Importer Bot"
          git config user.email "importer-bot@github.com"

          # Commit and push
          git add .github/workflows/
          if git diff --cached --quiet; then
            echo "No changes to commit — workflows already up to date."
          else
            git commit -m "chore: migrate pipelines using GitHub Actions Importer [automated]"
            git push origin "main"
            echo "✅ Workflows pushed to https://github.com/${GH_ORG}/${GH_REPO}"
          fi
      env:
        # Map variables from Variable Group 'repo-migration-migrate'
        GH_ORG: $(GH_Org)
        GH_PAT: $(GH_PAT)
        GH_REPO: $(GitHub_Repo)