# ==============================================================================
# Azure DevOps Pipeline: Task Group Discovery & Migration
# 
# Requires Variable Groups linked with: 
# GH_Org, GH_PAT, GitHub_Repo, ADO_Org, ADO_PAT, ADO_Project
# ==============================================================================

trigger: none

pool:
  vmImage: ubuntu-latest
variables:
  - group: repo-migration-discove  # ADO_ORG, ADO_PROJECT, ADO_PAT
  - group: repo-migration-migrate
stages:
  - stage: DiscoverAndMigrateTaskGroups
    displayName: "Migrate Task Groups to GitHub"
    jobs:
      - job: DiscoverAndMigrate
        displayName: "Discover & Migrate Task Groups"
        steps:
          - checkout: none

          - task: Bash@3
            displayName: "Install GitHub Actions Importer"
            inputs:
              targetType: 'inline'
              script: |
                echo $(GH_PAT) | gh auth login --with-token
                gh extension install github/gh-actions-importer || true
                gh actions-importer update

          - task: Bash@3
            displayName: "1. Audit (Simple Discover Task Groups)"
            env:
              GITHUB_ACCESS_TOKEN: $(GH_PAT)
              AZURE_DEVOPS_ACCESS_TOKEN: $(ADO_PAT)
            inputs:
              targetType: 'inline'
              script: |
                mkdir -p output/taskgroups
                
                # Strip out URL if the user provided the full URL instead of just the Org name
                ADO_ORG_NAME=$(echo "$(ADO_Org)" | sed -E 's|https?://dev.azure.com/([^/]+).*|\1|')
                
                echo "Scanning ADO for Task Groups in org: $ADO_ORG_NAME, project: $(ADO_Project)..."
                gh actions-importer audit azure-devops \
                    --output-dir "output/taskgroups" \
                    --azure-devops-organization "$ADO_ORG_NAME" \
                    --azure-devops-project "$(ADO_Project)"
                
                if [ ! -f "output/taskgroups/config.yml" ]; then
                    echo "##vso[task.logissue type=error]Failed to discover any Task Groups."
                    exit 1
                fi
                
                echo "Task Groups Found:"
                awk '/^reusable-templates:/{flag=1; next} /^[a-zA-Z0-9_-]+:/{flag=0} flag && /^[[:space:]]*- name:/{print}' output/taskgroups/config.yml | sed 's/^[[:space:]]*-[[:space:]]*name:[[:space:]]*/  - /'

          - task: Bash@3
            displayName: "2. Configure Routing"
            inputs:
              targetType: 'inline'
              script: |
                CONFIG_FILE="output/taskgroups/config.yml"
                TEMP_CONFIG="${CONFIG_FILE}.tmp"
                TARGET_URL="https://github.com/$(GH_Org)/$(GitHub_Repo)"
                
                echo "Routing all Task Groups to $TARGET_URL"
                
                IN_REUSABLES=0
                while IFS= read -r line || [[ -n "$line" ]]; do
                    if [[ "$line" =~ ^reusable-templates: ]]; then
                        IN_REUSABLES=1
                        echo "$line" >> "$TEMP_CONFIG"
                    elif [[ "$line" =~ ^[a-zA-Z0-9_-]+: ]] && [[ ! "$line" =~ ^reusable-templates: ]]; then
                        IN_REUSABLES=0
                        echo "$line" >> "$TEMP_CONFIG"
                    elif [[ "$IN_REUSABLES" == "1" ]] && [[ "$line" =~ ^([[:space:]]*)-[[:space:]]+name:[[:space:]]+([^[:space:]]+) ]]; then
                        raw_name="${BASH_REMATCH[2]}"
                        folderName=$(echo "$raw_name" | sed -E 's/\.ya?ml$//I' | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]/_/g')
                        
                        echo "$line" >> "$TEMP_CONFIG"
                        echo "      target_url: $TARGET_URL" >> "$TEMP_CONFIG"
                        echo "      ref: main" >> "$TEMP_CONFIG"
                        echo "      path: .github/actions/$folderName" >> "$TEMP_CONFIG"
                    elif [[ "$IN_REUSABLES" == "1" ]] && ([[ "$line" =~ ^[[:space:]]+target_url: ]] || [[ "$line" =~ ^[[:space:]]+ref: ]] || [[ "$line" =~ ^[[:space:]]+path: ]]); then
                        continue
                    else
                        echo "$line" >> "$TEMP_CONFIG"
                    fi
                done < "$CONFIG_FILE"
                
                mv "$TEMP_CONFIG" "$CONFIG_FILE"

          - task: Bash@3
            displayName: "3. Migrate & Create Pull Requests"
            env:
              GITHUB_ACCESS_TOKEN: $(GH_PAT)
              AZURE_DEVOPS_ACCESS_TOKEN: $(ADO_PAT)
            inputs:
              targetType: 'inline'
              script: |
                TARGET_URL="https://github.com/$(GH_Org)/$(GitHub_Repo)"
                ADO_ORG_NAME=$(echo "$(ADO_Org)" | sed -E 's|https?://dev.azure.com/([^/]+).*|\1|')
                
                echo "Migrating Task Groups to GitHub..."
                gh actions-importer migrate azure-devops release \
                    --output-dir "output/migrated" \
                    --azure-devops-organization "$ADO_ORG_NAME" \
                    --azure-devops-project "$(ADO_Project)" \
                    --release-id "$(ADO_Pipeline_ID)" \
                    --config-file-path "output/taskgroups/config.yml" \
                    --target-url "$TARGET_URL"

          - task: PublishPipelineArtifact@1
            displayName: "Publish Migration Logs"
            condition: always()
            inputs:
              targetPath: 'output'
              artifact: "taskgroup-migration-logs"
              publishLocation: pipeline
