# azure-pipelines-migrate.yml
trigger: none # Run this manually

pool:
  vmImage: 'ubuntu-latest' 

variables:
- group: repo-migration-migrate
- group: repo-migration-discove

steps:
# 1. Install the GitHub Actions Importer Extension
- bash: |
    echo "Authenticating GitHub CLI..."
    gh extension install github/gh-actions-importer
    
    echo "Updating Importer Docker Image..."
    gh actions-importer update
  displayName: 'Install GitHub Actions Importer'
  env:
    GH_TOKEN: $(GH_PAT) 

# 2. Run the Audit (Discovery Phase)
- bash: |
    echo "Running Audit on Azure DevOps..."
    
    # This automatically strips the URL prefix from the variable
    CLEAN_ADO_ORG="$(ADO_Org)"
    CLEAN_ADO_ORG="${CLEAN_ADO_ORG#https://dev.azure.com/}"
    echo "Cleaned Organization Name: $CLEAN_ADO_ORG"

    gh actions-importer audit azure-devops \
      --azure-devops-organization $CLEAN_ADO_ORG \
      --azure-devops-project $(ADO_Project) \
      --azure-devops-access-token $(ADO_PAT) \
      --output-dir audit-results
  displayName: 'Discover (Audit) Task Groups & Pipelines'
  env:
    GH_TOKEN: $(GH_PAT)
    GITHUB_ACCESS_TOKEN: $(GH_PAT)

# 3. Run the Dry-Run (Generates the GitHub YAML)
- bash: |
    echo "Running Dry-Run Migration..."
    
    # Clean the org name here as well
    CLEAN_ADO_ORG="$(ADO_Org)"
    CLEAN_ADO_ORG="${CLEAN_ADO_ORG#https://dev.azure.com/}"

    gh actions-importer dry-run azure-devops \
      --azure-devops-organization $CLEAN_ADO_ORG \
      --azure-devops-project $(ADO_Project) \
      --azure-devops-access-token $(ADO_PAT) \
      --output-dir dry-run-results
  displayName: 'Generate GitHub Actions YAML (Dry-Run)'
  env:
    GH_TOKEN: $(GH_PAT)
    GITHUB_ACCESS_TOKEN: $(GH_PAT)

# 4. Publish Audit Report Artifact
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'audit-results'
    ArtifactName: 'Audit_Discovery_Report'
    publishLocation: 'Container'
  displayName: 'Publish Discovery Report'
  condition: always() 

# 5. Publish Generated YAML Artifact
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'dry-run-results'
    ArtifactName: 'Generated_GitHub_YAML'
    publishLocation: 'Container'
  displayName: 'Publish Generated YAML Code'
  condition: always()