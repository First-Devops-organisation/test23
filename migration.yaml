trigger: none

pool:
  vmImage: ubuntu-latest


variables:
  - group: ankit-adotogit # ADO_Org, ADO_Project, ADO_Repo, ADO_PAT, GH_PAT, GitHub_Org, GitHub_Repo
  

stages:
  # ===========================================================================
  # STAGE 1 – DISCOVER  (reuse existing scripts — already working)
  # ===========================================================================
  - stage: Discover
    displayName: "1. Discover & Audit Pipelines"
    jobs:
      - job: AuditPipelines
        displayName: "1.1 Audit ADO Pipelines (actions-importer)"
        timeoutInMinutes: 60

        steps:
          - checkout: self
            fetchDepth: 0
          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'migration-accelerator/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Run audit-pipelines.ps1"
            inputs:
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/00-discovery/audit-pipelines.ps1'
              arguments: >-
                -AdoOrg "$(ADO_Org)"
                -AdoProject "$(ADO_Project)"
                -AdoPat "$(ADO_PAT)"
                -GitHubPat "$(GH_PAT)"
                -OutputDir "output/pipeline-audit"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "List all ADO Pipeline IDs"
            inputs:
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/02-migrate/migrate-pipelines.ps1'
              arguments: >-
                -ConfigFile "$(Build.SourcesDirectory)/migration-accelerator/config/migration-config.json"
                -AdoProject "$(ADO_Project)"
                -Mode "list"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
             
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Audit Artifact"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/migration-accelerator/output/pipeline-audit'
              artifact: "pipeline-audit"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Audit Dashboard on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)/migration-accelerator/output/pipeline-audit/dashboard'
              tabName: "Pipeline Audit Dashboard"

  # ===========================================================================
  # STAGE 1.5 – SCRUB SECRETS (redact & store in GitHub Secrets)
  # ===========================================================================
  - stage: ScrubSecrets
    displayName: "1.5 Scrub Secrets & Store in GitHub"
    dependsOn: Discover
    condition: succeeded()
    jobs:
      - job: ScrubSecrets
        displayName: "1.5.1 Scrub Secrets in Repo History"
        timeoutInMinutes: 120
        steps:
          - checkout: self
            fetchDepth: 0

          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'migration-accelerator/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Inventory ADO assets ($(ADO_Project)/$(ADO_Repo))"
            inputs:
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/00-discovery/inventory-assets.ps1'
              arguments: >-
                -OrgUrl "https://dev.azure.com/$(ADO_Org)"
                -Pat "$(ADO_PAT)"
                -ProjectFilter "$(ADO_Project)"
                -RepoFilter "$(ADO_Repo)"
                -OutputDir "$(Build.SourcesDirectory)/migration-accelerator/output/inventory"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PowerShell@2
            displayName: "Create inventory-LATEST.json"
            inputs:
              targetType: 'inline'
              script: |
                $invDir = "$(Build.SourcesDirectory)/migration-accelerator/output/inventory"
                $latest = Get-ChildItem $invDir -Filter "inventory-*.json" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
                if ($latest) {
                  Copy-Item $latest.FullName (Join-Path $invDir "inventory-LATEST.json") -Force
                  Write-Host "Created inventory-LATEST.json from $($latest.Name)" -ForegroundColor Green
                } else {
                  Write-Error "No inventory file found in $invDir"
                  exit 1
                }
              pwsh: true

          - task: PowerShell@2
            displayName: "Scan for secrets (gitleaks)"
            inputs:
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/00-discovery/scan-secrets.ps1'
              arguments: >-
                -InventoryFile "$(Build.SourcesDirectory)/migration-accelerator/output/inventory/inventory-LATEST.json"
                -Pat "$(ADO_PAT)"
                -OutputDir "$(Build.SourcesDirectory)/migration-accelerator/output/secrets"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PowerShell@2
            displayName: "Scrub secrets from repo history"
            inputs:
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/01-prep/scrub-secrets.ps1'
              arguments: >-
                -SecretScanDir "$(Build.SourcesDirectory)/migration-accelerator/output/secrets"
                -Pat "$(ADO_PAT)"
                -GitHubOrg "$(GitHub_Org)"
                -OutputDir "$(Build.SourcesDirectory)/migration-accelerator/output/scrubbed"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_PAT: $(ADO_PAT)
              ADO_ORG: $(ADO_Org)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Scrub Artifacts"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/migration-accelerator/output/scrubbed'
              artifact: "secret-scrub-results"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Secret Scrub Dashboard"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)/migration-accelerator/output/scrubbed/dashboard'
              tabName: "Secret Migration Dashboard"

  # ===========================================================================
  # STAGE 2 – MIGRATE REPO (GEI + scrub secrets on GitHub)
  # ===========================================================================
  - stage: MigrateRepo
    displayName: "2. GEI Migrate & Scrub on GitHub"
    dependsOn: ScrubSecrets
    condition: succeeded()
    jobs:
      - job: MigrateAndScrub
        displayName: "2.1 GEI Migrate → Scrub secrets on GitHub"
        timeoutInMinutes: 120
        steps:
          - checkout: self
            fetchDepth: 0

          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'migration-accelerator/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "GEI Migrate: $(ADO_Repo) → $(GitHub_Org)"
            inputs:
              targetType: 'inline'
              script: |
                $ErrorActionPreference = "Stop"

                $adoOrg  = "$(ADO_Org)"
                $adoProj = "$(ADO_Project)"
                $adoRepo = "$(ADO_Repo)"
                $ghOrg   = "$(GitHub_Org)"
                $ghRepo  = $adoRepo.ToLower() -replace " ", "-"

                Write-Host "=== GEI Repo Migration ===" -ForegroundColor Cyan
                Write-Host "Source: $adoOrg / $adoProj / $adoRepo" -ForegroundColor Yellow
                Write-Host "Target: $ghOrg / $ghRepo" -ForegroundColor Yellow

                # Ensure GEI extension is installed
                $installed = gh extension list 2>&1
                if ($installed -notmatch "ado2gh") {
                    Write-Host "Installing gh-ado2gh extension..." -ForegroundColor Gray
                    gh extension install github/gh-ado2gh 2>&1
                }

                # Run GEI migration
                Write-Host "`nStarting GEI migration..." -ForegroundColor Cyan
                gh ado2gh migrate-repo `
                    --ado-org "$adoOrg" `
                    --ado-team-project "$adoProj" `
                    --ado-repo "$adoRepo" `
                    --github-org "$ghOrg" `
                    --github-repo "$ghRepo" `
                    --verbose 2>&1

                if ($LASTEXITCODE -ne 0) {
                    Write-Error "GEI migration failed with exit code $LASTEXITCODE"
                    exit 1
                }

                Write-Host "`n✓ GEI migration complete: https://github.com/$ghOrg/$ghRepo" -ForegroundColor Green
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: DownloadPipelineArtifact@2
            displayName: "Download scrub data"
            inputs:
              artifactName: 'secret-scrub-results'
              targetPath: '$(Build.SourcesDirectory)/migration-accelerator/output/scrubbed'

          - task: PowerShell@2
            displayName: "Scrub secrets from GitHub repo"
            inputs:
              targetType: 'inline'
              script: |
                $ErrorActionPreference = "Stop"

                $adoRepo = "$(ADO_Repo)"
                $adoProj = "$(ADO_Project)"
                $ghOrg   = "$(GitHub_Org)"
                $ghPat   = $env:GH_PAT
                $ghRepo  = $adoRepo.ToLower() -replace " ", "-"
                $repoId  = "${adoProj}_${adoRepo}"

                $scrubDir = "$(Build.SourcesDirectory)/migration-accelerator/output/scrubbed"
                $expressionsFile = "$scrubDir/../tmp/scrub/$repoId-expressions.txt"

                # Check if there are secrets to scrub
                $secretValuesFile = Join-Path $scrubDir "secret-values.json"
                if (-not (Test-Path $secretValuesFile)) {
                    Write-Host "No secrets to scrub — repo is clean." -ForegroundColor Green
                    exit 0
                }

                $secrets = Get-Content $secretValuesFile -Raw | ConvertFrom-Json
                if ($secrets.Count -eq 0) {
                    Write-Host "No secrets to scrub — repo is clean." -ForegroundColor Green
                    exit 0
                }

                Write-Host "=== Scrubbing $($secrets.Count) secrets from GitHub repo ===" -ForegroundColor Cyan
                Write-Host "Repo: $ghOrg/$ghRepo" -ForegroundColor Yellow

                # Clone the migrated GitHub repo
                $cloneDir = Join-Path $scrubDir "github-clone"
                if (Test-Path $cloneDir) { Remove-Item -Recurse -Force $cloneDir }

                $cloneUrl = "https://x-access-token:$ghPat@github.com/$ghOrg/$ghRepo.git"
                git clone $cloneUrl $cloneDir 2>&1 | Out-Null

                if (-not (Test-Path $cloneDir)) {
                    Write-Error "Failed to clone GitHub repo"
                    exit 1
                }

                # Build expressions file for git-filter-repo
                $expFile = Join-Path $scrubDir "expressions.txt"
                $expressions = @()
                foreach ($entry in $secrets) {
                    $escaped = [regex]::Escape($entry.SecretValue)
                    $placeholder = "***GITHUB_SECRET:$($entry.SecretName)***"
                    $expressions += "regex:$escaped==>$placeholder"
                }
                $expressions | Out-File -FilePath $expFile -Encoding utf8
                $absExpFile = (Resolve-Path $expFile).Path

                # Run git-filter-repo on the GitHub clone
                Write-Host "Running git-filter-repo..." -ForegroundColor Gray
                Push-Location $cloneDir
                git filter-repo --replace-text "$absExpFile" --force 2>&1
                Pop-Location

                # Push scrubbed history back to GitHub
                Write-Host "Force pushing clean history to GitHub..." -ForegroundColor Yellow
                Push-Location $cloneDir
                git remote add github "$cloneUrl" 2>&1 | Out-Null
                git push github --mirror --force 2>&1
                if ($LASTEXITCODE -ne 0) {
                    Write-Error "Failed to push scrubbed repo"
                    Pop-Location
                    exit 1
                }
                Pop-Location

                Write-Host "`n✓ Secrets scrubbed from GitHub repo: $ghOrg/$ghRepo" -ForegroundColor Green
                Write-Host "  $($secrets.Count) secrets replaced with placeholders" -ForegroundColor Green
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

  # ===========================================================================
  # STAGE 3 – CREATE GITHUB SECRETS (after migration, repos now exist)
  # ===========================================================================
  - stage: CreateGitHubSecrets
    displayName: "3. Create GitHub Secrets"
    dependsOn: MigrateRepo
    condition: succeeded('MigrateRepo')
    jobs:
      - job: PushSecrets
        displayName: "3.1 Push secrets to GitHub repos"
        timeoutInMinutes: 30
        steps:
          - checkout: self
            fetchDepth: 0

          - task: DownloadPipelineArtifact@2
            displayName: "Download scrub results"
            inputs:
              artifactName: 'secret-scrub-results'
              targetPath: '$(Build.SourcesDirectory)/migration-accelerator/output/scrubbed'

          - task: PowerShell@2
            displayName: "Create GitHub Secrets from saved values"
            inputs:
              targetType: 'inline'
              script: |
                $ErrorActionPreference = "Stop"

                $secretsFile = "$(Build.SourcesDirectory)/migration-accelerator/output/scrubbed/secret-values.json"

                if (-not (Test-Path $secretsFile)) {
                    Write-Host "No secret-values.json found — no secrets to create." -ForegroundColor Green
                    exit 0
                }

                $secrets = Get-Content $secretsFile -Raw | ConvertFrom-Json
                if ($secrets.Count -eq 0) {
                    Write-Host "No secrets in secret-values.json — all repos were clean." -ForegroundColor Green
                    exit 0
                }

                Write-Host "=== Creating GitHub Secrets ===" -ForegroundColor Cyan
                Write-Host "Total secrets to create: $($secrets.Count)" -ForegroundColor Yellow

                $created = 0
                $failed = 0

                foreach ($entry in $secrets) {
                    Write-Host "`n  Repo: $($entry.GitHubRepo)" -ForegroundColor Yellow
                    Write-Host "    Secret: $($entry.SecretName) ($($entry.RuleID))" -ForegroundColor Gray

                    try {
                        $entry.SecretValue | gh secret set $entry.SecretName --repo $entry.GitHubRepo 2>&1
                        if ($LASTEXITCODE -eq 0) {
                            Write-Host "    ✓ Created: $($entry.SecretName)" -ForegroundColor Green
                            $created++
                        } else {
                            Write-Host "    ✗ Failed: $($entry.SecretName)" -ForegroundColor Red
                            $failed++
                        }
                    }
                    catch {
                        Write-Host "    ✗ Error: $_" -ForegroundColor Red
                        $failed++
                    }
                }

                Write-Host "`n=== GitHub Secrets Summary ===" -ForegroundColor Cyan
                Write-Host "Created: $created" -ForegroundColor Green
                Write-Host "Failed:  $failed" -ForegroundColor $(if ($failed -gt 0) { "Red" } else { "Green" })

                # Delete the secret-values.json for security
                Remove-Item $secretsFile -Force
                Write-Host "`nDeleted secret-values.json for security." -ForegroundColor Gray

                if ($failed -gt 0) { exit 1 }
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)