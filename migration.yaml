trigger: none

pool:
  vmImage: ubuntu-latest


variables:
  - group: ankit-adotogit # ADO_Org, ADO_Project, ADO_Repo, ADO_PAT, GH_PAT, GitHub_Org, GitHub_Repo
  

stages:
  # ===========================================================================
  # STAGE 1 – DISCOVER  (reuse existing scripts — already working)
  # ===========================================================================
  - stage: Discover
    displayName: "1. Discover & Audit Pipelines"
    jobs:
      - job: AuditPipelines
        displayName: "1.1 Audit ADO Pipelines (actions-importer)"
        timeoutInMinutes: 60

        steps:
          - checkout: self
            fetchDepth: 0
          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'migration-accelerator/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Run audit-pipelines.ps1"
            inputs:
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/00-discovery/audit-pipelines.ps1'
              arguments: >-
                -AdoOrg "$(ADO_Org)"
                -AdoProject "$(ADO_Project)"
                -AdoPat "$(ADO_PAT)"
                -GitHubPat "$(GH_PAT)"
                -OutputDir "output/pipeline-audit"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "List all ADO Pipeline IDs"
            inputs:
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/02-migrate/migrate-pipelines.ps1'
              arguments: >-
                -ConfigFile "$(Build.SourcesDirectory)/migration-accelerator/config/migration-config.json"
                -AdoProject "$(ADO_Project)"
                -Mode "list"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
             
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Audit Artifact"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/migration-accelerator/output/pipeline-audit'
              artifact: "pipeline-audit"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Audit Dashboard on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)/migration-accelerator/output/pipeline-audit/dashboard'
              tabName: "Pipeline Audit Dashboard"

  # ===========================================================================
  # STAGE 1.5 – SCRUB SECRETS (redact & store in GitHub Secrets)
  # ===========================================================================
  - stage: ScrubSecrets
    displayName: "1.5 Scrub Secrets & Store in GitHub"
    dependsOn: Discover
    condition: succeeded()
    jobs:
      - job: ScrubSecrets
        displayName: "1.5.1 Scrub Secrets in Repo History"
        timeoutInMinutes: 120
        steps:
          - checkout: self
            fetchDepth: 0

          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'migration-accelerator/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Inventory ADO assets ($(ADO_Project)/$(ADO_Repo))"
            inputs:
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/00-discovery/inventory-assets.ps1'
              arguments: >-
                -OrgUrl "https://dev.azure.com/$(ADO_Org)"
                -Pat "$(ADO_PAT)"
                -ProjectFilter "$(ADO_Project)"
                -RepoFilter "$(ADO_Repo)"
                -OutputDir "$(Build.SourcesDirectory)/migration-accelerator/output/inventory"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PowerShell@2
            displayName: "Create inventory-LATEST.json"
            inputs:
              targetType: 'inline'
              script: |
                $invDir = "$(Build.SourcesDirectory)/migration-accelerator/output/inventory"
                $latest = Get-ChildItem $invDir -Filter "inventory-*.json" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
                if ($latest) {
                  Copy-Item $latest.FullName (Join-Path $invDir "inventory-LATEST.json") -Force
                  Write-Host "Created inventory-LATEST.json from $($latest.Name)" -ForegroundColor Green
                } else {
                  Write-Error "No inventory file found in $invDir"
                  exit 1
                }
              pwsh: true

          - task: PowerShell@2
            displayName: "Scan for secrets (gitleaks)"
            inputs:
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/00-discovery/scan-secrets.ps1'
              arguments: >-
                -InventoryFile "$(Build.SourcesDirectory)/migration-accelerator/output/inventory/inventory-LATEST.json"
                -Pat "$(ADO_PAT)"
                -OutputDir "$(Build.SourcesDirectory)/migration-accelerator/output/secrets"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PowerShell@2
            displayName: "Scrub secrets & store in GitHub Secrets"
            inputs:
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/01-prep/scrub-secrets.ps1'
              arguments: >-
                -SecretScanDir "$(Build.SourcesDirectory)/migration-accelerator/output/secrets"
                -Pat "$(ADO_PAT)"
                -GitHubOrg "$(GitHub_Org)"
                -GitHubPat "$(GH_PAT)"
                -OutputDir "$(Build.SourcesDirectory)/migration-accelerator/output/scrubbed"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_PAT: $(ADO_PAT)
              ADO_ORG: $(ADO_Org)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Scrub Artifacts"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/migration-accelerator/output/scrubbed'
              artifact: "secret-scrub-results"
              publishLocation: pipeline

  # ===========================================================================
  # STAGE 2 – MIGRATE (skipped if PIPELINE_IDS is empty)
  # ===========================================================================
  - stage: MigratePipeline
    displayName: "2. Migrate Pipelines"
    dependsOn: ScrubSecrets
    condition: and(succeeded(), ne(variables['PIPELINE_IDS'], ''))
    jobs:
      - job: DryRun
        displayName: "2.1 Dry-Run Preview"
        steps:
          - checkout: self
            fetchDepth: 0

          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'migration-accelerator/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Dry-Run pipelines: $(PIPELINE_IDS)"
            inputs:
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/02-migrate/migrate-pipelines.ps1'
              arguments: >-
                -AdoProject "$(ADO_Project)"
                -PipelineId $(PIPELINE_IDS)
                -PipelineType "$(PIPELINE_TYPE)"
                -Mode "dry-run"
                -ImporterConfigFile "$(Build.SourcesDirectory)/migration-accelerator/output/pipeline-audit/config.yml"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_ORG: $(ADO_Org)
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)
              GH_REPO: $(GitHub_Repo)
              PIPELINE_REPO_MAP: $(PIPELINE_REPO_MAP)
 
           
          - task: PublishPipelineArtifact@1
            displayName: "Publish Dry-Run Output"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/migration-accelerator/output/pipelines'
              artifact: "pipeline-dry-run"
              publishLocation: pipeline

          # - task: PublishHtmlReport@1
          #   displayName: "Dry-Run Dashboard on Pipeline Tab"
          #   condition: always()
          #   inputs:
          #     reportDir: '$(Build.SourcesDirectory)/migration-accelerator/output/pipelines/dashboard'
          #     tabName: "Dry-Run Migration Dashboard"

      - job: Migrate
        displayName: "2.2 Migrate to GitHub"
        dependsOn: DryRun
        condition: and(succeeded(), eq(variables['MIGRATE_MODE'], 'migrate'))
        steps:
          - checkout: self
            fetchDepth: 0

          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'migration-accelerator/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Migrate pipelines: $(PIPELINE_IDS)"
            inputs:
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/02-migrate/migrate-pipelines.ps1'
              arguments: >-
                -AdoProject "$(ADO_Project)"
                -PipelineId $(PIPELINE_IDS)
                -PipelineType "$(PIPELINE_TYPE)"
                -Mode "migrate"
                -ImporterConfigFile "output/pipeline-audit/config.yml"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_ORG: $(ADO_Org)
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)
              GH_REPO: $(GitHub_Repo)
              PIPELINE_REPO_MAP: $(PIPELINE_REPO_MAP)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Migration Output"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/migration-accelerator/output/pipelines'
              artifact: "pipeline-migrate"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Migration Dashboard on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)/migration-accelerator/output/pipelines/dashboard'
              tabName: "Migration Dashboard"