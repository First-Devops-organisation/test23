trigger: none

parameters:
  # ── Test overrides: lower these to trigger BLOCKED/WARNING with small repos ──
  - name: repoSizeBlockedGB
    displayName: "Repo Size BLOCKED threshold (GB)"
    type: number
    default: 40
  - name: repoSizeWarningGB
    displayName: "Repo Size WARNING threshold (GB)"
    type: number
    default: 10
  - name: fileSizeBlockedMB
    displayName: "Single File BLOCKED threshold (MB)"
    type: number
    default: 400
  - name: fileSizeWarningMB
    displayName: "Single File WARNING threshold (MB)"
    type: number
    default: 100

pool:
  vmImage: ubuntu-latest

variables:
  - group: ankit-adotogit  # ADO_Org, ADO_Project, ADO_Repo, ADO_PAT, GH_PAT, GitHub_Org, GitHub_Repo

# ===========================================================================
# STAGE ORDER (Safe & Correct):
#   1. Setup
#   2. ScrubSecrets         (Inventory → Scan → Scrub ADO repo history)
#   3. SingleRepoMigration  (Pre-Checks → ApprovalGate → Migrate CLEAN repo → Audit)
#   4. CreateGitHubSecrets  (Push scrubbed secrets to GitHub repo)
#
# WHY THIS ORDER:
#   Secrets are scanned & scrubbed from ADO history BEFORE migration.
#   Only a clean repo (no secrets in history) is pushed to GitHub.
#   Then secrets are re-added safely as GitHub Secrets (env vars).
# ===========================================================================

stages:

  # ===========================================================================
  # STAGE 1 – SETUP
  # ===========================================================================
  - stage: Setup
    displayName: "Stage 1 - Install Tools"
    jobs:
      - job: InstallTools
        steps:
          - task: PowerShell@2
            displayName: "Install GitHub CLI"
            inputs:
              targetType: inline
              pwsh: true
              script: |
                Write-Host "Installing GitHub CLI..."
                if ($IsLinux) {
                    sudo apt-get update -y -q
                    sudo apt-get install -y gh
                } else {
                    winget install --id GitHub.cli -e --source winget
                }
                gh --version

  # ===========================================================================
  # STAGE 2 – SCRUB SECRETS (scan & clean ADO repo BEFORE migration)
  # ===========================================================================
  - stage: ScrubSecrets
    displayName: "Stage 2 - Scrub Secrets & Store in GitHub"
    dependsOn: Setup
    condition: succeeded()
    jobs:
      - job: ScrubSecrets
        displayName: "2.1 Scrub Secrets in Repo History"
        timeoutInMinutes: 120
        steps:
          - checkout: self
            fetchDepth: 0

          - task: PowerShell@2
            displayName: "Install required tooling"
            inputs:
              targetType: filePath
              filePath: "migration-accelerator/01-prep/install-tools.ps1"
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Inventory ADO assets ($(ADO_Project)/$(ADO_Repo))"
            inputs:
              filePath: "$(Build.SourcesDirectory)/migration-accelerator/00-discovery/inventory-assets.ps1"
              arguments: >-
                -OrgUrl "https://dev.azure.com/$(ADO_Org)"
                -Pat "$(ADO_PAT)"
                -ProjectFilter "$(ADO_Project)"
                -RepoFilter "$(ADO_Repo)"
                -OutputDir "$(Build.SourcesDirectory)/migration-accelerator/output/inventory"
              pwsh: true
              workingDirectory: "$(Build.SourcesDirectory)/migration-accelerator"
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PowerShell@2
            displayName: "Create inventory-LATEST.json"
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $invDir = "$(Build.SourcesDirectory)/migration-accelerator/output/inventory"
                $latest = Get-ChildItem $invDir -Filter "inventory-*.json" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
                if ($latest) {
                    Copy-Item $latest.FullName (Join-Path $invDir "inventory-LATEST.json") -Force
                    Write-Host "Created inventory-LATEST.json from $($latest.Name)" -ForegroundColor Green
                } else {
                    Write-Error "No inventory file found in $invDir"
                    exit 1
                }

          - task: PowerShell@2
            displayName: "Scan for secrets (gitleaks)"
            inputs:
              filePath: "$(Build.SourcesDirectory)/migration-accelerator/00-discovery/scan-secrets.ps1"
              arguments: >-
                -InventoryFile "$(Build.SourcesDirectory)/migration-accelerator/output/inventory/inventory-LATEST.json"
                -Pat "$(ADO_PAT)"
                -OutputDir "$(Build.SourcesDirectory)/migration-accelerator/output/secrets"
              pwsh: true
              workingDirectory: "$(Build.SourcesDirectory)/migration-accelerator"
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PowerShell@2
            displayName: "Scrub secrets from repo history"
            inputs:
              filePath: "$(Build.SourcesDirectory)/migration-accelerator/01-prep/scrub-secrets.ps1"
              arguments: >-
                -SecretScanDir "$(Build.SourcesDirectory)/migration-accelerator/output/secrets"
                -Pat "$(ADO_PAT)"
                -GitHubOrg "$(GitHub_Org)"
                -OutputDir "$(Build.SourcesDirectory)/migration-accelerator/output/scrubbed"
              pwsh: true
              workingDirectory: "$(Build.SourcesDirectory)/migration-accelerator"
            env:
              ADO_PAT: $(ADO_PAT)
              ADO_ORG: $(ADO_Org)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Scrub Artifacts"
            condition: always()
            inputs:
              targetPath: "$(Build.SourcesDirectory)/migration-accelerator/output/scrubbed"
              artifact: "secret-scrub-results"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Secret Scrub Dashboard"
            condition: always()
            inputs:
              reportDir: "$(Build.SourcesDirectory)/migration-accelerator/output/scrubbed/dashboard"
              tabName: "Secret Migration Dashboard"

  # ===========================================================================
  # STAGE 3 – SINGLE REPO MIGRATION WITH BRANCH-WISE AUDIT (repo is now clean)
  # ===========================================================================
  - stage: SingleRepoMigration
    displayName: "Stage 3 - Migrate & Audit (Clean Repo)"
    dependsOn: ScrubSecrets
    jobs:

      # -----------------------------------------------------------------------
      # JOB 1 – PRE-CHECKS
      # -----------------------------------------------------------------------
      - job: PreChecks
        displayName: "Pre-Migration Checks"
        timeoutInMinutes: 30
        cancelTimeoutInMinutes: 1
        steps:

          # STEP 1 – AUTHENTICATE & INSTALL EXTENSION
          - task: PowerShell@2
            displayName: "Step 1 - Authenticate GitHub & Install ado2gh"
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $env:GH_TOKEN = "$(GH_PAT)"
                echo $env:GH_TOKEN | gh auth login --with-token
                gh auth status
                gh extension install github/gh-ado2gh
                gh extension list

          # STEP 2 – PRE-CHECK REPO EXISTENCE IN GITHUB
          - task: PowerShell@2
            name: repoCheck
            displayName: "Step 2 - Pre-check Repo Existence in GitHub"
            continueOnError: true
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $env:GH_TOKEN = "$(GH_PAT)"
                $repo = "$(GitHub_Repo)"
                $org  = "$(GitHub_Org)"

                Write-Host "========== Pre-Migration Repository Status =========="
                Write-Host "Checking repository: $org/$repo"

                try {
                    $ErrorActionPreference = 'Stop'
                    [void](gh repo view "$org/$repo" --json name 2>&1)
                    Write-Host "Repo already exists in GitHub: $repo"
                    "ALREADY_EXISTS" | Out-File "$(Build.ArtifactStagingDirectory)/repo-precheck.txt" -Encoding utf8
                    Write-Host "##vso[task.setvariable variable=REPO_STATUS;isOutput=true]ALREADY_EXISTS"
                }
                catch {
                    Write-Host "Repo does not exist yet (will be migrated): $repo"
                    "NOT_EXISTS" | Out-File "$(Build.ArtifactStagingDirectory)/repo-precheck.txt" -Encoding utf8
                    Write-Host "##vso[task.setvariable variable=REPO_STATUS;isOutput=true]NOT_EXISTS"
                }
                finally {
                    $ErrorActionPreference = 'Continue'
                }
                exit 0

          # STEP 2.5 – PRE-MIGRATION SIZE & LFS CHECKS
          - task: PowerShell@2
            name: sizeCheck
            displayName: "Step 2.5 - Pre-Migration Size & LFS Checks"
            condition: and(succeeded(), ne(variables['repoCheck.REPO_STATUS'], 'ALREADY_EXISTS'))
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $adoOrg    = "$(ADO_Org)"
                $adoProj   = "$(ADO_Project)"
                $adoRepo   = "$(ADO_Repo)"
                $adoPat    = "$(ADO_PAT)"
                $auditDir  = "$(Build.ArtifactStagingDirectory)/audit"
                New-Item -ItemType Directory -Path $auditDir -Force | Out-Null

                if ($adoOrg -notmatch '^https?://') { $adoOrg = "https://dev.azure.com/$adoOrg" }
                $adoOrg = $adoOrg.TrimEnd('/')

                $base64Auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$adoPat"))
                $headers    = @{ Authorization = "Basic $base64Auth" }

                Write-Host "============================================"
                Write-Host "  PRE-MIGRATION CHECKS"
                Write-Host "  Repo: $adoOrg / $adoProj / $adoRepo"
                Write-Host "============================================"

                $blocked  = $false
                $warnings = @()

                # CHECK 1: Repo total size
                Write-Host "`n[CHECK 1] Repo Total Size..."
                $repoApi  = "$adoOrg/$adoProj/_apis/git/repositories/${adoRepo}?api-version=7.1"
                $repoInfo = Invoke-RestMethod -Uri $repoApi -Headers $headers -Method Get
                $sizeBytes = $repoInfo.size
                $sizeMB    = [math]::Round($sizeBytes / 1MB, 2)
                $sizeGB    = [math]::Round($sizeBytes / 1GB, 2)
                Write-Host "  Repo size: $sizeMB MB ($sizeGB GB)"

                $repoBlockedGB = ${{ parameters.repoSizeBlockedGB }}
                $repoWarningGB = ${{ parameters.repoSizeWarningGB }}
                $fileBlockedMB = ${{ parameters.fileSizeBlockedMB }}
                $fileWarningMB = ${{ parameters.fileSizeWarningMB }}
                Write-Host "  Thresholds: Repo BLOCKED > ${repoBlockedGB}GB | WARNING > ${repoWarningGB}GB | File BLOCKED > ${fileBlockedMB}MB | WARNING > ${fileWarningMB}MB"

                if ($sizeGB -gt $repoBlockedGB) {
                    Write-Host "##vso[task.logissue type=error]BLOCKED: Repo is $sizeGB GB — exceeds $repoBlockedGB GB limit"
                    $blocked = $true
                } elseif ($sizeGB -gt $repoWarningGB) {
                    Write-Host "##vso[task.logissue type=warning]WARNING: Repo is $sizeGB GB — exceeds $repoWarningGB GB threshold"
                    $warnings += "Repo size $sizeGB GB exceeds $repoWarningGB GB (risk of timeout)"
                } else {
                    Write-Host "  OK — under $repoWarningGB GB"
                }

                # CHECK 2: Individual files > threshold
                Write-Host "`n[CHECK 2] Large Files (> $fileWarningMB MB)..."
                $defaultBranch = if ($repoInfo.defaultBranch) { $repoInfo.defaultBranch -replace '^refs/heads/', '' } else { $null }
                $largeFiles    = @()

                if ($defaultBranch) {
                    $itemsUrl = "$adoOrg/$adoProj/_apis/git/repositories/$($repoInfo.id)/items?recursionLevel=Full&versionDescriptor.version=$defaultBranch&api-version=7.1"
                    try {
                        $itemsResp = Invoke-RestMethod -Uri $itemsUrl -Headers $headers -Method Get
                        if ($itemsResp.value) {
                            $largeFiles = @($itemsResp.value | Where-Object {
                                $_.PSObject.Properties['size'] -and $_.size -gt ($fileWarningMB * 1MB) -and
                                (-not $_.PSObject.Properties['isFolder'] -or -not $_.isFolder)
                            } | Sort-Object { $_.size } -Descending | Select-Object -First 20)
                        }
                    } catch {
                        Write-Host "##vso[task.logissue type=warning]Could not enumerate files via API: $_"
                    }
                }

                if ($largeFiles.Count -gt 0) {
                    Write-Host "##vso[task.logissue type=warning]WARNING: $($largeFiles.Count) file(s) exceed $fileWarningMB MB"
                    foreach ($f in $largeFiles) {
                        $fSizeMB = [math]::Round($f.size / 1MB, 2)
                        Write-Host "    $($f.path) — $fSizeMB MB"
                        if ($fSizeMB -gt $fileBlockedMB) {
                            Write-Host "##vso[task.logissue type=error]BLOCKED: $($f.path) is $fSizeMB MB — exceeds $fileBlockedMB MB limit"
                            $blocked = $true
                        }
                    }
                    $warnings += "$($largeFiles.Count) file(s) > $fileWarningMB MB found"
                } else {
                    Write-Host "  OK — no files > $fileWarningMB MB on default branch"
                }

                # CHECK 3: Git LFS detection
                Write-Host "`n[CHECK 3] Git LFS Usage..."
                $hasLfs     = $false
                $lfsPatterns = @()
                if ($defaultBranch) {
                    try {
                        $gitattrsUrl = "$adoOrg/$adoProj/_apis/git/repositories/$($repoInfo.id)/items?path=.gitattributes&api-version=7.1"
                        $gitattrs    = Invoke-RestMethod -Uri $gitattrsUrl -Headers $headers -Method Get -ErrorAction Stop
                        if ($gitattrs -match 'filter=lfs') {
                            $hasLfs      = $true
                            $lfsPatterns = @($gitattrs -split "`n" | Where-Object { $_ -match 'filter=lfs' })
                        }
                    } catch { }
                }

                if ($hasLfs) {
                    Write-Host "##vso[task.logissue type=warning]WARNING: Repo uses Git LFS — LFS objects will NOT be migrated by GEI"
                    foreach ($p in $lfsPatterns) { Write-Host "    $p" }
                    $warnings += "Git LFS detected — LFS files will be lost after migration"
                } else {
                    Write-Host "  OK — no Git LFS usage detected"
                }

                # SUMMARY
                Write-Host "`n============================================"
                Write-Host "  PRE-CHECK SUMMARY"
                Write-Host "============================================"
                Write-Host "  Repo Size    : $sizeMB MB ($sizeGB GB)"
                Write-Host "  Large Files  : $($largeFiles.Count) file(s) > $fileWarningMB MB"
                Write-Host "  Git LFS      : $(if ($hasLfs) { 'YES — LFS objects will NOT migrate' } else { 'No' })"
                Write-Host "  Warnings     : $($warnings.Count)"
                Write-Host "  Blocked      : $blocked"
                Write-Host "============================================"

                $precheckReport = [PSCustomObject]@{
                    Repo = $adoRepo; SizeMB = $sizeMB; SizeGB = $sizeGB
                    LargeFileCount = $largeFiles.Count; HasLFS = $hasLfs
                    Warnings = $warnings; Blocked = $blocked
                }
                $precheckReport | ConvertTo-Json -Depth 3 | Out-File "$(Build.ArtifactStagingDirectory)/audit/precheck-report.json" -Encoding utf8

                if ($blocked) {
                    Write-Host "##vso[task.logissue type=error]MIGRATION BLOCKED — requires approval to proceed"
                    Write-Host "##vso[task.setvariable variable=PRECHECK_RESULT;isOutput=true]BLOCKED"
                } elseif ($warnings.Count -gt 0) {
                    Write-Host "##vso[task.logissue type=warning]Proceeding with warnings"
                    Write-Host "##vso[task.setvariable variable=PRECHECK_RESULT;isOutput=true]WARNING"
                } else {
                    Write-Host "All pre-checks passed!"
                    Write-Host "##vso[task.setvariable variable=PRECHECK_RESULT;isOutput=true]PASSED"
                }
            env:
              ADO_PAT: $(ADO_PAT)

      # -----------------------------------------------------------------------
      # JOB 2 – APPROVAL GATE (only when WARNING or BLOCKED)
      # -----------------------------------------------------------------------
      - job: ApprovalGate
        displayName: "Approval Gate - Review Pre-Check Issues"
        dependsOn: PreChecks
        condition: and(succeeded(), in(dependencies.PreChecks.outputs['sizeCheck.PRECHECK_RESULT'], 'WARNING', 'BLOCKED'))
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@0
            displayName: "Review Pre-Check Issues Before Migration"
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: ""
              instructions: |
                Pre-migration checks detected issues for repo $(ADO_Repo).

                Review the PreChecks job logs for details on:
                - BLOCKED: Repo exceeds 40 GB or has files > 400 MB (GEI limits)
                - WARNING: Repo size > 10 GB (timeout risk), files > 100 MB, or Git LFS detected

                Approve to override and force migration, or Reject to cancel.
              onTimeout: "reject"

      # -----------------------------------------------------------------------
      # JOB 3 – MIGRATE & AUDIT
      # -----------------------------------------------------------------------
      - job: MigrateAndAudit
        displayName: "Migrate & Audit Repo"
        dependsOn:
          - PreChecks
          - ApprovalGate
        condition: |
          and(
            succeeded('PreChecks'),
            ne(dependencies.PreChecks.outputs['repoCheck.REPO_STATUS'], 'ALREADY_EXISTS'),
            in(dependencies.ApprovalGate.result, 'Succeeded', 'Skipped')
          )
        timeoutInMinutes: 120
        cancelTimeoutInMinutes: 1
        variables:
          REPO_STATUS:     $[ dependencies.PreChecks.outputs['repoCheck.REPO_STATUS'] ]
          PRECHECK_RESULT: $[ dependencies.PreChecks.outputs['sizeCheck.PRECHECK_RESULT'] ]
        steps:

          # RE-AUTHENTICATE (new agent)
          - task: PowerShell@2
            displayName: "Re-authenticate GitHub CLI"
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $env:GH_TOKEN = "$(GH_PAT)"
                echo $env:GH_TOKEN | gh auth login --with-token
                gh auth status
                gh extension install github/gh-ado2gh
                gh extension list

          # STEP 3 – MIGRATE REPO
          - task: PowerShell@2
            displayName: "Step 3 - Migrate Repo (gh ado2gh)"
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $env:GH_PAT  = "$(GH_PAT)"
                $env:ADO_PAT = "$(ADO_PAT)"
                $stateFile   = "$(Build.ArtifactStagingDirectory)/migration-state.txt"

                Write-Host "Starting migration..."
                Write-Host "  ADO:    $(ADO_Org)/$(ADO_Project)/$(ADO_Repo)"
                Write-Host "  GitHub: $(GitHub_Org)/$(GitHub_Repo)"

                "PENDING" | Out-File $stateFile -Encoding utf8
                "EXPORTING" | Out-File $stateFile -Encoding utf8

                $migOutput = gh ado2gh migrate-repo `
                  --ado-org "$(ADO_Org)" `
                  --ado-team-project "$(ADO_Project)" `
                  --ado-repo "$(ADO_Repo)" `
                  --github-org "$(GitHub_Org)" `
                  --github-repo "$(GitHub_Repo)" 2>&1

                $migOutput | ForEach-Object { Write-Host $_ }

                if ($LASTEXITCODE -eq 0) {
                    "COMPLETE" | Out-File $stateFile -Encoding utf8
                } elseif ($migOutput -match "already been queued") {
                    Write-Host "Migration already queued. Waiting for completion..."
                    "WAITING" | Out-File $stateFile -Encoding utf8
                    $env:GH_TOKEN = "$(GH_PAT)"
                    $found = $false
                    for ($w = 1; $w -le 30; $w++) {
                        Start-Sleep -Seconds 60
                        Write-Host "  Check $w/30 - Verifying repo in GitHub..."
                        try {
                            gh repo view "$(GitHub_Org)/$(GitHub_Repo)" --json name 2>&1 | Out-Null
                            if ($LASTEXITCODE -eq 0) { $found = $true; break }
                        } catch { }
                    }
                    if ($found) {
                        "COMPLETE" | Out-File $stateFile -Encoding utf8
                    } else {
                        "FAILED" | Out-File $stateFile -Encoding utf8
                        exit 1
                    }
                } else {
                    "FAILED" | Out-File $stateFile -Encoding utf8
                    exit 1
                }

          # STEP 4 – POST-MIGRATION AUDIT (BRANCH-WISE)
          - task: PowerShell@2
            displayName: "Step 4 - Post-Migration Audit (Branch-Wise)"
            condition: always()
            continueOnError: true
            inputs:
              targetType: inline
              pwsh: true
              errorActionPreference: continue
              script: |
                $ProgressPreference = 'SilentlyContinue'
                $ghOrg    = "$(GitHub_Org)"
                $ghRepo   = "$(GitHub_Repo)"
                $ghPat    = "$(GH_PAT)"
                $auditDir = "$(Build.ArtifactStagingDirectory)/audit"
                New-Item -ItemType Directory -Path $auditDir -Force | Out-Null
                New-Item -ItemType Directory -Path "$auditDir/folder-listing" -Force | Out-Null

                Write-Host "============================================"
                Write-Host "  GITHUB POST-MIGRATION AUDIT (BRANCH-WISE)"
                Write-Host "  Repo: $ghOrg / $ghRepo"
                Write-Host "  Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
                Write-Host "============================================"

                Write-Host "Cloning GitHub repo (blobless mirror)..."
                $ErrorActionPreference = 'SilentlyContinue'
                git clone --filter=blob:none --mirror "https://$ghPat@github.com/$ghOrg/$ghRepo.git" gh-mirror 2>&1 | ForEach-Object { Write-Host $_ }
                $ErrorActionPreference = 'Continue'

                if ($LASTEXITCODE -ne 0) {
                    Write-Host "##vso[task.logissue type=warning]Could not clone GitHub repo for audit"
                    exit 0
                }
                Set-Location gh-mirror

                $branches    = git branch | ForEach-Object { $_.Trim().TrimStart("* ") } | Where-Object { $_ -ne "" }
                $branchCount = $branches.Count
                Write-Host "Total Branches: $branchCount"
                $branches | Out-File "$auditDir/gh-branches.txt" -Encoding utf8

                $defaultBranchRef = git symbolic-ref HEAD 2>$null
                $defaultBranch    = if ($defaultBranchRef) { $defaultBranchRef.Trim() -replace '^refs/heads/', '' }
                                    elseif ($branchCount -gt 0) { $branches[0].Trim() } else { "" }
                Write-Host "Default Branch: $defaultBranch"
                $defaultBranch | Out-File "$auditDir/gh-default-branch.txt" -Encoding utf8

                $tags     = git tag -l
                $tagCount = if ($tags) { ($tags | Measure-Object).Count } else { 0 }
                Write-Host "Total Tags: $tagCount"
                if ($tags) { $tags | Out-File "$auditDir/gh-tags.txt" -Encoding utf8 }
                else        { ""    | Out-File "$auditDir/gh-tags.txt" -Encoding utf8 }

                $totalCommits  = (git rev-list --count --all).Trim()
                $latestHash    = (git log -1 --format="%H").Trim()
                $latestAuthor  = (git log -1 --format="%an").Trim()
                $latestDate    = (git log -1 --format="%ad" --date=short).Trim()
                $latestMessage = (git log -1 --format="%s").Trim()

                git count-objects -vH | Out-File "$auditDir/gh-repo-size.txt" -Encoding utf8

                Write-Host "`n============================================"
                Write-Host "  BRANCH-WISE DETAILS"
                Write-Host "============================================"

                # Batch-fetch per-branch metadata
                $refMeta  = @{}
                $refLines = git for-each-ref --format='%(refname:short)|%(objectname:short=12)|%(authorname)|%(creatordate:short)|%(subject)' refs/heads/ 2>$null
                if ($refLines) {
                    foreach ($line in $refLines) {
                        $parts = $line -split '\|', 5
                        if ($parts.Count -ge 5) {
                            $refMeta[$parts[0]] = @{ Hash=$parts[1]; Author=$parts[2]; Date=$parts[3]; Msg=$parts[4] }
                        }
                    }
                }

                $branchCsvRows    = @()
                $bIdx             = 0
                $folderFileCsv    = "$auditDir/gh-folder-wise-files.csv"
                $folderSummaryCsv = "$auditDir/gh-folder-summary.csv"
                $csvHeaderWritten = $false
                $totalFolderFiles = 0
                $totalFolderRows  = 0

                foreach ($branch in $branches) {
                    $b = $branch.Trim()
                    if ($b -eq "") { continue }
                    $bIdx++
                    Write-Host "  [$bIdx/$branchCount] Branch: $b"

                    $bFileCount   = "-"
                    $bFolderCount = "-"

                    if ($b -eq $defaultBranch) {
                        $bFiles     = git ls-tree -r --name-only $b 2>$null
                        $bFileCount = if ($bFiles) { ($bFiles | Measure-Object).Count } else { 0 }

                        if ($bFileCount -gt 50000) {
                            Write-Host "    WARNING: $bFileCount files — skipping folder enumeration (50K cap)"
                            $bFolderCount = "50K+ (skipped)"
                            $bFiles       = $null
                        } else {
                            $filesByFolder = [ordered]@{}
                            if ($bFiles) {
                                foreach ($f in $bFiles) {
                                    $folder = Split-Path $f -Parent
                                    if (-not $folder -or $folder -eq "") { $folder = "(root)" }
                                    $folder = $folder -replace '\\', '/'
                                    if (-not $filesByFolder.Contains($folder)) { $filesByFolder[$folder] = @() }
                                    $filesByFolder[$folder] += Split-Path $f -Leaf
                                }
                            }
                            $bFolderCount  = $filesByFolder.Keys.Count
                            $safeBranch    = $b -replace '[/\\]', '--'
                            $branchFileMd  = "# Files in branch: $b`n`n"
                            foreach ($folder in ($filesByFolder.Keys | Sort-Object)) {
                                $branchFileMd += "## $folder/`n"
                                foreach ($file in ($filesByFolder[$folder] | Sort-Object)) { $branchFileMd += "- $file`n" }
                                $branchFileMd += "`n"
                            }
                            $branchFileMd | Out-File "$auditDir/folder-listing/gh-files-$safeBranch.md" -Encoding utf8

                            foreach ($folder in $filesByFolder.Keys) {
                                [PSCustomObject]@{ Branch=$b; Folder=$folder; FileCount=$filesByFolder[$folder].Count } |
                                    Export-Csv -Path $folderSummaryCsv -NoTypeInformation -Encoding utf8 -Append:$csvHeaderWritten -Force
                                $totalFolderRows++
                                foreach ($file in $filesByFolder[$folder]) {
                                    [PSCustomObject]@{ Branch=$b; Folder=$folder; FileName=$file } |
                                        Export-Csv -Path $folderFileCsv -NoTypeInformation -Encoding utf8 -Append:$csvHeaderWritten -Force
                                    $totalFolderFiles++
                                }
                                if (-not $csvHeaderWritten) { $csvHeaderWritten = $true }
                            }

                            $folderSummaryMd = "| Folder | Files |`n|---|---|`n"
                            $folderTotal     = 0
                            foreach ($folder in ($filesByFolder.Keys | Sort-Object)) {
                                $fc           = $filesByFolder[$folder].Count
                                $folderTotal += $fc
                                $folderSummaryMd += "| $folder | $fc |`n"
                            }
                            $folderSummaryMd += "| **Total** | **$folderTotal** |`n"
                            $folderSummaryMd | Out-File "$auditDir/gh-folder-summary-default.md" -Encoding utf8
                            $bFiles        = $null
                            $filesByFolder = $null
                        }
                    }

                    if ($refMeta.ContainsKey($b)) {
                        $bHashShort = $refMeta[$b].Hash; $bAuthor = $refMeta[$b].Author
                        $bDate      = $refMeta[$b].Date;  $bMsg   = $refMeta[$b].Msg
                    } else {
                        $bHashShort = "N/A"; $bAuthor = "N/A"; $bDate = "N/A"; $bMsg = "N/A"
                    }

                    Write-Host "    Status: Migrated | Files: $bFileCount | Folders: $bFolderCount"
                    $branchCsvRows += [PSCustomObject]@{
                        Branch=$b; Status="Migrated"; Files=$bFileCount; Folders=$bFolderCount
                        LatestHash=$bHashShort; LatestAuthor=$bAuthor; LatestDate=$bDate; LatestMsg=$bMsg
                    }
                }

                $branchCsvRows | Export-Csv "$auditDir/gh-branch-wise-data.csv" -NoTypeInformation -Encoding utf8

                # Top 5 key branches
                $topBranches = $branchCsvRows | Sort-Object {
                    $bn = $_.Branch
                    if ($bn -eq $defaultBranch) { 0 }
                    elseif ($bn -match '^(main|master)$') { 1 }
                    elseif ($bn -match '^(develop|development)$') { 2 }
                    elseif ($bn -match '^(release|hotfix)[/\-]') { 3 }
                    else { 99 }
                }, Branch | Select-Object -First 5
                $topRows = @()
                foreach ($tb in $topBranches) {
                    $cnt    = (git rev-list --count $tb.Branch 2>$null)
                    $cnt    = if ($cnt) { $cnt.Trim() } else { "0" }
                    $fmtCnt = "{0:N0}" -f [long]$cnt
                    $isDef  = if ($tb.Branch -eq $defaultBranch) { "Yes" } else { "No" }
                    $topRows += [PSCustomObject]@{ Branch=$tb.Branch; Commits=$fmtCnt; IsDefault=$isDef }
                }
                $topRows | Export-Csv "$auditDir/gh-top-branches.csv" -NoTypeInformation -Encoding utf8

                # PR Audit
                Set-Location ..
                $env:GH_TOKEN = $ghPat
                $allPRs = @()
                $page   = 1
                do {
                    $prs = gh api "repos/$ghOrg/$ghRepo/pulls?state=all&per_page=100&page=$page" 2>$null | ConvertFrom-Json
                    if ($prs -and $prs.Count -gt 0) { $allPRs += $prs; $page++ } else { break }
                } while ($prs.Count -eq 100)

                $totalPRs    = $allPRs.Count
                $totalOpen   = 0; $totalMerged = 0; $totalClosed = 0
                $prByHead    = @{}
                foreach ($pr in $allPRs) {
                    $head = $pr.head.ref
                    if (-not $prByHead.ContainsKey($head)) { $prByHead[$head] = @{ Open=0; Merged=0; Closed=0 } }
                    if     ($pr.state -eq "open")  { $prByHead[$head].Open++;   $totalOpen++ }
                    elseif ($pr.merged_at)          { $prByHead[$head].Merged++; $totalMerged++ }
                    else                            { $prByHead[$head].Closed++; $totalClosed++ }
                }

                $branchCount  | Out-File "$auditDir/gh-branch-count.txt"  -Encoding utf8
                $tagCount     | Out-File "$auditDir/gh-tag-count.txt"     -Encoding utf8
                $totalCommits | Out-File "$auditDir/gh-commit-count.txt"  -Encoding utf8
                $totalPRs     | Out-File "$auditDir/gh-pr-count.txt"      -Encoding utf8
                $totalOpen    | Out-File "$auditDir/gh-pr-open.txt"       -Encoding utf8
                $totalMerged  | Out-File "$auditDir/gh-pr-merged.txt"     -Encoding utf8
                $totalClosed  | Out-File "$auditDir/gh-pr-closed.txt"     -Encoding utf8
                $latestHash   | Out-File "$auditDir/gh-latest-hash.txt"   -Encoding utf8
                Write-Host "Audit completed."

          # STEP 5 – DOWNLOAD MIGRATION LOGS
          - task: PowerShell@2
            displayName: "Step 5 - Download Migration Logs"
            condition: and(always(), ne(variables['REPO_STATUS'], 'ALREADY_EXISTS'))
            continueOnError: true
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $env:GH_PAT   = "$(GH_PAT)"
                $env:GH_TOKEN = "$(GH_PAT)"
                $logDir = "$(Build.ArtifactStagingDirectory)/migration-logs"
                New-Item -ItemType Directory -Path $logDir -Force | Out-Null
                $repo    = "$(GitHub_Repo)"
                $repoDir = "$logDir/$repo"
                New-Item -ItemType Directory -Path $repoDir -Force | Out-Null
                $logFile = "$repoDir/migration-log-$repo.log"

                Write-Host "Waiting 300 seconds for GEI logs to be available..."
                Start-Sleep -Seconds 300

                $success = $false
                for ($i = 1; $i -le 15; $i++) {
                    try {
                        gh ado2gh download-logs `
                          --github-org "$(GitHub_Org)" `
                          --github-repo "$repo" `
                          --migration-log-file "$logFile" `
                          --overwrite 2>&1
                        if ($LASTEXITCODE -eq 0) { $success = $true; break }
                        else { Write-Host "  Attempt ${i}: exit $LASTEXITCODE. Waiting 60s..."; Start-Sleep -Seconds 60 }
                    } catch {
                        Write-Host "  Attempt ${i}: $($_.Exception.Message). Waiting 60s..."
                        Start-Sleep -Seconds 60
                    }
                }
                if (-not $success) {
                    "Log download failed after 15 retries for $repo" | Out-File $logFile -Encoding utf8
                }
                exit 0

          # STEP 6a – ENSURE LOGS DIR EXISTS
          - task: PowerShell@2
            displayName: "Step 6a - Ensure Migration Logs Directory Exists"
            condition: always()
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $logDir = "$(Build.ArtifactStagingDirectory)/migration-logs"
                if (-not (Test-Path $logDir)) {
                    New-Item -ItemType Directory -Path $logDir -Force | Out-Null
                    "No migration logs available." | Out-File "$logDir/no-logs.txt" -Encoding utf8
                    Write-Host "##vso[task.setvariable variable=MIGRATION_LOGS_EXIST]false"
                } else {
                    Write-Host "##vso[task.setvariable variable=MIGRATION_LOGS_EXIST]true"
                }

          # STEP 6b – PUBLISH MIGRATION LOGS
          - task: PublishPipelineArtifact@1
            displayName: "Step 6b - Publish Migration Logs"
            condition: always()
            continueOnError: true
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/migration-logs"
              artifact: "MigrationLogs"
              publishLocation: pipeline

          # STEP 7 – PUBLISH AUDIT ARTIFACTS
          - task: PublishPipelineArtifact@1
            displayName: "Step 7 - Publish Audit Data"
            condition: always()
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/audit"
              artifact: "MigrationAudit"
              publishLocation: pipeline

          # STEP 8 – CALCULATE REPO SIZE FROM GITHUB
          - task: PowerShell@2
            displayName: "Step 8 - Calculate Repo Size (GitHub API)"
            condition: always()
            continueOnError: true
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $ghOrg        = "$(GitHub_Org)"
                $ghRepo       = "$(GitHub_Repo)"
                $auditDir     = "$(Build.ArtifactStagingDirectory)/audit"
                $env:GH_TOKEN = "$(GH_PAT)"
                $actualSize   = "N/A"

                for ($i = 1; $i -le 5; $i++) {
                    $rawSize = gh api "repos/$ghOrg/$ghRepo" --jq '.size' 2>$null
                    if ($rawSize -and $rawSize -match '^\d+$' -and [long]$rawSize -gt 0) {
                        $sizeKB = [long]$rawSize
                        if     ($sizeKB -ge 1048576) { $actualSize = "{0:N2} GB" -f ($sizeKB / 1048576) }
                        elseif ($sizeKB -ge 1024)    { $actualSize = "{0:N2} MB" -f ($sizeKB / 1024) }
                        else                         { $actualSize = "$sizeKB KB" }
                        break
                    }
                    Write-Host "  Attempt $i/5 — waiting for GitHub to calculate repo size..."
                    Start-Sleep -Seconds 20
                }
                $actualSize | Out-File "$auditDir/gh-repo-size-actual.txt" -Encoding utf8
                Write-Host "Final repo size: $actualSize"

          # STEP 9 – GENERATE MIGRATION DASHBOARD
          - task: PowerShell@2
            displayName: "Step 9 - Generate Migration Dashboard"
            condition: always()
            continueOnError: true
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $auditDir     = "$(Build.ArtifactStagingDirectory)/audit"
                $repo         = "$(GitHub_Repo)"
                $adoRepo      = "$(ADO_Repo)"
                $precheckFile = "$(Build.ArtifactStagingDirectory)/repo-precheck.txt"

                $precheckStatus = if (Test-Path $precheckFile) { (Get-Content $precheckFile -Raw).Trim() } else { "UNKNOWN" }

                $logFile       = "$(Build.ArtifactStagingDirectory)/migration-logs/$repo/migration-log-$repo.log"
                $stateFilePath = "$(Build.ArtifactStagingDirectory)/migration-state.txt"
                $migStateValue = if (Test-Path $stateFilePath) { (Get-Content $stateFilePath -Raw).Trim() } else { "UNKNOWN" }

                $migrationResult = "Failed"
                if ($precheckStatus -eq "ALREADY_EXISTS") {
                    $migrationResult = "Already Exists"
                } elseif ($migStateValue -eq "COMPLETE") {
                    $migrationResult = "Success"
                } elseif (Test-Path $logFile) {
                    $logContent = Get-Content $logFile -Raw
                    if ($logContent -match "successfully|completed") { $migrationResult = "Success" }
                }

                function Get-Val($file) {
                    $p = "$auditDir/$file"
                    if (Test-Path $p) { return (Get-Content $p -Raw).Trim() }
                    return "N/A"
                }

                $branchCount = Get-Val "gh-branch-count.txt"
                $tagCount    = Get-Val "gh-tag-count.txt"
                $commitCount = Get-Val "gh-commit-count.txt"
                $prCount     = Get-Val "gh-pr-count.txt"
                $prOpen      = Get-Val "gh-pr-open.txt"
                $prMerged    = Get-Val "gh-pr-merged.txt"
                $prClosed    = Get-Val "gh-pr-closed.txt"
                $actualSize  = Get-Val "gh-repo-size-actual.txt"
                $migDate     = Get-Date -Format 'dd MMM yyyy · HH:mm'

                if ($migrationResult -eq "Already Exists") {
                    $statusEmoji = "&#x26A0;&#xFE0F;"; $statusText = "Skipped &#x2014; Already Exists"
                    $statusColor = "#f0ad4e"; $statusBg = "#fff8e1"; $reasonText = "Target repository already existed in GitHub."
                } elseif ($migrationResult -eq "Success") {
                    $statusEmoji = "&#x2705;"; $statusText = "Completed &#x2014; Migration Successful"
                    $statusColor = "#28a745"; $statusBg = "#e6f9ed"; $reasonText = "Repository migrated successfully from ADO to GitHub."
                } else {
                    $statusEmoji = "&#x274C;"; $statusText = "Failed &#x2014; Migration Error"
                    $statusColor = "#dc3545"; $statusBg = "#fdecea"; $reasonText = "Check migration logs for error details."
                }

                $htmlDir = "$(Build.ArtifactStagingDirectory)/dashboard"
                New-Item -ItemType Directory -Path $htmlDir -Force | Out-Null

                $html = @"
                <!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'>
                <title>Migration Report - $repo</title>
                <style>body{font-family:Segoe UI,sans-serif;background:#f4f6f9;color:#333;padding:30px;}
                .header{background:linear-gradient(135deg,#0d1117,#161b22);color:#fff;padding:32px;border-radius:14px;margin-bottom:24px;}
                .status-banner{display:inline-block;padding:10px 22px;border-radius:8px;font-size:18px;font-weight:600;background:$statusBg;color:$statusColor;border:2px solid $statusColor;}
                .card{background:#fff;border-radius:12px;padding:28px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
                .card h2{font-size:22px;margin-bottom:18px;color:#0d1117;border-bottom:2px solid #e1e4e8;padding-bottom:10px;}
                table{width:100%;border-collapse:collapse;}th{background:#f6f8fa;text-align:left;padding:12px 16px;border-bottom:2px solid #d0d7de;}
                td{padding:11px 16px;border-bottom:1px solid #eaecef;}tr:hover{background:#f6f8fa;}
                .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;}
                .stat-box{background:#f6f8fa;border-radius:10px;padding:20px;text-align:center;border:1px solid #e1e4e8;}
                .stat-box .num{font-size:32px;font-weight:700;color:#0d1117;}.stat-box .label{font-size:14px;color:#666;margin-top:4px;}
                .footer{text-align:center;color:#999;font-size:13px;margin-top:30px;padding-top:16px;border-top:1px solid #e1e4e8;}</style></head>
                <body><div>
                <div class='header'><h1>&#x1F680; ADO &#x2192; GitHub Migration Report</h1>
                <div class='status-banner'>$statusEmoji $statusText</div></div>
                <div class='card'><h2>&#x1F4C2; Migration Overview</h2><table>
                <tr><td><b>Date</b></td><td>$migDate</td></tr>
                <tr><td><b>Source (ADO)</b></td><td><code>$(ADO_Org) / $(ADO_Project) / $adoRepo</code></td></tr>
                <tr><td><b>Target (GitHub)</b></td><td><code>$(GitHub_Org) / $repo</code></td></tr>
                </table></div>
                <div class='card'><h2>&#x1F4CA; Repository Snapshot</h2><div class='stat-grid'>
                <div class='stat-box'><div class='num'>$branchCount</div><div class='label'>Branches</div></div>
                <div class='stat-box'><div class='num'>$tagCount</div><div class='label'>Tags</div></div>
                <div class='stat-box'><div class='num'>$commitCount</div><div class='label'>Commits</div></div>
                <div class='stat-box'><div class='num'>$prCount</div><div class='label'>Pull Requests</div></div>
                <div class='stat-box'><div class='num'>$actualSize</div><div class='label'>Repo Size</div></div>
                </div><p style='margin-top:12px;'>PRs: <b>$prOpen</b> Open / <b>$prMerged</b> Merged / <b>$prClosed</b> Closed</p></div>
                <div class='footer'>Generated on $migDate &bull; ADO-to-GitHub Migration Pipeline</div>
                </div></body></html>
"@
                $html | Out-File "$htmlDir/migration-report.html" -Encoding utf8
                Write-Host "HTML dashboard saved."

          # STEP 9a – PUBLISH HTML DASHBOARD ARTIFACT
          - task: PublishPipelineArtifact@1
            displayName: "Step 9a - Publish HTML Dashboard"
            condition: always()
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/dashboard"
              artifact: "MigrationDashboard"
              publishLocation: pipeline

          # STEP 9b – SHOW HTML ON PIPELINE TAB
          - task: PublishHtmlReport@1
            displayName: "Step 9b - Show HTML on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: "$(Build.ArtifactStagingDirectory)/dashboard/migration-report.html"
              tabName: "Migration Report"

          # STEP 9c – PUBLISH SUMMARY TO ADO TAB
          - task: PowerShell@2
            displayName: "Step 9c - Publish Summary to ADO Tab"
            condition: always()
            inputs:
              targetType: inline
              pwsh: true
              script: |
                Write-Host "##vso[task.uploadsummary]$(Build.SourcesDirectory)/migration-report.md"

  # ===========================================================================
  # STAGE 4 – CREATE GITHUB SECRETS (push scrubbed secrets to GitHub)
  # ===========================================================================
  - stage: CreateGitHubSecrets
    displayName: "Stage 4 - Create GitHub Secrets"
    dependsOn: SingleRepoMigration
    condition: succeeded('SingleRepoMigration')
    jobs:
      - job: PushSecrets
        displayName: "4.1 Push Scrubbed Secrets to GitHub repo"
        timeoutInMinutes: 30
        steps:
          - checkout: self
            fetchDepth: 0

          - task: DownloadPipelineArtifact@2
            displayName: "Download scrub results"
            inputs:
              artifactName: "secret-scrub-results"
              targetPath: "$(Build.SourcesDirectory)/migration-accelerator/output/scrubbed"

          - task: PowerShell@2
            displayName: "Create GitHub Secrets from saved values"
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $ErrorActionPreference = "Continue"
                $secretsFile = "$(Build.SourcesDirectory)/migration-accelerator/output/scrubbed/secret-values.json"

                if (-not (Test-Path $secretsFile)) {
                    Write-Host "No secret-values.json found — no secrets to create." -ForegroundColor Green
                    exit 0
                }

                $secrets = Get-Content $secretsFile -Raw | ConvertFrom-Json
                if ($secrets.Count -eq 0) {
                    Write-Host "No secrets in secret-values.json — all repos were clean." -ForegroundColor Green
                    exit 0
                }

                Write-Host "=== Creating GitHub Secrets ===" -ForegroundColor Cyan
                Write-Host "Total secrets to create: $($secrets.Count)" -ForegroundColor Yellow

                $created      = 0
                $failed       = 0
                $failedSecrets = @()
                $maxRetries   = 3

                foreach ($entry in $secrets) {
                    Write-Host "`n  Repo: $($entry.GitHubRepo)" -ForegroundColor Yellow
                    Write-Host "    Secret: $($entry.SecretName) ($($entry.RuleID))" -ForegroundColor Gray

                    # Validate secret name
                    if ($entry.SecretName -notmatch '^[A-Za-z_][A-Za-z0-9_]*$') {
                        Write-Host "    ✗ Invalid secret name '$($entry.SecretName)'" -ForegroundColor Red
                        $failedSecrets += [PSCustomObject]@{ SecretName=$entry.SecretName; Repo=$entry.GitHubRepo; Error="Invalid secret name format" }
                        $failed++
                        continue
                    }

                    # Validate secret value
                    if ([string]::IsNullOrWhiteSpace($entry.SecretValue)) {
                        Write-Host "    ✗ Empty secret value for '$($entry.SecretName)'" -ForegroundColor Red
                        $failedSecrets += [PSCustomObject]@{ SecretName=$entry.SecretName; Repo=$entry.GitHubRepo; Error="Empty secret value" }
                        $failed++
                        continue
                    }

                    $success = $false
                    for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
                        try {
                            $entry.SecretValue | gh secret set $entry.SecretName --repo $entry.GitHubRepo 2>&1
                            if ($LASTEXITCODE -eq 0) {
                                Write-Host "    ✓ Created: $($entry.SecretName)" -ForegroundColor Green
                                $created++; $success = $true; break
                            } else {
                                Write-Host "    ⚠ Attempt $attempt/$maxRetries failed (exit: $LASTEXITCODE)" -ForegroundColor Yellow
                            }
                        } catch {
                            Write-Host "    ⚠ Attempt $attempt/$maxRetries error: $_" -ForegroundColor Yellow
                        }
                        if ($attempt -lt $maxRetries) {
                            $delay = [math]::Pow(2, $attempt)
                            Write-Host "    Retrying in ${delay}s..." -ForegroundColor Gray
                            Start-Sleep -Seconds $delay
                        }
                    }

                    if (-not $success) {
                        $failedSecrets += [PSCustomObject]@{ SecretName=$entry.SecretName; Repo=$entry.GitHubRepo; Error="Failed after $maxRetries retries" }
                        $failed++
                    }
                    Start-Sleep -Milliseconds 500
                }

                Write-Host "`n=== GitHub Secrets Summary ===" -ForegroundColor Cyan
                Write-Host "Created: $created" -ForegroundColor Green
                Write-Host "Failed:  $failed"  -ForegroundColor $(if ($failed -gt 0) { "Yellow" } else { "Green" })

                if ($failedSecrets.Count -gt 0) {
                    Write-Host "`n=== Failed Secrets ===" -ForegroundColor Yellow
                    foreach ($fs in $failedSecrets) {
                        Write-Host "  ✗ $($fs.SecretName) @ $($fs.Repo) — $($fs.Error)" -ForegroundColor Red
                    }
                }

                # Delete for security
                Remove-Item $secretsFile -Force
                Write-Host "Deleted secret-values.json for security." -ForegroundColor Gray

                if ($created -eq 0 -and $failed -gt 0) {
                    Write-Error "All $failed secrets failed to create."
                    exit 1
                } elseif ($failed -gt 0) {
                    Write-Host "##vso[task.logissue type=warning]$failed out of $($created + $failed) secrets failed."
                    Write-Host "##vso[task.complete result=SucceededWithIssues;]$failed secrets failed"
                }
            workingDirectory: "$(Build.SourcesDirectory)/migration-accelerator"
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)