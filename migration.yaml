trigger: none

pool: 
  vmImage: windows-latest

variables:
  - group: log

stages:
  # =================================================
  # STAGE 1 – SETUP
  # =================================================
  - stage: Setup
    displayName: "Stage 1 - Install Tools"
    jobs:
      - job: InstallTools
        steps:
          - powershell: |
              Write-Host "Installing GitHub CLI..."
              winget install --id GitHub.cli -e --source winget
              gh --version
            displayName: Install GitHub CLI

  # =================================================
  # STAGE 2 – SINGLE REPO MIGRATION WITH BRANCH-WISE AUDIT
  # =================================================
  - stage: SingleRepoMigration
    displayName: "Stage 2 - Migrate & Audit"
    dependsOn: Setup
    jobs:
      - job: MigrateSingleRepo
        timeoutInMinutes: 120
        cancelTimeoutInMinutes: 1
        steps:
          # -------------------------------------------
          # STEP 1 – AUTHENTICATE & INSTALL EXTENSION
          # -------------------------------------------
          - task: PowerShell@2
            displayName: "Step 1 - Authenticate GitHub & Install ado2gh"
            inputs:
              targetType: "inline"
              script: |
                $env:GH_TOKEN = "$(GH_PAT)"
                echo $env:GH_TOKEN | gh auth login --with-token
                gh auth status
                gh extension install github/gh-ado2gh
                gh extension list

          # -------------------------------------------
          # STEP 2 – PRE-CHECK REPO IN GITHUB
          # -------------------------------------------
          - task: PowerShell@2
            displayName: "Step 2 - Pre-check Repo Existence in GitHub"
            continueOnError: true
            inputs:
              targetType: "inline"
              script: |
                $env:GH_TOKEN = "$(GH_PAT)"
                $repo = "$(GitHub_Repo)"
                $org  = "$(GitHub_Org)"

                Write-Host "========== Pre-Migration Repository Status =========="
                Write-Host "Checking repository: $org/$repo"

                try {
                    $ErrorActionPreference = 'Stop'
                    [void](gh repo view "$org/$repo" --json name 2>&1)
                    Write-Host "Repo already exists in GitHub: $repo"
                    "ALREADY_EXISTS" | Out-File "$(Build.ArtifactStagingDirectory)\repo-precheck.txt" -Encoding utf8
                    Write-Host "##vso[task.setvariable variable=REPO_STATUS]ALREADY_EXISTS"
                }
                catch {
                    Write-Host "Repo does not exist yet (will be migrated): $repo"
                    "NOT_EXISTS" | Out-File "$(Build.ArtifactStagingDirectory)\repo-precheck.txt" -Encoding utf8
                    Write-Host "##vso[task.setvariable variable=REPO_STATUS]NOT_EXISTS"
                }
                finally {
                    $ErrorActionPreference = 'Continue'
                }
                exit 0

          # -------------------------------------------
          # STEP 2.5 – PRE-MIGRATION SIZE & LFS CHECKS
          # -------------------------------------------
          - task: PowerShell@2
            displayName: "Step 2.5 - Pre-Migration Size & LFS Checks"
            condition: and(succeeded(), ne(variables['REPO_STATUS'], 'ALREADY_EXISTS'))
            inputs:
              targetType: "inline"
              script: |
                $adoOrg    = "$(ADO_Org)"
                $adoProj   = "$(ADO_Project)"
                $adoRepo   = "$(ADO_Repo)"
                $adoPat    = "$(ADO_PAT)"
                $auditDir  = "$(Build.ArtifactStagingDirectory)\audit"
                New-Item -ItemType Directory -Path $auditDir -Force | Out-Null

                $base64Auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$adoPat"))
                $headers = @{ Authorization = "Basic $base64Auth" }

                Write-Host "============================================"
                Write-Host "  PRE-MIGRATION CHECKS"
                Write-Host "  Repo: $adoOrg / $adoProj / $adoRepo"
                Write-Host "============================================"

                $blocked = $false
                $warnings = @()

                # ── CHECK 1: Repo total size (ADO API) ──
                Write-Host "`n[CHECK 1] Repo Total Size..."
                $repoApi = "$adoOrg/$adoProj/_apis/git/repositories/${adoRepo}?api-version=7.1"
                $repoInfo = Invoke-RestMethod -Uri $repoApi -Headers $headers -Method Get
                $sizeBytes = $repoInfo.size
                $sizeMB = [math]::Round($sizeBytes / 1MB, 2)
                $sizeGB = [math]::Round($sizeBytes / 1GB, 2)
                Write-Host "  Repo size: $sizeMB MB ($sizeGB GB)"

                if ($sizeGB -gt 40) {
                    Write-Host "##vso[task.logissue type=error]BLOCKED: Repo is $sizeGB GB — exceeds GEI 40 GB archive limit"
                    $blocked = $true
                } elseif ($sizeGB -gt 10) {
                    Write-Host "##vso[task.logissue type=warning]WARNING: Repo is $sizeGB GB — may timeout during migration"
                    $warnings += "Repo size $sizeGB GB exceeds 10 GB (risk of timeout)"
                } else {
                    Write-Host "  OK — under 10 GB"
                }

                # ── CHECK 2: Individual files > 100 MB ──
                Write-Host "`n[CHECK 2] Large Files (> 100 MB)..."
                $defaultBranch = if ($repoInfo.defaultBranch) { $repoInfo.defaultBranch -replace '^refs/heads/', '' } else { $null }
                $largeFiles = @()

                if ($defaultBranch) {
                    $itemsUrl = "$adoOrg/$adoProj/_apis/git/repositories/$($repoInfo.id)/items?recursionLevel=Full&versionDescriptor.version=$defaultBranch&api-version=7.1"
                    try {
                        $itemsResp = Invoke-RestMethod -Uri $itemsUrl -Headers $headers -Method Get
                        if ($itemsResp.value) {
                            $largeFiles = @($itemsResp.value | Where-Object {
                                $_.PSObject.Properties['size'] -and $_.size -gt (100 * 1MB) -and
                                (-not $_.PSObject.Properties['isFolder'] -or -not $_.isFolder)
                            } | Sort-Object { $_.size } -Descending | Select-Object -First 20)
                        }
                    } catch {
                        Write-Host "##vso[task.logissue type=warning]Could not enumerate files via API: $_"
                    }
                }

                if ($largeFiles.Count -gt 0) {
                    Write-Host "##vso[task.logissue type=warning]WARNING: $($largeFiles.Count) file(s) exceed 100 MB"
                    foreach ($f in $largeFiles) {
                        $fSizeMB = [math]::Round($f.size / 1MB, 2)
                        Write-Host "    $($f.path) — $fSizeMB MB"
                        if ($fSizeMB -gt 400) {
                            Write-Host "##vso[task.logissue type=error]BLOCKED: $($f.path) is $fSizeMB MB — exceeds GEI 400 MB file limit"
                            $blocked = $true
                        }
                    }
                    $warnings += "$($largeFiles.Count) file(s) > 100 MB found"
                } else {
                    Write-Host "  OK — no files > 100 MB on default branch"
                }

                # ── CHECK 3: Git LFS detection ──
                Write-Host "`n[CHECK 3] Git LFS Usage..."
                $hasLfs = $false
                $lfsPatterns = @()
                if ($defaultBranch) {
                    try {
                        $gitattrsUrl = "$adoOrg/$adoProj/_apis/git/repositories/$($repoInfo.id)/items?path=.gitattributes&api-version=7.1"
                        $gitattrs = Invoke-RestMethod -Uri $gitattrsUrl -Headers $headers -Method Get -ErrorAction Stop
                        if ($gitattrs -match 'filter=lfs') {
                            $hasLfs = $true
                            $lfsPatterns = @($gitattrs -split "`n" | Where-Object { $_ -match 'filter=lfs' })
                        }
                    } catch {
                        # No .gitattributes — no LFS
                    }
                }

                if ($hasLfs) {
                    Write-Host "##vso[task.logissue type=warning]WARNING: Repo uses Git LFS — LFS objects will NOT be migrated by GEI"
                    Write-Host "  LFS patterns found:"
                    foreach ($p in $lfsPatterns) { Write-Host "    $p" }
                    $warnings += "Git LFS detected — LFS files will be lost after migration"
                } else {
                    Write-Host "  OK — no Git LFS usage detected"
                }

                # ── SUMMARY ──
                Write-Host "`n============================================"
                Write-Host "  PRE-CHECK SUMMARY"
                Write-Host "============================================"
                Write-Host "  Repo Size    : $sizeMB MB ($sizeGB GB)"
                Write-Host "  Large Files  : $($largeFiles.Count) file(s) > 100 MB"
                Write-Host "  Git LFS      : $(if ($hasLfs) { 'YES — LFS objects will NOT migrate' } else { 'No' })"
                Write-Host "  Warnings     : $($warnings.Count)"
                Write-Host "  Blocked      : $blocked"
                Write-Host "============================================"

                # Save pre-check report
                $precheckReport = [PSCustomObject]@{
                    Repo = $adoRepo; SizeMB = $sizeMB; SizeGB = $sizeGB
                    LargeFileCount = $largeFiles.Count; HasLFS = $hasLfs
                    Warnings = $warnings; Blocked = $blocked
                }
                $precheckReport | ConvertTo-Json -Depth 3 | Out-File "$auditDir\precheck-report.json" -Encoding utf8

                if ($blocked) {
                    Write-Host "##vso[task.logissue type=error]MIGRATION BLOCKED — resolve issues before migrating"
                    Write-Host "##vso[task.setvariable variable=PRECHECK_RESULT]BLOCKED"
                    exit 1
                } elseif ($warnings.Count -gt 0) {
                    Write-Host "##vso[task.logissue type=warning]Proceeding with warnings"
                    Write-Host "##vso[task.setvariable variable=PRECHECK_RESULT]WARNING"
                } else {
                    Write-Host "All pre-checks passed!"
                    Write-Host "##vso[task.setvariable variable=PRECHECK_RESULT]PASSED"
                }
            env:
              ADO_PAT: $(ADO_PAT)

          # -------------------------------------------
          # STEP 3 – MIGRATE REPO (SKIPPED IF ALREADY EXISTS OR BLOCKED)
          # -------------------------------------------
          - task: PowerShell@2
            displayName: "Step 3 - Migrate Repo (gh ado2gh)"
            condition: and(succeeded(), ne(variables['REPO_STATUS'], 'ALREADY_EXISTS'), ne(variables['PRECHECK_RESULT'], 'BLOCKED'))
            inputs:
              targetType: "inline"
              script: |
                $env:GH_PAT  = "$(GH_PAT)"
                $env:ADO_PAT = "$(ADO_PAT)"
                $stateFile = "$(Build.ArtifactStagingDirectory)\migration-state.txt"

                Write-Host "Starting migration..."
                Write-Host "  ADO:    $(ADO_Org)/$(ADO_Project)/$(ADO_Repo)"
                Write-Host "  GitHub: $(GitHub_Org)/$(GitHub_Repo)"

                Write-Host "State: PENDING"
                "PENDING" | Out-File $stateFile -Encoding utf8

                Write-Host "State: EXPORTING from ADO..."
                "EXPORTING" | Out-File $stateFile -Encoding utf8

                $migOutput = gh ado2gh migrate-repo `
                  --ado-org "$(ADO_Org)" `
                  --ado-team-project "$(ADO_Project)" `
                  --ado-repo "$(ADO_Repo)" `
                  --github-org "$(GitHub_Org)" `
                  --github-repo "$(GitHub_Repo)" 2>&1

                $migOutput | ForEach-Object { Write-Host $_ }

                if ($LASTEXITCODE -eq 0) {
                    Write-Host "State: COMPLETE"
                    "COMPLETE" | Out-File $stateFile -Encoding utf8
                } elseif ($migOutput -match "already been queued") {
                    Write-Host "Migration already queued. Waiting for it to complete..."
                    "WAITING" | Out-File $stateFile -Encoding utf8

                    $env:GH_TOKEN = "$(GH_PAT)"
                    $maxWait = 30  # check up to 30 times
                    $found = $false
                    for ($w = 1; $w -le $maxWait; $w++) {
                        Start-Sleep -Seconds 60
                        Write-Host "  Check $w/$maxWait - Verifying repo exists in GitHub..."
                        try {
                            $repoCheck = gh repo view "$(GitHub_Org)/$(GitHub_Repo)" --json name 2>&1
                            if ($LASTEXITCODE -eq 0) {
                                Write-Host "  Repo found! Queued migration completed successfully."
                                $found = $true
                                break
                            }
                        } catch { }
                    }

                    if ($found) {
                        Write-Host "State: COMPLETE"
                        "COMPLETE" | Out-File $stateFile -Encoding utf8
                    } else {
                        Write-Host "State: FAILED (queued migration did not complete in time)"
                        "FAILED" | Out-File $stateFile -Encoding utf8
                        exit 1
                    }
                } else {
                    Write-Host "State: FAILED (exit code: $LASTEXITCODE)"
                    "FAILED" | Out-File $stateFile -Encoding utf8
                    exit 1
                }

          # -------------------------------------------
          # STEP 4 – POST-MIGRATION AUDIT (BRANCH-WISE)
          # -------------------------------------------
          - task: PowerShell@2
            displayName: "Step 4 - Post-Migration Audit (Branch-Wise)"
            condition: always()
            continueOnError: true
            inputs:
              targetType: "inline"
              errorActionPreference: "continue"
              script: |
                $ProgressPreference = 'SilentlyContinue'
                $ghOrg    = "$(GitHub_Org)"
                $ghRepo   = "$(GitHub_Repo)"
                $ghPat    = "$(GH_PAT)"
                $auditDir = "$(Build.ArtifactStagingDirectory)\audit"
                New-Item -ItemType Directory -Path $auditDir -Force | Out-Null
                New-Item -ItemType Directory -Path "$auditDir\folder-listing" -Force | Out-Null

                Write-Host "============================================"
                Write-Host "  GITHUB POST-MIGRATION AUDIT (BRANCH-WISE)"
                Write-Host "  Repo: $ghOrg / $ghRepo"
                Write-Host "  Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
                Write-Host "============================================"
                Write-Host ""

                Write-Host "Cloning GitHub repo (blobless mirror)..."
                $ErrorActionPreference = 'SilentlyContinue'
                git clone --filter=blob:none --mirror "https://$ghPat@github.com/$ghOrg/$ghRepo.git" gh-mirror 2>&1 | ForEach-Object { Write-Host $_ }
                $ErrorActionPreference = 'Continue'

                if ($LASTEXITCODE -ne 0) {
                    Write-Host "##vso[task.logissue type=warning]Could not clone GitHub repo for audit"
                    exit 0
                }
                Set-Location gh-mirror

                $branches = git branch | ForEach-Object { $_.Trim().TrimStart("* ") } | Where-Object { $_ -ne "" }
                $branchCount = $branches.Count
                Write-Host "Total Branches: $branchCount"
                $branches | Out-File "$auditDir\gh-branches.txt" -Encoding utf8

                $defaultBranchRef = git symbolic-ref HEAD 2>$null
                if ($defaultBranchRef) {
                    $defaultBranch = $defaultBranchRef.Trim() -replace '^refs/heads/', ''
                } else {
                    $defaultBranch = if ($branchCount -gt 0) { $branches[0].Trim() } else { "" }
                }
                Write-Host "Default Branch: $defaultBranch"
                $defaultBranch | Out-File "$auditDir\gh-default-branch.txt" -Encoding utf8

                $tags = git tag -l
                $tagCount = if ($tags) { ($tags | Measure-Object).Count } else { 0 }
                Write-Host "Total Tags: $tagCount"
                if ($tags) { $tags | Out-File "$auditDir\gh-tags.txt" -Encoding utf8 }
                else { "" | Out-File "$auditDir\gh-tags.txt" -Encoding utf8 }

                $totalCommits = (git rev-list --count --all).Trim()
                Write-Host "Total Commits (all branches): $totalCommits"

                $latestHash    = (git log -1 --format="%H").Trim()
                $latestAuthor  = (git log -1 --format="%an").Trim()
                $latestDate    = (git log -1 --format="%ad" --date=short).Trim()
                $latestMessage = (git log -1 --format="%s").Trim()

                $repoSize = git count-objects -vH
                Write-Host "Repo Size (metadata only - blobless clone):"
                $repoSize | ForEach-Object { Write-Host "  $_" }
                $repoSize | Out-File "$auditDir\gh-repo-size.txt" -Encoding utf8

                Write-Host ""
                Write-Host "============================================"
                Write-Host "  BRANCH-WISE DETAILS"
                Write-Host "============================================"

                # ── Batch-fetch per-branch metadata (1 git call instead of 4×N) ──
                $refMeta = @{}
                $refLines = git for-each-ref --format='%(refname:short)|%(objectname:short=12)|%(authorname)|%(creatordate:short)|%(subject)' refs/heads/ 2>$null
                if ($refLines) {
                    foreach ($line in $refLines) {
                        $parts = $line -split '\|', 5
                        if ($parts.Count -ge 5) {
                            $refMeta[$parts[0]] = @{ Hash=$parts[1]; Author=$parts[2]; Date=$parts[3]; Msg=$parts[4] }
                        }
                    }
                }

                $branchCsvRows = @()
                $bIdx = 0
                $folderFileCsv    = "$auditDir\gh-folder-wise-files.csv"
                $folderSummaryCsv = "$auditDir\gh-folder-summary.csv"
                $csvHeaderWritten = $false
                $totalFolderFiles = 0
                $totalFolderRows  = 0

                foreach ($branch in $branches) {
                    $b = $branch.Trim()
                    if ($b -eq "") { continue }
                    $bIdx++
                    Write-Host "  [$bIdx/$branchCount] Branch: $b"

                    $bStatus = "Migrated"

                    $bFileCount   = 0
                    $bFolderCount = 0

                    if ($b -eq $defaultBranch) {
                        # ── FULL AUDIT for default branch only ──
                        $bFiles = git ls-tree -r --name-only $b 2>$null
                        $bFileCount = if ($bFiles) { ($bFiles | Measure-Object).Count } else { 0 }

                        # ── 50K file cap: skip folder enumeration for very large repos ──
                        if ($bFileCount -gt 50000) {
                            Write-Host "    WARNING: $bFileCount files exceeds 50K cap — skipping folder enumeration"
                            $bFolderCount = "50K+ (skipped)"
                            $bFiles = $null
                        } else {
                            $filesByFolder = [ordered]@{}
                            if ($bFiles) {
                                foreach ($f in $bFiles) {
                                    $folder = Split-Path $f -Parent
                                    if (-not $folder -or $folder -eq "") { $folder = "(root)" }
                                    $folder = $folder -replace '\\', '/'
                                    if (-not $filesByFolder.Contains($folder)) { $filesByFolder[$folder] = @() }
                                    $filesByFolder[$folder] += Split-Path $f -Leaf
                                }
                            }
                            $bFolderCount = $filesByFolder.Keys.Count

                            # Per-branch folder-wise MD file
                            $safeBranch = $b -replace '[/\\]', '--'
                            $branchFileMd = "# Files in branch: $b`n`n"
                            foreach ($folder in ($filesByFolder.Keys | Sort-Object)) {
                                $branchFileMd += "## $folder/`n"
                                foreach ($file in ($filesByFolder[$folder] | Sort-Object)) {
                                    $branchFileMd += "- $file`n"
                                }
                                $branchFileMd += "`n"
                            }
                            $branchFileMd | Out-File "$auditDir\folder-listing\gh-files-$safeBranch.md" -Encoding utf8
                            Write-Host "    Folder listing saved: gh-files-$safeBranch.md"

                            # Stream folder CSVs to disk
                            foreach ($folder in $filesByFolder.Keys) {
                                [PSCustomObject]@{ Branch=$b; Folder=$folder; FileCount=$filesByFolder[$folder].Count } |
                                    Export-Csv -Path $folderSummaryCsv -NoTypeInformation -Encoding utf8 -Append:$csvHeaderWritten -Force
                                $totalFolderRows++
                                foreach ($file in $filesByFolder[$folder]) {
                                    [PSCustomObject]@{ Branch=$b; Folder=$folder; FileName=$file } |
                                        Export-Csv -Path $folderFileCsv -NoTypeInformation -Encoding utf8 -Append:$csvHeaderWritten -Force
                                    $totalFolderFiles++
                                }
                                if (-not $csvHeaderWritten) { $csvHeaderWritten = $true }
                            }

                            # Default branch folder summary
                            $folderSummaryMd = "| Folder | Files |`n|---|---|`n"
                            $folderTotal = 0
                            foreach ($folder in ($filesByFolder.Keys | Sort-Object)) {
                                $fc = $filesByFolder[$folder].Count
                                $folderTotal += $fc
                                $folderSummaryMd += "| $folder | $fc |`n"
                            }
                            $folderSummaryMd += "| **Total** | **$folderTotal** |`n"
                            $folderSummaryMd | Out-File "$auditDir\gh-folder-summary-default.md" -Encoding utf8

                            $bFiles = $null
                            $filesByFolder = $null
                        }
                    }
                    else {
                        # ── SKIP file/folder enumeration for non-default branches ──
                        # (columns removed from HTML report; only commit stats needed)
                        $bFileCount   = "-"
                        $bFolderCount = "-"
                    }

                    # ── Use batch metadata from git for-each-ref ──
                    if ($refMeta.ContainsKey($b)) {
                        $bHashShort = $refMeta[$b].Hash
                        $bAuthor    = $refMeta[$b].Author
                        $bDate      = $refMeta[$b].Date
                        $bMsg       = $refMeta[$b].Msg
                    } else {
                        $bHashShort = "N/A"; $bAuthor = "N/A"; $bDate = "N/A"; $bMsg = "N/A"
                    }

                    Write-Host "    Status: $bStatus | Files: $bFileCount | Folders: $bFolderCount"
                    Write-Host "    Latest:  $bHashShort by $bAuthor on $bDate"
                    Write-Host ""

                    $branchCsvRows += [PSCustomObject]@{
                        Branch       = $b
                        Status       = $bStatus
                        Files        = $bFileCount
                        Folders      = $bFolderCount
                        LatestHash   = $bHashShort
                        LatestAuthor = $bAuthor
                        LatestDate   = $bDate
                        LatestMsg    = $bMsg
                    }
                }

                $branchCsvRows | Export-Csv "$auditDir\gh-branch-wise-data.csv" -NoTypeInformation -Encoding utf8

                # ── Top 5 key branches: priority sort + commit count (only 5 git calls) ──
                $topBranches = $branchCsvRows | Sort-Object {
                    $bn = $_.Branch
                    if ($bn -eq $defaultBranch) { 0 }
                    elseif ($bn -match '^(main|master)$') { 1 }
                    elseif ($bn -match '^(develop|development)$') { 2 }
                    elseif ($bn -match '^(release|hotfix)[/\-]') { 3 }
                    else { 99 }
                }, Branch | Select-Object -First 5
                $topRows = @()
                foreach ($tb in $topBranches) {
                    $cnt = (git rev-list --count $tb.Branch 2>$null)
                    if ($cnt) { $cnt = $cnt.Trim() } else { $cnt = "0" }
                    $fmtCnt = "{0:N0}" -f [long]$cnt
                    $isDef = if ($tb.Branch -eq $defaultBranch) { "Yes" } else { "No" }
                    $topRows += [PSCustomObject]@{ Branch=$tb.Branch; Commits=$fmtCnt; IsDefault=$isDef }
                    Write-Host "  Top branch: $($tb.Branch) — $fmtCnt commits"
                }
                $topRows | Export-Csv "$auditDir\gh-top-branches.csv" -NoTypeInformation -Encoding utf8

                $mdTable = "| # | Branch | Status | Files | Latest Commit | Date |`n"
                $mdTable += "|---|---|---|---|---|---|`n"
                $idx = 1
                foreach ($row in ($branchCsvRows | Sort-Object Branch)) {
                    $mdTable += "| $idx | ``$($row.Branch)`` | $($row.Status) | $($row.Files) | $($row.LatestAuthor) - *$($row.LatestMsg)* | $($row.LatestDate) |`n"
                    $idx++
                }
                $mdTable | Out-File "$auditDir\gh-branch-wise-table.md" -Encoding utf8

                Write-Host ""
                Write-Host "Folder-wise file listings saved to: $auditDir\folder-listing\"
                Write-Host "Combined CSV: gh-folder-wise-files.csv ($totalFolderFiles rows)"
                Write-Host "Folder summary CSV: gh-folder-summary.csv ($totalFolderRows rows)"

                Write-Host "============================================"
                Write-Host "  PULL REQUEST AUDIT (BRANCH-WISE)"
                Write-Host "============================================"

                Set-Location ..
                $env:GH_TOKEN = $ghPat

                $allPRs = @()
                $page = 1
                do {
                    $prs = gh api "repos/$ghOrg/$ghRepo/pulls?state=all&per_page=100&page=$page" 2>$null | ConvertFrom-Json
                    if ($prs -and $prs.Count -gt 0) {
                        $allPRs += $prs
                        $page++
                    } else {
                        break
                    }
                } while ($prs.Count -eq 100)

                $totalPRs    = $allPRs.Count
                $totalOpen   = 0
                $totalMerged = 0
                $totalClosed = 0

                Write-Host "Total PRs fetched: $totalPRs"

                $prByHead = @{}
                foreach ($pr in $allPRs) {
                    $head = $pr.head.ref
                    if (-not $prByHead.ContainsKey($head)) {
                        $prByHead[$head] = @{ Open = 0; Merged = 0; Closed = 0 }
                    }
                    if ($pr.state -eq "open") {
                        $prByHead[$head].Open++
                        $totalOpen++
                    } elseif ($pr.merged_at) {
                        $prByHead[$head].Merged++
                        $totalMerged++
                    } else {
                        $prByHead[$head].Closed++
                        $totalClosed++
                    }
                }

                $prHeadMd = "| Source Branch (head) | Open | Merged | Closed | Total |`n"
                $prHeadMd += "|---|---|---|---|---|`n"
                foreach ($b in ($prByHead.Keys | Sort-Object)) {
                    $o = $prByHead[$b].Open; $m = $prByHead[$b].Merged; $c = $prByHead[$b].Closed; $t = $o + $m + $c
                    Write-Host "  Source: $b | Open: $o | Merged: $m | Closed: $c | Total: $t"
                    $prHeadMd += "| $b | $o | $m | $c | $t |`n"
                }
                $prHeadMd += "| **TOTAL** | **$totalOpen** | **$totalMerged** | **$totalClosed** | **$totalPRs** |`n"
                $prHeadMd | Out-File "$auditDir\gh-pr-by-source-branch.md" -Encoding utf8

                $prByBase = @{}
                foreach ($pr in $allPRs) {
                    $base = $pr.base.ref
                    if (-not $prByBase.ContainsKey($base)) {
                        $prByBase[$base] = @{ Open = 0; Merged = 0; Closed = 0 }
                    }
                    if ($pr.state -eq "open") { $prByBase[$base].Open++ }
                    elseif ($pr.merged_at) { $prByBase[$base].Merged++ }
                    else { $prByBase[$base].Closed++ }
                }

                $prBaseMd = "| Target Branch (base) | Open | Merged | Closed | Total |`n"
                $prBaseMd += "|---|---|---|---|---|`n"
                foreach ($b in ($prByBase.Keys | Sort-Object)) {
                    $o = $prByBase[$b].Open; $m = $prByBase[$b].Merged; $c = $prByBase[$b].Closed; $t = $o + $m + $c
                    Write-Host "  Target: $b | Open: $o | Merged: $m | Closed: $c | Total: $t"
                    $prBaseMd += "| $b | $o | $m | $c | $t |`n"
                }
                $prBaseMd | Out-File "$auditDir\gh-pr-by-target-branch.md" -Encoding utf8

                $branchCount  | Out-File "$auditDir\gh-branch-count.txt" -Encoding utf8
                $tagCount     | Out-File "$auditDir\gh-tag-count.txt" -Encoding utf8
                $totalCommits | Out-File "$auditDir\gh-commit-count.txt" -Encoding utf8
                $totalPRs     | Out-File "$auditDir\gh-pr-count.txt" -Encoding utf8
                $totalOpen    | Out-File "$auditDir\gh-pr-open.txt" -Encoding utf8
                $totalMerged  | Out-File "$auditDir\gh-pr-merged.txt" -Encoding utf8
                $totalClosed  | Out-File "$auditDir\gh-pr-closed.txt" -Encoding utf8
                $latestHash   | Out-File "$auditDir\gh-latest-hash.txt" -Encoding utf8

                Write-Host ""
                Write-Host "Audit completed."

          # -------------------------------------------
          # STEP 5 – DOWNLOAD MIGRATION LOGS
          # -------------------------------------------
          - task: PowerShell@2
            displayName: "Step 5 - Download Migration Logs"
            condition: and(always(), ne(variables['REPO_STATUS'], 'ALREADY_EXISTS'))
            continueOnError: true
            inputs:
              targetType: "inline"
              script: |
                $env:GH_PAT   = "$(GH_PAT)"
                $env:GH_TOKEN = "$(GH_PAT)"
                $logDir = "$(Build.ArtifactStagingDirectory)\migration-logs"
                New-Item -ItemType Directory -Path $logDir -Force | Out-Null

                $repo = "$(GitHub_Repo)"

                # Large repos (5+ GB) need more time for GEI to generate logs
                Write-Host "Waiting 300 seconds for GEI logs to be available (large repo support)..."
                Start-Sleep -Seconds 300

                $repoDir = "$logDir\$repo"
                New-Item -ItemType Directory -Path $repoDir -Force | Out-Null
                $logFile = "$repoDir\migration-log-$repo.log"

                Write-Host "Downloading migration log for: $repo"

                $success = $false
                for ($i = 1; $i -le 15; $i++) {
                    try {
                        Write-Host "  Attempt $i/15..."
                        $output = gh ado2gh download-logs `
                          --github-org "$(GitHub_Org)" `
                          --github-repo "$repo" `
                          --migration-log-file "$logFile" `
                          --overwrite 2>&1

                        if ($LASTEXITCODE -eq 0) {
                            Write-Host "  Logs downloaded for $repo"
                            $success = $true
                            break
                        } else {
                            Write-Host "  Attempt ${i}: Exit code $LASTEXITCODE. Waiting 60s..."
                            Start-Sleep -Seconds 60
                        }
                    }
                    catch {
                        Write-Host "  Attempt ${i}: $($_.Exception.Message). Waiting 60s..."
                        Start-Sleep -Seconds 60
                    }
                }

                if (-not $success) {
                    Write-Host "  Logs NOT available after 15 retries."
                    "Log download failed after 15 retries for $repo" | Out-File $logFile -Encoding utf8
                }

                exit 0

          # -------------------------------------------
          # STEP 6 – PUBLISH MIGRATION LOGS
          # -------------------------------------------
          - task: PowerShell@2
            displayName: "Step 6a - Ensure Migration Logs Directory Exists"
            condition: always()
            inputs:
              targetType: "inline"
              script: |
                $logDir = "$(Build.ArtifactStagingDirectory)\migration-logs"
                if (-not (Test-Path $logDir)) {
                    Write-Host "Migration logs directory not found. Creating with placeholder."
                    New-Item -ItemType Directory -Path $logDir -Force | Out-Null
                    "No migration logs available. Migration may have been skipped (repo already exists)." | Out-File "$logDir\no-logs.txt" -Encoding utf8
                    Write-Host "##vso[task.setvariable variable=MIGRATION_LOGS_EXIST]false"
                } else {
                    Write-Host "Migration logs directory found."
                    Write-Host "##vso[task.setvariable variable=MIGRATION_LOGS_EXIST]true"
                }

          - task: PublishPipelineArtifact@1
            displayName: "Step 6b - Publish Migration Logs"
            condition: always()
            continueOnError: true
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)\\migration-logs"
              artifact: "MigrationLogs"
              publishLocation: "pipeline"

          # -------------------------------------------
          # STEP 7 – PUBLISH AUDIT ARTIFACTS
          # -------------------------------------------
          - task: PublishPipelineArtifact@1
            displayName: "Step 7 - Publish Audit Data"
            condition: always()
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)\\audit"
              artifact: "MigrationAudit"
              publishLocation: "pipeline"

          # -------------------------------------------
          # STEP 8 – CALCULATE REPO SIZE (FROM GITHUB)
          # -------------------------------------------
          - task: PowerShell@2
            displayName: "Step 8 - Calculate Repo Size (GitHub API)"
            condition: always()
            continueOnError: true
            inputs:
              targetType: "inline"
              script: |
                $ghOrg    = "$(GitHub_Org)"
                $ghRepo   = "$(GitHub_Repo)"
                $auditDir = "$(Build.ArtifactStagingDirectory)\audit"
                $env:GH_TOKEN = "$(GH_PAT)"

                Write-Host "============================================"
                Write-Host "  CALCULATING REPO SIZE (FROM GITHUB)"
                Write-Host "  ~10-20 min after migration"
                Write-Host "============================================"

                $actualSize = "N/A"

                # Try GitHub REST API .size (with retry)
                $sizeKB = 0
                for ($i = 1; $i -le 5; $i++) {
                    $rawSize = gh api "repos/$ghOrg/$ghRepo" --jq '.size' 2>$null
                    if ($rawSize -and $rawSize -match '^\d+$' -and [long]$rawSize -gt 0) {
                        $sizeKB = [long]$rawSize
                        break
                    }
                    Write-Host "  Attempt $i/5 — Waiting for GitHub to calculate repo size..."
                    Start-Sleep -Seconds 20
                }

                if ($sizeKB -gt 0) {
                    if     ($sizeKB -ge 1048576) { $actualSize = "{0:N2} GB" -f ($sizeKB / 1048576) }
                    elseif ($sizeKB -ge 1024)    { $actualSize = "{0:N2} MB" -f ($sizeKB / 1024) }
                    else                         { $actualSize = "$sizeKB KB" }
                    Write-Host "Repo Size (GitHub REST API): $actualSize"
                }

                # Fallback: size-pack from blobless clone metadata
                if ($actualSize -eq "N/A") {
                    $repoSizeFile = "$auditDir\gh-repo-size.txt"
                    if (Test-Path $repoSizeFile) {
                        $repoSizeLines = Get-Content $repoSizeFile
                        $sizePack = ($repoSizeLines | Where-Object { $_ -match '^size-pack:' }) -replace 'size-pack:\s*', ''
                        if ($sizePack) {
                            $actualSize = $sizePack.Trim()
                            Write-Host "Repo Size (clone metadata fallback): $actualSize"
                        }
                    }
                }

                if ($actualSize -eq "N/A") {
                    Write-Host "All size methods returned 0"
                }

                $actualSize | Out-File "$auditDir\gh-repo-size-actual.txt" -Encoding utf8
                Write-Host "Final repo size for dashboard: $actualSize"

          # -------------------------------------------
          # STEP 9 – GENERATE MIGRATION DASHBOARD (HTML + MD)
          # -------------------------------------------
          - task: PowerShell@2
            displayName: "Step 9 - Generate Migration Dashboard"
            condition: always()
            continueOnError: true
            inputs:
              targetType: "inline"
              script: |
                $auditDir     = "$(Build.ArtifactStagingDirectory)\audit"
                $repo         = "$(GitHub_Repo)"
                $adoRepo      = "$(ADO_Repo)"
                $precheckFile = "$(Build.ArtifactStagingDirectory)\repo-precheck.txt"

                Write-Host "============================================"
                Write-Host "  GENERATING MIGRATION DASHBOARD"
                Write-Host "============================================"

                $precheckStatus = "UNKNOWN"
                if (Test-Path $precheckFile) {
                    $precheckStatus = (Get-Content $precheckFile -Raw).Trim()
                }

                $logFile = "$(Build.ArtifactStagingDirectory)\migration-logs\$repo\migration-log-$repo.log"
                $migrationResult = "Failed"
                $migrationDetail = "No logs available"

                $stateFilePath = "$(Build.ArtifactStagingDirectory)\migration-state.txt"
                $migStateValue = "UNKNOWN"
                if (Test-Path $stateFilePath) {
                    $migStateValue = (Get-Content $stateFilePath -Raw).Trim()
                }

                if ($precheckStatus -eq "ALREADY_EXISTS") {
                    $migrationResult = "Already Exists"
                    $migrationDetail = "Repo was already present in GitHub before migration"
                } elseif ($migStateValue -eq "COMPLETE") {
                    $migrationResult = "Success"
                    $migrationDetail = "Migration completed successfully (verified via state file)"
                    if (Test-Path $logFile) {
                        $logContent = Get-Content $logFile -Raw -ErrorAction SilentlyContinue
                        if ($logContent -match "Log download failed") {
                            $migrationDetail = "Migration completed successfully (logs unavailable for large repo)"
                        }
                    }
                } elseif (Test-Path $logFile) {
                    $logContent = Get-Content $logFile -Raw
                    if ($logContent -match "successfully|completed" -or $logContent.Length -gt 100) {
                        $migrationResult = "Success"
                        $migrationDetail = "Migration completed successfully"
                    } else {
                        $migrationDetail = "Check migration logs for errors"
                    }
                }

                function Get-Val($file) {
                    $p = "$auditDir\$file"
                    if (Test-Path $p) { return (Get-Content $p -Raw).Trim() }
                    return "N/A"
                }

                $branchCount  = Get-Val "gh-branch-count.txt"
                $tagCount     = Get-Val "gh-tag-count.txt"
                $commitCount  = Get-Val "gh-commit-count.txt"
                $prCount      = Get-Val "gh-pr-count.txt"
                $prOpen       = Get-Val "gh-pr-open.txt"
                $prMerged     = Get-Val "gh-pr-merged.txt"
                $prClosed     = Get-Val "gh-pr-closed.txt"
                $latestHash   = Get-Val "gh-latest-hash.txt"
                $ghRepoSize   = Get-Val "gh-repo-size.txt"
                $actualSize   = Get-Val "gh-repo-size-actual.txt"

                $migState = $migStateValue
                $migDate = Get-Date -Format 'dd MMM yyyy · HH:mm'

                # ── Status config ──
                if ($migrationResult -eq "Already Exists") {
                    $statusEmoji = "&#x26A0;&#xFE0F;"
                    $statusText = "Skipped &#x2014; Repository Already Exists"
                    $statusColor = "#f0ad4e"
                    $statusBg = "#fff8e1"
                    $reasonText = "Target repository was detected in GitHub prior to migration."
                } elseif ($migrationResult -eq "Success") {
                    $statusEmoji = "&#x2705;"
                    $statusText = "Completed &#x2014; Migration Successful"
                    $statusColor = "#28a745"
                    $statusBg = "#e6f9ed"
                    $reasonText = "Repository migrated successfully from ADO to GitHub."
                } else {
                    $statusEmoji = "&#x274C;"
                    $statusText = "Failed &#x2014; Migration Error"
                    $statusColor = "#dc3545"
                    $statusBg = "#fdecea"
                    $reasonText = "Check migration logs for error details."
                }

                # ── Pipeline phase rows ──
                if ($precheckStatus -eq "ALREADY_EXISTS") {
                    $phaseRows = @(
                        @("&#x2705;","Pre-Check","Completed","#28a745"),
                        @("&#x23E9;","Migration","Skipped","#f0ad4e"),
                        @("&#x2705;","Audit","Completed","#28a745"),
                        @("&#x26A0;&#xFE0F;","Result","Repository Already Exists","#f0ad4e")
                    )
                } elseif ($migState -eq "COMPLETE" -or $migrationResult -eq "Success") {
                    $phaseRows = @(
                        @("&#x2705;","Pre-Check","Completed","#28a745"),
                        @("&#x2705;","Migration","Completed","#28a745"),
                        @("&#x2705;","Audit","Completed","#28a745"),
                        @("&#x2705;","Result","Migration Successful","#28a745")
                    )
                } else {
                    $phaseRows = @(
                        @("&#x2705;","Pre-Check","Completed","#28a745"),
                        @("&#x274C;","Migration","Failed","#dc3545"),
                        @("&#x2705;","Audit","Completed","#28a745"),
                        @("&#x274C;","Result","Migration Failed","#dc3545")
                    )
                }

                $phaseHtml = ""
                foreach ($p in $phaseRows) {
                    $phaseHtml += "<tr><td style='font-size:20px;text-align:center;'>$($p[0])</td><td><strong>$($p[1])</strong></td><td style='color:$($p[3]);font-weight:600;'>$($p[2])</td></tr>`n"
                }

                # ── Key branches HTML (top 5 priority branches with commit counts) ──
                $topBranchCsv = "$auditDir\gh-top-branches.csv"
                $defaultBranch = Get-Val "gh-default-branch.txt"
                $topBranchHtml = ""
                if (Test-Path $topBranchCsv) {
                    $topRows = Import-Csv $topBranchCsv
                    $rank = 1
                    foreach ($r in $topRows) {
                        $brLabel = "<code>$($r.Branch)</code>"
                        if ($r.IsDefault -eq "Yes") {
                            $brLabel += " <span style='background:#ddf4ff;color:#0969da;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700;margin-left:6px;'>DEFAULT</span>"
                        }
                        $topBranchHtml += "<tr><td style='text-align:center;font-weight:700;color:#6f42c1;'>$rank</td><td>$brLabel</td><td style='text-align:right;font-weight:600;font-variant-numeric:tabular-nums;'>$($r.Commits)</td></tr>`n"
                        $rank++
                    }
                }
                if ($topBranchHtml -eq "") { $topBranchHtml = "<tr><td colspan='3' style='text-align:center;color:#999;'>No branch data available</td></tr>" }

                # ── All branches HTML ──
                $branchCsvFile = "$auditDir\gh-branch-wise-data.csv"
                $allBranchHtml = ""
                if (Test-Path $branchCsvFile) {
                    $allRows = Import-Csv $branchCsvFile | Sort-Object Branch
                    $idx = 1
                    foreach ($r in $allRows) {
                        $allBranchHtml += "<tr><td style='text-align:center;'>$idx</td><td><code>$($r.Branch)</code></td><td style='text-align:center;'><span style='background:#dafbe1;color:#1a7f37;padding:4px 12px;border-radius:12px;font-weight:600;font-size:13px;'>&#x2705; Migrated</span></td></tr>`n"
                        $idx++
                    }
                }
                if ($allBranchHtml -eq "") { $allBranchHtml = "<tr><td colspan='3' style='text-align:center;color:#999;'>No branch data</td></tr>" }

                # ── Build HTML Report ──
                $nl2 = [Environment]::NewLine
                $html = "<!DOCTYPE html>" + $nl2
                $html += "<html lang='en'>" + $nl2
                $html += "<head>" + $nl2
                $html += "<meta charset='UTF-8'>" + $nl2
                $html += "<meta name='viewport' content='width=device-width, initial-scale=1.0'>" + $nl2
                $html += "<title>Migration Report - $repo</title>" + $nl2
                $html += "<style>" + $nl2
                $html += "* { margin: 0; padding: 0; box-sizing: border-box; }" + $nl2
                $html += "body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; color: #333; padding: 30px; font-size: 16px; }" + $nl2
                $html += ".container { max-width: 960px; margin: 0 auto; }" + $nl2
                $html += ".header { background: linear-gradient(135deg, #0d1117 0%, #161b22 100%); color: #fff; padding: 32px 36px; border-radius: 14px; margin-bottom: 24px; }" + $nl2
                $html += ".header h1 { font-size: 28px; margin-bottom: 12px; }" + $nl2
                $html += ".status-banner { display: inline-block; padding: 10px 22px; border-radius: 8px; font-size: 18px; font-weight: 600; margin-top: 6px; background: $statusBg; color: $statusColor; border: 2px solid $statusColor; }" + $nl2
                $html += ".card { background: #fff; border-radius: 12px; padding: 28px 32px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }" + $nl2
                $html += ".card h2 { font-size: 22px; margin-bottom: 18px; color: #0d1117; border-bottom: 2px solid #e1e4e8; padding-bottom: 10px; }" + $nl2
                $html += "table { width: 100%; border-collapse: collapse; font-size: 15px; }" + $nl2
                $html += "th { background: #f6f8fa; text-align: left; padding: 12px 16px; font-weight: 600; color: #24292f; border-bottom: 2px solid #d0d7de; }" + $nl2
                $html += "td { padding: 11px 16px; border-bottom: 1px solid #eaecef; }" + $nl2
                $html += "tr:hover { background: #f6f8fa; }" + $nl2
                $html += ".overview-table td:first-child { font-weight: 600; width: 220px; color: #555; font-size: 16px; }" + $nl2
                $html += ".overview-table td:last-child { font-size: 16px; }" + $nl2
                $html += "code { background: #eff1f3; padding: 3px 8px; border-radius: 5px; font-size: 14px; color: #0d1117; }" + $nl2
                $html += ".stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 8px; }" + $nl2
                $html += ".stat-box { background: #f6f8fa; border-radius: 10px; padding: 20px; text-align: center; border: 1px solid #e1e4e8; }" + $nl2
                $html += ".stat-box .num { font-size: 32px; font-weight: 700; color: #0d1117; }" + $nl2
                $html += ".stat-box .label { font-size: 14px; color: #666; margin-top: 4px; }" + $nl2
                $html += ".reason { background: #f0f4f8; border-left: 4px solid $statusColor; padding: 12px 18px; border-radius: 6px; margin-top: 14px; font-size: 15px; color: #555; }" + $nl2
                $html += "details { margin-top: 10px; }" + $nl2
                $html += "details summary { cursor: pointer; font-weight: 600; font-size: 16px; color: #0969da; padding: 8px 0; }" + $nl2
                $html += "details summary:hover { text-decoration: underline; }" + $nl2
                $html += ".footer { text-align: center; color: #999; font-size: 13px; margin-top: 30px; padding-top: 16px; border-top: 1px solid #e1e4e8; }" + $nl2
                $html += ".pr-pills { display: flex; gap: 12px; flex-wrap: wrap; }" + $nl2
                $html += ".pr-pill { padding: 8px 18px; border-radius: 20px; font-weight: 600; font-size: 15px; }" + $nl2
                $html += ".pr-open { background: #dafbe1; color: #1a7f37; }" + $nl2
                $html += ".pr-merged { background: #e8d5f5; color: #8250df; }" + $nl2
                $html += ".pr-closed { background: #fdecea; color: #cf222e; }" + $nl2
                $html += "</style>" + $nl2
                $html += "</head>" + $nl2
                $html += "<body>" + $nl2
                $html += "<div class='container'>" + $nl2
                # Header
                $html += "<div class='header'>" + $nl2
                $html += "  <h1>&#x1F680; ADO &#x2192; GitHub Migration Report</h1>" + $nl2
                $html += "  <div class='status-banner'>$statusEmoji $statusText</div>" + $nl2
                $html += "</div>" + $nl2
                # Migration Overview
                $html += "<div class='card'>" + $nl2
                $html += "  <h2>&#x1F4C2; Migration Overview</h2>" + $nl2
                $html += "  <table class='overview-table'>" + $nl2
                $html += "    <tr><td>&#x1F4C5; Migration Date</td><td>$migDate</td></tr>" + $nl2
                $html += "    <tr><td>&#x1F4E6; Source (ADO)</td><td><code>$(ADO_Org) / $(ADO_Project) / $adoRepo</code></td></tr>" + $nl2
                $html += "    <tr><td>&#x1F3AF; Target (GitHub)</td><td><code>$(GitHub_Org) / $repo</code></td></tr>" + $nl2
                $html += "  </table>" + $nl2
                $html += "</div>" + $nl2
                # Pipeline Status
                $html += "<div class='card'>" + $nl2
                $html += "  <h2>&#x1F6A6; Pipeline Execution Status</h2>" + $nl2
                $html += "  <table>" + $nl2
                $html += "    <thead><tr><th style='width:50px;'></th><th>Phase</th><th>Status</th></tr></thead>" + $nl2
                $html += "    <tbody>" + $nl2
                $html += $phaseHtml
                $html += "    </tbody>" + $nl2
                $html += "  </table>" + $nl2
                $html += "  <div class='reason'>&#x2139;&#xFE0F; <strong>Reason:</strong> $reasonText</div>" + $nl2
                $html += "</div>" + $nl2
                # Repository Snapshot
                $html += "<div class='card'>" + $nl2
                $html += "  <h2>&#x1F4CA; Repository Snapshot</h2>" + $nl2
                $html += "  <div class='stat-grid'>" + $nl2
                $html += "    <div class='stat-box'><div class='num'>$branchCount</div><div class='label'>&#x1F33F; Branches</div></div>" + $nl2
                $html += "    <div class='stat-box'><div class='num'>$tagCount</div><div class='label'>&#x1F3F7;&#xFE0F; Tags</div></div>" + $nl2
                $html += "    <div class='stat-box'><div class='num'>$commitCount</div><div class='label'>&#x1F4DD; Commits</div></div>" + $nl2
                $html += "    <div class='stat-box'><div class='num'>$prCount</div><div class='label'>&#x1F500; Pull Requests</div></div>" + $nl2
                $html += "    <div class='stat-box'><div class='num'>$actualSize</div><div class='label'>&#x1F4BE; Repo Size</div></div>" + $nl2
                $html += "  </div>" + $nl2
                $html += "  <div class='pr-pills' style='margin-top:14px;'>" + $nl2
                $html += "    <span class='pr-pill pr-open'>&#x1F7E2; $prOpen Open</span>" + $nl2
                $html += "    <span class='pr-pill pr-merged'>&#x1F7E3; $prMerged Merged</span>" + $nl2
                $html += "    <span class='pr-pill pr-closed'>&#x1F534; $prClosed Closed</span>" + $nl2
                $html += "  </div>" + $nl2
                $html += "</div>" + $nl2
                # Key Branches
                $html += "<div class='card'>" + $nl2
                $html += "  <h2>&#x1F511; Key Branches</h2>" + $nl2
                $html += "  <table>" + $nl2
                $html += "    <thead><tr><th style='text-align:center;'>#</th><th>Branch</th><th style='text-align:right;'>Commits</th></tr></thead>" + $nl2
                $html += "    <tbody>" + $nl2
                $html += $topBranchHtml
                $html += "    </tbody>" + $nl2
                $html += "  </table>" + $nl2
                $html += "</div>" + $nl2
                # All Branches
                $html += "<div class='card'>" + $nl2
                $html += "  <h2>&#x1F33F; All Branches ($branchCount)</h2>" + $nl2
                $html += "  <details>" + $nl2
                $html += "    <summary>Click to expand all branches</summary>" + $nl2
                $html += "    <table style='margin-top:10px;'>" + $nl2
                $html += "      <thead><tr><th style='text-align:center;'>#</th><th>Branch</th><th style='text-align:center;'>Status</th></tr></thead>" + $nl2
                $html += "      <tbody>" + $nl2
                $html += $allBranchHtml
                $html += "      </tbody>" + $nl2
                $html += "    </table>" + $nl2
                $html += "  </details>" + $nl2
                $html += "</div>" + $nl2
                # Audit
                $html += "<div class='card'>" + $nl2
                $html += "  <h2>&#x1F4E6; Audit &amp; Artifacts</h2>" + $nl2
                $html += "  <p style='font-size:16px;margin-bottom:10px;'>&#x1F4E5; <strong>MigrationAudit</strong> artifact includes:</p>" + $nl2
                $html += "  <ul style='margin-left:24px;font-size:15px;line-height:2;'>" + $nl2
                $html += "    <li>Folder-wise file inventory</li>" + $nl2
                $html += "    <li>Commit-to-branch mapping</li>" + $nl2
                $html += "    <li>PR details (CSV)</li>" + $nl2
                $html += "    <li>Validation checks</li>" + $nl2
                $html += "  </ul>" + $nl2
                $html += "  <p style='margin-top:12px;font-size:15px;'>&#x2705; Recommended for audit &amp; compliance reviews.</p>" + $nl2
                $html += "</div>" + $nl2
                # Footer
                $html += "<div class='footer'>" + $nl2
                $html += "  Generated on $migDate &bull; ADO-to-GitHub Migration Pipeline" + $nl2
                $html += "</div>" + $nl2
                $html += "</div>" + $nl2
                $html += "</body>" + $nl2
                $html += "</html>"

                # Save HTML report
                $htmlDir = "$(Build.ArtifactStagingDirectory)\dashboard"
                New-Item -ItemType Directory -Path $htmlDir -Force | Out-Null
                $html | Out-File "$htmlDir\migration-report.html" -Encoding utf8
                Write-Host "HTML dashboard saved: $htmlDir\migration-report.html"

                # ── Compact Markdown for ADO Summary tab ──
                $emojiCheck = [char]::ConvertFromUtf32(0x2705)
                $emojiWarn  = [char]::ConvertFromUtf32(0x26A0) + [char]::ConvertFromUtf32(0xFE0F)
                $emojiCross = [char]::ConvertFromUtf32(0x274C)
                $nl = [Environment]::NewLine

                if ($migrationResult -eq "Already Exists") {
                    $mdStatus = "$emojiWarn Skipped — Repository Already Exists"
                } elseif ($migrationResult -eq "Success") {
                    $mdStatus = "$emojiCheck Completed — Migration Successful"
                } else {
                    $mdStatus = "$emojiCross Failed — Migration Error"
                }

                $md = "# " + [char]::ConvertFromUtf32(0x1F680) + " ADO " + [char]::ConvertFromUtf32(0x2192) + " GitHub Migration Report" + $nl + $nl
                $md += "> Status: $mdStatus" + $nl + $nl
                $md += "| | |" + $nl + "|:---|:---|" + $nl
                $md += "| " + [char]::ConvertFromUtf32(0x1F4C5) + " Date | $migDate |" + $nl
                $md += "| " + [char]::ConvertFromUtf32(0x1F4E6) + " Source | ``$(ADO_Org) / $(ADO_Project) / $adoRepo`` |" + $nl
                $md += "| " + [char]::ConvertFromUtf32(0x1F3AF) + " Target | ``$(GitHub_Org) / $repo`` |" + $nl
                $md += "| " + [char]::ConvertFromUtf32(0x1F33F) + " Branches | $branchCount |" + $nl
                $md += "| " + [char]::ConvertFromUtf32(0x1F4DD) + " Commits | $commitCount |" + $nl
                $md += "| " + [char]::ConvertFromUtf32(0x1F500) + " PRs | $prOpen Open / $prMerged Merged / $prClosed Closed |" + $nl + $nl
                $md += "> " + [char]::ConvertFromUtf32(0x1F4A1) + " Download the **MigrationDashboard** artifact for the full HTML report." + $nl

                $md | Out-File "$(Build.SourcesDirectory)\migration-report.md" -Encoding utf8

                Write-Host ""
                Write-Host "========================================="
                Write-Host "  DASHBOARD SUMMARY"
                Write-Host "========================================="
                Write-Host "  Status:     $migrationResult"
                Write-Host "  Branches:   $branchCount"
                Write-Host "  Tags:       $tagCount"
                Write-Host "  Commits:    $commitCount"
                Write-Host "  PRs Total:  $prCount"
                Write-Host "  PRs Open:   $prOpen"
                Write-Host "  PRs Merged: $prMerged"
                Write-Host "  PRs Closed: $prClosed"
                Write-Host "========================================="

          # -------------------------------------------
          # STEP 9 – PUBLISH DASHBOARD
          # -------------------------------------------
          - task: PublishPipelineArtifact@1
            displayName: "Step 9a - Publish HTML Dashboard"
            condition: always()
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)\\dashboard"
              artifact: "MigrationDashboard"
              publishLocation: "pipeline"


          - task: PublishHtmlReport@1
            displayName: "Step 9b - Show HTML on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: "$(Build.ArtifactStagingDirectory)\\dashboard\\migration-report.html"
              tabName: "Migration Report"

          - task: PowerShell@2
            displayName: "Step 9c - Publish Summary to ADO Tab"
            condition: always()
            inputs:
              targetType: "inline"
              script: |
                Write-Host '##vso[task.uploadsummary]$(Build.SourcesDirectory)\migration-report.md'