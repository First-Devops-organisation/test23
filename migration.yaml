trigger: none

pool:
  vmImage: ubuntu-latest


variables:
  - group: ankit-adotogit # ADO_ORG, ADO_PROJECT, ADO_PAT
  

stages:
  # ===========================================================================
  # STAGE 1 – DISCOVER  (reuse existing scripts — already working)
  # ===========================================================================
  - stage: Discover
    displayName: "1. Discover & Audit Pipelines"
    jobs:
      - job: AuditPipelines
        displayName: "1.1 Audit ADO Pipelines (actions-importer)"
        timeoutInMinutes: 60

        steps:
          - checkout: self
            fetchDepth: 0
          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'migration-accelerator/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Run audit-pipelines.ps1"
            inputs:
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/00-discovery/audit-pipelines.ps1'
              arguments: >-
                -AdoOrg "$(ADO_ORG)"
                -AdoProject "$(ADO_PROJECT)"
                -AdoPat "$(ADO_PAT)"
                -GitHubPat "$(GH_PAT)"
                -OutputDir "output/pipeline-audit"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "List all ADO Pipeline IDs"
            inputs:
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/02-migrate/migrate-pipelines.ps1'
              arguments: >-
                -ConfigFile "$(Build.SourcesDirectory)/migration-accelerator/config/migration-config.json"
                -AdoProject "$(ADO_PROJECT)"
                -Mode "list"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
             
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Audit Artifact"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/migration-accelerator/output/pipeline-audit'
              artifact: "pipeline-audit"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Audit Dashboard on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)/migration-accelerator/output/pipeline-audit/dashboard'
              tabName: "Pipeline Audit Dashboard"

  # ===========================================================================
  # STAGE 1.5 – SCRUB SECRETS (encrypt before migration)
  # ===========================================================================
  - stage: ScrubSecrets
    displayName: "1.5 Scrub & Encrypt Secrets"
    dependsOn: Discover
    condition: succeeded()
    jobs:
      - job: EncryptSecrets
        displayName: "1.5.1 Encrypt Secrets in Repo History"
        timeoutInMinutes: 120
        steps:
          - checkout: self
            fetchDepth: 0

          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'migration-accelerator/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Scan for secrets (gitleaks)"
            inputs:
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/00-discovery/scan-secrets.ps1'
              arguments: >-
                -InventoryFile "$(Build.SourcesDirectory)/migration-accelerator/output/inventory/inventory-LATEST.json"
                -Pat "$(ADO_PAT)"
                -OutputDir "$(Build.SourcesDirectory)/migration-accelerator/output/secrets"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_PAT: $(ADO_PAT)

          - task: PowerShell@2
            displayName: "Encrypt secrets in repo history"
            inputs:
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/01-prep/scrub-secrets.ps1'
              arguments: >-
                -SecretScanDir "$(Build.SourcesDirectory)/migration-accelerator/output/secrets"
                -Pat "$(ADO_PAT)"
                -OutputDir "$(Build.SourcesDirectory)/migration-accelerator/output/scrubbed"
                -Mode "encrypt"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_PAT: $(ADO_PAT)
              ADO_ORG: $(ADO_ORG)
              SCRUB_PASSPHRASE: $(SCRUB_PASSPHRASE)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Scrub Artifacts"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/migration-accelerator/output/scrubbed'
              artifact: "secret-scrub-results"
              publishLocation: pipeline

  # ===========================================================================
  # STAGE 2 – MIGRATE (skipped if PIPELINE_IDS is empty)
  # ===========================================================================
  - stage: MigratePipeline
    displayName: "2. Migrate Pipelines"
    dependsOn: ScrubSecrets
    condition: and(succeeded(), ne(variables['PIPELINE_IDS'], ''))
    jobs:
      - job: DryRun
        displayName: "2.1 Dry-Run Preview"
        steps:
          - checkout: self
            fetchDepth: 0

          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'migration-accelerator/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Dry-Run pipelines: $(PIPELINE_IDS)"
            inputs:
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/02-migrate/migrate-pipelines.ps1'
              arguments: >-
                -AdoProject "$(ADO_PROJECT)"
                -PipelineId $(PIPELINE_IDS)
                -PipelineType "$(PIPELINE_TYPE)"
                -Mode "dry-run"
                -ImporterConfigFile "$(Build.SourcesDirectory)/migration-accelerator/output/pipeline-audit/config.yml"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_ORG: $(ADO_ORG)
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)
              GH_REPO: $(GH_REPO)
              PIPELINE_REPO_MAP: $(PIPELINE_REPO_MAP)
 
           
          - task: PublishPipelineArtifact@1
            displayName: "Publish Dry-Run Output"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/migration-accelerator/output/pipelines'
              artifact: "pipeline-dry-run"
              publishLocation: pipeline

          # - task: PublishHtmlReport@1
          #   displayName: "Dry-Run Dashboard on Pipeline Tab"
          #   condition: always()
          #   inputs:
          #     reportDir: '$(Build.SourcesDirectory)/migration-accelerator/output/pipelines/dashboard'
          #     tabName: "Dry-Run Migration Dashboard"

      - job: Migrate
        displayName: "2.2 Migrate to GitHub"
        dependsOn: DryRun
        condition: and(succeeded(), eq(variables['MIGRATE_MODE'], 'migrate'))
        steps:
          - checkout: self
            fetchDepth: 0

          - task: PowerShell@2
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'migration-accelerator/01-prep/install-tools.ps1'
              pwsh: true
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PowerShell@2
            displayName: "Migrate pipelines: $(PIPELINE_IDS)"
            inputs:
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/02-migrate/migrate-pipelines.ps1'
              arguments: >-
                -AdoProject "$(ADO_PROJECT)"
                -PipelineId $(PIPELINE_IDS)
                -PipelineType "$(PIPELINE_TYPE)"
                -Mode "migrate"
                -ImporterConfigFile "output/pipeline-audit/config.yml"
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_ORG: $(ADO_ORG)
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)
              GH_REPO: $(GH_REPO)
              PIPELINE_REPO_MAP: $(PIPELINE_REPO_MAP)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Migration Output"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/migration-accelerator/output/pipelines'
              artifact: "pipeline-migrate"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Migration Dashboard on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)/migration-accelerator/output/pipelines/dashboard'
              tabName: "Migration Dashboard"

  # ===========================================================================
  # STAGE 3 – DECRYPT SECRETS (restore originals on GitHub after migration)
  # ===========================================================================
  - stage: DecryptSecrets
    displayName: "3. Decrypt Secrets on GitHub"
    dependsOn: MigratePipeline
    condition: succeeded()
    jobs:
      - job: DecryptSecrets
        displayName: "3.1 Decrypt Secrets in Migrated Repos"
        timeoutInMinutes: 120
        steps:
          - checkout: self
            fetchDepth: 0

          - task: PowerShell@2
            displayName: "Decrypt secrets in migrated repos"
            inputs:
              targetType: 'inline'
              script: |
                $ErrorActionPreference = "Stop"

                # --- Clone each migrated repo from GitHub and decrypt ---
                $configFile = "$(Build.SourcesDirectory)/migration-accelerator/config/migration-config.json"
                $config = Get-Content $configFile -Raw | ConvertFrom-Json
                $ghOrg = $config.target.organization
                $ghPat = $env:GH_PAT

                $outputDir = "$(Build.SourcesDirectory)/migration-accelerator/output/decrypted"
                if (-not (Test-Path $outputDir)) { New-Item -ItemType Directory -Path $outputDir -Force | Out-Null }

                $batches = $config.batches
                $totalDecrypted = 0
                $totalFailed = 0

                foreach ($batch in $batches) {
                    Write-Host "`n--- Batch: $($batch.name) ---" -ForegroundColor Cyan

                    foreach ($repoName in $batch.repos) {
                        $targetRepo = $repoName.ToLower() -replace " ", "-"
                        Write-Host "`n  Processing: $ghOrg/$targetRepo" -ForegroundColor Yellow

                        $cloneDir = Join-Path $outputDir $targetRepo
                        if (Test-Path $cloneDir) { Remove-Item -Recurse -Force $cloneDir }

                        # Clone from GitHub
                        $cloneUrl = "https://x-access-token:$ghPat@github.com/$ghOrg/$targetRepo.git"
                        git clone $cloneUrl $cloneDir 2>&1 | Out-Null

                        if (-not (Test-Path $cloneDir)) {
                            Write-Warning "  Failed to clone $ghOrg/$targetRepo — skipping"
                            continue
                        }

                        # Configure git identity
                        Push-Location $cloneDir
                        git config user.name "azure-pipelines[bot]"
                        git config user.email "azure-pipelines[bot]@users.noreply.github.com"
                        Pop-Location

                        # Run decrypt
                        & "$(Build.SourcesDirectory)/migration-accelerator/03-post-migrate/decrypt-secrets.ps1" `
                            -RepoDir $cloneDir `
                            -Passphrase $env:SCRUB_PASSPHRASE `
                            -CommitChanges `
                            -RemoveManifest

                        if ($LASTEXITCODE -eq 0) {
                            Write-Host "  ✓ Decryption complete for $targetRepo" -ForegroundColor Green
                            $totalDecrypted++
                        } else {
                            Write-Host "  ✗ Decryption failed for $targetRepo" -ForegroundColor Red
                            $totalFailed++
                        }
                    }
                }

                Write-Host "`n=== Decryption Summary ===" -ForegroundColor Cyan
                Write-Host "Repos decrypted: $totalDecrypted" -ForegroundColor Green
                Write-Host "Repos failed:    $totalFailed" -ForegroundColor $(if ($totalFailed -gt 0) { "Red" } else { "Green" })

                if ($totalFailed -gt 0) { exit 1 }
              pwsh: true
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              GH_PAT: $(GH_PAT)
              SCRUB_PASSPHRASE: $(SCRUB_PASSPHRASE)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Decryption Reports"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/migration-accelerator/output/decrypted'
              artifact: "decryption-reports"
              publishLocation: pipeline