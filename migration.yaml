#  added new yaml for skip migrate reusable if not present 

trigger: none

pool: linux
  


variables:
  - group: pipeline-migration # ADO_ORG, ADO_PROJECT, ADO_PAT
  

stages:
  # ===========================================================================
  # STAGE 1 – DISCOVER  (reuse existing scripts — already working)
  # ===========================================================================
  - stage: Discover
    displayName: "1. Discover & Audit Pipelines"
    jobs:
      - job: AuditPipelines
        displayName: "1.1 Audit ADO Pipelines (actions-importer)"
        timeoutInMinutes: 60

        steps:
          - checkout: self
            fetchDepth: 0
          - task: Bash@3
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'migration-accelerator/01-prep/install-tools.sh'
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: Bash@3
            displayName: "Run audit-pipelines.sh"
            inputs:
              targetType: 'filePath'
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/00-discovery/audit-pipelines.sh'
              arguments: >-
                --ado-org "$(ADO_ORG)"
                --ado-project "$(ADO_PROJECT)"
                --ado-pat "$(ADO_PAT)"
                --github-pat "$(GH_PAT)"
                --output-dir "output/pipeline-audit"
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: Bash@3
            displayName: "List all ADO Pipeline IDs"
            inputs:
              targetType: 'filePath'
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/02-migrate/migrate-pipelines.sh'
              arguments: >-
                --config-file "$(Build.SourcesDirectory)/migration-accelerator/config/migration-config.json"
                --ado-project "$(ADO_PROJECT)"
                --mode "list"
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
             
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Audit Artifact"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/migration-accelerator/output/pipeline-audit'
              artifact: "pipeline-audit"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Audit Dashboard on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)/migration-accelerator/output/pipeline-audit/dashboard'
              tabName: "Pipeline Audit Dashboard"

          - task: Bash@3
            displayName: "Parse config for pipeline conditions"
            name: checkConfig
            inputs:
              targetType: 'inline'
              script: |
                configPath="$(Build.SourcesDirectory)/migration-accelerator/config/migration-config.json"
                ids=""
                reusableIds=""
                mode=""
                type=""
                if [ -f "$configPath" ]; then
                    ids=$(python3 -c "import json; data=json.load(open('$configPath')); print(','.join(map(str, data['PIPELINE_IDS']))) if 'PIPELINE_IDS' in data and data['PIPELINE_IDS'] is not None else print('')" 2>/dev/null)
                    reusableIds=$(python3 -c "import json; data=json.load(open('$configPath')); print(','.join(map(str, data['REUSABLE_PIPELINE_IDS']))) if 'REUSABLE_PIPELINE_IDS' in data and data['REUSABLE_PIPELINE_IDS'] is not None else print('')" 2>/dev/null)
                    mode=$(python3 -c "import json; data=json.load(open('$configPath')); print(data.get('MIGRATE_MODE', data.get('MODE', '')))" 2>/dev/null)
                    type=$(python3 -c "import json; data=json.load(open('$configPath')); print(data.get('PIPELINE_TYPE', ''))" 2>/dev/null)
                fi
                
                macroIds="$(PIPELINE_IDS)"
                macroReusableIds="$(REUSABLE_PIPELINE_IDS)"
                macroMode="$(MIGRATE_MODE)"
                macroType="$(PIPELINE_TYPE)"
                
                if [ -z "$ids" ] && [ "$macroIds" != "\$(PIPELINE_IDS)" ]; then ids="$macroIds"; fi
                if [ -z "$reusableIds" ] && [ "$macroReusableIds" != "\$(REUSABLE_PIPELINE_IDS)" ]; then reusableIds="$macroReusableIds"; fi
                if [ -z "$mode" ] && [ "$macroMode" != "\$(MIGRATE_MODE)" ]; then mode="$macroMode"; fi
                if [ -z "$type" ] && [ "$macroType" != "\$(PIPELINE_TYPE)" ]; then type="$macroType"; fi
                if [ -z "$mode" ]; then mode="dry-run"; fi
                if [ -z "$type" ]; then type="build"; fi
                
                echo "Resolved PIPELINE_IDS: $ids"
                echo "Resolved REUSABLE_PIPELINE_IDS: $reusableIds"
                echo "Resolved MIGRATE_MODE: $mode"
                echo "Resolved PIPELINE_TYPE: $type"
                
                hasIds="false"
                if [ -n "$ids" ]; then hasIds="true"; fi
                hasReusableIds="false"
                if [ -n "$reusableIds" ]; then hasReusableIds="true"; fi
                
                echo "##vso[task.setvariable variable=HAS_IDS;isOutput=true]$hasIds"
                echo "##vso[task.setvariable variable=RESOLVED_IDS;isOutput=true]$ids"
                echo "##vso[task.setvariable variable=HAS_REUSABLE_IDS;isOutput=true]$hasReusableIds"
                echo "##vso[task.setvariable variable=RESOLVED_MODE;isOutput=true]$mode"
                echo "##vso[task.setvariable variable=RESOLVED_TYPE;isOutput=true]$type"

  # ===========================================================================
  # STAGE 2 – MIGRATE
  # ===========================================================================
  - stage: MigratePipeline
    displayName: "2. Migrate Pipelines"
    dependsOn: Discover
    condition: and(succeeded(), eq(dependencies.Discover.outputs['AuditPipelines.checkConfig.HAS_IDS'], 'true'))
    variables:
      PIPELINE_IDS: $[ stageDependencies.Discover.AuditPipelines.outputs['checkConfig.RESOLVED_IDS'] ]
      HAS_REUSABLE_IDS: $[ stageDependencies.Discover.AuditPipelines.outputs['checkConfig.HAS_REUSABLE_IDS'] ]
      MIGRATE_MODE: $[ stageDependencies.Discover.AuditPipelines.outputs['checkConfig.RESOLVED_MODE'] ]
      PIPELINE_TYPE: $[ stageDependencies.Discover.AuditPipelines.outputs['checkConfig.RESOLVED_TYPE'] ]
    jobs:
      - job: DryRun
        displayName: "2.1 Dry-Run Preview"
        condition: succeeded()
        steps:
          - checkout: self
            fetchDepth: 0

          - task: Bash@3
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'migration-accelerator/01-prep/install-tools.sh'
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: Bash@3
            displayName: "Dry-Run pipelines: $(PIPELINE_IDS)"
            inputs:
              targetType: 'filePath'
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/02-migrate/migrate-pipelines.sh'
              arguments: >-
                --config-file "$(Build.SourcesDirectory)/migration-accelerator/config/migration-config.json"
                --ado-project "$(ADO_PROJECT)"
                --pipeline-id "$(PIPELINE_IDS)"
                --pipeline-type "$(PIPELINE_TYPE)"
                --mode "dry-run"
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_ORG: $(ADO_ORG)
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)
              GH_REPO: $(GH_REPO)
              PIPELINE_REPO_MAP: $(PIPELINE_REPO_MAP)
 
           
          - task: PublishPipelineArtifact@1
            displayName: "Publish Dry-Run Output"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/migration-accelerator/output/pipelines'
              artifact: "pipeline-dry-run"
              publishLocation: pipeline

      # ---------------------------------------------------------------------
      # 2.1.b  Migrate reusable workflows + composite actions to central repo
      # ---------------------------------------------------------------------
      # Runs only when REUSABLES_REPO is defined in the variable group
      # (e.g. "my-org/reusable-workflows"). It uses the GEI-produced
      # config.yml and rewrites every target_url to that single shared repo.
      - job: MigrateReusables
        displayName: "2.1.b Migrate Reusable Templates -> Central Repo"
        dependsOn: DryRun
        condition: and(succeeded(), ne(variables['REUSABLES_REPO'], ''), eq(variables['HAS_REUSABLE_IDS'], 'true'))
        steps:
          - checkout: self
            fetchDepth: 0

          - task: Bash@3
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'migration-accelerator/01-prep/install-tools.sh'
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: DownloadPipelineArtifact@2
            displayName: "Download dry-run output (for config.yml)"
            inputs:
              artifact: "pipeline-dry-run"
              path: '$(Build.SourcesDirectory)/migration-accelerator/output/pipelines'

          - task: Bash@3
            displayName: "Ensure central reusables repo exists on GitHub"
            inputs:
              targetType: 'inline'
              script: |
                repo="$(REUSABLES_REPO)"   # e.g. my-org/reusable-workflows
                if [ -z "$repo" ]; then
                  echo "REUSABLES_REPO not set; skipping."
                  exit 0
                fi
                export GH_TOKEN="$(GH_PAT)"
                if ! gh repo view "$repo" &>/dev/null; then
                  echo "Creating $repo ..."
                  gh repo create "$repo" --private --add-readme \
                    --description "Central reusable workflows + composite actions migrated from Azure DevOps"
                else
                  echo "$repo already exists."
                fi
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: Bash@3
            displayName: "Audit (refresh config.yml listing reusables)"
            inputs:
              targetType: 'filePath'
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/02-migrate/migrate-pipelines.sh'
              arguments: >-
                --config-file "$(Build.SourcesDirectory)/migration-accelerator/config/migration-config.json"
                --ado-project "$(ADO_PROJECT)"
                --mode "audit"
                --output-dir "output/pipelines"
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_ORG: $(ADO_ORG)
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          - task: Bash@3
            displayName: "Migrate reusables to $(REUSABLES_REPO)@$(REUSABLES_REF)"
            inputs:
              targetType: 'filePath'
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/02-migrate/migrate-pipelines.sh'
              arguments: >-
                --config-file "$(Build.SourcesDirectory)/migration-accelerator/config/migration-config.json"
                --ado-project "$(ADO_PROJECT)"
                --mode "migrate-reusables"
                --pipeline-id "$(PIPELINE_IDS)"
                --pipeline-type "$(PIPELINE_TYPE)"
                --config-file-path "output/pipelines/config.yml"
                --reusables-target-repo "$(REUSABLES_REPO)"
                --reusables-ref "$(REUSABLES_REF)"
                --output-dir "output/pipelines"
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_ORG: $(ADO_ORG)
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)
              GH_REPO: $(GH_REPO)

          - task: PublishPipelineArtifact@1
            displayName: "Publish reusables config + output"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/migration-accelerator/output/pipelines'
              artifact: "pipeline-reusables"
              publishLocation: pipeline

      - job: Migrate
        displayName: "2.2 Migrate to GitHub"
        dependsOn:
          - DryRun
          - MigrateReusables
        condition: |
          and(
            in(dependencies.DryRun.result, 'Succeeded', 'SucceededWithIssues'),
            in(dependencies.MigrateReusables.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
            eq(stageDependencies.Discover.AuditPipelines.outputs['checkConfig.RESOLVED_MODE'], 'migrate')
          )
        steps:
          - checkout: self
            fetchDepth: 0

          - task: Bash@3
            displayName: 'Install required tooling'
            inputs:
              targetType: 'filePath'
              filePath: 'migration-accelerator/01-prep/install-tools.sh'
            env:
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)

          # Pull the rewritten config.yml (4-field entries with `path:`) produced by
          # MigrateReusables. Without this, `Test-Path output/pipelines/config.yml`
          # below is false, the script drops --config-file-path, and GEI inlines
          # every template as a local `./.github/actions/<name>` ref in the
          # consumer repo. If MigrateReusables was skipped (no REUSABLES_REPO),
          # this download is a no-op via `continueOnError`.
          - task: DownloadPipelineArtifact@2
            displayName: "Download rewritten config.yml from MigrateReusables"
            continueOnError: true
            condition: eq(variables['HAS_REUSABLE_IDS'], 'true')
            inputs:
              artifact: "pipeline-reusables"
              path: '$(Build.SourcesDirectory)/migration-accelerator/output/pipelines'

          - task: Bash@3
            displayName: "Verify config.yml is present"
            inputs:
              targetType: 'inline'
              script: |
                cfg="$(Build.SourcesDirectory)/migration-accelerator/output/pipelines/config.yml"
                if [ -f "$cfg" ]; then
                  echo "config.yml found at $cfg"
                  echo "First 20 lines:"
                  head -n 20 "$cfg" | sed 's/^/  /'
                else
                  echo "WARNING: $cfg NOT found. GEI will inline templates as local refs."
                fi

          - task: Bash@3
            displayName: "Migrate pipelines: $(PIPELINE_IDS)"
            inputs:
              targetType: 'filePath'
              filePath: '$(Build.SourcesDirectory)/migration-accelerator/02-migrate/migrate-pipelines.sh'
              arguments: >-
                --config-file "$(Build.SourcesDirectory)/migration-accelerator/config/migration-config.json"
                --ado-project "$(ADO_PROJECT)"
                --pipeline-id "$(PIPELINE_IDS)"
                --pipeline-type "$(PIPELINE_TYPE)"
                --mode "migrate"
                --config-file-path "output/pipelines/config.yml"
              workingDirectory: '$(Build.SourcesDirectory)/migration-accelerator'
            env:
              ADO_ORG: $(ADO_ORG)
              ADO_PAT: $(ADO_PAT)
              GH_PAT: $(GH_PAT)
              GH_TOKEN: $(GH_PAT)
              GH_REPO: $(GH_REPO)
              PIPELINE_REPO_MAP: $(PIPELINE_REPO_MAP)

          - task: PublishPipelineArtifact@1
            displayName: "Publish Migration Output"
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/migration-accelerator/output/pipelines'
              artifact: "pipeline-migrate"
              publishLocation: pipeline

          - task: PublishHtmlReport@1
            displayName: "Migration Dashboard on Pipeline Tab"
            condition: always()
            inputs:
              reportDir: '$(Build.SourcesDirectory)/migration-accelerator/output/pipelines/dashboard'
              tabName: "Migration Dashboard"
